<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#6933C5">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">

</head>
<body>
<header class="top"><div class="wrap">
  <span class="marca" aria-label="GenIO, módulos"><b>Gen<i>IO</i></b><span>módulos</span></span>
  <div class="fill"></div>
  <a class="btn btn-ic" href="admin.html" id="lAdmin" hidden aria-label="Configurações" title="Configurações"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  <a class="btn btn-ic" id="lAtend" hidden target="_blank" rel="noopener" aria-label="Central de atendimento (WhatsApp)" title="Central de atendimento"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 16 0v4a2 2 0 0 1-2 2h-2v-6h4M4 12v4a2 2 0 0 0 2 2h2v-6H4"/><path d="M12 20v1a1 1 0 0 0 1 1h3"/></svg></a>
  <button class="btn btn-s btn-sm" type="button" id="bSair">Sair</button>
</div></header>
<main class="wrap">
  <div class="saud">
    <h1 id="oi">Olá</h1>
    <img class="saud-ic" src="img/parceiro.png?v=e63b2912d3" alt="" width="77" height="150">
  </div>
  <section class="ctx">
    <div class="cli">
      <div class="row between"><label for="cliSel">Cliente</label><button class="linkbtn" type="button" id="cliNovo">Novo cliente</button></div>
      <select id="cliSel"></select>
      <input id="cliente" autocomplete="off" placeholder="Nome ou empresa" hidden>
      <p class="muted small" id="cliInfo" aria-live="polite"></p>
    </div>
  </section>
  <div id="off" class="msg info" hidden>Sem internet. O Capacho funciona assim mesmo.</div>
  <button class="btn btn-s btn-sm" type="button" id="bInst" hidden style="margin:0 0 12px">Instalar no aparelho</button>
  <div class="mods" id="mods" aria-live="polite"></div>
  <div style="height:48px"></div>
</main>
<script src="portal.js?v=e63b2912d3"></script>
<script>
(async()=>{const {$, $$}=G;
  let c=null;try{c=await G.eu();}catch(e){c=null;}
  if(!c){location.replace("/?entrar=1&volta=app.html");return;}
  $("#oi").textContent="Olá, "+(c.nome||"").split(" ")[0];
  $("#lAdmin").hidden=c.papel!=="admin";$("#off").hidden=!c.offline;
  // central de atendimento: WhatsApp do Dom Banana Tech (número em G.ATENDIMENTO; sem número, o ícone não aparece)
  if(G.ATENDIMENTO){const at=$("#lAtend");at.href="https://wa.me/"+G.ATENDIMENTO+"?text="+encodeURIComponent("Olá! Sou "+(c.nome||"")+", do GenIO.");at.hidden=false;}
  G.renderMods($("#mods"),true);
  // cliente: é o contexto de todos os módulos. Fica guardado neste aparelho e o módulo abre já no projeto dele
  const ci=$("#cliente"),info=$("#cliInfo");let CL=[];
  const abrirDB=()=>new Promise(res=>{try{const r=indexedDB.open("genio-vendas",3);r.onupgradeneeded=()=>{const d=r.result;["orcamentos","sessao"].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:"id"});});if(!d.objectStoreNames.contains("clientes"))d.createObjectStore("clientes",{keyPath:"k"});};r.onsuccess=()=>res(r.result);r.onerror=()=>res(null);}catch(e){res(null);}});
  const lerClientes=async()=>{const db=await abrirDB();if(!db)return[];return new Promise(res=>{const t=db.transaction("orcamentos").objectStore("orcamentos").getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([]);});};
  const sel=$("#cliSel"),bNovo=$("#cliNovo");
  const mostrar=()=>{const n=ci.value.trim().toLowerCase();const d=CL.find(o=>(o.nome||"").toLowerCase()===n);
    info.textContent=!n?"":d?(d.n?`${d.n} projeto${d.n>1?"s":""} · ${d.numero||""}${d.status?" · "+d.status:""}`:"Sem projeto ainda"):"Cliente novo";};
  // lista dos clientes (mais recentes primeiro); "Novo cliente" troca a lista por um campo para digitar
  const modo=m=>{const novo=m==="novo"||!CL.length;sel.hidden=novo;ci.hidden=!novo;bNovo.hidden=!CL.length;bNovo.textContent=novo?"Escolher da lista":"Novo cliente";if(novo&&m==="novo")setTimeout(()=>ci.focus(),30);};
  const montarLista=()=>{const atual=ci.value.trim();sel.innerHTML='<option value="">Escolha o cliente</option>'+CL.map(r=>`<option value="${G.esc(r.nome)}">${G.esc(r.nome)}${r.n>1?` · ${r.n} projetos`:""}</option>`).join("");
    const na=CL.some(r=>r.nome===atual);sel.value=na?atual:"";modo(CL.length&&(na||!atual)?"lista":"novo");};
  sel.onchange=()=>{ci.value=sel.value;G.ls.set("genio-cliente",ci.value);mostrar();};
  bNovo.onclick=()=>{if(ci.hidden){ci.value="";G.ls.set("genio-cliente","");sel.value="";mostrar();modo("novo");}else{modo("lista");}};
  ci.value=G.ls.get("genio-cliente")||"";
  ci.addEventListener("input",()=>{G.ls.set("genio-cliente",ci.value.trim());mostrar();});
  // clientes = quem tem projeto (orçamentos) ou identidade visual guardada
  const lerIdent=async()=>{const db=await abrirDB();if(!db||!db.objectStoreNames.contains("clientes"))return[];return new Promise(res=>{const t=db.transaction("clientes").objectStore("clientes").getAll();t.onsuccess=()=>res(t.result||[]);t.onerror=()=>res([]);});};
  Promise.all([lerClientes(),lerIdent()]).then(([all,ids])=>{const m=new Map();all.forEach(o=>{const nome=(o.cliente&&o.cliente.nome||"").trim();if(!nome)return;const k=nome.toLowerCase();const r=m.get(k)||{nome,n:0,numero:"",status:"",at:""};r.n++;if((o.atualizado||"")>r.at){r.at=o.atualizado||"";r.numero=o.numero||"";r.status=o.status||"";}m.set(k,r);});
    ids.forEach(o=>{const nome=(o.nome||"").trim();if(!nome)return;const k=nome.toLowerCase();if(!m.has(k))m.set(k,{nome,n:0,numero:"",status:"",at:o.atualizado||""});});
    CL=[...m.values()].sort((a,b)=>b.at.localeCompare(a.at)).map(r=>({nome:r.nome,n:r.n,numero:r.numero,status:r.status}));montarLista();mostrar();});
  $("#bSair").onclick=()=>G.sair();
  const bi=$("#bInst"),mostra=()=>{bi.hidden=!G.podeInstalar();};mostra();document.addEventListener("genio-instalavel",mostra);
  bi.onclick=async()=>{await G.instalar();mostra();};
  G.ls.set("genio-ultimo","app.html");
})();
</script>
</body>
</html>
