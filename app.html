<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GenIO · Módulos</title>
<meta name="theme-color" content="#6933C5">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GenIO">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="portal.css?v=cad726c76b">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="marca" href="app.html" aria-label="GenIO, módulos"><b>Gen<i>IO</i></b><span>módulos</span></a>
  <div class="fill"></div>
  <a class="btn btn-t btn-sm" href="admin.html" id="lAdmin" hidden>Administração</a>
  <button class="btn btn-s btn-sm" type="button" id="bSair">Sair</button>
</div></header>
<main class="wrap">
  <div class="saud">
    <div class="saud-oi">
      <svg class="saud-ic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <path d="M20 44c-3 4-4 8-2 12 1 2 4 3 6 2" fill="none" stroke="#6933C5" stroke-width="3" stroke-linecap="round"/>
        <rect x="18" y="38" width="28" height="18" rx="9" fill="#6933C5"/>
        <rect x="24" y="40" width="16" height="6" rx="3" fill="#04C6C0"/>
        <rect x="16" y="12" width="32" height="26" rx="12" fill="#F2ECFB" stroke="#1C1635" stroke-width="2.5"/>
        <rect x="21" y="21" width="22" height="7" rx="3.5" fill="#1C1635"/>
        <rect x="24" y="23" width="6" height="3" rx="1.5" fill="#04C6C0"/>
        <rect x="34" y="23" width="6" height="3" rx="1.5" fill="#04C6C0"/>
        <path d="M26 33c2 2 4 3 6 3s4-1 6-3" fill="none" stroke="#1C1635" stroke-width="2.4" stroke-linecap="round"/>
        <rect x="28" y="6" width="8" height="8" rx="2" fill="#1C1635"/>
        <circle cx="32" cy="7" r="2" fill="#04C6C0"/>
        <g transform="translate(42,34) rotate(25)">
          <rect x="-2.2" y="-13" width="4.4" height="16" rx="2.2" fill="#49258B"/>
          <circle cx="0" cy="-13" r="5" fill="none" stroke="#49258B" stroke-width="3.2"/>
        </g>
      </svg>
      <div><h1 id="oi" style="margin:0">Olá</h1><p class="muted" id="plano" style="margin:4px 0 0"></p></div>
    </div>
    <button class="btn btn-s btn-sm" type="button" id="bInst" hidden>Instalar no aparelho</button>
  </div>
  <div id="off" class="msg info" hidden>Sem internet agora. O Capacho funciona assim mesmo; o que precisar do servidor volta quando a conexão voltar.</div>
  <p class="sub">Escolha com o que você vai trabalhar.</p>
  <div class="mods" id="mods" aria-live="polite"></div>
  <div style="height:48px"></div>
</main>
<script src="portal.js?v=cad726c76b"></script>
<script>
(async()=>{const {$}=G;
  let c=null;try{c=await G.eu();}catch(e){c=null;}
  if(!c){location.replace("/?entrar=1&volta=app.html");return;}
  $("#oi").textContent="Olá, "+(c.nome||"").split(" ")[0];
  $("#plano").textContent=(c.plano_nome||"")+(c.papel==="admin"?"":" · este aparelho está ligado à sua conta");
  $("#lAdmin").hidden=c.papel!=="admin";$("#off").hidden=!c.offline;
  $("#mods").innerHTML=G.MODULOS.map(m=>m.on
    ?`<a class="mod on" href="${m.url}"><div class="mod-cover" style="background-image:url('${m.img}')"><span class="tag">Abrir</span></div><div class="mod-body"><div class="ic">${m.ic}</div><b>${G.esc(m.nome)}</b><span class="desc">${G.esc(m.desc)}</span></div></a>`
    :`<div class="mod off" aria-disabled="true"><div class="mod-cover" style="background-image:url('${m.img}')"><span class="tag">Em breve</span></div><div class="mod-body"><div class="ic">${m.ic}</div><b>${G.esc(m.nome)}</b><span class="desc">${G.esc(m.desc)}</span></div></div>`).join("");
  $("#bSair").onclick=()=>{if(confirm("Sair da conta neste aparelho?"))G.sair();};
  const bi=$("#bInst"),mostra=()=>{bi.hidden=!G.podeInstalar();};mostra();document.addEventListener("genio-instalavel",mostra);
  bi.onclick=async()=>{await G.instalar();mostra();};
  G.ls.set("genio-ultimo","app.html");
})();
</script>
</body>
</html>
