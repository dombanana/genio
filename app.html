<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GenIO · Módulos</title>
<meta name="theme-color" content="#6933C5">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GenIO">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="portal.css?v=800ca6c890">
</head>
<body>
<header class="top"><div class="wrap">
  <span class="marca" aria-label="GenIO, módulos"><b>Gen<i>IO</i></b><span>módulos</span></span>
  <div class="fill"></div>
  <a class="btn btn-t btn-sm" href="admin.html" id="lAdmin" hidden>Administração</a>
  <button class="btn btn-s btn-sm" type="button" id="bSair">Sair</button>
</div></header>
<main class="wrap">
  <div class="saud">
    <div><h1 id="oi">Olá</h1><p class="muted" id="plano" style="margin:4px 0 0"></p><button class="btn btn-s btn-sm" type="button" id="bInst" hidden style="margin-top:10px">Instalar no aparelho</button></div>
    <img class="saud-ic" src="img/parceiro.png?v=800ca6c890" alt="" width="77" height="150">
  </div>
  <div id="off" class="msg info" hidden>Sem internet. O Capacho funciona assim mesmo.</div>
  <div class="mods" id="mods" aria-live="polite"></div>
  <div style="height:48px"></div>
</main>
<script src="portal.js?v=800ca6c890"></script>
<script>
(async()=>{const {$}=G;
  let c=null;try{c=await G.eu();}catch(e){c=null;}
  if(!c){location.replace("/?entrar=1&volta=app.html");return;}
  $("#oi").textContent="Olá, "+(c.nome||"").split(" ")[0];
  $("#plano").textContent=c.plano_nome||"";
  $("#lAdmin").hidden=c.papel!=="admin";$("#off").hidden=!c.offline;
  G.renderMods($("#mods"),true);
  $("#bSair").onclick=()=>G.sair();
  const bi=$("#bInst"),mostra=()=>{bi.hidden=!G.podeInstalar();};mostra();document.addEventListener("genio-instalavel",mostra);
  bi.onclick=async()=>{await G.instalar();mostra();};
  G.ls.set("genio-ultimo","app.html");
})();
</script>
</body>
</html>
