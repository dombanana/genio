<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GenIO · Módulos</title>
<meta name="theme-color" content="#6933C5">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="GenIO">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="portal.css?v=03e88f3b78">
</head>
<body>
<header class="top"><div class="wrap">
  <a class="marca" href="app.html" aria-label="GenIO, módulos"><b>Gen<i>IO</i></b><span>módulos</span></a>
  <div class="fill"></div>
  <a class="btn btn-t btn-sm" href="admin.html" id="lAdmin" hidden>Administração</a>
  <button class="btn btn-s btn-sm" type="button" id="bSair">Sair</button>
</div></header>
<main class="wrap">
  <div class="saud">
    <div class="saud-oi">
      <svg class="saud-ic" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <path d="M32 40c-6 2-10 7-10 13 0 5 4 8 10 8s10-3 10-8c0-6-4-11-10-13z" fill="#6933C5" opacity=".18"/>
        <path d="M24 46c-5 1-8 4-8 8 0 3 2 5 6 5" fill="none" stroke="#04C6C0" stroke-width="3" stroke-linecap="round" opacity=".55"/>
        <circle cx="32" cy="26" r="16" fill="#E7D6F8"/>
        <path d="M16 25c0-10 7-17 16-17s16 7 16 17c-4-3-9 1-12-2-2 3-6 2-8 0-3 3-8 3-12 2z" fill="#1C1635"/>
        <path d="M44 20c3 1 5 4 5 7" fill="none" stroke="#1C1635" stroke-width="3" stroke-linecap="round"/>
        <g fill="none" stroke="#1C1635" stroke-width="2.4" stroke-linecap="round">
          <circle cx="25" cy="28" r="5"/>
          <circle cx="39" cy="28" r="5"/>
          <path d="M30 28h2"/>
          <path d="M20 27l-3-1"/>
          <path d="M44 27l3-1"/>
        </g>
        <path d="M26 37c2 2 4 3 6 3s4-1 6-3" fill="none" stroke="#1C1635" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M30 10l1.4 3.2L35 14.6l-3.6 1.4L30 19.2l-1.4-3.2L25 14.6l3.6-1.4z" fill="#04C6C0"/>
      </svg>
      <div><h1 id="oi" style="margin:0">Olá</h1><p class="muted" id="plano" style="margin:4px 0 0"></p></div>
    </div>
    <button class="btn btn-s btn-sm" type="button" id="bInst" hidden>Instalar no aparelho</button>
  </div>
  <div id="off" class="msg info" hidden>Sem internet agora. O Capacho funciona assim mesmo; o que precisar do servidor volta quando a conexão voltar.</div>
  <p class="sub">Escolha com o que você vai trabalhar.</p>
  <div class="mods" id="mods" aria-live="polite"></div>
  <div style="height:48px"></div>
</main>
<script src="portal.js?v=03e88f3b78"></script>
<script>
(async()=>{const {$}=G;
  let c=null;try{c=await G.eu();}catch(e){c=null;}
  if(!c){location.replace("/?entrar=1&volta=app.html");return;}
  $("#oi").textContent="Olá, "+(c.nome||"").split(" ")[0];
  $("#plano").textContent=(c.plano_nome||"")+(c.papel==="admin"?"":" · este aparelho está ligado à sua conta");
  $("#lAdmin").hidden=c.papel!=="admin";$("#off").hidden=!c.offline;
  $("#mods").innerHTML=G.MODULOS.map(m=>m.on
    ?`<a class="mod on" href="${m.url}"><div class="ic">${m.ic}</div><span class="tag">Abrir</span><b>${G.esc(m.nome)}</b><span>${G.esc(m.desc)}</span></a>`
    :`<div class="mod off" aria-disabled="true"><div class="ic">${m.ic}</div><span class="tag">Em breve</span><b>${G.esc(m.nome)}</b><span>${G.esc(m.desc)}</span></div>`).join("");
  $("#bSair").onclick=()=>{if(confirm("Sair da conta neste aparelho?"))G.sair();};
  const bi=$("#bInst"),mostra=()=>{bi.hidden=!G.podeInstalar();};mostra();document.addEventListener("genio-instalavel",mostra);
  bi.onclick=async()=>{await G.instalar();mostra();};
  G.ls.set("genio-ultimo","app.html");
})();
</script>
</body>
</html>
