<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Produtos e serviços</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=a58c8fce5c">
<style>
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(28,22,53,.06);overflow:hidden;display:flex;flex-direction:column;position:relative}
.prod .cena{aspect-ratio:4/3;background:var(--lav) center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.prod .cena img{width:100%;height:100%;object-fit:cover;display:block}
.prod b{display:block;padding:10px 12px 2px;font-size:16px;line-height:1.2}
.prod .st{padding:0 12px 10px;color:var(--texto2);font-size:13px;min-height:28px}
.prod .st.ok{color:#0E8A84;font-weight:600}
.prod .qtd{display:flex;align-items:center;margin:0 12px 12px;border:1.5px solid var(--linha);border-radius:12px;overflow:hidden}
.prod .qtd button{flex:0 0 42px;height:40px;border:0;background:var(--lav);font-size:20px;font-weight:700;color:var(--marca)}
.prod .qtd span{flex:1;text-align:center;font-weight:700;font-size:16px}.prod .qtd span.zero{color:var(--texto2);font-weight:500;font-size:13px}
.prod.sel{outline:2.5px solid var(--marca)}
.prod .ir{margin:0 12px 8px;min-height:40px;border-radius:12px;background:var(--lav);color:var(--marca);font-weight:700;display:grid;place-items:center;text-decoration:none;font-size:15px}
.serv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px}
.serv .ic{width:44px;height:44px;border-radius:12px;background:var(--lav);display:grid;place-items:center;font-size:22px}
.serv small{display:block;color:var(--texto2);font-size:13px}
.serv .mostra-acao{grid-column:1/-1}.serv .mostra-acao .btn{min-height:42px}
.tog{width:52px;height:30px;border-radius:999px;background:#CFC8E0;position:relative;border:0}.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.tog.on{background:var(--teal)}.tog.on::after{left:25px}
.resumo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-radius:16px;margin:0 0 10px}
.galeria-ctx{position:fixed;inset:0;background:var(--lav);z-index:40;display:flex;flex-direction:column}
.galeria-ctx .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:18px}
.galeria-ctx .rolo{flex:1;overflow:auto;padding:0 16px 24px}.galeria-ctx img{width:100%;border-radius:16px;display:block}
.faces2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 0}.faces2 figure{margin:0}.faces2 img{width:100%;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}.faces2 figcaption{font-size:12px;color:var(--texto2);margin-top:4px;text-align:center}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=a58c8fce5c"></script>
<script src="qr.js?v=a58c8fce5c"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,nav,topo,voltar,setorNome,nomeLoja,estado,salvar,cliente,gravarCliente,definirCliente}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("rota")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);let c=await cliente(l);
  if(!(c.manual&&c.manual.editado)){location.href=`visita.html?l=${encodeURIComponent(slug)}`;return;}  // catálogo só depois do logotipo limpo
  const G=await (await fetch("gabaritos.json?v=a58c8fce5c")).json();
  await App.carregarScript("kits14.js?v=a58c8fce5c");
  // os 16 produtos do kit de 14 setores (10/11); a foto de cada um é a do ramo da loja
  const CAT=await Promise.all([["capacho","Capacho"],["placas","Placa"],["adesivos","Adesivo de vitrine"],["uniformes","Camisa polo"],["impressos","Cartão de visita"],["panfleto",/padaria|restaurante|bar|cafeteria/.test(l.setor||"")?"Flyer · cardápio":"Flyer · produtos e serviços"],["banners","Banner retrátil"],["parede","Adesivo de parede · rotas"],["brindes","Ecobag"],["carimbo","Carimbo"],["windbanner","Wind banner"],["faixa","Faixa"],["folheto","Folheto promocional"],["camiseta","Camiseta"],["bone","Boné"],["avental","Avental"]].map(async([id,n])=>({id,nome:n,img:await Kits14.foto(l.setor,id,true)})));
  const SERV=[{id:"mostraai",nome:"Mostraí · TV de ofertas",desc:"Sua TV em pé com itens, preços e destaque · muda pelo celular",ic:"📺"},{id:"postaai",nome:"Posta Aí · postagens",desc:"Conteúdo para as redes (AI Negócios)",ic:"📣"},{id:"inpi",nome:"Registro de marca (INPI)",desc:"Proteção do nome e do logo",ic:"®"}];
  // Mostraí: preço aprovado em 10/11 (TV do lojista; a GenIO liga e configura o TV Box)
  const PLANOS=[{id:"comodato",rot:"Aparelho emprestado",entrada:249,mensal:99,txt:"R$ 249 de ativação + R$ 99/mês · 12 meses"},{id:"compra",rot:"Compra o aparelho",entrada:499,mensal:79,txt:"R$ 499 na entrada + R$ 79/mês"},{id:"anual",rot:"Anual à vista",entrada:1289,mensal:0,txt:"R$ 1.289 · aparelho e ativação incluídos"}];
  const MOSTRAI_IMG=`/brand/mostrai/JPG/${Kits14.kitDe(l.setor)}_Mostrai.jpg`;
  const e=estado();e.sel=e.sel||{};const S=e.sel[slug]=e.sel[slug]||{};
  function render(){const n=Object.values(S).filter(v=>v&&v.q>0).length;const artes=c.artes||{};
    $("#app").innerHTML=`${topo()}${voltar(`visita.html?l=${encodeURIComponent(slug)}`,"Visita")}
    <h1>Produtos e serviços</h1><p class="sub">${esc(nome)} · ${esc(setorNome(l.setor))}</p>
    <div class="resumo"><div><b>${n?`${n} item(ns) no orçamento`:"Nada escolhido ainda"}</b><br><small class="muted">${Object.keys(artes).length} arte(s) feita(s) · logotipo tratado</small></div><img src="${esc(c.manual.tratado)}" alt="" style="width:56px;height:40px;object-fit:contain;background:#fff;border-radius:8px"></div>
    <div style="display:grid;grid-template-columns:1fr ${Object.keys(artes).length?"1fr":""};gap:8px;margin:0 0 12px"><button class="btn sec" id="todos" type="button" style="min-height:50px">✦ Gerar todos os produtos</button>${Object.keys(artes).length?`<button class="btn sec" id="ctx" type="button" style="min-height:50px">Contextualizar (${Object.keys(artes).length})</button>`:""}</div>
    ${(()=>{const UNI=["uniformes","camiseta","bone","avental"];const cartao=p=>{const s=S[p.id]||{q:0},A=artes[p.id];const mock=(A&&A.contexto)||(A&&A.png)||null;return `<div class="prod ${s.q>0?"sel":""}" data-p="${p.id}">
      <div class="cena" ${mock?"":`style="background-image:url('${p.img}')"`} data-ctx="${p.id}">${mock?`<img src="${mock}" alt="">`:""}</div>
      <b>${esc(p.nome)}</b><div class="st ${s.q>0?"ok":""}">${s.q>0?"✓ no orçamento":A?(A.doc&&A.doc.auto?"arte automática":"arte feita"):"sem arte"}${A&&A.contexto?" · no ambiente":""}</div>
      ${p.id==="capacho"?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 12px 8px"><a class="ir" style="margin:0" href="capacho.html?l=${encodeURIComponent(slug)}">${A?"Editar →":"Montar →"}</a><a class="ir" style="margin:0;background:var(--navy);color:#fff" href="capacho.html?l=${encodeURIComponent(slug)}&ver=1" title="foto do local · ao vivo">👁 Visualizar</a></div>`:(A?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 12px 8px"><a class="ir" style="margin:0" href="editor.html?l=${encodeURIComponent(slug)}&p=${p.id}">Editar →</a><a class="ir" style="margin:0;background:var(--navy);color:#fff" href="local.html?l=${encodeURIComponent(slug)}&p=${p.id}" title="câmera ao vivo · a peça no lugar">👁 No local</a></div>`:`<a class="ir" href="editor.html?l=${encodeURIComponent(slug)}&p=${p.id}">Criar arte</a>`)}
      <div class="qtd"><button data-m="-">−</button><span class="${s.q>0?"":"zero"}">${s.q>0?s.q+" un.":"não quero"}</span><button data-m="+">+</button></div></div>`;};
      return `<div class="grade">${CAT.filter(p=>!UNI.includes(p.id)).map(cartao).join("")}</div><h2 style="margin:22px 0 10px">Uniforme</h2><div class="grade">${UNI.map(id=>CAT.find(p=>p.id===id)).filter(Boolean).map(cartao).join("")}</div>`;})()}
    <h2 style="margin:22px 0 10px">Serviços</h2>
    ${SERV.map(s=>{const on=!!(S[s.id]&&S[s.id].q>0);return `<div class="card serv"><span class="ic">${s.ic}</span><div><b>${esc(s.nome)}</b><small>${esc(s.desc)}${on?" · <b style='color:#0E8A84'>no orçamento</b>":""}</small></div><button class="tog ${on?"on":""}" data-t="${s.id}" aria-label="${esc(s.nome)}"></button>${s.id==="mostraai"?`<div class="mostra-acao"><img class="mostrai-ref" src="${MOSTRAI_IMG}" alt="Mostraí numa loja do ramo" loading="lazy"><div class="planos">${PLANOS.map(p=>`<button type="button" class="plano ${on&&(S.mostraai.plano||"comodato")===p.id?"on":""}" data-plano="${p.id}"><b>${p.rot}</b><small>${p.txt}</small></button>`).join("")}</div><button type="button" class="btn sec sm" id="acionarMostra">${c.mostra&&c.mostra.token?"📺 Abrir tela e programação":"📺 Acionar o Mostraí desta loja"}</button></div>`:""}</div>`;}).join("")}
    <p class="ilus">Preços entram na fase do orçamento.</p>
    <div class="acoes"><div class="w"><a class="btn sec" href="visita.html?l=${encodeURIComponent(slug)}">← Visita</a><a class="btn" href="pedidos.html?l=${encodeURIComponent(slug)}">Ver seleção →</a></div></div>
    ${nav("rota")}`;document.body.classList.add("com-acoes");
    $$(".prod .qtd button").forEach(b=>b.onclick=()=>{const id=b.closest(".prod").dataset.p;const s=S[id]=S[id]||{q:0,nome:CAT.find(x=>x.id===id).nome};s.q=Math.max(0,s.q+(b.dataset.m==="+"?1:-1));salvar(e);render();});
    const am=$("#acionarMostra");if(am)am.onclick=async()=>{am.disabled=true;am.textContent="Preparando…";
      try{const r=await fetch("/api/mostra",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,loja:{nome:l.nome,setor:l.setor}})});const d=await r.json();if(!r.ok)throw new Error(d.erro||r.status);
        c=await cliente(l);c.mostra={token:d.token,criado:(c.mostra&&c.mostra.criado)||new Date().toISOString()};await gravarCliente(c);
        const tela=location.origin+d.tela,prog=location.origin+d.programacao;
        const g=document.createElement("div");g.className="galeria-ctx";g.innerHTML=`<div class="top"><b>Mostraí · ${esc(nome)}</b><button class="btn sec sm" id="fecharM" style="width:auto;min-height:40px;padding:0 12px">Fechar</button></div><div class="rolo" style="padding:0 16px 24px">
          <section class="card" style="text-align:center"><h2 style="margin:0 0 6px">Tela</h2><p class="sub" style="margin:0 0 10px">Abra no TV Box (TV em pé) ou no seu celular. Aponte a câmera:</p><canvas id="qrTela" width="220" height="220" style="width:220px;height:220px;border-radius:12px"></canvas><p style="word-break:break-all;font-size:13px;color:var(--texto2);margin:8px 0">${esc(tela)}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><a class="btn" href="${esc(tela)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir tela</a><button type="button" class="btn sec" data-copia="${esc(tela)}">Copiar · enviar</button></div></section>
          <section class="card" style="text-align:center"><h2 style="margin:0 0 6px">Programação (painel do cliente)</h2><p class="sub" style="margin:0 0 10px">O cliente troca itens, preços, foto e destaque; a TV muda em segundos.</p><canvas id="qrProg" width="220" height="220" style="width:220px;height:220px;border-radius:12px"></canvas><p style="word-break:break-all;font-size:13px;color:var(--texto2);margin:8px 0">${esc(prog)}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><a class="btn" href="${esc(prog)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir programação</a><button type="button" class="btn sec" data-copia="${esc(prog)}">Copiar · enviar</button></div></section></div>`;
        document.body.appendChild(g);g.querySelector("#fecharM").onclick=()=>{g.remove();render();};
        if(window.QR){const q1=g.querySelector("#qrTela").getContext("2d");window.QR.desenhar(q1,tela,0,0,220,"#1C1635","#fff");const q2=g.querySelector("#qrProg").getContext("2d");window.QR.desenhar(q2,prog,0,0,220,"#1C1635","#fff");}
        g.querySelectorAll("[data-copia]").forEach(b=>b.onclick=async()=>{const u=b.dataset.copia;if(navigator.share){try{await navigator.share({title:"Mostraí · "+nome,url:u});return;}catch(e){}}try{await navigator.clipboard.writeText(u);b.textContent="Copiado ✓";}catch(e){prompt("Copie o link:",u);}});
      }catch(e){alert("Não consegui acionar o Mostraí: "+e.message);am.disabled=false;am.textContent="📺 Acionar Mostraí";}};
    const porPlano=id=>{const p=PLANOS.find(x=>x.id===id)||PLANOS[0];S.mostraai={q:1,servico:true,plano:p.id,entrada:p.entrada,mensal:p.mensal,nome:`Mostraí · ${p.rot.toLowerCase()} · ${p.txt}`};};
    $$(".plano").forEach(b=>b.onclick=()=>{porPlano(b.dataset.plano);salvar(e);render();});
    $$(".tog").forEach(b=>b.onclick=()=>{const id=b.dataset.t;if(id==="mostraai"){if(S.mostraai&&S.mostraai.q>0)S.mostraai.q=0;else porPlano((S.mostraai&&S.mostraai.plano)||"comodato");salvar(e);render();return;}const s=S[id]=S[id]||{q:0,nome:SERV.find(x=>x.id===id).nome,servico:true};s.q=s.q>0?0:1;salvar(e);render();});
    // item do kit com arte: tocar volta para a edição daquela arte
    $$(".cena[data-ctx]").forEach(el=>{let t0=0,mv=false;el.addEventListener("pointerdown",()=>{t0=Date.now();mv=false;});el.addEventListener("pointermove",()=>{mv=true;});el.addEventListener("pointerup",()=>{if(mv||Date.now()-t0>450)return;const A=artes[el.dataset.ctx];if(A&&A.contexto){const g=document.createElement("div");g.className="galeria-ctx";g.innerHTML=`<div class="top"><b>${esc(CAT.find(x=>x.id===el.dataset.ctx).nome)}</b><span><a class="btn sec sm" style="width:auto;display:inline-grid;min-height:40px;padding:0 12px;text-decoration:none;margin-right:6px" href="editor.html?l=${encodeURIComponent(slug)}&p=${el.dataset.ctx}">${A.verso?"Editar frente":"Editar"}</a>${A.verso?`<a class="btn sec sm" style="width:auto;display:inline-grid;min-height:40px;padding:0 12px;text-decoration:none;margin-right:6px" href="editor.html?l=${encodeURIComponent(slug)}&p=${el.dataset.ctx}&face=verso">Editar verso</a>`:""}<button class="btn sec sm" id="fechar" style="width:auto;min-height:40px;padding:0 12px">Fechar</button></span></div><div class="rolo"><img src="${A.contexto}" alt="">${A.verso?`<div class="faces2"><figure><img src="${A.png}" alt=""><figcaption>Frente</figcaption></figure><figure><img src="${A.verso.png}" alt=""><figcaption>Verso</figcaption></figure></div>`:""}</div>`;document.body.appendChild(g);g.querySelector("#fechar").onclick=()=>g.remove();}else location.href=el.dataset.ctx==="capacho"?`capacho.html?l=${encodeURIComponent(slug)}`:`editor.html?l=${encodeURIComponent(slug)}&p=${el.dataset.ctx}`;});});
    $("#todos").onclick=async()=>{const b=$("#todos");b.disabled=true;const r=await App.gerarProdutos(l,pid=>{b.textContent=`Gerando ${CAT.find(x=>x.id===pid).nome}…`;});c=await cliente(l);render();if(r.falhas.length)alert("Não consegui em: "+r.falhas.join(" · "));};
    const cb=$("#ctx");if(cb)cb.onclick=async()=>{cb.disabled=true;const ids=Object.keys(artes);let k=0,falhas=[];
      for(const id of ids){const A=artes[id];cb.textContent=`Aplicando ${CAT.find(x=>x.id===id).nome}… (${++k}/${ids.length})`;
        if(id==="carimbo"){A.contexto=App.cenaCarimbo((A.doc&&A.doc.campos)||{});A.kit="carimbo-folha";continue;}
        try{const r=await App.contextualizar(l,id,A);const d=await r.json();if(r.ok&&d.jpg){A.contexto=d.jpg;A.kit=d.kit;}else falhas.push(CAT.find(x=>x.id===id).nome+": "+(d.mensagem||d.erro||r.status));}catch(err){falhas.push(id+": "+err.message);}}
      c.artes=artes;await gravarCliente(c);render();if(falhas.length)alert("Não consegui em: "+falhas.join(" · "));};}
  render();
})();
</script>
</body>
</html>
