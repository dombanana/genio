<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Produtos e serviços</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=8159db0531">
<style>
.grade{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prod{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(28,22,53,.06);overflow:hidden;display:flex;flex-direction:column;position:relative}
.prod .cena{aspect-ratio:4/3;background:var(--lav) center/cover no-repeat;display:grid;place-items:center;overflow:hidden}
.prod .cena img{width:100%;height:100%;object-fit:cover;display:block}
.prod b{display:block;padding:10px 12px 2px;font-size:16px;line-height:1.2}
.prod .st{padding:0 12px 10px;color:var(--texto2);font-size:13px;min-height:28px}
.prod .st.ok{color:#0E8A84;font-weight:600}
.prod .qtd{display:flex;align-items:center;margin:0 12px 12px;border:1.5px solid var(--linha);border-radius:12px;overflow:hidden}
.prod .qtd button{flex:0 0 42px;height:40px;border:0;background:var(--lav);font-size:20px;font-weight:700;color:var(--marca)}
.prod .qtd span{flex:1;text-align:center;font-weight:700;font-size:16px}.prod .qtd span.zero{color:var(--texto2);font-weight:500;font-size:13px}
.prod.sel{outline:2.5px solid var(--marca)}
.prod .dup{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:2}
.prod .dup button{width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:var(--marca);color:#fff;font:700 19px/1 Rubik,system-ui,sans-serif;padding:0;display:grid;place-items:center;box-shadow:0 2px 6px rgba(28,22,53,.35)}
.prod .dup button.menos{background:#6f6888}
.prod .ir{margin:0 12px 8px;min-height:40px;border-radius:12px;background:var(--lav);color:var(--marca);font-weight:700;display:grid;place-items:center;text-decoration:none;font-size:15px}
.loc-cena{display:grid!important;grid-template-columns:1fr 1fr;gap:2px;position:relative;background:#ddd}
.loc-cena img{width:100%;height:100%;object-fit:cover}
.loc-cena .tema{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font:800 15px/1.1 Rubik,system-ui,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:7px 6px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.tema.t-liquidacao{background:#D7262E;color:#fff}.tema.t-blackfriday{background:#111;color:#FFD400}.tema.t-queima{background:#F26A1B;color:#fff}
.temas{display:flex;flex-wrap:wrap;gap:6px;margin:0 12px 8px}
.temas button{flex:1 1 auto;min-height:34px;border-radius:10px;border:1.5px solid var(--linha);background:#fff;font:600 12.5px/1.1 Rubik,system-ui,sans-serif;color:var(--texto);padding:4px 8px}
.temas button.on{border-color:var(--marca);background:var(--lav);color:var(--marca)}
.cal-fundo{position:fixed;inset:0;background:rgba(20,16,36,.45);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.cal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.cal .mes{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}.cal .mes b{font-size:17px}
.cal .mes button{width:38px;height:38px;border-radius:10px;border:0;background:var(--lav);color:var(--marca);font-size:18px}
.cal .sem,.cal .dias{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal .sem span{text-align:center;font-size:11px;color:var(--texto2);font-weight:700}
.cal .dias button{height:46px;border-radius:9px;border:0;background:#F5F3FA;font:600 14px/1 Rubik,system-ui,sans-serif;color:var(--texto);display:grid;place-items:center;padding:2px 0}
.cal .dias button small{display:block;font-size:9.5px;font-weight:500;color:var(--texto2)}
.cal .dias button:disabled{background:none;color:#c9c4d6;text-decoration:line-through}.cal .dias button:disabled small{visibility:hidden}
.cal .dias button.faixa-dia{background:#E4DCF7}.cal .dias button.ini{background:var(--marca);color:#fff}.cal .dias button.ini small{color:#fff}
.cal .res{margin:10px 2px;font-size:14px;line-height:1.35}.cal .acoes-cal{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.serv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 16px}
.serv .ic{position:relative;width:56px;height:56px;border-radius:12px;background:var(--lav);display:grid;place-items:center;font-size:24px}
.serv .ic .dup{position:absolute;top:-8px;right:-10px;display:flex;gap:3px}
.serv .ic .dup button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;background:var(--marca);color:#fff;font:700 16px/1 Rubik,system-ui,sans-serif;padding:0;display:grid;place-items:center;box-shadow:0 2px 5px rgba(28,22,53,.3)}
.serv .ic .dup button.menos{background:#6f6888}
.serv small{display:block;color:var(--texto2);font-size:13px}
.serv .mostra-acao{grid-column:1/-1}.serv .mostra-acao .btn{min-height:42px}
.tog{width:52px;height:30px;border-radius:999px;background:#CFC8E0;position:relative;border:0}.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}.tog.on{background:var(--teal)}.tog.on::after{left:25px}
.resumo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-radius:16px;margin:0 0 10px}
.galeria-ctx{position:fixed;inset:0;background:var(--lav);z-index:40;display:flex;flex-direction:column}
.galeria-ctx .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:18px}
.galeria-ctx .rolo{flex:1;overflow:auto;padding:0 16px 24px}.galeria-ctx img{width:100%;border-radius:16px;display:block}
.faces2{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 0}.faces2 figure{margin:0}.faces2 img{width:100%;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.18)}.faces2 figcaption{font-size:12px;color:var(--texto2);margin-top:4px;text-align:center}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=8159db0531"></script>
<script src="qr.js?v=8159db0531"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,nav,topo,voltar,setorNome,nomeLoja,estado,salvar,cliente,gravarCliente,definirCliente}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("rota")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);let c=await cliente(l);
  if(!(c.manual&&c.manual.editado)){location.href=`visita.html?l=${encodeURIComponent(slug)}`;return;}  // catálogo só depois do logotipo limpo
  const G=await (await fetch("gabaritos.json?v=8159db0531")).json();
  await App.carregarScript("kits14.js?v=8159db0531");
  // os 16 produtos do kit de 14 setores (10/11); a foto de cada um é a do ramo da loja
  const CAT=await Promise.all([["capacho","Capacho"],["placas","Placa"],["adesivos","Adesivo de vitrine"],["uniformes","Camisa polo"],["impressos","Cartão de visita"],["panfleto",/padaria|restaurante|bar|cafeteria/.test(l.setor||"")?"Flyer · cardápio":"Flyer · produtos e serviços"],["banners","Banner retrátil"],["parede","Adesivo de parede · rotas"],["brindes","Ecobag"],["carimbo","Carimbo"],["windbanner","Wind banner"],["faixa","Faixa"],["folheto","Folheto promocional"],["camiseta","Camiseta"],["bone","Boné"],["avental","Avental"]].map(async([id,n])=>({id,nome:n,img:await Kits14.foto(l.setor,id,true)})));
  const SERV=[{id:"mostraai",nome:"Mostraí · TV de ofertas",desc:"Sua TV em pé com itens, preços e destaque · muda pelo celular",ic:"📺"},{id:"falaai",nome:"Fala Aí · atendente no telefone",desc:"URA com o nome da loja · frases gravadas do sistema",ic:"📞"},{id:"inpi",nome:"Registro de marca (INPI)",desc:"Proteção do nome e do logo",ic:"®"}];
  // Mostraí: preço aprovado em 10/11 (TV do lojista; a GenIO liga e configura o TV Box)
  const PLANOS=[{id:"comodato",rot:"Aparelho emprestado",entrada:249,mensal:99,txt:"R$ 249 de ativação + R$ 99/mês · 12 meses"},{id:"anual",rot:"Anual à vista",entrada:1289,mensal:0,txt:"R$ 1.289 · aparelho emprestado e ativação incluídos"}];
  const MOSTRAI_IMG=`/brand/mostrai/JPG/${Kits14.kitDe(l.setor)}_Mostrai.jpg`;
  const e=estado();e.sel=e.sel||{};const S=e.sel[slug]=e.sel[slug]||{};
  const UNI_CORES=new Set(["uniformes","camiseta","bone","avental"]);
  const TECIDO=[["#F4F1EA","Branco"],["#2B2B2D","Preto"],["#1F3A5F","Marinho"],["#9A9B9D","Cinza"],["#C62828","Vermelho"],["#2E7D32","Verde"],["#14B8B0","Verde-água"],["#EDE6D6","Cru"]];
  function coresPeca(pid,A){const fm=c.manual&&c.manual.fundoMarca;const marca=((c.manual&&c.manual.cores)||[]).map(x=>x.hex).filter(Boolean);
    const lista=[...(fm?[[fm,"Fundo da marca"]]:[]),...marca.filter(h=>h!==fm).slice(0,3).map(h=>[h,"Cor da marca"]),...TECIDO];const vistos=new Set();
    return `<div class="cores-peca" data-p="${pid}">${lista.filter(([h])=>{const k=h.toLowerCase();if(vistos.has(k))return false;vistos.add(k);return true;}).map(([h,n])=>`<button type="button" data-cor="${h}" title="${esc(n)}" aria-label="${esc(n)}" class="${(A.material||"").toLowerCase()===h.toLowerCase()?"on":""} ${n!=="Cor da marca"&&n!=="Fundo da marca"?"":"marca"}" style="background:${h}"></button>`).join("")}</div>`;}
  async function trocarCorPeca(pid,hex,el){el.classList.add("trocando");
    try{// peça ainda sem arte: monta a arte-padrão já na cor tocada
      const A=(c.artes||{})[pid]||await App.artePadrao(pid,(c=await App.garantirCamadas(l)),l);if(!A)throw new Error("sem gabarito para esta peça");const novo={...A,material:hex};const r=await App.contextualizar(l,pid,novo);const d=await r.json();if(!r.ok||!d.jpg)throw new Error(d.mensagem||d.erro||r.status);
      novo.contexto=d.jpg;novo.kit=d.kit;c=await cliente(l);c.artes=c.artes||{};c.artes[pid]=novo;await gravarCliente(c);render();}
    catch(err){el.classList.remove("trocando");alert("Não consegui trocar a cor: "+err.message);}}
  // adesivo de vitrine: tamanhos da GIV (vinil transparente) em retrato ou paisagem; a arte se reorganiza e a foto mostra na escala
  function formatoVitrine(){const f=(c.formatos||{}).adesivos||App.VITRINE_PADRAO;const mp=App.vitrineMaisPerto(f);const a=mp[0],b=mp[1];const ret=f.h_cm>f.w_cm;
    const nb=x=>String(x).replace(".",",");
    return `<div class="fmt-v"><select data-fmtv>${App.VITRINE.map(([x,y])=>`<option value="${x}x${y}" ${Math.abs(x-a)<0.6&&Math.abs(y-b)<0.6?"selected":""}>${nb(x)} × ${nb(y)} cm</option>`).join("")}</select>
      <div class="ori"><button type="button" data-ori="paisagem" class="${ret?"":"on"}">▭ Paisagem</button><button type="button" data-ori="retrato" class="${ret?"on":""}">▯ Retrato</button></div></div>`;}
  async function trocarFormato(w,h,el){el&&el.classList.add("trocando");
    try{c=await App.garantirCamadas(l);c.formatos={...(c.formatos||{}),adesivos:{w_cm:w,h_cm:h}};
      const A=await App.artePadrao("adesivos",c,l);if(!A)throw new Error("sem gabarito");const rr=await App.contextualizar(l,"adesivos",A);const d=await rr.json();if(!rr.ok||!d.jpg)throw new Error(d.erro||rr.status);
      A.contexto=d.jpg;A.kit=d.kit;const c2=await cliente(l);c2.formatos=c.formatos;c2.artes=c2.artes||{};c2.artes.adesivos=A;await gravarCliente(c2);c=c2;render();}
    catch(err){el&&el.classList.remove("trocando");alert("Não consegui trocar o tamanho: "+err.message);}}
  document.addEventListener("change",ev=>{const sl=ev.target.closest&&ev.target.closest("[data-fmtv]");if(!sl)return;const [x,y]=sl.value.split("x").map(Number);const f=(c.formatos||{}).adesivos||App.VITRINE_PADRAO;const ret=f.h_cm>f.w_cm;
    trocarFormato(ret?Math.min(x,y):Math.max(x,y),ret?Math.max(x,y):Math.min(x,y),sl.closest(".prod"));},true);
  document.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest("[data-ori]");if(!b)return;ev.preventDefault();ev.stopPropagation();const f=(c.formatos||{}).adesivos||App.VITRINE_PADRAO;const a=Math.min(f.w_cm,f.h_cm),bb=Math.max(f.w_cm,f.h_cm);
    if(b.classList.contains("on"))return;b.parentNode.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));trocarFormato(b.dataset.ori==="retrato"?a:bb,b.dataset.ori==="retrato"?bb:a,b.closest(".prod"));},true);
  document.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest(".cores-peca [data-cor]");if(!b)return;ev.preventDefault();ev.stopPropagation();const box=b.closest(".cores-peca");
    box.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));trocarCorPeca(box.dataset.p,b.dataset.cor,b.closest(".prod"));},true);
  // propostas duplicadas no orçamento ("camiseta~2"): cada uma tem o seu card, com arte e cor próprias
  const variantes=id=>Object.keys(S).filter(k=>k.startsWith(id+"~")).sort((a,b)=>+a.split("~")[1]-+b.split("~")[1]).map(k=>{const b=CAT.find(x=>x.id===id);return {id:k,nome:`${b.nome} · ${k.split("~")[1]}`,img:b.img};});
  const catDe=id=>CAT.find(x=>x.id===id)||(()=>{const b=CAT.find(x=>x.id===App.baseId(id));return b?{id,nome:`${b.nome} · ${String(id).split("~")[1]}`,img:b.img}:{id,nome:id};})();
  // locação: kit tapete + wind banner (imagens padrão do escritório), tema trocado aqui; no lugar da quantidade, o dia da retirada (15 dias)
  const Rb=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  function cartaoLoc(id){const s=S[id]||{q:0},tema=s.tema||"liquidacao",t=App.LOC_TEMAS.find(x=>x.id===tema),pr=App.precoLocacao(s.inicio),n=id.includes("~")?" · "+id.split("~")[1]:"";
    return `<div class="prod ${s.q>0?"sel":""}" id="p-${id}" data-p="${id}" data-loc="1">
      <div class="cena loc-cena">${App.LOC_IMG.map(u=>`<img src="${u}" alt="" loading="lazy">`).join("")}<span class="tema t-${tema}">${esc(t.nome)}</span></div><span class="dup"><button type="button" class="menos" data-tira aria-label="${n?"tirar esta proposta":"não quero"}">−</button><button type="button" data-dup aria-label="duplicar esta proposta">+</button></span>
      <b>Kit locação${n}</b><div class="preco-p">${s.inicio?(pr!=null?`<b>${Rb(pr)}</b><small>15 dias · tapete + wind banner</small>`:`<small>preço a confirmar para essa data · 15 dias</small>`):`<small>tapete + wind banner · 15 dias · preço pela data de retirada</small>`}</div>
      <div class="st ${s.q>0?"ok":""}">${s.q>0?"✓ no orçamento":"escolha o tema e o dia"}</div>
      <div class="temas">${App.LOC_TEMAS.map(x=>`<button type="button" data-tema="${x.id}" class="${x.id===tema?"on":""}">${esc(x.nome)}</button>`).join("")}</div>
      <button type="button" class="ir" data-cal style="border:0;width:calc(100% - 24px)">📅 ${s.inicio?`Retira ${App.diaBR(s.inicio)} · devolve ${App.diaBR(App.locFim(s.inicio))}`:"Escolher o dia da retirada"}</button></div>`;}
  const resId=k=>slug+"|"+k;
  async function abrirCal(k){const s=S[k]||{},tema=s.tema||"liquidacao";const Rv=await App.reservasLoc();const hoje=App.isoDia(new Date());let ini=s.inicio||null;
    let base=new Date((ini||hoje)+"T12:00:00");base.setDate(1);
    const f=document.createElement("div");f.className="cal-fundo";document.body.appendChild(f);
    const fechar=()=>f.remove();f.onclick=ev=>{if(ev.target===f)fechar();};
    const desenha=()=>{const y=base.getFullYear(),m=base.getMonth(),pri=new Date(y,m,1).getDay(),nd=new Date(y,m+1,0).getDate();const fim=ini?App.locFim(ini):null;
      let cel="";for(let i=0;i<pri;i++)cel+="<span></span>";
      for(let d=1;d<=nd;d++){const iso=App.isoDia(new Date(y,m,d,12));const ok=iso>=hoje&&App.locLivre(Rv,tema,iso,resId(k));const p=App.precoLocacao(iso);
        cel+=`<button type="button" data-d="${iso}" ${ok?"":"disabled"} class="${ini===iso?"ini":ini&&iso>ini&&iso<=fim?"faixa-dia":""}">${d}<small>${p!=null?Math.round(p):""}</small></button>`;}
      const pr=ini?App.precoLocacao(ini):null;
      f.innerHTML=`<div class="cal"><div class="mes"><button type="button" data-m="-1" aria-label="mês anterior">‹</button><b>${(t=>t[0].toUpperCase()+t.slice(1))(base.toLocaleDateString("pt-BR",{month:"long",year:"numeric"}))}</b><button type="button" data-m="1" aria-label="próximo mês">›</button></div>
        <p class="muted" style="margin:0 0 8px;font-size:13px">Kit ${esc(App.LOC_TEMAS.find(x=>x.id===tema).nome)} · toque no dia em que a loja retira; são sempre 15 dias. Dias riscados: sem kit livre.</p>
        <div class="sem">${["D","S","T","Q","Q","S","S"].map(x=>`<span>${x}</span>`).join("")}</div><div class="dias">${cel}</div>
        <div class="res">${ini?`Retira <b>${App.diaBR(ini)}</b> · devolve <b>${App.diaBR(fim)}</b> · ${pr!=null?`<b>${Rb(pr)}</b>`:"preço a confirmar para essa data"}`:"Nenhum dia escolhido."}</div>
        <div class="acoes-cal"><button type="button" class="btn sec" data-x>${s.inicio?"Tirar data":"Fechar"}</button><button type="button" class="btn" data-ok ${ini?"":"disabled"}>Confirmar</button></div></div>`;
      f.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{base.setMonth(base.getMonth()+ +b.dataset.m);desenha();});
      f.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ini=b.dataset.d;desenha();});
      f.querySelector("[data-x]").onclick=async()=>{if(s.inicio){await App.reservarLoc({id:resId(k),inicio:null});const o=S[k];delete o.inicio;o.q=0;salvar(e);}fechar();render();};
      f.querySelector("[data-ok]").onclick=async ev=>{ev.target.disabled=true;ev.target.textContent="Reservando…";
        const ok=await App.reservarLoc({id:resId(k),slug,loja:nomeLoja(l.nome),tema,inicio:ini});
        if(!ok){alert("Esse período acabou de ser reservado por outra loja. Escolha outro dia.");fechar();abrirCal(k);return;}
        S[k]={...(S[k]||{}),q:1,locacao:true,tema,inicio:ini,nome:"Kit locação"};salvar(e);fechar();render();};};
    desenha();}
  function render(){const n=Object.values(S).filter(v=>v&&v.q>0).length;const artes=c.artes||{};
    $("#app").innerHTML=`${topo()}${voltar(`visita.html?l=${encodeURIComponent(slug)}`,"Visita")}
    ${App.cabCliente(l,{titulo:"Produtos e serviços"})}
    <div class="resumo"><div><b>${n?`${n} item(ns) no orçamento`:"Nada escolhido ainda"}</b><br><small class="muted">${Object.keys(artes).length} arte(s) feita(s) · logotipo tratado</small></div><img src="${esc(c.manual.tratado)}" alt="" style="width:56px;height:40px;object-fit:contain;background:#fff;border-radius:8px"></div>
    <div style="display:grid;grid-template-columns:1fr ${Object.keys(artes).length?"1fr":""};gap:8px;margin:0 0 12px"><button class="btn sec" id="todos" type="button" style="min-height:50px">✦ Gerar todos os produtos</button>${Object.keys(artes).length?`<button class="btn sec" id="ctx" type="button" style="min-height:50px">Contextualizar (${Object.keys(artes).length})</button>`:""}</div>
    ${(()=>{const UNI=["uniformes","camiseta","bone","avental"];const cartao=p=>{const s=S[p.id]||{q:0},A=artes[p.id];const prova=A&&A.provas&&A.provas[0]&&A.provas[0].src;const mock=prova||(A&&A.contexto)||(A&&A.png)||null;return `<div class="prod ${s.q>0?"sel":""}" id="p-${p.id}" data-p="${p.id}">
      <div class="cena" ${mock?"":`style="background-image:url('${p.img}')"`} data-ctx="${p.id}">${mock?`<img src="${mock}" alt="">`:""}</div><span class="dup"><button type="button" class="menos" data-tira aria-label="${p.id.includes("~")?"tirar esta proposta":"não quero"}">−</button><button type="button" data-dup aria-label="duplicar esta proposta">+</button></span>
      <b>${esc(p.nome)}</b>${(()=>{const cp=p.id==="capacho"&&c.capacho_preco;if(cp&&cp.total){const R=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});const md=(cp.medidas||[]).map(m=>`${String((m.w/100).toFixed(2)).replace(".",",")} × ${String((m.h/100).toFixed(2)).replace(".",",")} m`).join(" + ");
        return `<div class="preco-p"><b>${R(cp.total)}</b><small>${esc(md)}${cp.qtd>1?` · ${cp.qtd} un.`:""} · Pix ${R(cp.pix)} · ${cp.parc}× ${R(cp.cartao/cp.parc)} no cartão</small></div>`;}
      const pr=App.precoProduto(p.id,(c.formatos||{})[p.id]);return pr?`<div class="preco-p"><b>${pr.txt}</b><small>${esc(pr.unid)} · frete no fechamento</small></div>`:`<div class="preco-p"><small>preço a confirmar</small></div>`;})()}<div class="st ${s.q>0?"ok":""}">${s.q>0?"✓ no orçamento":A?(A.doc&&A.doc.auto?"arte automática":"arte feita"):"sem arte"}${prova?" · foto real":A&&A.contexto?" · no ambiente":""}</div>
      ${p.id==="capacho"?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 12px 8px"><a class="ir" style="margin:0" href="capacho.html?l=${encodeURIComponent(slug)}&n=${encodeURIComponent(nomeLoja(l.nome))}">${A?"Editar →":"Montar →"}</a><a class="ir" style="margin:0;background:var(--navy);color:#fff" href="capacho.html?l=${encodeURIComponent(slug)}&n=${encodeURIComponent(nomeLoja(l.nome))}&ver=1" title="foto do local · ao vivo">👁 Visualizar</a></div>`:(A?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 12px 8px"><a class="ir" style="margin:0" href="editor.html?l=${encodeURIComponent(slug)}&p=${p.id}">Editar →</a>${UNI_CORES.has(App.baseId(p.id))?`<a class="ir" style="margin:0;background:var(--navy);color:#fff" href="provar.html?l=${encodeURIComponent(slug)}&p=${p.id}" title="foto de quem vai vestir: recorte, cor e estampa no lugar">Provar</a>`:`<a class="ir" style="margin:0;background:var(--navy);color:#fff" href="local.html?l=${encodeURIComponent(slug)}&p=${p.id}" title="câmera ao vivo · a peça no lugar">👁 No local</a>`}</div>`:(UNI_CORES.has(App.baseId(p.id))?`<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 12px 8px"><a class="ir" style="margin:0" href="editor.html?l=${encodeURIComponent(slug)}&p=${p.id}">Criar arte</a><a class="ir" style="margin:0;background:var(--navy);color:#fff" href="provar.html?l=${encodeURIComponent(slug)}&p=${p.id}">Provar</a></div>`:`<a class="ir" href="editor.html?l=${encodeURIComponent(slug)}&p=${p.id}">Criar arte</a>`))}
      ${UNI_CORES.has(App.baseId(p.id))&&(A||(c.manual&&c.manual.editado))?coresPeca(p.id,A||{}):""}${p.id==="adesivos"?formatoVitrine():""}<div class="qtd"><button data-m="-">−</button><span class="${s.q>0?"":"zero"}">${s.q>0?(p.id==="capacho"?s.q+" un.":App.qtdNormal(p.id,s.q).toLocaleString("pt-BR")+" un."+(s.grade?" · grade":"")):"não quero"}</span><button data-m="+">+</button></div></div>`;};
      const comVar=p=>[p,...variantes(p.id)];return `<div class="grade">${CAT.filter(p=>!UNI.includes(p.id)).flatMap(comVar).map(cartao).join("")}</div><h2 style="margin:22px 0 10px">Uniforme</h2><div class="grade">${UNI.map(id=>CAT.find(p=>p.id===id)).filter(Boolean).flatMap(comVar).map(cartao).join("")}</div>`;})()}
    <h2 style="margin:22px 0 10px">Locação</h2>
    <div class="grade">${["locacao",...Object.keys(S).filter(k=>k.startsWith("locacao~")).sort((a,b)=>+a.split("~")[1]-+b.split("~")[1])].map(cartaoLoc).join("")}</div>
    <h2 style="margin:22px 0 10px">Serviços</h2>
    ${SERV.flatMap(s=>[s,...Object.keys(S).filter(k=>k.startsWith(s.id+"~")).sort((a,b)=>+a.split("~")[1]-+b.split("~")[1]).map(k=>({...s,id:k,nome:`${s.nome} · ${k.split("~")[1]}`}))]).map(s=>{const on=!!(S[s.id]&&S[s.id].q>0);const sb=App.baseId(s.id);return `<div class="card serv" data-s="${s.id}"><span class="ic">${s.ic}<span class="dup"><button type="button" class="menos" data-stira aria-label="${s.id.includes("~")?"tirar esta proposta":"não quero"}">−</button><button type="button" data-sdup aria-label="duplicar esta proposta">+</button></span></span><div><b>${esc(s.nome)}</b><small>${esc(s.desc)}${on?" · <b style='color:#0E8A84'>no orçamento</b>":""}</small></div><button class="tog ${on?"on":""}" data-t="${s.id}" aria-label="${esc(s.nome)}"></button>${sb==="mostraai"?`<div class="mostra-acao"><img class="mostrai-ref" src="${MOSTRAI_IMG}" alt="Mostraí numa loja do ramo" loading="lazy"><div class="planos">${PLANOS.map(p=>`<button type="button" class="plano ${on&&(S[s.id].plano||"comodato")===p.id?"on":""}" data-plano="${p.id}"><b>${p.rot}</b><small>${p.txt}</small></button>`).join("")}</div>${s.id==="mostraai"?`<button type="button" class="btn sec sm" id="acionarMostra">${c.mostra&&c.mostra.token?"📺 Abrir tela e programação":"📺 Acionar o Mostraí desta loja"}</button>`:""}</div>`:""}</div>`;}).join("")}
    <p class="ilus">Preços entram na fase do orçamento.</p>
    <div class="acoes"><div class="w"><a class="btn sec" href="visita.html?l=${encodeURIComponent(slug)}">← Visita</a><a class="btn" href="orcamento.html?l=${encodeURIComponent(slug)}">Orçamento →</a></div></div>
    ${nav("rota")}`;document.body.classList.add("com-acoes");
    $$(".prod [data-tema]").forEach(b=>b.onclick=async()=>{const k=b.closest(".prod").dataset.p;const s=S[k]=S[k]||{q:0,locacao:true,nome:"Kit locação"};const novo=b.dataset.tema;if(s.tema===novo)return;
      if(s.inicio){const ok=await App.reservarLoc({id:resId(k),slug,loja:nomeLoja(l.nome),tema:novo,inicio:s.inicio});if(!ok){alert("Não há kit desse tema livre nesse período. Escolha outro dia.");await App.reservarLoc({id:resId(k),inicio:null});delete s.inicio;s.q=0;}}
      s.tema=novo;salvar(e);render();});
    $$(".prod [data-cal]").forEach(b=>b.onclick=()=>abrirCal(b.closest(".prod").dataset.p));
    // + na foto: duplica a proposta (outra cor, outra arte, outra quantidade) num card próprio logo abaixo; − na foto: tira a cópia (no card original, "não quero")
    $$(".prod [data-dup]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();const k=b.closest(".prod").dataset.p;const kb=App.baseId(k);
      if(kb==="capacho"){location.href=`capacho.html?l=${encodeURIComponent(slug)}&n=${encodeURIComponent(nomeLoja(l.nome))}`;return;}   // outro tapete: o motor do capacho monta vários no mesmo orçamento
      if(kb==="locacao"){let n=2;while(S["locacao~"+n])n++;S["locacao~"+n]={q:0,locacao:true,tema:(S[k]&&S[k].tema)||"liquidacao",nome:"Kit locação"};salvar(e);render();return;}   // outro kit: escolhe tema e dia próprios
      let n=2;while(S[kb+"~"+n])n++;const nk=kb+"~"+n;const s0=S[k]||{q:0};S[nk]={...s0,nome:catDe(nk).nome,q:s0.q>0?s0.q:App.passoQtd(nk,0,1)};salvar(e);
      c=await cliente(l);c.artes=c.artes||{};if(c.artes[k])c.artes[nk]=JSON.parse(JSON.stringify(c.artes[k]));if(c.formatos&&c.formatos[k])c.formatos[nk]=JSON.parse(JSON.stringify(c.formatos[k]));if(c.artes[nk]||(c.formatos&&c.formatos[nk]))await App.gravarCliente(c);
      render();setTimeout(()=>{const el=document.getElementById("p-"+nk);if(el)el.scrollIntoView({behavior:"smooth",block:"center"});},60);});
    $$(".prod [data-tira]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();const k=b.closest(".prod").dataset.p;
      if(App.baseId(k)==="locacao"){if(S[k]&&S[k].inicio)await App.reservarLoc({id:resId(k),inicio:null});if(k.includes("~"))delete S[k];else if(S[k]){delete S[k].inicio;S[k].q=0;}salvar(e);render();return;}
      if(k.includes("~")){delete S[k];const P=(e.pedidos||{})[slug];if(P&&P.desc)delete P.desc[k];salvar(e);c=await cliente(l);let mud=false;if(c.artes&&c.artes[k]){delete c.artes[k];mud=true;}if(c.formatos&&c.formatos[k]){delete c.formatos[k];mud=true;}if(mud)await App.gravarCliente(c);}
      else if(S[k]){S[k].q=0;salvar(e);}render();});
    $$(".prod .qtd button").forEach(b=>b.onclick=()=>{const id=b.closest(".prod").dataset.p;if(S[id]&&S[id].grade&&S[id].q>0){location.href=`orcamento.html?l=${encodeURIComponent(slug)}#${id}`;return;}   // quantidade já distribuída por modelo e tamanho: ajusta na grade do orçamento
const s=S[id]=S[id]||{q:0,nome:catDe(id).nome};s.q=id==="capacho"?Math.max(0,s.q+(b.dataset.m==="+"?1:-1)):App.passoQtd(id,App.qtdNormal(id,s.q),b.dataset.m==="+"?1:-1);salvar(e);render();});
    const am=$("#acionarMostra");if(am)am.onclick=async()=>{am.disabled=true;am.textContent="Preparando…";
      try{const r=await fetch("/api/mostra",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({slug,loja:{nome:l.nome,setor:l.setor}})});const d=await r.json();if(!r.ok)throw new Error(d.erro||r.status);
        c=await cliente(l);c.mostra={token:d.token,criado:(c.mostra&&c.mostra.criado)||new Date().toISOString()};await gravarCliente(c);
        const tela=location.origin+d.tela,prog=location.origin+d.programacao;
        const g=document.createElement("div");g.className="galeria-ctx";g.innerHTML=`<div class="top"><b>Mostraí · ${esc(nome)}</b><button class="btn sec sm" id="fecharM" style="width:auto;min-height:40px;padding:0 12px">Fechar</button></div><div class="rolo" style="padding:0 16px 24px">
          <section class="card" style="text-align:center"><h2 style="margin:0 0 6px">Tela</h2><p class="sub" style="margin:0 0 10px">Abra no TV Box (TV em pé) ou no seu celular. Aponte a câmera:</p><canvas id="qrTela" width="220" height="220" style="width:220px;height:220px;border-radius:12px"></canvas><p style="word-break:break-all;font-size:13px;color:var(--texto2);margin:8px 0">${esc(tela)}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><a class="btn" href="${esc(tela)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir tela</a><button type="button" class="btn sec" data-copia="${esc(tela)}">Copiar · enviar</button></div></section>
          <section class="card" style="text-align:center"><h2 style="margin:0 0 6px">Programação (painel do cliente)</h2><p class="sub" style="margin:0 0 10px">O cliente troca itens, preços, foto e destaque; a TV muda em segundos.</p><canvas id="qrProg" width="220" height="220" style="width:220px;height:220px;border-radius:12px"></canvas><p style="word-break:break-all;font-size:13px;color:var(--texto2);margin:8px 0">${esc(prog)}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><a class="btn" href="${esc(prog)}" target="_blank" rel="noopener" style="text-decoration:none">Abrir programação</a><button type="button" class="btn sec" data-copia="${esc(prog)}">Copiar · enviar</button></div></section></div>`;
        document.body.appendChild(g);g.querySelector("#fecharM").onclick=()=>{g.remove();render();};
        if(window.QR){const q1=g.querySelector("#qrTela").getContext("2d");window.QR.desenhar(q1,tela,0,0,220,"#1C1635","#fff");const q2=g.querySelector("#qrProg").getContext("2d");window.QR.desenhar(q2,prog,0,0,220,"#1C1635","#fff");}
        g.querySelectorAll("[data-copia]").forEach(b=>b.onclick=async()=>{const u=b.dataset.copia;if(navigator.share){try{await navigator.share({title:"Mostraí · "+nome,url:u});return;}catch(e){}}try{await navigator.clipboard.writeText(u);b.textContent="Copiado ✓";}catch(e){prompt("Copie o link:",u);}});
      }catch(e){alert("Não consegui acionar o Mostraí: "+e.message);am.disabled=false;am.textContent="📺 Acionar Mostraí";}};
    const porPlano=(id,sid="mostraai")=>{const p=PLANOS.find(x=>x.id===id)||PLANOS[0];S[sid]={q:1,servico:true,plano:p.id,entrada:p.entrada,mensal:p.mensal,nome:`Mostraí · ${p.rot.toLowerCase()} · ${p.txt}`};};
    // + e − na figura do serviço: duplica (ex.: duas TVs do Mostraí, dois registros no INPI) ou tira a cópia (no card original, "não quero")
    $$("[data-sdup]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const k=b.closest(".serv").dataset.s,kb=App.baseId(k);let n=2;while(S[kb+"~"+n])n++;const nk=kb+"~"+n;const sv=SERV.find(x=>x.id===kb);
      if(kb==="mostraai")porPlano((S[k]&&S[k].plano)||"comodato",nk);else S[nk]={q:1,servico:true,nome:`${sv.nome} · ${n}`};salvar(e);render();});
    $$("[data-stira]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();const k=b.closest(".serv").dataset.s;if(k.includes("~")){delete S[k];const P=(e.pedidos||{})[slug];if(P&&P.desc)delete P.desc[k];}else if(S[k])S[k].q=0;salvar(e);render();});
    $$(".plano").forEach(b=>b.onclick=()=>{porPlano(b.dataset.plano,b.closest(".serv").dataset.s);salvar(e);render();});
    $$(".tog").forEach(b=>b.onclick=()=>{const id=b.dataset.t,ib=App.baseId(id);if(ib==="mostraai"){if(S[id]&&S[id].q>0)S[id].q=0;else porPlano((S[id]&&S[id].plano)||"comodato",id);salvar(e);render();return;}const sv=SERV.find(x=>x.id===ib);const s=S[id]=S[id]||{q:0,nome:sv.nome+(id.includes("~")?" · "+id.split("~")[1]:""),servico:true};s.q=s.q>0?0:1;salvar(e);render();});
    // item do kit com arte: tocar volta para a edição daquela arte
    $$(".cena[data-ctx]").forEach(el=>{let t0=0,mv=false;el.addEventListener("pointerdown",()=>{t0=Date.now();mv=false;});el.addEventListener("pointermove",()=>{mv=true;});el.addEventListener("pointerup",()=>{if(mv||Date.now()-t0>450)return;if(UNI_CORES.has(App.baseId(el.dataset.ctx))){location.href=`provar.html?l=${encodeURIComponent(slug)}&p=${encodeURIComponent(el.dataset.ctx)}`;return;}const A=artes[el.dataset.ctx];if(A&&A.contexto){const g=document.createElement("div");g.className="galeria-ctx";g.innerHTML=`<div class="top"><b>${esc(catDe(el.dataset.ctx).nome)}</b><span><a class="btn sec sm" style="width:auto;display:inline-grid;min-height:40px;padding:0 12px;text-decoration:none;margin-right:6px" href="editor.html?l=${encodeURIComponent(slug)}&p=${el.dataset.ctx}">${A.verso?"Editar frente":"Editar"}</a>${A.verso?`<a class="btn sec sm" style="width:auto;display:inline-grid;min-height:40px;padding:0 12px;text-decoration:none;margin-right:6px" href="editor.html?l=${encodeURIComponent(slug)}&p=${el.dataset.ctx}&face=verso">Editar verso</a>`:""}<button class="btn sec sm" id="fechar" style="width:auto;min-height:40px;padding:0 12px">Fechar</button></span></div><div class="rolo"><img src="${A.contexto}" alt="">${A.verso?`<div class="faces2"><figure><img src="${A.png}" alt=""><figcaption>Frente</figcaption></figure><figure><img src="${A.verso.png}" alt=""><figcaption>Verso</figcaption></figure></div>`:""}</div>`;document.body.appendChild(g);g.querySelector("#fechar").onclick=()=>g.remove();}else location.href=el.dataset.ctx==="capacho"?`capacho.html?l=${encodeURIComponent(slug)}&n=${encodeURIComponent(nomeLoja(l.nome))}`:`editor.html?l=${encodeURIComponent(slug)}&p=${el.dataset.ctx}`;});});
    $("#todos").onclick=async()=>{const b=$("#todos");b.disabled=true;const r=await App.gerarProdutos(l,pid=>{b.textContent=`Gerando ${catDe(pid).nome}…`;});c=await cliente(l);render();if(r.falhas.length)alert("Não consegui em: "+r.falhas.join(" · "));};
    const cb=$("#ctx");if(cb)cb.onclick=async()=>{cb.disabled=true;const ids=Object.keys(artes);let k=0,falhas=[];
      for(const id of ids){const A=artes[id];cb.textContent=`Aplicando ${catDe(id).nome}… (${++k}/${ids.length})`;
        if(id==="carimbo"){A.contexto=App.cenaCarimbo((A.doc&&A.doc.campos)||{});A.kit="carimbo-folha";continue;}
        try{const r=await App.contextualizar(l,id,A);const d=await r.json();if(r.ok&&d.jpg){A.contexto=d.jpg;A.kit=d.kit;}else falhas.push(catDe(id).nome+": "+(d.mensagem||d.erro||r.status));}catch(err){falhas.push(id+": "+err.message);}}
      c.artes=artes;await gravarCliente(c);render();if(falhas.length)alert("Não consegui em: "+falhas.join(" · "));};}
  render();
  // volta da ferramenta: abre no mesmo produto
  if(/^#p-/.test(location.hash)){const el=document.getElementById(location.hash.slice(1));if(el)setTimeout(()=>el.scrollIntoView({block:"center"}),60);}
})();
</script>
