<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Logotipo</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=4808e50d9e">
<style>
body.com-acoes{padding-bottom:calc(150px + env(safe-area-inset-bottom,0))}
.palco{position:relative;height:min(50vh,480px);background:repeating-conic-gradient(#e9e5f3 0 25%,#fff 0 50%) 0 0/18px 18px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.palco canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.palco #sel{pointer-events:none}
.caixa{position:absolute;border:2px solid var(--teal);box-shadow:0 0 0 9999px rgba(20,28,58,.45);pointer-events:none;display:none}
.alca{position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;border:3px solid var(--teal);transform:translate(-50%,-50%);display:none}
.modos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.modos button{border:0;background:#fff;border-radius:12px;min-height:50px;font:inherit;font-size:14px;font-weight:600;color:var(--texto)}
.modos button.on{background:var(--navy);color:#fff}
.ferr{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 8px}
.ferr button{border:0;background:#fff;border-radius:12px;min-height:56px;font:inherit;font-size:12px;color:var(--texto);display:grid;place-items:center;gap:2px;padding:4px 2px}
.ferr button .ic{font-size:20px}.ferr button.on{background:var(--marca);color:#fff}
.painel{background:#fff;border-radius:16px;padding:10px 14px;margin:0 0 10px}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.linha input[type=range]{flex:1;min-width:100px}
.dica{font-size:13px;color:var(--texto2);margin:6px 0 0}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=4808e50d9e"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,nav,topo,voltar,nomeLoja,cliente,gravarCliente,definirCliente}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  let u=qs.get("u")||"";const fonte=qs.get("fonte")||"";const de=qs.get("de")||"visita";const thumb=qs.get("thumb")||"";
  if(u.startsWith("sess:")){u=sessionStorage.getItem(u)||"";}
  if(!l||!u){$("#app").innerHTML=`${topo()}<p>Faltou a imagem.</p>${nav("rota")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);
  const voltaHref=de==="fontes"?`fontes.html?l=${encodeURIComponent(slug)}&tipo=${esc(qs.get("tipo")||"busca")}`:`visita.html?l=${encodeURIComponent(slug)}`;
  $("#app").innerHTML=`${topo()}${voltar(voltaHref,de==="fontes"?"Pesquisa":"Visita")}
  <h1 style="font-size:24px;margin-bottom:2px">Logotipo</h1><p class="sub">${esc(nome)}${fonte?` · ${esc(fonte)}`:""}</p>
  <div class="palco" id="palco"><canvas id="cv"></canvas><canvas id="sel"></canvas><div class="caixa" id="caixa"></div><button type="button" class="trava-giro" id="travaGiro">🔒 Giro travado</button>${[0,1,2,3].map(i=>`<div class="alca" data-i="${i}"></div>`).join("")}</div>
  <div class="dica" id="st">Carregando a imagem…</div>
  <div class="modos"><button type="button" data-m="ver" class="on">👆 Ver · pinça</button><button type="button" data-m="area">▭ Marcar área</button><button type="button" data-m="fundo">✂ Tirar fundo</button></div>
  <div id="opc"></div>
  <div class="acoes"><div class="w"><button class="btn sec" id="desfazer" type="button" style="flex:0 0 auto;width:auto;padding:0 14px">↶</button><button class="btn" id="salvar" type="button" disabled>Salvar logotipo →</button></div></div>
  ${nav("rota")}`;document.body.classList.add("com-acoes");
  const palco=$("#palco"),cv=$("#cv"),cx=cv.getContext("2d",{willReadFrequently:true}),sel=$("#sel"),sx=sel.getContext("2d"),caixa=$("#caixa"),alcas=$$(".alca");
  let W,H,base=null,hist=[],modo="ver",ferr="varinha",tol=28,pincel=18,contiguo=true,selMask=null,nSel=0,R=null;
  let z=1,px=0,py=0,rotV=0,giroLivre=false;  // zoom, deslocamento e giro em visualização
  const encaixe=()=>{const pw=palco.clientWidth,ph=palco.clientHeight;const s=Math.min(pw/W,ph/H)*z;[cv,sel].forEach(c=>{c.style.width=W+"px";c.style.height=H+"px";c.style.transform=`translate(${px+(pw-W*s)/2}px,${py+(ph-H*s)/2}px) scale(${s}) translate(${W/2}px,${H/2}px) rotate(${rotV}deg) translate(${-W/2}px,${-H/2}px)`;});desenharCaixa();};
  function carregar(src){return new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{const s=Math.min(1,1400/Math.max(im.width,im.height));W=Math.round(im.width*s);H=Math.round(im.height*s);cv.width=sel.width=W;cv.height=sel.height=H;cx.drawImage(im,0,0,W,H);
      try{base=cx.getImageData(0,0,W,H);}catch(e){return res("bloqueada");}encaixe();res("ok");};im.onerror=()=>res("erro");im.src=src;});}
  // imagem do próprio servidor (/api/arq/…, logotipos automáticos e salvos) abre direto; só imagem de fora passa pelo proxy
  const prox=/^(data:|blob:|\/(?!\/))/.test(u)||u.startsWith(location.origin)?u:`/api/img?u=${encodeURIComponent(u)}`;
  let r=await carregar(prox);
  if(r!=="ok"&&thumb){r=await carregar(`/api/img?u=${encodeURIComponent(thumb)}`);if(r==="ok")$("#st").textContent="Imagem grande não abriu; usando a miniatura.";}
  if(r!=="ok"){$("#st").textContent="Não consegui abrir esta imagem. Tente outra.";return;}
  // cor do fundo da arte antes de qualquer recorte: vira a cor base dos produtos (capacho, impressos, uniformes…)
  let FUNDO=null;try{await App.carregarScript("kits14.js?v=4808e50d9e");FUNDO=window.Kits14.fundoDaImagem(cv);}catch(e){}
  $("#st").textContent=`${W}×${H} px · pinça para ampliar · salve inteiro ou marque a área`;$("#salvar").disabled=false;
  const pos=ev=>{const b=cv.getBoundingClientRect();return {x:Math.floor((ev.clientX-b.left)/b.width*W),y:Math.floor((ev.clientY-b.top)/b.height*H)};};
  const posPalco=ev=>{const b=palco.getBoundingClientRect();return {x:ev.clientX-b.left,y:ev.clientY-b.top};};
  const guardar=()=>{hist.push(new ImageData(new Uint8ClampedArray(base.data),W,H));if(hist.length>12)hist.shift();};
  const aplicar=()=>cx.putImageData(base,0,0);
  // ---- gestos: 1 dedo (ver: arrasta · área: marca · fundo: ferramenta) · 2 dedos: pinça sempre
  const ptrs=new Map();let pinch=null,drag=null,press=null,timer=null,alca=null,pint=false;
  {const tg=$("#travaGiro");tg.onclick=()=>{giroLivre=!giroLivre;tg.classList.toggle("livre",giroLivre);tg.textContent=giroLivre?"⟳ Giro livre":"🔒 Giro travado";};}
  palco.addEventListener("pointerdown",ev=>{if(ev.target.id==="travaGiro")return;try{palco.setPointerCapture(ev.pointerId);}catch(e){}ptrs.set(ev.pointerId,ev);
    if(ptrs.size===2){clearTimeout(timer);press=null;pint=false;const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),ang:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),rot:0,z,px,py,cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2};return;}
    const a=ev.target.closest(".alca");if(a&&modo==="area"){alca=+a.dataset.i;return;}
    if(modo==="ver"){drag={x:ev.clientX,y:ev.clientY,px,py};return;}
    if(modo==="area"){press=posPalco(ev);timer=setTimeout(()=>{const p=pos(ev);R={x0:p.x,y0:p.y,x1:p.x,y1:p.y};caixa.style.display="block";alcas.forEach(x=>x.style.display="none");desenharCaixa();if(navigator.vibrate)navigator.vibrate(15);},300);return;}
    if(modo==="fundo"){const p=pos(ev);if(p.x<0||p.y<0||p.x>=W||p.y>=H)return;
      if(ferr==="varinha"){const m=similares(p.x,p.y,contiguo);const ja=selMask&&selMask[p.y*W+p.x];if(ja){for(let i=0;i<W*H;i++)if(m[i])selMask[i]=0;nSel=Math.max(0,nSel-1);if(!selMask.some(v=>v)){selMask=null;nSel=0;}}else{if(!selMask)selMask=m;else for(let i=0;i<W*H;i++)if(m[i])selMask[i]=1;nSel++;}mostrarSel(selMask);renderOpc();$("#st").textContent=ja?`Área desmarcada · ${nSel} marcada(s)`:`${nSel} área(s) marcada(s) · toque de novo para desmarcar`;}
      if(ferr==="borracha"||ferr==="recuperar"){guardar();pint=true;pincelar(p);}
      if(ferr==="gotas"){const i=(p.y*W+p.x)*4;$("#st").textContent=`Cor tocada: #${[base.data[i],base.data[i+1],base.data[i+2]].map(v=>v.toString(16).padStart(2,"0")).join("")}`;}}});
  palco.addEventListener("pointermove",ev=>{if(!ptrs.has(ev.pointerId))return;ptrs.set(ev.pointerId,ev);
    if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(!giroLivre){z=Math.min(8,Math.max(1,pinch.z*d/pinch.d));const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;px=pinch.px+(mx-pinch.cx);py=pinch.py+(my-pinch.cy);encaixe();return;}
      // giro com a pinça (endireitar): mostra ao vivo; aplica na imagem ao soltar; encaixa em 0/90/180/270
      let dr=(Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)-pinch.ang)*180/Math.PI;if(Math.abs(dr)<2)dr=0;const n=Math.round(dr/90)*90;if(Math.abs(dr-n)<3)dr=n;pinch.rot=dr;rotV=dr;encaixe();$("#st").textContent=dr?`Girando ${dr>0?"+":""}${Math.round(dr)}° · solte para aplicar`:`${W}×${H} px`;return;}
    if(drag){px=drag.px+(ev.clientX-drag.x);py=drag.py+(ev.clientY-drag.y);encaixe();return;}
    if(alca!==null&&R){const p=pos(ev);const x=Math.min(R.x0,R.x1),y=Math.min(R.y0,R.y1),X=Math.max(R.x0,R.x1),Y=Math.max(R.y0,R.y1);if(alca===0)R={x0:p.x,y0:p.y,x1:X,y1:Y};if(alca===1)R={x0:x,y0:p.y,x1:p.x,y1:Y};if(alca===2)R={x0:x,y0:y,x1:p.x,y1:p.y};if(alca===3)R={x0:p.x,y0:y,x1:X,y1:p.y};desenharCaixa();return;}
    if(modo==="area"){if(press&&!R){const q=posPalco(ev);if(Math.hypot(q.x-press.x,q.y-press.y)>10){clearTimeout(timer);press=null;}return;}if(R&&press){const p=pos(ev);R.x1=Math.max(0,Math.min(W,p.x));R.y1=Math.max(0,Math.min(H,p.y));desenharCaixa();}return;}
    if(pint)pincelar(pos(ev));});
  function girarBase(graus){if(!graus)return;guardar();const a=graus*Math.PI/180;const nw=Math.round(Math.abs(W*Math.cos(a))+Math.abs(H*Math.sin(a))),nh=Math.round(Math.abs(W*Math.sin(a))+Math.abs(H*Math.cos(a)));
    const src=document.createElement("canvas");src.width=W;src.height=H;src.getContext("2d").putImageData(base,0,0);const o=document.createElement("canvas");o.width=nw;o.height=nh;const g=o.getContext("2d");g.translate(nw/2,nh/2);g.rotate(a);g.drawImage(src,-W/2,-H/2);
    W=nw;H=nh;cv.width=sel.width=W;cv.height=sel.height=H;base=g.getImageData(0,0,W,H);aplicar();selMask=null;nSel=0;mostrarSel(null);R=null;caixa.style.display="none";}
  const fim=ev=>{ptrs.delete(ev.pointerId);clearTimeout(timer);if(pinch&&ptrs.size<2){const r=pinch.rot||0;rotV=0;pinch=null;if(r){girarBase(r);$("#st").textContent=`Girado ${r>0?"+":""}${Math.round(r)}° · ↶ desfaz`;}encaixe();}if(ptrs.size<2)pinch=null;drag=null;pint=false;if(alca!==null){alca=null;}if(modo==="area"&&R&&press){press=null;alcas.forEach(x=>x.style.display="block");desenharCaixa();renderOpc();}press=null;};
  palco.addEventListener("pointerup",fim);palco.addEventListener("pointercancel",fim);
  function desenharCaixa(){if(!R)return;const b=cv.getBoundingClientRect(),pb=palco.getBoundingClientRect();const k=b.width/W;const x=Math.min(R.x0,R.x1)*k+(b.left-pb.left),y=Math.min(R.y0,R.y1)*k+(b.top-pb.top),w=Math.abs(R.x1-R.x0)*k,h=Math.abs(R.y1-R.y0)*k;caixa.style.left=x+"px";caixa.style.top=y+"px";caixa.style.width=w+"px";caixa.style.height=h+"px";[[x,y],[x+w,y],[x+w,y+h],[x,y+h]].forEach(([ax,ay],i)=>{alcas[i].style.left=ax+"px";alcas[i].style.top=ay+"px";});}
  // ---- ferramentas de fundo (da versão anterior)
  function similares(x0,y0,contig){const d=base.data;const i0=(y0*W+x0)*4;const Rr=d[i0],G=d[i0+1],B=d[i0+2];const out=new Uint8Array(W*H);const t2=tol*tol*3;const perto=i=>{const dr=d[i*4]-Rr,dg=d[i*4+1]-G,db=d[i*4+2]-B;return d[i*4+3]>0&&dr*dr+dg*dg+db*db<=t2;};
    if(!contig){for(let i=0;i<W*H;i++)if(perto(i))out[i]=1;return out;}
    const fila=[y0*W+x0];out[fila[0]]=1;while(fila.length){const i=fila.pop();const x=i%W,y=(i-x)/W;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(!out[j]&&perto(j)){out[j]=1;fila.push(j);}}}return out;}
  function mostrarSel(m){sx.clearRect(0,0,W,H);if(!m)return;const id=sx.createImageData(W,H);for(let i=0;i<W*H;i++)if(m[i]){id.data[i*4]=20;id.data[i*4+1]=184;id.data[i*4+2]=176;id.data[i*4+3]=150;}sx.putImageData(id,0,0);}
  function pincelar(p){const r=pincel,orig=hist[0];for(let y=Math.max(0,p.y-r);y<=Math.min(H-1,p.y+r);y++)for(let x=Math.max(0,p.x-r);x<=Math.min(W-1,p.x+r);x++){if((x-p.x)**2+(y-p.y)**2>r*r)continue;const i=(y*W+x)*4;if(ferr==="borracha")base.data[i+3]=0;else if(orig&&orig.width===W)base.data[i+3]=orig.data[i+3];}aplicar();}
  function enquadrar(){let x0=W,y0=H,x1=0,y1=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(base.data[(y*W+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}if(x1<=x0)return;const m=Math.round(Math.max(W,H)*0.03);recortar(Math.max(0,x0-m),Math.max(0,y0-m),Math.min(W-1,x1+m),Math.min(H-1,y1+m));}
  function recortar(x0,y0,x1,y1){guardar();const nw=x1-x0+1,nh=y1-y0+1;if(nw<4||nh<4)return;const nd=new ImageData(nw,nh);for(let y=0;y<nh;y++)nd.data.set(base.data.subarray(((y+y0)*W+x0)*4,((y+y0)*W+x0+nw)*4),y*nw*4);W=nw;H=nh;cv.width=sel.width=W;cv.height=sel.height=H;base=nd;aplicar();z=1;px=py=0;encaixe();}
  function renderOpc(){const o=$("#opc");
    if(modo==="ver"){o.innerHTML=`<div class="painel"><small class="muted">Arraste com um dedo; pinça com dois. Se o logotipo já está bom, é só salvar.</small></div>`;return;}
    if(modo==="area"){o.innerHTML=`<div class="painel"><div class="linha"><button type="button" class="btn sm" id="aplicarArea" ${R?"":"disabled"} style="min-height:42px;width:auto;padding:0 14px">Recortar para a área</button><button type="button" class="btn sec sm" id="limparArea" style="min-height:42px;width:auto;padding:0 14px">Limpar</button></div><small class="muted">Segure e arraste sobre o logotipo; ajuste pelas bolinhas.</small></div>`;
      $("#aplicarArea").onclick=()=>{if(!R)return;recortar(Math.min(R.x0,R.x1),Math.min(R.y0,R.y1),Math.max(R.x0,R.x1),Math.max(R.y0,R.y1));R=null;caixa.style.display="none";alcas.forEach(x=>x.style.display="none");renderOpc();};$("#limparArea").onclick=()=>{R=null;caixa.style.display="none";alcas.forEach(x=>x.style.display="none");renderOpc();};return;}
    o.innerHTML=`<div class="ferr">${[["varinha","✨","Por cor"],["borracha","🧽","Borracha"],["recuperar","↩","Recuperar"],["enquadrar","⌗","Enquadrar"],["gotas","💧","Ver cor"]].map(([id,ic,n])=>`<button type="button" data-f="${id}" class="${ferr===id?"on":""}"><span class="ic">${ic}</span>${n}</button>`).join("")}</div>
      <div class="painel">${ferr==="varinha"?`<div class="linha"><small class="muted">Tolerância</small><input type="range" id="tol" min="4" max="90" value="${tol}"><button type="button" class="btn sec sm" id="contig" style="min-height:36px;width:auto;padding:0 10px;font-size:13px">${contiguo?"Só a área tocada":"Na imagem toda"}</button></div><div class="linha" style="margin-top:8px"><button type="button" class="btn sm" id="apagarSel" ${selMask?"":"disabled"} style="min-height:40px;width:auto;padding:0 14px">Apagar ${nSel?nSel+" área(s)":"seleção"}</button><button type="button" class="btn sec sm" id="limparSel" style="min-height:40px;width:auto;padding:0 14px">Limpar</button></div><small class="muted">Cada toque soma uma área à seleção; depois apague tudo de uma vez.</small>`:ferr==="enquadrar"?`<button type="button" class="btn sm" id="autoCorte" style="min-height:40px;width:auto;padding:0 14px">Cortar margens transparentes</button>`:ferr==="gotas"?`<small class="muted">Toque na imagem para ver o código da cor.</small>`:`<div class="linha"><small class="muted">Tamanho</small><input type="range" id="pincel" min="4" max="80" value="${pincel}"></div>`}</div>`;
    $$(".ferr button").forEach(b=>b.onclick=()=>{ferr=b.dataset.f;selMask=null;nSel=0;mostrarSel(null);renderOpc();});
    const t=$("#tol");if(t)t.oninput=()=>tol=+t.value;const pz=$("#pincel");if(pz)pz.oninput=()=>pincel=+pz.value;const cg=$("#contig");if(cg)cg.onclick=()=>{contiguo=!contiguo;renderOpc();};
    const ap=$("#apagarSel");if(ap)ap.onclick=()=>{if(!selMask)return;guardar();for(let i=0;i<W*H;i++)if(selMask[i])base.data[i*4+3]=0;aplicar();selMask=null;nSel=0;mostrarSel(null);renderOpc();$("#st").textContent="Apagado · ↶ desfaz";};
    const ls=$("#limparSel");if(ls)ls.onclick=()=>{selMask=null;nSel=0;mostrarSel(null);renderOpc();};const ac=$("#autoCorte");if(ac)ac.onclick=enquadrar;}
  $$(".modos button").forEach(b=>b.onclick=()=>{modo=b.dataset.m;$$(".modos button").forEach(x=>x.classList.toggle("on",x===b));selMask=null;mostrarSel(null);if(modo!=="area"){R=null;caixa.style.display="none";alcas.forEach(x=>x.style.display="none");}renderOpc();});
  renderOpc();
  $("#desfazer").onclick=()=>{const h=hist.pop();if(!h)return;base=h;if(base.width!==W){W=base.width;H=base.height;cv.width=sel.width=W;cv.height=sel.height=H;z=1;px=py=0;encaixe();}aplicar();};
  $("#salvar").onclick=async()=>{$("#salvar").disabled=true;$("#salvar").textContent="Salvando…";
    if(R&&modo==="area")recortar(Math.min(R.x0,R.x1),Math.min(R.y0,R.y1),Math.max(R.x0,R.x1),Math.max(R.y0,R.y1));
    const png=cv.toDataURL("image/png");const c=await cliente(l);
    // salvo sem fundo (transparente na borda) = tratado, mesmo sem mexer aqui
    const dd=cv.getContext("2d").getImageData(0,0,W,H).data;let tb=0,nb=0;const vb=(x,y)=>{nb++;if(dd[(y*W+x)*4+3]<16)tb++;};
    for(let x=0;x<W;x+=Math.max(1,W>>8)){vb(x,0);vb(x,H-1);}for(let y=0;y<H;y+=Math.max(1,H>>8)){vb(0,y);vb(W-1,y);}
    const tratado=hist.length>0||tb/nb>0.6;
