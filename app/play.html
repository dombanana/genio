<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Play</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=017d8aa9a1">
<style>
/* Play (14/11): só a empresa da vez na fila da rota */
.fila{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.fila .barra{flex:1;height:8px;border-radius:99px;background:#fff;overflow:hidden}.fila .barra i{display:block;height:100%;background:var(--marca);border-radius:99px}
.fila small{color:var(--texto2);font-size:13px;white-space:nowrap}
.pl-mapa{height:190px;border-radius:16px;overflow:hidden;margin:0 0 12px;background:#E9E6F2}
.pl-mapa .leaflet-div-icon{background:transparent;border:0}
.mk{width:34px;height:34px;border-radius:50%;background:var(--marca);color:#fff;font-weight:700;display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}.mk.eu{width:18px;height:18px;background:#14B8B0}
.fato{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--linha);font-size:15px}.fato:first-of-type{border-top:0}
.fato span{color:var(--texto2);font-size:13.5px}.fato small{display:block;color:var(--texto2);font-size:12.5px;font-weight:400}
.fonte{font-size:12px;color:var(--texto2);margin:8px 0 0}
.melhora{border-top:1px solid var(--linha);padding:10px 0}.melhora:first-of-type{border-top:0}
.melhora b{font-size:15px}.melhora blockquote{margin:4px 0;font-size:14px;color:var(--texto2);font-style:italic}.melhora .prod{font-size:13.5px;color:var(--marca);font-weight:600}
.prods{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prods figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--linha)}.prods img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;background:#fff}
.prods figcaption{font-size:12.5px;font-weight:600;padding:6px 8px}
.bts{display:grid;gap:8px;margin:0 0 14px}.bts .dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bts .btn.nao{background:#FBEBEB;color:#B42318}
.chegou{background:var(--teal2);color:#0E6E6A;border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin:0 0 10px}
.res-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.res-g span{background:var(--lav);border-radius:12px;padding:10px;font-size:13px;color:var(--texto2)}.res-g b{display:block;font-size:22px;color:var(--texto)}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=017d8aa9a1"></script>
<script>
(async()=>{
  const {$,$$,esc,sessao,eu,dados,estado,salvar,nav,topo,nomeLoja,setorNome,cliente}=App;
  if(!await sessao())return;
  let D;try{D=await dados();}catch(e){$("#app").innerHTML=`${topo()}<section class="card"><h2>Sem captação</h2><p>Nenhuma zona tem lojas captadas.</p></section>${nav("play")}`;return;}
  const hoje=App.hojeISO();const fmt=iso=>{const x=App.dataCurta(iso);return `${x.sem} ${x.dia}/${x.mes}`;};
  const L$=s=>D.lojas.find(l=>l.slug===s);
  const NOME={capacho:"Capacho",placas:"Placa",adesivos:"Adesivo de vitrine",uniformes:"Camisa polo",impressos:"Cartão de visita",panfleto:"Flyer",banners:"Banner retrátil",parede:"Adesivo de parede",brindes:"Ecobag",carimbo:"Carimbo",windbanner:"Wind banner",faixa:"Faixa",folheto:"Folheto",camiseta:"Camiseta",bone:"Boné",avental:"Avental"};
  const rp=App.rotaDoPlay();
  if(!rp){$("#app").innerHTML=`${topo()}<h1>Play</h1><section class="card"><h2>Nenhuma rota pronta</h2><p>Monte a rota na tela Rota (lojas, logotipos, recorte e ordem) e marque "Rota pronta". Ela aparece aqui.</p><a class="btn" href="index.html">Montar a rota →</a></section>${nav("play")}`;return;}
  const dia=rp[0];
  const R=()=>{const e=estado();const X=e.rotas[dia];X.res=X.res||{};X.chegou=X.chegou||{};X.orc=X.orc||{};return X;};
  const gravar=async(fn)=>{const e=estado();const X=e.rotas[dia];X.res=X.res||{};X.chegou=X.chegou||{};X.orc=X.orc||{};fn(e,X);await salvar(e);};
  const fila=()=>{const e=estado();const arq=new Set(e.arquivadas||[]);return R().slugs.filter(s=>L$(s)&&!arq.has(s));};

  // ---- fim da fila: resumo e encerrar
  function resumo(){const X=R();const f=fila();const c=k=>f.filter(s=>X.res[s]===k).length;const j=(estado().jornadas||{})["d"+dia];
    $("#app").innerHTML=`${topo()}<h1>Play</h1><p class="sub">Rota de ${dia===hoje?"hoje":fmt(dia)} · ${f.length} lojas</p>
    <section class="card"><h2>${X.encerrada?"Rota encerrada":"Fila concluída"}</h2><div class="res-g"><span>Visitadas<b>${c("visitada")+c("orcamento")}</b></span><span>Com orçamento<b>${c("orcamento")}</b></span><span>Não estavam<b>${c("nao_estava")}</b></span><span>Lojas na rota<b>${f.length}</b></span></div>
      <p class="muted" style="margin:0 0 12px;font-size:14px">As que não estavam entram sozinhas no tipo de rota "Retornos".</p>
      ${X.encerrada?`<a class="btn" href="index.html">Montar a próxima rota →</a>`:`<button class="btn" type="button" id="encerrar">■ Encerrar a rota</button>`}</section>${nav("play")}`;
    const b=$("#encerrar");if(b)b.onclick=async()=>{await gravar((e,X)=>{X.encerrada=true;X.encerradaEm=new Date().toISOString();const jj=(e.jornadas||{})["d"+dia];if(jj&&jj.status!=="encerrada"){const t=new Date().toISOString();const p=(jj.pausas||[]).slice(-1)[0];if(p&&!p.fim)p.fim=t;jj.fim=t;jj.status="encerrada";}});resumo();};}

  // a loja da vez abre na tela da visita (modo Play): produtos com o logotipo, seleção, orçamento, não estava, próxima (14/11)
  function tela(){const f=fila();const X=R();const s0=f.find(s=>!X.res[s]);if(!s0)return resumo();location.replace(`visita.html?l=${encodeURIComponent(s0)}&de=play`);}

  tela();
})();
</script>
</body>
</html>
