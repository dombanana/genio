<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Representante</title>
<meta name="theme-color" content="#6933C5">
<link rel="icon" href="../genio-favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css?v=a2271a6f70">
<style>html,body{height:100%;overflow:hidden;padding:0}</style>
</head>
<body>
<div class="casca">
  <iframe id="tela" allow="camera; microphone; geolocation; display-capture; screen-wake-lock" title="GênIO"></iframe>
  <nav class="nav" id="barra"></nav>
</div>
<script src="app.js?v=a2271a6f70"></script>
<script>
(()=>{
  const {$,esc,ICONES,gravarNota}=App;
  const fr=$("#tela");const alvo=()=>decodeURIComponent((location.hash||"#index.html").slice(1))||"index.html";
  let atual=alvo();fr.src=atual;
  let CONT={entrada:{n:0,u:0},processamento:{n:0,u:0},saida:{n:0,u:0}};
  let MSG=0,SOLTAS=0;
  const marca=(el,n,classe)=>{if(!el)return;el.classList.remove("alerta","urgente");if(n&&classe)el.classList.add(classe);const b=el.querySelector(".badge");if(b){b.textContent=n;b.hidden=!n;}};
  const pintarMonitor=()=>{for(const k of Object.keys(CONT)){const c=CONT[k];marca(document.querySelector(`.grupo [data-k="${k}"]`),c.n,c.u?"urgente":"alerta");}
    marca(document.querySelector('.grupo [data-k="clientes"]'),MSG,"urgente");marca(document.querySelector('.grupo [data-k="notasLista"]'),SOLTAS,"alerta");};
  // mensagens de clientes e notas soltas: conferidas no servidor a cada minuto
  async function conferirAvisos(){try{const [m,n]=await Promise.all([fetch("/api/mensagens",{credentials:"same-origin",cache:"no-store"}).then(r=>r.ok?r.json():null),fetch("/api/notas",{credentials:"same-origin",cache:"no-store"}).then(r=>r.ok?r.json():null)]);
    if(m)MSG=Object.values(m.conversas||{}).reduce((a,c)=>a+(c.nao_lidas||0),0);if(n)SOLTAS=(n.notas||[]).filter(x=>!x.loja&&!x.pedido).length;pintarMonitor();}catch(e){}}
  setTimeout(conferirAvisos,1500);setInterval(conferirAvisos,60*1000);window.addEventListener("message",ev=>{if(ev.origin===location.origin&&ev.data&&ev.data.genio==="avisos")conferirAvisos();});
  window.addEventListener("message",ev=>{if(ev.origin!==location.origin||!ev.data)return;if(ev.data.genio==="ocorrencias"){CONT=ev.data.cont||CONT;pintarMonitor();return;}if(ev.data.genio!=="tela")return;atual=ev.data.href;history.replaceState(null,"","#"+atual);marcar();});
  window.addEventListener("storage",marcar);
  window.addEventListener("hashchange",()=>{const a=alvo();if(a!==atual){atual=a;fr.src=a;}});
  const on=p=>atual.startsWith(p)?"on":"";
  const ir=h=>{atual=h;fr.src=h;history.replaceState(null,"","#"+h);marcar();};
  const dur=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
  function marcar(){const rotOn=on("index")||on("visita")||on("fontes")||on("logotipo")||on("manual")||on("produtos")||on("editor")||on("capacho");
    const grupo=(nome,itens,seta)=>`<div class="grupo" role="group" aria-label="${nome}"><div class="trio n${itens.length}${seta?" seta":""}">${itens.join("")}</div><small>${nome}</small></div>`;
    const item=(k,t,href,ativo)=>`<a href="#${href}" data-k="${k}" class="${ativo?"on":""}" data-ir="${href}" aria-label="${t}" title="${t}"><span class="ic">${ICONES[k]}</span><span class="badge" hidden></span></a>`;
    const rec=`<button type="button" class="rec-b ${REC.ativo?(REC.pausado?"pausado":"on"):""}" id="rec" aria-label="Gravar" title="grava no modo escolhido em Notas"><span class="ic">${ICONES.recModo(REC.ativo?REC.tipo:(localStorage.getItem("rec-tipo")||"audio"))}</span>${REC.ativo?`<span class="tempo" id="recTempo">${dur(REC.segundos())}</span>`:""}<span class="badge" hidden></span></button>`;
    $("#barra").innerHTML=grupo("Atendimento",[item("rota","Rota","index.html",on("index")||on("visita")||on("fontes")||on("logotipo")||on("manual")||on("produtos")||on("editor")||on("capacho")||on("local")),item("clientes","Clientes","clientes.html",on("clientes"))])
      +`<span class="vao"></span>`+grupo("Produção",[["entrada","Entrada"],["processamento","Produção"],["saida","Saída"]].map(([k,t])=>item(k,t,"pedidos.html?etapa="+k,atual.includes("etapa="+k))),true)
      +`<span class="vao"></span>`+grupo("Gravação",[rec,item("notasLista","Notas","notas.html",on("notas"))]);
    // REC é um botão à parte: um toque grava no modo parametrizado em Notas; outro toque para
    $("#rec").onclick=async()=>{if(REC.ativo){await parar();return;}const tipo=localStorage.getItem("rec-tipo")||"audio",tela=localStorage.getItem("rec-tela")!=="0";
      // foto e vídeo usam a câmera do próprio celular (o navegador não grava vídeo direito); áudio e transcrição gravam aqui
      try{if(tipo==="foto"){await foto(false);if(atual.startsWith("notas"))fr.contentWindow.location.reload();return;}
        if(tipo==="video-tras"||tipo==="video-frente"){await video(false);if(atual.startsWith("notas"))fr.contentWindow.location.reload();return;}
        await iniciar(tipo==="transcrever"?"transcrever":"audio",{telaAcesa:tela});}catch(e){alert(e.message);}};
    $("#barra").querySelectorAll("[data-ir]").forEach(a=>a.onclick=ev=>{ev.preventDefault();ir(a.dataset.ir);});pintarMonitor();}
  // conferência das ocorrências em segundo plano: a própria tela de pedidos conta (mesma regra) e avisa a casca
  const conferir=()=>{const f=document.createElement("iframe");f.hidden=true;f.src="pedidos.html?contar=1&t="+Date.now();document.body.appendChild(f);setTimeout(()=>f.remove(),60000);};
  setTimeout(conferir,2500);setInterval(conferir,10*60*1000);
  // ---- motor de gravação (vive na casca: continua entre telas). A tela de Notas é o painel de controle.
  const lojaAtual=()=>{try{return JSON.parse(localStorage.getItem("app-ultima-loja")||"null");}catch(e){return null;}};
  const REC={ativo:false,pausado:false,tipo:null,rec:null,stream:null,chunks:[],t0:0,acum:0,timer:null,texto:"",reconhec:null,wake:null,loja:null,ouvintes:new Set(),
    segundos(){return (this.acum+(this.ativo&&!this.pausado?Date.now()-this.t0:0))/1000;}};
  const mime=c=>c.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||"";
  const avisar=()=>{marcar();const s=$("#recTempo");if(s)s.textContent=dur(REC.segundos());REC.ouvintes.forEach(f=>{try{f(estado());}catch(e){}});};
  const estado=()=>({ativo:REC.ativo,pausado:REC.pausado,tipo:REC.tipo,segundos:REC.segundos(),texto:REC.texto,loja:REC.loja,stream:REC.stream,telaAcesa:!!REC.wake,suporte:{tela:!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia),transcrever:!!(window.SpeechRecognition||window.webkitSpeechRecognition),wake:"wakeLock" in navigator}});
  async function telaAcesa(liga){try{if(liga&&!REC.wake&&"wakeLock" in navigator){REC.wake=await navigator.wakeLock.request("screen");REC.wake.addEventListener("release",()=>{REC.wake=null;avisar();});}else if(!liga&&REC.wake){await REC.wake.release();REC.wake=null;}}catch(e){}avisar();}
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&REC.ativo&&REC.quisWake&&!REC.wake)telaAcesa(true);});
  async function iniciar(tipo,opc){if(REC.ativo)return estado();opc=opc||{};REC.loja=lojaAtual();REC.texto="";REC.chunks=[];REC.acum=0;REC.pausado=false;
    if(tipo==="transcrever"){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)throw new Error("Este navegador não transcreve. Use a gravação de áudio.");
      const r=new SR();r.lang="pt-BR";r.continuous=true;r.interimResults=true;let fim="";r.onresult=ev=>{let parcial="";for(let i=ev.resultIndex;i<ev.results.length;i++){const t=ev.results[i][0].transcript;if(ev.results[i].isFinal)fim+=t.trim()+" ";else parcial+=t;}REC.texto=(fim+parcial).trim();REC.fimTexto=fim;avisar();};
      r.onend=()=>{if(REC.ativo&&REC.tipo==="transcrever"&&!REC.pausado){try{r.start();}catch(e){}}};r.onerror=ev=>{if(ev.error==="not-allowed"){parar();}};
      REC.reconhec=r;REC.fimTexto="";r.start();REC.ativo=true;REC.tipo=tipo;REC.t0=Date.now();}
    else{let stream;
      if(tipo==="audio")stream=await navigator.mediaDevices.getUserMedia({audio:true});
      else if(tipo==="video-tras"||tipo==="video-frente")stream=await navigator.mediaDevices.getUserMedia({audio:true,video:{facingMode:tipo==="video-frente"?"user":{ideal:"environment"},width:{ideal:1280}}});
      else if(tipo==="tela"){if(!navigator.mediaDevices.getDisplayMedia)throw new Error("Este navegador não grava a tela do celular (o Chrome no Android não oferece). Use o gravador de tela do aparelho.");
        stream=await navigator.mediaDevices.getDisplayMedia({video:true,audio:true});try{const mic=await navigator.mediaDevices.getUserMedia({audio:true});mic.getAudioTracks().forEach(t=>stream.addTrack(t));}catch(e){}}
      else throw new Error("tipo desconhecido");
      const tm=tipo==="audio"?mime(["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg"]):mime(["video/webm;codecs=vp9,opus","video/webm;codecs=vp8,opus","video/webm","video/mp4"]);
      const rec=new MediaRecorder(stream,tm?{mimeType:tm}:undefined);REC.rec=rec;REC.stream=stream;REC.mime=rec.mimeType||tm||(tipo==="audio"?"audio/webm":"video/webm");
      rec.ondataavailable=e=>{if(e.data.size)REC.chunks.push(e.data);};
      rec.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(REC.chunks,{type:REC.mime});const d=REC.segundos();
        if(d>0.7)await gravarNota({id:"n"+Date.now().toString(36),em:new Date().toISOString(),tipo,[tipo==="audio"?"audio":"video"]:blob,dur:d,loja:REC.loja});
        limpar();};
      stream.getVideoTracks().forEach(t=>t.onended=()=>{if(REC.ativo)parar();});
      rec.start(500);REC.ativo=true;REC.tipo=tipo;REC.t0=Date.now();}
    REC.quisWake=!!opc.telaAcesa;if(opc.telaAcesa)telaAcesa(true);
    REC.timer=setInterval(avisar,500);avisar();return estado();}
  function pausar(){if(!REC.ativo||REC.pausado)return;REC.acum+=Date.now()-REC.t0;REC.pausado=true;if(REC.rec&&REC.rec.state==="recording")REC.rec.pause();if(REC.reconhec){try{REC.reconhec.stop();}catch(e){}}avisar();}
  function retomar(){if(!REC.ativo||!REC.pausado)return;REC.pausado=false;REC.t0=Date.now();if(REC.rec&&REC.rec.state==="paused")REC.rec.resume();if(REC.reconhec){try{REC.reconhec.start();}catch(e){}}avisar();}
  async function parar(){if(!REC.ativo)return;if(REC.pausado){REC.pausado=false;}else{REC.acum+=Date.now()-REC.t0;}REC.t0=Date.now();
    if(REC.tipo==="transcrever"){const r=REC.reconhec;REC.reconhec=null;try{r.onend=null;r.stop();}catch(e){}const t=(REC.texto||"").trim();if(t)await gravarNota({id:"n"+Date.now().toString(36),em:new Date().toISOString(),tipo:"transcricao",texto:t,dur:REC.acum/1000,loja:REC.loja});limpar();}
    else if(REC.rec&&REC.rec.state!=="inactive")REC.rec.stop();else limpar();}
  function limpar(){clearInterval(REC.timer);REC.ativo=false;REC.pausado=false;REC.rec=null;REC.stream=null;REC.tipo=null;telaAcesa(false);avisar();REC.ouvintes.forEach(f=>{try{f({...estado(),terminou:true});}catch(e){}});}
  // foto: câmera do aparelho → nota com imagem
  function foto(frente){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.capture=frente?"user":"environment";i.style.display="none";document.body.appendChild(i);let ok=false;
    i.onchange=async()=>{const f=i.files&&i.files[0];i.remove();if(!f)return res(false);ok=true;await gravarNota({id:"n"+Date.now().toString(36),em:new Date().toISOString(),tipo:frente?"selfie":"foto",foto:f,loja:lojaAtual()});res(true);};
    i.addEventListener("cancel",()=>{i.remove();res(false);});i.click();});}
  // vídeo: câmera do aparelho (traseira ou frontal) → nota com vídeo, guardada no servidor
  function video(frente){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept="video/*";i.capture=frente?"user":"environment";i.style.display="none";document.body.appendChild(i);
    i.onchange=async()=>{const f=i.files&&i.files[0];i.remove();if(!f)return res(false);if(f.size>40*1024*1024){alert(`Este vídeo tem ${Math.round(f.size/1048576)} MB e passa do limite de 40 MB. Grave um trecho mais curto.`);return res(false);}
      const d=await new Promise(ok=>{const v=document.createElement("video");v.preload="metadata";v.onloadedmetadata=()=>{ok(v.duration||0);URL.revokeObjectURL(v.src);};v.onerror=()=>ok(0);v.src=URL.createObjectURL(f);});
      await gravarNota({id:"n"+Date.now().toString(36),em:new Date().toISOString(),tipo:frente?"video-frente":"video-tras",video:f,dur:d,loja:lojaAtual()});res(true);};
    i.addEventListener("cancel",()=>{i.remove();res(false);});i.click();});}
  // API para a tela de Notas (mesma origem)
  window.REC_API={estado,iniciar,pausar,retomar,parar,foto,video,telaAcesa,ouvir(f){REC.ouvintes.add(f);return()=>REC.ouvintes.delete(f);}};
  marcar();
})();
</script>
</body>
</html>
