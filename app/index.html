<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Rota</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="app.css?v=fcfda3f6c3">
<style>
/* montagem da rota pelo vendedor (14/11): 1 lojas · 2 logotipos · 3 recorte e ordem */
.dias-r{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 0 4px;scrollbar-width:none}.dias-r::-webkit-scrollbar{display:none}
.dias-r a,.dias-r label{flex:0 0 auto;text-decoration:none;color:var(--texto);background:#fff;border:1.5px solid var(--linha);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.25;position:relative}
.dias-r a.on{border-color:var(--marca);background:var(--lav2);color:var(--marca);font-weight:700}.dias-r small{display:block;color:var(--texto2);font-size:12px}
.dias-r label input{position:absolute;inset:0;opacity:0;width:100%}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.etapas button{border:0;border-radius:12px;padding:10px 4px;font:inherit;font-size:13.5px;font-weight:700;background:#fff;color:var(--texto2);line-height:1.2}
.etapas button.on{background:var(--marca);color:#fff}.etapas button.ok{color:#0E6E6A}.etapas button:disabled{opacity:.45}
.op{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.op button{border:1.5px solid var(--linha);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;font-weight:600;color:var(--texto)}
.op button.on{background:var(--marca);border-color:var(--marca);color:#fff}
select.campo,input.campo{width:100%;font:inherit;font-size:16px;min-height:46px;padding:0 12px;border:1.5px solid var(--linha);border-radius:12px;background:#fff;margin:0 0 6px}
.cand{display:grid;gap:6px}
.cand label{display:grid;grid-template-columns:24px 44px 1fr auto;gap:10px;align-items:center;background:var(--lav);border-radius:12px;padding:8px 10px}
.cand input{width:20px;height:20px;accent-color:var(--marca)}
.cand .mi{width:44px;height:44px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:9.5px;color:var(--texto2);text-align:center;line-height:1.1}
.cand .mi img{width:100%;height:100%;object-fit:contain}
.cand b{display:block;font-size:15px}.cand small{color:var(--texto2);font-size:12.5px}
.cand .tag{font-size:11.5px;background:#FFF2DC;color:#8A5A0D;border-radius:8px;padding:2px 7px;white-space:nowrap}
.linha-b{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.linha-b .btn{width:auto;flex:1 1 auto;min-height:44px;font-size:15px;padding:0 12px}
.lg-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lg-g figure{margin:0;background:#fff;border:2px solid var(--linha);border-radius:14px;overflow:hidden;position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.lg-g .im{aspect-ratio:1/1;display:grid;place-items:center;background:#fff;padding:8px}.lg-g .im img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.lg-g .im i{font-size:12px;color:var(--texto2);text-align:center}
.lg-g figcaption{font-size:12px;padding:5px 7px 7px;line-height:1.2;border-top:1px solid var(--linha)}.lg-g figcaption b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.lg-g figcaption small{color:var(--texto2);font-size:11px}
.lg-g figure.errada{border-color:#C62828;box-shadow:0 0 0 3px rgba(198,40,40,.18)}.lg-g figure.errada::after{content:"✕ deu errado";position:absolute;top:6px;left:6px;background:#C62828;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px}
.lg-g figure.busy::before{content:"buscando…";position:absolute;inset:0;background:rgba(255,255,255,.8);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--marca);z-index:2}
.lg-g figure.alvo{outline:3px dashed var(--teal);outline-offset:-3px}
.bandeja{display:flex;gap:8px;overflow-x:auto;padding:8px;background:var(--teal2);border-radius:12px;margin:0 0 10px}
.bandeja img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px;border:3px solid transparent;flex:0 0 auto}.bandeja img.on{border-color:var(--marca)}
.st{font-size:13.5px;color:var(--texto2);margin:0 0 10px;min-height:1em}
.rc-l{display:grid;gap:8px}
.rc{display:grid;grid-template-columns:26px 28px 1fr 14px 1fr;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px;box-shadow:var(--sombra);position:relative;touch-action:pan-y}
.rc .pos{width:26px;height:26px;border-radius:50%;background:var(--lav);color:var(--marca);font-weight:700;font-size:13px;display:grid;place-items:center}
.rc .alca{font-size:22px;color:var(--texto2);text-align:center;cursor:grab;touch-action:none;padding:8px 0}
.rc figure{margin:0;aspect-ratio:4/3;border-radius:10px;background:repeating-conic-gradient(#EEE 0 25%,#fff 0 50%) 0 0/14px 14px;display:grid;place-items:center;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none}
.rc figure img{max-width:92%;max-height:92%;object-fit:contain;pointer-events:none}.rc figure i{font-size:11.5px;color:var(--texto2);text-align:center;padding:4px;font-style:normal;background:rgba(255,255,255,.85);border-radius:8px}
.rc figure span.r{position:absolute;left:4px;top:4px;font-size:10.5px;font-weight:700;background:rgba(20,16,36,.7);color:#fff;border-radius:6px;padding:1px 6px}
.rc .seta{color:var(--texto2);text-align:center}
.rc .nm{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:0 4px}.rc .nm small{color:var(--texto2)}
.rc.ok .nm small{color:#0E6E6A;font-weight:600}
.rc.arrasta{z-index:5;box-shadow:0 10px 30px rgba(28,22,53,.3);opacity:.95}
.rc.busy figure.dep::after{content:"recortando…";position:absolute;inset:0;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--marca)}
.pronta{background:var(--teal2);color:#0E6E6A;border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:600}
.pronta a{color:#0E6E6A}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=fcfda3f6c3"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,eu,dados,estrelasHTML,estado,salvar,nav,topo,setorNome,nomeLoja,cliente,gravarCliente,menuLongo}=App;
  if(!await sessao())return;
  let D;try{D=await dados();}catch(e){$("#app").innerHTML=`${topo()}<section class="card"><h2>Rota ainda não preparada</h2><p>Nenhuma zona tem captação pronta. Peça ao administrador para rodar a varredura.</p></section>${nav("rota")}`;return;}
  const hoje=App.hojeISO();
  const dia=/^\d{4}-\d{2}-\d{2}$/.test(qs.get("d")||"")?qs.get("d"):hoje;
  const zonas=App.PLANO.filter(z=>D.zonas[z]);
  let R=JSON.parse(JSON.stringify(App.rotaDe(dia)||{tipo:"zona-familia",zona:zonas[0],familia:"alimentacao",slugs:[],etapa:1,criada:new Date().toISOString(),por:eu().nome}));
  let etapa=+qs.get("etapa")||R.etapa||1;
  const L$=s=>D.lojas.find(l=>l.slug===s);
  const salvaR=()=>App.gravarRota(dia,R);
  const fmt=iso=>{const x=App.dataCurta(iso);return `${x.sem} ${x.dia}/${x.mes}`;};
  const ir=(n,extra)=>{location.href=`?d=${dia}&etapa=${n}${extra||""}`;};
  const norm=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const logoDe=c=>(c.manual&&c.manual.tratado)||(c.logos&&c.logos[0]&&c.logos[0].src)||null;
  // ---- candidatas: tipo de rota + zona + família; fora: arquivadas, já visitadas e (marcadas) as que estão em outra rota aberta
  function candidatas(){const e=estado();const arq=new Set(e.arquivadas||[]);const feitas=new Set(e.feitas||[]);
    const outras={};for(const [d,X] of Object.entries(e.rotas||{}))if(d!==dia&&X&&!X.encerrada)for(const s of X.slugs||[])if(!(X.res||{})[s])outras[s]=d;
    let L;
    if(R.tipo==="retorno"){const ret=new Set([...(e.retornos||[]),...Object.entries(e.atend||{}).filter(([,a])=>a&&(a.res==="voltar"||a.res==="nao_estava")).map(([s])=>s)]);L=D.lojas.filter(l=>ret.has(l.slug)&&!arq.has(l.slug));}
    else{L=D.lojas.filter(l=>l.zona===R.zona&&l.estrelas>=3&&!arq.has(l.slug)&&!feitas.has(l.slug));if(R.tipo==="zona-familia")L=L.filter(l=>App.familiaDe(l.setor)===R.familia);}
    return L.sort((a,b)=>b.estrelas-a.estrelas||(a.dia||0)-(b.dia||0)||(a.ordem||0)-(b.ordem||0)).map(l=>({l,outra:outras[l.slug]||null}));}
  // ---- cabeçalho: dias com rota + escolher outro dia; etapas
  function cabecalho(){const e=estado();const dias=Object.entries(e.rotas||{}).filter(([d,X])=>X&&(X.slugs||[]).length&&!X.encerrada).sort((a,b)=>a[0].localeCompare(b[0])).filter(([d,X])=>d>=hoje||(X.slugs||[]).some(s=>!(X.res||{})[s]));
    if(!dias.some(([d])=>d===dia))dias.push([dia,R]);dias.sort((a,b)=>a[0].localeCompare(b[0]));
    const ok=[R.slugs.length>0,R.etapa>=3||R.pronta,!!R.pronta];
    return `<h1>Rota</h1><p class="sub">Monte a rota do dia: lojas, logotipos, recorte e ordem. Depois, ▶ Play no menu.</p>
    <div class="dias-r">${dias.map(([d,X])=>`<a href="?d=${d}" class="${d===dia?"on":""}">${d===hoje?"Hoje":fmt(d)}<small>${(X.slugs||[]).length} lojas${X.pronta?" · pronta ✓":""}</small></a>`).join("")}<label>+ Outro dia<small>escolher a data</small><input type="date" id="outroDia" min="${hoje}"></label></div>
    <div class="etapas"><button type="button" data-et="1" class="${etapa===1?"on":ok[0]?"ok":""}">1 · Lojas${ok[0]?" ✓":""}</button><button type="button" data-et="2" class="${etapa===2?"on":ok[1]?"ok":""}" ${R.slugs.length?"":"disabled"}>2 · Logotipos${ok[1]?" ✓":""}</button><button type="button" data-et="3" class="${etapa===3?"on":ok[2]?"ok":""}" ${R.etapa>=3||R.pronta?"":"disabled"}>3 · Recorte e ordem${ok[2]?" ✓":""}</button></div>`;}
  function ligarCab(){$$("[data-et]").forEach(b=>b.onclick=()=>ir(+b.dataset.et));const od=$("#outroDia");if(od)od.onchange=()=>{if(od.value)location.href=`?d=${od.value}`;};}

  // =============== 1 · LOJAS ===============
  function etapa1(){const C=candidatas();const sel=new Set(R.slugs);const naLista=new Set(C.map(x=>x.l.slug));const fora=R.slugs.filter(s=>!naLista.has(s)).map(L$).filter(Boolean);
    const linha=(l,outra)=>{return `<label><input type="checkbox" data-s="${esc(l.slug)}" ${sel.has(l.slug)?"checked":""}><span class="mi" data-mi="${esc(l.slug)}"><i>…</i></span><span><b>${esc(nomeLoja(l.nome))}</b><small>${esc(setorNome(l.setor))} · ${esc((l.endereco||"").split(" · ")[0])}</small></span><span style="text-align:right">${estrelasHTML(l.estrelas||0)}${outra?`<br><span class="tag">na rota de ${esc(fmt(outra))}</span>`:""}</span></label>`;};
    $("#app").innerHTML=`${topo()}${cabecalho()}
    <section class="card"><h2>Tipo de rota</h2>
      <div class="op">${Object.entries(App.TIPOS_ROTA).map(([k,t])=>`<button type="button" data-tipo="${k}" class="${R.tipo===k?"on":""}">${t}</button>`).join("")}</div>
      ${R.tipo!=="retorno"?`<label class="muted" style="font-size:13px">Zona</label><select class="campo" id="zona">${zonas.map(z=>`<option value="${z}" ${z===R.zona?"selected":""}>${esc(D.zonas[z].nome)} · ${D.lojas.filter(l=>l.zona===z&&l.estrelas>=3).length} lojas 3–5★</option>`).join("")}</select>`:`<p class="muted" style="margin:0">Lojas que pediram para voltar e as que não estavam quando o vendedor passou.</p>`}
      ${R.tipo==="zona-familia"?`<label class="muted" style="font-size:13px">Família</label><div class="op">${Object.entries(App.FAMILIAS).map(([k,f])=>`<button type="button" data-fam="${k}" class="${R.familia===k?"on":""}">${f.nome}</button>`).join("")}</div>`:""}
    </section>
    <section class="card"><h2>Lojas da rota <small class="muted" style="font-weight:400;font-size:14px">· <b id="nSel">${R.slugs.length}</b> marcadas de ${C.length}</small></h2>
      <div class="linha-b"><button type="button" class="btn sec" id="m35">Marcar as 35 primeiras</button><button type="button" class="btn sec" id="limpa">Limpar</button></div>
      ${fora.length?`<p class="muted" style="margin:0 0 6px;font-size:13px">Adicionadas por fora do filtro</p><div class="cand" style="margin-bottom:10px">${fora.map(l=>linha(l,null)).join("")}</div>`:""}
      ${C.length?`<div class="cand">${C.map(x=>linha(x.l,x.outra)).join("")}</div>`:`<p class="muted">Nenhuma loja com esse filtro${R.tipo==="retorno"?" (ainda não há retornos)":""}.</p>`}
    </section>
    <section class="card"><h2>Adicionar outras lojas</h2><input class="campo" id="busca" placeholder="Nome da loja (qualquer zona)" autocomplete="off"><div class="cand" id="buscaRes"></div></section>
    <div class="acoes"><div class="w"><button class="btn" type="button" id="seguir" ${R.slugs.length?"":"disabled"}>Seguir: logotipos →</button></div></div>${nav("rota")}`;
    document.body.classList.add("com-acoes");ligarCab();
    // miniaturas (fichas já estão em memória)
    $$("[data-mi]").forEach(async m=>{const c=await cliente({slug:m.dataset.mi});const s=logoDe(c);m.innerHTML=s?`<img src="${esc(s)}" alt="" loading="lazy">`:"<i>sem<br>logo</i>";});
    const conta=()=>{$("#nSel").textContent=R.slugs.length;$("#seguir").disabled=!R.slugs.length;};
    const marca=(s,on)=>{R.slugs=R.slugs.filter(x=>x!==s);if(on)R.slugs.push(s);};
    if(!window.__chg&&(window.__chg=1))document.addEventListener("change",ev=>{const i=ev.target.closest&&ev.target.closest("input[data-s]");if(!i)return;marca(i.dataset.s,i.checked);$$(`input[data-s="${i.dataset.s}"]`).forEach(x=>x.checked=i.checked);conta();salvaR();});
    $$("[data-tipo]").forEach(b=>b.onclick=()=>{R.tipo=b.dataset.tipo;salvaR();etapa1();});
    $$("[data-fam]").forEach(b=>b.onclick=()=>{R.familia=b.dataset.fam;salvaR();etapa1();});
    const z=$("#zona");if(z)z.onchange=()=>{R.zona=z.value;salvaR();etapa1();};
    $("#m35").onclick=()=>{const livres=C.filter(x=>!x.outra).map(x=>x.l.slug);const novas=livres.filter(s=>!R.slugs.includes(s)).slice(0,Math.max(0,35-R.slugs.length));R.slugs=R.slugs.concat(novas);salvaR();etapa1();};
    $("#limpa").onclick=()=>{if(R.slugs.length&&!confirm(`Tirar as ${R.slugs.length} lojas marcadas?`))return;R.slugs=[];R.pronta=false;salvaR();etapa1();};
    $("#busca").oninput=()=>{const t=norm($("#busca").value.trim());const box=$("#buscaRes");if(t.length<2){box.innerHTML="";return;}
      const achou=D.lojas.filter(l=>norm(l.nome).includes(t)).slice(0,20);
      box.innerHTML=achou.length?achou.map(l=>`<label><input type="checkbox" data-s="${esc(l.slug)}" ${R.slugs.includes(l.slug)?"checked":""}><span class="mi"><i>${esc((D.zonas[l.zona]||{}).nome||"")}</i></span><span><b>${esc(nomeLoja(l.nome))}</b><small>${esc(setorNome(l.setor))} · ${esc((l.endereco||"").split(" · ")[0])}</small></span><span>${estrelasHTML(l.estrelas||0)}</span></label>`).join(""):`<p class="muted" style="margin:6px 0 0">Nenhuma loja com esse nome.</p>`;};
    $("#seguir").onclick=async()=>{R.etapa=Math.max(R.etapa||1,2);await salvaR();ir(2);};}

  // =============== 2 · LOGOTIPOS ===============
  async function etapa2(){const lojas=R.slugs.map(L$).filter(Boolean);const C={};for(const l of lojas)C[l.slug]=await cliente(l);
    const marcadas=new Set(JSON.parse(sessionStorage.getItem("rota-erradas-"+dia)||"[]").filter(s=>R.slugs.includes(s)));
    let bandeja=[],escolhida=-1;
    const semLogo=()=>lojas.filter(l=>!logoDe(C[l.slug]));
    const rot=c=>(c.manual&&c.manual.editado)?"✓ recortado":!(c.logos||[]).length?"sem logotipo":c.aprovacao==="pendente"?"✦ automático":"✓ escolhido";
    const card=l=>{const c=C[l.slug];const s=logoDe(c);return `<figure data-s="${esc(l.slug)}" class="${marcadas.has(l.slug)?"errada":""}"><div class="im">${s?`<img src="${esc(s)}" alt="">`:`<i>sem<br>logotipo</i>`}</div><figcaption><b>${esc(nomeLoja(l.nome))}</b><small>${rot(c)}</small></figcaption></figure>`;};
    function desenha(){const nM=marcadas.size,nS=semLogo().length;
      $("#app").innerHTML=`${topo()}${cabecalho()}
      <section class="card"><h2>Logotipos <small class="muted" style="font-weight:400;font-size:14px">· ${lojas.length-nS} de ${lojas.length} com logotipo</small></h2>
        <p class="muted" style="margin:0 0 10px;font-size:14px">Toque nos que vieram errados para marcar. Segure (ou botão direito) para pôr um à mão.</p>
        <div class="linha-b"><button type="button" class="btn" id="auto" style="min-height:48px;font-size:15px">${nM?`✦ Buscar de novo · ${nM} marcada(s)`:`✦ Buscar automático · ${nS} sem logotipo`}</button></div>
        <div class="linha-b"><label class="btn sec" style="position:relative">📁 Pôr à mão em lote<input type="file" id="lote" accept="image/*" multiple style="position:absolute;inset:0;opacity:0"></label>${nM?`<button type="button" class="btn sec" id="desm">Desmarcar</button>`:""}</div>
        ${bandeja.length?`<p class="muted" style="margin:0 0 6px;font-size:13px">Toque numa imagem e depois na loja dela.${nM===bandeja.length?` Ou <a href="#" id="naOrdem">pôr na ordem das ${nM} marcadas</a>.`:""}</p><div class="bandeja">${bandeja.map((s,i)=>`<img src="${esc(s)}" data-b="${i}" class="${i===escolhida?"on":""}" alt="">`).join("")}</div>`:""}
        <div class="st" id="st"></div>
        <div class="lg-g">${lojas.map(card).join("")}</div>
      </section>
      <div class="acoes"><div class="w"><button class="btn sec" type="button" id="volta">← Lojas</button><button class="btn" type="button" id="aceitar">Aceitar as escolhas →</button></div></div>${nav("rota")}`;
      document.body.classList.add("com-acoes");ligarCab();ligar();}
    const guardaM=()=>sessionStorage.setItem("rota-erradas-"+dia,JSON.stringify([...marcadas]));
    async function porLogo(slug,src,origem){const c=await cliente({slug});c.logos=[{id:"man"+Date.now().toString(36),src,nome:"Logotipo · "+(origem==="foto"?"foto":"enviado"),origem,auto:false}].concat((c.logos||[]).filter(x=>!x.auto));delete c.manual;c.aprovacao="ok";await gravarCliente(c);C[slug]=c;marcadas.delete(slug);guardaM();}
    const reduz=src=>new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));if(k>=1&&src.length<2.5e6)return res(src);const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/png"));};im.onerror=()=>res(src);im.src=src;});
    const lerArq=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>res(null);r.readAsDataURL(f);});
    function ligar(){
      $$(".lg-g figure").forEach(f=>{const s=f.dataset.s;
        f.onclick=async()=>{if(f.dataset.longo==="1"){f.dataset.longo="";return;}
          if(escolhida>=0){const src=bandeja[escolhida];f.classList.add("busy");await porLogo(s,src,"arquivo");bandeja.splice(escolhida,1);escolhida=-1;desenha();return;}
          if(marcadas.has(s))marcadas.delete(s);else marcadas.add(s);guardaM();desenha();};
        let t=null;f.addEventListener("pointerdown",ev=>{if(ev.button===2)return;t=setTimeout(()=>{t=null;f.dataset.longo="1";if(navigator.vibrate)navigator.vibrate(12);menu(s);},480);});
        ["pointerup","pointercancel","pointerleave"].forEach(k=>f.addEventListener(k,()=>{clearTimeout(t);}));
        f.addEventListener("contextmenu",ev=>{ev.preventDefault();clearTimeout(t);menu(s);});});
      $("#auto").onclick=()=>auto();const dm=$("#desm");if(dm)dm.onclick=()=>{marcadas.clear();guardaM();desenha();};
      $("#lote").onchange=async ev=>{const fs=[...ev.target.files].slice(0,40);$("#st").textContent=`Lendo ${fs.length} imagem(ns)…`;for(const f of fs){const s=await lerArq(f);if(s)bandeja.push(await reduz(s));}escolhida=bandeja.length?0:-1;desenha();};
      $$(".bandeja img").forEach(im=>im.onclick=()=>{escolhida=+im.dataset.b;desenha();$$(".lg-g figure").forEach(f=>f.classList.add("alvo"));});
      if(escolhida>=0)$$(".lg-g figure").forEach(f=>f.classList.add("alvo"));
      const no=$("#naOrdem");if(no)no.onclick=async ev=>{ev.preventDefault();const alvos=lojas.filter(l=>marcadas.has(l.slug));for(let i=0;i<alvos.length;i++){$("#st").textContent=`Gravando ${i+1}/${alvos.length}…`;await porLogo(alvos[i].slug,bandeja[i],"arquivo");}bandeja=[];escolhida=-1;desenha();};
      $("#volta").onclick=()=>ir(1);
      $("#aceitar").onclick=async()=>{const sem=semLogo();if(sem.length&&!confirm(`${sem.length} loja(s) ainda sem logotipo:\n${sem.slice(0,6).map(l=>nomeLoja(l.nome)).join("\n")}${sem.length>6?"\n…":""}\n\nSeguir mesmo assim?`))return;
        const b=$("#aceitar");b.disabled=true;b.textContent="Gravando…";
        for(const l of lojas){const c=C[l.slug];if(c.aprovacao==="pendente"&&(c.logos||[]).length){c.aprovacao="ok";if(c.logos[0]){c.logos[0].aprovadoEm=new Date().toISOString();c.logos[0].aprovadoPor=eu().nome;}await gravarCliente(c);}}
        marcadas.clear();guardaM();R.etapa=3;await salvaR();ir(3);};}
    async function auto(so){const alvo=so?[L$(so)]:marcadas.size?lojas.filter(l=>marcadas.has(l.slug)):semLogo();if(!alvo.length){$("#st").textContent="Todas já têm logotipo. Marque as que vieram erradas para buscar de novo.";return;}
      const b=$("#auto");b.disabled=true;let ok=0;const falhas=[];
      for(let i=0;i<alvo.length;i++){const l=alvo[i];const f=document.querySelector(`.lg-g figure[data-s="${l.slug}"]`);if(f)f.classList.add("busy");$("#st").textContent=`${i+1}/${alvo.length} · ${nomeLoja(l.nome)}`;
        try{const r=await fetch(`/api/rota/logo/${encodeURIComponent(l.slug)}`,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({refazer:!!logoDe(C[l.slug])})});const d=await r.json().catch(()=>({}));
          if(r.ok&&d.ok){ok++;marcadas.delete(l.slug);}else falhas.push(nomeLoja(l.nome)+": "+(d.motivo||d.erro||r.status));}catch(e){falhas.push(nomeLoja(l.nome)+": sem conexão");}
        C[l.slug]=await App.recarregarFicha(l.slug)||C[l.slug];
        if(f){const n=document.createElement("div");n.innerHTML=card(l);f.replaceWith(n.firstChild);}}
      guardaM();desenha();$("#st").textContent=`${ok} logotipo(s) novo(s)`+(falhas.length?` · ${falhas.length} sem resultado: ${falhas.slice(0,3).join(" · ")}${falhas.length>3?" …":""}`:"");}
    async function menu(slug){const l=L$(slug);const temLogo=!!logoDe(C[slug]);
      const k=await menuLongo(nomeLoja(l.nome),[{k:"auto",ic:"✦",t:temLogo?"Buscar outro automático":"Buscar automático"},{k:"foto",ic:"📷",t:"Fotografar o logotipo"},{k:"arquivo",ic:"📁",t:"Enviar arquivo"},{k:"pesquisa",ic:"🔍",t:"Pesquisa de imagens"}].concat(temLogo?[{k:"tirar",ic:"🗑",t:"Tirar o logotipo"}]:[]));if(!k)return;
      if(k==="auto"){await auto(slug);return;}
      if(k==="foto"||k==="arquivo"){const img=await App.escolherImagem(k==="foto");if(!img)return;await porLogo(slug,await reduz(img),k);desenha();return;}
      if(k==="pesquisa"){location.href=`fontes.html?l=${encodeURIComponent(slug)}&tipo=busca`;return;}
      if(k==="tirar"){const c=await cliente({slug});const p=(c.logos||[])[0];if(p)await App.removerLogo(l,p.id);C[slug]=await cliente({slug});desenha();}}
    desenha();}

  // =============== 3 · RECORTE E ORDEM ===============
  async function etapa3(){const C={};for(const s of R.slugs){const l=L$(s);if(l)C[s]=await cliente(l);}
    const lojas=()=>R.slugs.map(L$).filter(Boolean);
    const linha=(l,i)=>{const c=C[l.slug];const p=(c.logos||[])[0]||{};const feito=!!(c.manual&&c.manual.editado);const antes=p.original||(!feito?p.src:null)||p.src;const depois=feito?(c.manual.tratado||p.src):null;
      return `<div class="rc ${feito?"ok":""}" data-s="${esc(l.slug)}"><span class="pos">${i+1}</span><span class="alca" aria-label="arrastar">≡</span>
        <figure class="ant" data-logo>${antes?`<img src="${esc(antes)}" alt=""><span class="r">antes</span>`:`<i>sem logotipo</i>`}</figure><span class="seta">→</span>
        <figure class="dep" data-logo>${depois?`<img src="${esc(depois)}" alt=""><span class="r">depois</span>`:`<i>${antes?"segure ou botão direito<br>para recortar":"—"}</i>`}</figure>
        <div class="nm"><span><b>${esc(nomeLoja(l.nome))}</b></span><small>${feito?"✓ recortado":antes?"falta recortar":"sem logotipo"}</small></div></div>`;};
    function desenha(){const L=lojas();const nOk=L.filter(l=>C[l.slug]&&C[l.slug].manual&&C[l.slug].manual.editado).length;
      $("#app").innerHTML=`${topo()}${cabecalho()}
      ${R.pronta?`<div class="pronta">✓ Rota pronta · ${L.length} lojas. Toque <a href="play.html">▶ Play</a> no menu para começar.</div>`:""}
      <section class="card" style="padding:14px"><h2>Recorte e ordem <small class="muted" style="font-weight:400;font-size:14px">· ${nOk} de ${L.length} recortados</small></h2>
        <p class="muted" style="margin:0 0 10px;font-size:14px">Segure o logotipo (ou botão direito) e peça o recorte: o antes e o depois aparecem lado a lado. Arraste pelo ≡ para mudar a fila.</p>
        <div class="linha-b"><button type="button" class="btn sec" id="caminho">Ordenar pelo caminho</button></div>
        <div class="rc-l" id="lista">${L.map(linha).join("")}</div></section>
      <div class="acoes"><div class="w"><button class="btn sec" type="button" id="volta">← Logotipos</button><button class="btn" type="button" id="pronta">${R.pronta?"✓ Rota pronta":"✓ Rota pronta"}</button></div></div>${nav("rota")}`;
      document.body.classList.add("com-acoes");ligarCab();ligar();}
    async function recortar(s){const row=document.querySelector(`.rc[data-s="${s}"]`);if(row)row.classList.add("busy");const r=await App.recortarLogo(L$(s));C[s]=await cliente(L$(s));if(!r.ok)alert("Não consegui recortar: "+r.motivo);troca(s);}
    function troca(s){const row=document.querySelector(`.rc[data-s="${s}"]`);if(!row)return desenha();const n=document.createElement("div");n.innerHTML=linha(L$(s),R.slugs.indexOf(s));row.replaceWith(n.firstChild);ligarLinha(document.querySelector(`.rc[data-s="${s}"]`));
      const L=lojas();$("h2 small").innerHTML=`· ${L.filter(l=>C[l.slug]&&C[l.slug].manual&&C[l.slug].manual.editado).length} de ${L.length} recortados`;}
    async function menu(s){const c=C[s];const p=(c.logos||[])[0];const feito=!!(c.manual&&c.manual.editado);if(!p){if(confirm("Esta loja está sem logotipo. Voltar ao passo 2?"))ir(2);return;}
      const k=await menuLongo(nomeLoja(L$(s).nome),[{k:"rec",ic:"✂",t:feito?"Recortar de novo":"Recortar"},{k:"mao",ic:"✏",t:"Editar à mão"}].concat(feito&&p.original?[{k:"desf",ic:"↩",t:"Desfazer o recorte"}]:[]).concat([{k:"trocar",ic:"✦",t:"Trocar o logotipo (passo 2)"}]));if(!k)return;
      if(k==="rec"){if(feito){await desfazer(s);}await recortar(s);}
      if(k==="mao")App.abrirLogotipo(s,p.original||p.src,"","rota");
      if(k==="desf"){await desfazer(s);troca(s);}
      if(k==="trocar")ir(2);}
    async function desfazer(s){const c=await cliente(L$(s));const p=(c.logos||[])[0];if(p&&p.original){p.src=p.original;delete p.original;p.tratado=false;}delete c.manual;await gravarCliente(c);C[s]=c;}
    function ligarLinha(row){const s=row.dataset.s;
      row.querySelectorAll("[data-logo]").forEach(f=>{let t=null;f.addEventListener("pointerdown",ev=>{if(ev.button===2)return;t=setTimeout(()=>{t=null;if(navigator.vibrate)navigator.vibrate(12);menu(s);},480);});["pointerup","pointercancel","pointerleave"].forEach(k=>f.addEventListener(k,()=>clearTimeout(t)));f.addEventListener("contextmenu",ev=>{ev.preventDefault();clearTimeout(t);menu(s);});});
      // arrastar pelo ≡: a linha segue o dedo e troca de lugar com as vizinhas
      const al=row.querySelector(".alca");al.addEventListener("pointerdown",ev=>{ev.preventDefault();try{al.setPointerCapture(ev.pointerId);}catch(e){}const lista=$("#lista");row.classList.add("arrasta");let y0=ev.clientY;
        const mv=e=>{const dy=e.clientY-y0;row.style.transform=`translateY(${dy}px)`;const irmaos=[...lista.children].filter(x=>x!==row);const meio=row.getBoundingClientRect().top+row.offsetHeight/2;
          for(const x of irmaos){const r=x.getBoundingClientRect();if(meio<r.top+r.height/2&&x.compareDocumentPosition(row)&Node.DOCUMENT_POSITION_FOLLOWING){const antes=row.getBoundingClientRect().top;lista.insertBefore(row,x);y0+=row.getBoundingClientRect().top-antes;row.style.transform=`translateY(${e.clientY-y0}px)`;break;}
            if(meio>r.top+r.height/2&&x.compareDocumentPosition(row)&Node.DOCUMENT_POSITION_PRECEDING&&x===row.nextElementSibling){const antes=row.getBoundingClientRect().top;lista.insertBefore(row,x.nextSibling);y0+=row.getBoundingClientRect().top-antes;row.style.transform=`translateY(${e.clientY-y0}px)`;break;}}};
        const up=async()=>{al.removeEventListener("pointermove",mv);al.removeEventListener("pointerup",up);al.removeEventListener("pointercancel",up);row.classList.remove("arrasta");row.style.transform="";
          R.slugs=[...lista.children].map(x=>x.dataset.s);[...lista.children].forEach((x,i)=>x.querySelector(".pos").textContent=i+1);await salvaR();};
        al.addEventListener("pointermove",mv);al.addEventListener("pointerup",up);al.addEventListener("pointercancel",up);});}
    function ligar(){$$(".rc").forEach(ligarLinha);$("#volta").onclick=()=>ir(2);
      $("#caminho").onclick=async()=>{const Z=D.zonas[R.zona]||D.zona;const dist=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lng-b.lng)*111*Math.cos(a.lat*Math.PI/180));let cur=Z&&Z.base?{lat:Z.base[0],lng:Z.base[1]}:null;
        const resto=lojas().filter(l=>l.lat&&l.lng),sem=lojas().filter(l=>!(l.lat&&l.lng));const out=[];if(!cur&&resto.length)cur=resto[0];
        while(resto.length){let k=0;for(let i=1;i<resto.length;i++)if(dist(cur,resto[i])<dist(cur,resto[k]))k=i;cur=resto.splice(k,1)[0];out.push(cur);}R.slugs=out.concat(sem).map(l=>l.slug);await salvaR();desenha();};
      $("#pronta").onclick=async()=>{const falta=lojas().filter(l=>!(C[l.slug]&&C[l.slug].manual&&C[l.slug].manual.editado));if(falta.length&&!confirm(`${falta.length} loja(s) sem recorte. Marcar a rota como pronta mesmo assim?`))return;
        R.pronta=true;R.prontaEm=new Date().toISOString();R.res=R.res||{};await salvaR();desenha();scrollTo(0,0);};}
    desenha();}

  if(etapa===2&&R.slugs.length)await etapa2();else if(etapa===3&&(R.etapa>=3||R.pronta))await etapa3();else etapa1();
})();
</script>
</body>
