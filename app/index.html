<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GênIO · Rota</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css?v=4563719462">
<style>.leaflet-div-icon{background:transparent;border:0}.mapa svg.esq{width:100%;height:100%}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=4563719462"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,eu,dados,estrelasHTML,estado,salvar,nav,topo,setorNome,nomeLoja}=App;
  if(!await sessao())return;
  let D;try{D=await dados();}catch(e){$("#app").innerHTML=`${topo()}<section class="card"><h2>Rota ainda não preparada</h2><p>A zona <b>${esc(App.ZONA)}</b> não tem captação pronta. Peça ao administrador para rodar a varredura.</p></section>${nav("rota")}`;return;}
  const e=estado();e.feitas=e.feitas||[];
  // agenda: todas as lojas da zona por estrelas, em dias de 50; cada dia tem uma data (pula domingo)
  const DIAS=App.diasDeRota(D);const hoje=App.hojeISO();
  const pedida=qs.get("dia")?+qs.get("dia"):0;const feitasSet=new Set(e.feitas);
  const pend=d=>d.lojas.some(l=>!feitasSet.has(l.slug));
  // abre a rota de hoje; sem rota hoje (sábado) ou com atraso, a pendente mais antiga; senão a próxima
  const atual=DIAS.find(d=>d.n===pedida)||DIAS.find(d=>d.data===hoje&&pend(d))||DIAS.find(d=>d.data<hoje&&pend(d))||DIAS.find(d=>d.data>hoje&&pend(d))||DIAS.find(d=>pend(d))||DIAS[0];
  const sel=atual.lojas;if(!sel.length){const dc0=App.dataCurta(atual.data);$("#app").innerHTML=`${topo()}<h1>Olá, ${esc(eu().nome.split(" ")[0])}</h1><p class="sub">${esc(D.zona.nome)} · ${dc0.sem} ${dc0.dia}/${dc0.mes}</p>
    <div class="agenda">${DIAS.map(d=>{const q=d.lojas.filter(l=>feitasSet.has(l.slug)).length;const x=App.dataCurta(d.data);const st=d.vazio?"a captar":q>=d.lojas.length?"feita":d.data<hoje?"pendente":d.data===hoje?"hoje":"";return `<a href="?dia=${d.n}" class="${d===atual?"on":""} ${d.data===hoje?"hoje":""} ${d.data<hoje?"passado":""}"><span class="s">${x.sem}</span><span class="d">${x.dia}</span><span class="s">${x.mes}</span><span class="q">${d.vazio?"sem lojas":`${q?`<b>${q}</b>/`:""}${d.lojas.length} lojas`}</span>${st?`<span class="tag ${st}">${st}</span>`:""}</a>`;}).join("")}</div>
    <section class="card"><h2>Sem rota neste dia</h2><p>As lojas desta zona (3 a 5 estrelas) preenchem ${DIAS.filter(d=>!d.vazio).length} dias de rota. Para preencher os próximos dias, a captação precisa varrer novas zonas — hoje está pausada por decisão do dono.</p></section>${nav("rota")}`;return;}
  // percurso do dia: encadeado ponto a ponto a partir da base (vizinho mais próximo)
  const dist=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lng-b.lng)*111*Math.cos(a.lat*Math.PI/180));
  const rota=[];{let cur={lat:D.zona.base[0],lng:D.zona.base[1]};const resto=sel.filter(l=>l.lat&&l.lng);const semGeo=sel.filter(l=>!(l.lat&&l.lng));while(resto.length){let k=0;for(let i=1;i<resto.length;i++)if(dist(cur,resto[i])<dist(cur,resto[k]))k=i;cur=resto.splice(k,1)[0];rota.push(cur);}rota.push(...semGeo);}
  rota.forEach((l,i)=>l.parada=i+1);
  const filtro=qs.get("min")?+qs.get("min"):0;const vis=rota.filter(l=>l.estrelas>=filtro);
  const LOGO={},MINI={};for(const l of vis){const c=await App.cliente(l);LOGO[l.slug]=(c.manual&&c.manual.editado)?"pronto":(c.logos&&c.logos.length)?"falta":"vazio";MINI[l.slug]=(c.manual&&c.manual.tratado)||(c.logos&&c.logos[0]&&c.logos[0].src)||null;}const feitasDia=rota.filter(l=>feitasSet.has(l.slug)).length;const dc=App.dataCurta(atual.data);
  const feitas=new Set(e.feitas);const prox=rota.find(l=>!feitas.has(l.slug))||null;
  const cont=[5,4,3].map(n=>[n,rota.filter(l=>l.estrelas===n).length]).filter(x=>x[1]);
  $("#app").innerHTML=`${topo()}
  <h1>Olá, ${esc(eu().nome.split(" ")[0])}</h1><p class="sub">${esc(D.zona.nome)} · rota ${atual.n} · ${dc.sem} ${dc.dia}/${dc.mes} · ${rota.length} lojas · ${feitasDia} visitadas</p>
  <div class="agenda">${DIAS.map(d=>{const q=d.lojas.filter(l=>feitasSet.has(l.slug)).length;const x=App.dataCurta(d.data);const st=d.vazio?"a captar":q>=d.lojas.length?"feita":d.data<hoje?"pendente":d.data===hoje?"hoje":"";return `<a href="?dia=${d.n}" class="${d===atual?"on":""} ${d.data===hoje?"hoje":""} ${d.data<hoje?"passado":""}"><span class="s">${x.sem}</span><span class="d">${x.dia}</span><span class="s">${x.mes}</span><span class="q">${d.vazio?"sem lojas":`${q?`<b>${q}</b>/`:""}${d.lojas.length} lojas`}</span>${st?`<span class="tag ${st}">${st}</span>`:""}</a>`;}).join("")}</div>
  ${atual.data!==hoje&&feitasDia<rota.length?`<div class="linha-rota"><span class="muted">Rota ${atual.n} agendada para ${dc.sem} ${dc.dia}/${dc.mes}${atual.data<hoje?" · ainda não feita":""}</span><button type="button" class="btn sec sm" id="reHoje" style="width:auto;min-height:36px;padding:0 12px;font-size:13px">Fazer hoje</button><label class="btn sec sm" style="width:auto;min-height:36px;padding:0 12px;font-size:13px;display:inline-grid;place-items:center;position:relative">Outra data<input type="date" id="reData" value="${atual.data}" style="position:absolute;inset:0;opacity:0;width:100%"></label></div>`:""}
  <section class="card" style="padding:12px 16px"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">${cont.map(([n,q])=>`<a href="?dia=${atual.n}&min=${n}" class="chip ${filtro===n?"ok":""}" style="text-decoration:none">${"★".repeat(n)} <b>${q}</b></a>`).join("")}${filtro?`<a href="?dia=${atual.n}" class="chip">todas</a>`:""}</div><small class="muted">Só lojas de 3 a 5 estrelas; 5 e 4 primeiro. <span class="leg-falta">Fundo âmbar</span> = logotipo ainda não organizado.</small></section>
  <div class="mapa" id="mapa"></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 6px"><button class="btn sec" id="recortarTodas" type="button" style="min-height:48px;font-size:14px">✂ Recortar logotipos em lote</button><button class="btn sec" id="gerarTodas" type="button" style="min-height:48px;font-size:14px">✦ Gerar produtos de todas</button></div><div class="muted" id="gerarSt" style="font-size:13px;margin:0 0 10px"></div>
  <div class="lista">${vis.map((l,i)=>`<a class="card loja-l ${e.feitas.includes(l.slug)?"feita":""} logo-${LOGO[l.slug]}" href="visita.html?l=${encodeURIComponent(l.slug)}" style="display:grid;color:inherit;text-decoration:none"><span class="n">${e.feitas.includes(l.slug)?"✓":l.parada}</span><span class="mini ${LOGO[l.slug]}" data-mini="${esc(l.slug)}">${MINI[l.slug]?`<img src="${esc(MINI[l.slug])}" alt="" loading="lazy">`:"<i>sem<br>logo</i>"}</span><div><b>${esc(nomeLoja(l.nome))}</b><small>${esc(setorNome(l.setor))} · ${esc((l.endereco||"").split(" · ")[0])}</small></div><div style="text-align:right">${estrelasHTML(l.estrelas)}<br><small class="${LOGO[l.slug]==="pronto"?"ok-logo":"falta-logo"}">${LOGO[l.slug]==="pronto"?"✓ logotipo pronto":LOGO[l.slug]==="falta"?"◷ falta tratar":"✦ falta logotipo"}</small></div></a>`).join("")}</div>
  ${nav("rota")}`;
  const rh=$("#reHoje");if(rh)rh.onclick=()=>{App.reagendar(atual.n,hoje);location.href=`?dia=${atual.n}`;};const rd=$("#reData");if(rd)rd.onchange=()=>{if(rd.value){App.reagendar(atual.n,rd.value);location.href=`?dia=${atual.n}`;}};
  // recorte em lote: só as lojas desta rota com logotipo escolhido e ainda não tratado (o manual não é mexido)
  $("#recortarTodas").onclick=async()=>{const b=$("#recortarTodas"),st=$("#gerarSt");b.disabled=true;let fila=[];for(const l of D.lojas){const c=await App.cliente(l);if((c.logos||[]).length&&!(c.manual&&c.manual.editado))fila.push(l);}  // todas as lojas da zona, qualquer dia
    if(!fila.length){st.textContent="Nenhuma loja com logotipo esperando recorte.";b.disabled=false;return;}
    let ok=0,falhas=[];for(let i=0;i<fila.length;i++){const l=fila[i];b.textContent=`✂ ${i+1}/${fila.length}`;st.textContent=`Recortando ${nomeLoja(l.nome)}…`;const r=await App.recortarLogo(l);if(r.ok)ok++;else falhas.push(nomeLoja(l.nome)+": "+r.motivo);}
    b.textContent="✂ Recortar logotipos em lote";b.disabled=false;st.textContent=`${ok} logotipo(s) recortado(s)${falhas.length?" · "+falhas.length+" falha(s)":""}`;if(falhas.length)alert(falhas.slice(0,8).join("\n"));setTimeout(()=>location.reload(),1200);};
  $("#gerarTodas").onclick=async()=>{const b=$("#gerarTodas"),st=$("#gerarSt");b.disabled=true;let prontas=0,feitas=0,falhas=[];
    for(const l of rota){const c=await App.cliente(l);if(!(c.manual&&c.manual.editado))continue;prontas++;b.textContent=`${nomeLoja(l.nome)}…`;
      const r=await App.gerarProdutos(l,pid=>{st.textContent=`${nomeLoja(l.nome)} · ${pid} (loja ${prontas})`;});feitas+=r.ok;if(r.falhas.length)falhas.push(nomeLoja(l.nome)+": "+r.falhas.join(", "));}
    b.textContent="✦ Gerar produtos de todas";b.disabled=false;st.textContent=`${prontas} loja(s) com logotipo · ${feitas} arte(s) geradas${falhas.length?" · falhas: "+falhas.length:""}`;if(falhas.length)alert(falhas.slice(0,8).join("\n"));};
  // miniatura do logotipo: toque = pop-up maior para analisar (toque de novo fecha); segurar = abre a edição
  (()=>{let pop=null;const fechar=()=>{if(pop){pop.remove();pop=null;}};
    const abrir=(l)=>{fechar();const src=MINI[l.slug];pop=document.createElement("div");pop.className="pop-logo";pop.innerHTML=`<div class="cx"><div class="img">${src?`<img src="${esc(src)}" alt="">`:"<i>sem logotipo</i>"}</div><div class="rod"><b>${esc(nomeLoja(l.nome))}</b><small>${LOGO[l.slug]==="pronto"?"✓ tratado":LOGO[l.slug]==="falta"?"◷ falta tratar":"✦ sem logotipo"} · toque para fechar · segure para editar</small></div></div>`;document.body.appendChild(pop);
      let t=null,longo=false;pop.addEventListener("pointerdown",()=>{longo=false;t=setTimeout(()=>{longo=true;if(navigator.vibrate)navigator.vibrate(12);menuLogo(l);},450);});
      const fim=()=>{clearTimeout(t);if(!longo)fechar();};pop.addEventListener("pointerup",fim);pop.addEventListener("pointercancel",()=>clearTimeout(t));};
    async function menuLogo(l){fechar();const src=MINI[l.slug];const k=await App.menuLongo(nomeLoja(l.nome),[{k:"editar",ic:"✂",t:"Editar logotipo"},{k:"auto",ic:"✦",t:"Recorte automático"},{k:"pesquisa",ic:"🔍",t:"Substituir · pesquisa"},{k:"foto",ic:"📷",t:"Substituir · fotografar"},{k:"arquivo",ic:"📁",t:"Substituir · enviar arquivo"},{k:"remover",ic:"🗑",t:"Remover logotipo"}]);if(!k)return;
      if(k==="editar"){if(src)App.abrirLogotipo(l.slug,src,"","visita");else location.href=`fontes.html?l=${encodeURIComponent(l.slug)}&tipo=busca`;return;}
      if(k==="pesquisa"){location.href=`fontes.html?l=${encodeURIComponent(l.slug)}&tipo=busca`;return;}
      if(k==="foto"||k==="arquivo"){const img=await App.escolherImagem(k==="foto");if(img)App.abrirLogotipo(l.slug,img,k==="foto"?"foto":"arquivo","visita");return;}
      if(k==="auto"){const r=await App.recortarLogo(l);if(!r.ok)alert("Não consegui: "+r.motivo);location.reload();return;}
      if(k==="remover"){const c=await App.cliente(l);const p=(c.logos||[])[0];if(p){await App.removerLogo(l,p.id);}location.reload();}}
    document.querySelectorAll("[data-mini]").forEach(m=>{let t=null,longo=false;const l=vis.find(x=>x.slug===m.dataset.mini);
      m.addEventListener("click",ev=>{ev.preventDefault();ev.stopPropagation();});
      m.addEventListener("pointerdown",ev=>{ev.preventDefault();ev.stopPropagation();longo=false;t=setTimeout(()=>{longo=true;if(navigator.vibrate)navigator.vibrate(12);menuLogo(l);},450);});
      m.addEventListener("pointerup",ev=>{ev.preventDefault();ev.stopPropagation();clearTimeout(t);if(!longo)abrir(l);});m.addEventListener("pointercancel",()=>clearTimeout(t));m.addEventListener("contextmenu",ev=>ev.preventDefault());});})();
  {const a=document.querySelector(".agenda a.on")||document.querySelector(".agenda a.hoje");if(a)a.scrollIntoView({inline:"center",block:"nearest"});}
  // mapa com o traço ligando as paradas na ordem do percurso: Google Maps se houver chave no servidor; senão mapa aberto (Leaflet/CARTO); sem rede, esquema
  const lojas=rota.filter(l=>l.lat&&l.lng);if(!lojas.length){$("#mapa").remove();return;}
  const cor=l=>l===prox?"#141C3A":feitas.has(l.slug)?"#B9B1CC":"#6933C5";
  let gkey="";try{const r=await fetch("/api/mapa",{cache:"no-store"});if(r.ok)gkey=(await r.json()).google||"";}catch(e){}
  if(gkey){await new Promise(res=>{const s=document.createElement("script");s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(gkey)}&v=weekly&language=pt-BR&region=BR&loading=async&callback=__gm`;window.__gm=res;s.onerror=res;document.head.appendChild(s);});}
  if(gkey&&window.google&&google.maps){const g=google.maps;const map=new g.Map($("#mapa"),{disableDefaultUI:true,gestureHandling:"greedy",clickableIcons:false,styles:[{featureType:"poi",stylers:[{visibility:"off"}]}]});
    const bounds=new g.LatLngBounds();lojas.forEach(l=>bounds.extend({lat:l.lat,lng:l.lng}));map.fitBounds(bounds,40);
    new g.Polyline({path:lojas.map(l=>({lat:l.lat,lng:l.lng})),strokeColor:"#6933C5",strokeWeight:5,strokeOpacity:.9,map});
    const pin=(txt,c,size)=>({url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='${size}' height='${size}'><circle cx='${size/2}' cy='${size/2}' r='${size/2-3}' fill='${c}' stroke='#fff' stroke-width='3'/><text x='50%' y='50%' dy='.36em' text-anchor='middle' font-family='Rubik,Arial' font-weight='700' font-size='${size*0.42}' fill='#fff'>${txt}</text></svg>`),scaledSize:new g.Size(size,size),anchor:new g.Point(size/2,size/2)});
    lojas.forEach(l=>{const f=feitas.has(l.slug);const mk=new g.Marker({position:{lat:l.lat,lng:l.lng},map,icon:pin(f?"✓":l.parada,cor(l),l===prox?40:34),title:l.nome,zIndex:l===prox?9:1});mk.addListener("click",()=>location.href=`visita.html?l=${encodeURIComponent(l.slug)}`);});
    if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{new g.Marker({position:{lat:p.coords.latitude,lng:p.coords.longitude},map,icon:{path:g.SymbolPath.CIRCLE,scale:9,fillColor:"#14B8B0",fillOpacity:1,strokeColor:"#fff",strokeWeight:3}});},()=>{},{timeout:6000,maximumAge:60000});
    return;}
  if(typeof L==="undefined"){const xs=lojas.map(l=>l.lng),ys=lojas.map(l=>l.lat);const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);const X=v=>30+(v-x0)/((x1-x0)||1)*340,Y=v=>270-(v-y0)/((y1-y0)||1)*240;
    $("#mapa").innerHTML=`<svg class="esq" viewBox="0 0 400 300"><polyline fill="none" stroke="#6933C5" stroke-width="5" stroke-linejoin="round" points="${lojas.map(l=>X(l.lng)+","+Y(l.lat)).join(" ")}"/>${lojas.map(l=>`<g><circle cx="${X(l.lng)}" cy="${Y(l.lat)}" r="${l===prox?17:14}" fill="${cor(l)}" stroke="#fff" stroke-width="3"/><text x="${X(l.lng)}" y="${Y(l.lat)+5}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${feitas.has(l.slug)?"✓":l.parada}</text></g>`).join("")}</svg>`;return;}
  const map=L.map("mapa",{zoomControl:false,attributionControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
  const pts=lojas.map(l=>[l.lat,l.lng]);
  L.polyline(pts,{color:"#6933C5",weight:5,opacity:.9,lineJoin:"round"}).addTo(map);
  lojas.forEach(l=>{const f=feitas.has(l.slug);const ic=L.divIcon({className:"",html:`<div class="mk ${l===prox?"prox":""} ${f?"feita":""}">${f?"✓":l.parada}</div>`,iconSize:[34,34],iconAnchor:[17,17]});L.marker([l.lat,l.lng],{icon:ic}).addTo(map).on("click",()=>location.href=`visita.html?l=${encodeURIComponent(l.slug)}`);});
  map.fitBounds(L.latLngBounds(pts).pad(.15));
  if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{L.marker([p.coords.latitude,p.coords.longitude],{icon:L.divIcon({className:"",html:'<div class="mk eu"></div>',iconSize:[18,18],iconAnchor:[9,9]})}).addTo(map);},()=>{},{timeout:6000,maximumAge:60000});
})();
</script>
</body>
</html>
