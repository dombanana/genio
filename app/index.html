<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Rota</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="app.css?v=2147003129">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* montagem da rota pelo vendedor (14/11): 1 lojas · 2 logotipos · 3 recorte e ordem */
.dias-r{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;margin:0 0 4px;scrollbar-width:none}.dias-r::-webkit-scrollbar{display:none}
.dias-r a,.dias-r label{flex:0 0 auto;text-decoration:none;color:var(--texto);background:#fff;border:1.5px solid var(--linha);border-radius:14px;padding:8px 12px;font-size:14px;line-height:1.25;position:relative}
.dias-r a.on{border-color:var(--marca);background:var(--lav2);color:var(--marca);font-weight:700}.dias-r small{display:block;color:var(--texto2);font-size:12px}
.dias-r label input{position:absolute;inset:0;opacity:0;width:100%}
.etapas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 0 12px}
.etapas button{border:0;border-radius:12px;padding:10px 4px;font:inherit;font-size:13.5px;font-weight:700;background:#fff;color:var(--texto2);line-height:1.2}
.etapas button.on{background:var(--marca);color:#fff}.etapas button.ok{color:#0E6E6A}.etapas button:disabled{opacity:.45}
.op{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.op button{border:1.5px solid var(--linha);background:#fff;border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;font-weight:600;color:var(--texto)}
.op button.on{background:var(--marca);border-color:var(--marca);color:#fff}
select.campo,input.campo{width:100%;font:inherit;font-size:16px;min-height:46px;padding:0 12px;border:1.5px solid var(--linha);border-radius:12px;background:#fff;margin:0 0 6px}
.cand{display:grid;gap:6px}
.cand label{display:grid;grid-template-columns:24px 44px 1fr auto;gap:10px;align-items:center;background:var(--lav);border-radius:12px;padding:8px 10px}
.cand input{width:20px;height:20px;accent-color:var(--marca)}
.cand .mi{width:44px;height:44px;border-radius:9px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:9.5px;color:var(--texto2);text-align:center;line-height:1.1}
.cand .mi img{width:100%;height:100%;object-fit:contain}
.cand b{display:block;font-size:15px}.cand small{color:var(--texto2);font-size:12.5px}
.cand .tag{font-size:11.5px;background:#FFF2DC;color:#8A5A0D;border-radius:8px;padding:2px 7px;white-space:nowrap}
.linha-b{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px}.linha-b .btn{width:auto;flex:1 1 auto;min-height:44px;font-size:15px;padding:0 12px}
.lg-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lg-g figure{margin:0;background:#fff;border:2px solid var(--linha);border-radius:14px;overflow:hidden;position:relative;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.lg-g .im{aspect-ratio:1/1;display:grid;place-items:center;background:#fff;padding:8px}.lg-g .im img{max-width:100%;max-height:100%;object-fit:contain;pointer-events:none}
.lg-g .im i{font-size:12px;color:var(--texto2);text-align:center}
.lg-g figcaption{font-size:12px;padding:5px 7px 7px;line-height:1.2;border-top:1px solid var(--linha)}.lg-g figcaption b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.lg-g figcaption small{color:var(--texto2);font-size:11px}
.lg-g figure.errada{border-color:#C62828;box-shadow:0 0 0 3px rgba(198,40,40,.18)}.lg-g figure.errada::after{content:"✕ deu errado";position:absolute;top:6px;left:6px;background:#C62828;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 7px}
.lg-g figure.busy::before{content:"buscando…";position:absolute;inset:0;background:rgba(255,255,255,.8);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--marca);z-index:2}
.lg-g figure.alvo{outline:3px dashed var(--teal);outline-offset:-3px}
.bandeja{display:flex;gap:8px;overflow-x:auto;padding:8px;background:var(--teal2);border-radius:12px;margin:0 0 10px}
.bandeja img{width:64px;height:64px;object-fit:contain;background:#fff;border-radius:10px;border:3px solid transparent;flex:0 0 auto}.bandeja img.on{border-color:var(--marca)}
.st{font-size:13.5px;color:var(--texto2);margin:0 0 10px;min-height:1em}
.rc-l{display:grid;gap:8px}
.rc{display:grid;grid-template-columns:26px 28px 1fr 14px 1fr;gap:8px;align-items:center;background:#fff;border-radius:14px;padding:8px;box-shadow:var(--sombra);position:relative;touch-action:pan-y}
.rc .pos{width:26px;height:26px;border-radius:50%;background:var(--lav);color:var(--marca);font-weight:700;font-size:13px;display:grid;place-items:center}
.ret-b{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:#fff;border:2px solid #141C3A;border-radius:12px;padding:10px 12px;margin:0 0 12px;font:inherit;color:var(--texto);cursor:pointer}.ret-b b{font-size:14px}.ret-b small{font-size:13px;color:var(--texto2)}.ret-b:disabled{opacity:.7;cursor:default}
.mapa-r .n.ret{background:#fff!important;color:#141C3A!important;border:3px solid #141C3A!important;box-sizing:border-box}
.so-recorte .alca{display:none}.so-recorte .rc{grid-template-columns:26px 1fr 14px 1fr}
.aq{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--linha)}.aq:last-child{border-bottom:0}.aq .pos{font-weight:800;color:#141C3A}.aq b{display:block}.aq small{color:var(--texto2);font-size:13px}.aq .btn{min-height:44px;padding:0 12px;font-size:14px}
.chks{display:flex;flex-direction:column;gap:6px}.chk{display:flex;gap:10px;align-items:center;min-height:44px;border-radius:12px;padding:0 12px;background:#F1EEF8;color:inherit;text-decoration:none;font-weight:600}.chk span{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex-shrink:0}.chk.ok span{background:#0E6E6A;color:#fff}.chk.falta{background:#FFF1DC;color:#7A4A00}.chk.falta span{background:#fff;border:2px solid #C77700}
.rc .alca{font-size:22px;color:var(--texto2);text-align:center;cursor:grab;touch-action:none;padding:8px 0}
.rc figure{margin:0;aspect-ratio:4/3;border-radius:10px;background:repeating-conic-gradient(#EEE 0 25%,#fff 0 50%) 0 0/14px 14px;display:grid;place-items:center;overflow:hidden;position:relative;-webkit-user-select:none;user-select:none}
.rc figure img{max-width:92%;max-height:92%;object-fit:contain;pointer-events:none}.rc figure i{font-size:11.5px;color:var(--texto2);text-align:center;padding:4px;font-style:normal;background:rgba(255,255,255,.85);border-radius:8px}
.rc figure span.r{position:absolute;left:4px;top:4px;font-size:10.5px;font-weight:700;background:rgba(20,16,36,.7);color:#fff;border-radius:6px;padding:1px 6px}
.rc .seta{color:var(--texto2);text-align:center}
.rc .nm{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:0 4px}.rc .nm small{color:var(--texto2)}
.rc.ok .nm small{color:#0E6E6A;font-weight:600}
.rc-l{position:relative}
.rc.puxa{transition:none;z-index:3}.rc.volta{transition:transform .2s ease}
.rc-fundo{position:absolute;left:0;right:0;border-radius:14px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-weight:700;font-size:14px;color:#fff;z-index:1;pointer-events:none}
.rc-fundo.esq{background:#C62828;justify-content:flex-end}.rc-fundo.dir{background:#0E8A84;justify-content:flex-start}
.rc.arrasta{z-index:5;box-shadow:0 10px 30px rgba(28,22,53,.3);opacity:.95}
.rc.busy figure.dep::after{content:"recortando…";position:absolute;inset:0;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--marca)}
.mapa-r{height:300px;border-radius:14px;overflow:hidden;margin:0 0 12px;background:#E9E6F2}
.mapa-r,.mapa-r.leaflet-container{touch-action:pan-y!important}   /* mapa travado: o dedo rola a página, não o mapa (16/11) */
.mapa-r .leaflet-div-icon{background:transparent;border:0}
.mapa-r .n{width:26px;height:26px;border-radius:50%;background:var(--marca);color:#fff;font:700 12px/1 Rubik,system-ui,sans-serif;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mapa-r .b{width:16px;height:16px;border-radius:4px;background:#14B8B0;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mapa-leg{font-size:12.5px;color:var(--texto2);margin:-6px 0 10px}
.pronta{background:var(--teal2);color:#0E6E6A;border-radius:14px;padding:12px 14px;margin:0 0 12px;font-weight:600}
.pronta a{color:#0E6E6A}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=2147003129"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,eu,dados,estrelasHTML,estado,salvar,nav,topo,setorNome,nomeLoja,cliente,gravarCliente,menuLongo}=App;
  if(!await sessao())return;
  let D;try{D=await dados();}catch(e){$("#app").innerHTML=`${topo()}<section class="card"><h2>Rota ainda não preparada</h2><p>Nenhuma zona tem captação pronta. Peça ao administrador para rodar a varredura.</p></section>${rodape()}${nav("rota")}`;return;}
  const hoje=App.hojeISO();
  const dia=/^\d{4}-\d{2}-\d{2}$/.test(qs.get("d")||"")?qs.get("d"):hoje;
  const zonas=App.PLANO.filter(z=>D.zonas[z]);
  let R=JSON.parse(JSON.stringify(App.rotaDe(dia)||{tipo:"zona-familia",zona:zonas[0],familia:"alimentacao",slugs:[],etapa:1,criada:new Date().toISOString(),por:eu().nome}));
  let etapa=+qs.get("etapa")||R.etapa||1;
  const L$=s=>D.lojas.find(l=>l.slug===s);
  const salvaR=()=>App.gravarRota(dia,R);
  const fmt=iso=>{const x=App.dataCurta(iso);return `${x.sem} ${x.dia}/${x.mes}`;};
  const ir=(n,extra)=>{location.href=`?d=${dia}&etapa=${n}${extra||""}`;};
  const norm=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const logoDe=c=>(c.manual&&c.manual.tratado)||(c.logos&&c.logos[0]&&c.logos[0].src)||null;
  // ---- caminho: vizinho mais próximo a partir da base da zona; lojas sem coordenada vão para o fim
  const baseZ=()=>{const Z=D.zonas[R.zona]||D.zona||{};return Z.base?{lat:Z.base[0],lng:Z.base[1]}:null;};
  const km=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lng-b.lng)*111*Math.cos(a.lat*Math.PI/180));
  function caminho(slugs){const ls=slugs.map(L$).filter(Boolean);const resto=ls.filter(l=>l.lat&&l.lng),sem=ls.filter(l=>!(l.lat&&l.lng));let cur=baseZ()||resto[0];const out=[];
    while(resto.length){let k=0;for(let i=1;i<resto.length;i++)if(km(cur,resto[i])<km(cur,resto[k]))k=i;cur=resto.splice(k,1)[0];out.push(cur);}return out.concat(sem).map(l=>l.slug);}
  // ---- candidatas: tipo de rota + zona + família; fora: arquivadas, já visitadas e (marcadas) as que estão em outra rota aberta
  // retornos com data: a próxima volta marcada na saída da loja, no pós-venda ou no contato; vencem até 6 dias depois do dia da rota
  const limVolta=()=>App.maisDias(dia,6);
  const voltaDe=s=>{const e=estado();return ((e.voltas||{})[s]||{}).data||((e.atend||{})[s]||{}).volta||"";};
  const retornosVencendo=z=>D.lojas.filter(l=>(!z||l.zona===z)&&voltaDe(l.slug)&&voltaDe(l.slug)<=limVolta());
  function candidatas(){const e=estado();const arq=new Set(e.arquivadas||[]);const feitas=new Set(e.feitas||[]);
    const outras={};for(const [d,X] of Object.entries(e.rotas||{}))if(d!==dia&&X&&!X.encerrada)for(const s of X.slugs||[])if(!(X.res||{})[s])outras[s]=d;
    let L;
    if(R.tipo==="retorno"){const ret=new Set([...(e.retornos||[]),...retornosVencendo(null).map(l=>l.slug),...Object.entries(e.atend||{}).filter(([,a])=>a&&(a.res==="voltar"||a.res==="nao_estava")).map(([s])=>s)]);L=D.lojas.filter(l=>ret.has(l.slug)&&!arq.has(l.slug));}
    else{L=D.lojas.filter(l=>l.zona===R.zona&&l.estrelas>=3&&!arq.has(l.slug)&&!feitas.has(l.slug));if(R.tipo==="zona-familia")L=L.filter(l=>App.familiaDe(l.setor)===R.familia);}
    return L.sort((a,b)=>b.estrelas-a.estrelas||(a.dia||0)-(b.dia||0)||(a.ordem||0)-(b.ordem||0)).map(l=>({l,outra:outras[l.slug]||null}));}
  // ---- cabeçalho: dias com rota + escolher outro dia; etapas
  const AJ=["Escolha o tipo de rota, a zona e marque as lojas. O mapa mostra o melhor caminho.","Confira os logotipos. Toque nos errados; segure para pôr um à mão.","Peça o recorte de cada logotipo: antes e depois lado a lado.","Arrume a fila: arraste pelo ≡, tire lojas ou troque por outras perto.","Avise as lojas pelo WhatsApp que você vai passar.","Confira tudo e marque a rota como pronta."];
  let ROD="";
  function cabecalho(){const e=estado();const dias=Object.entries(e.rotas||{}).filter(([d,X])=>X&&(X.slugs||[]).length&&!X.encerrada).sort((a,b)=>a[0].localeCompare(b[0])).filter(([d,X])=>d>=hoje||(X.slugs||[]).some(s=>!(X.res||{})[s]));
    if(!dias.some(([d])=>d===dia))dias.push([dia,R]);dias.sort((a,b)=>a[0].localeCompare(b[0]));
    const feitas=[R.slugs.length>0,R.etapa>=3||!!R.pronta,!!R.recOk||!!R.pronta,!!R.filaOk||!!R.pronta,!!R.aqOk,!!R.pronta];
    const nAq=Object.keys(R.aq||{}).filter(s=>R.slugs.includes(s)).length;
    const faltas={0:"nenhuma loja marcada.",1:"logotipos não conferidos.",2:R.faltaRec?`${R.faltaRec} loja(s) sem recorte.`:"recorte não conferido.",3:"fila não conferida.",4:`${nAq} de ${R.slugs.length} loja(s) avisada(s).`};
    const B=App.barraEtapas({proc:"rota",atual:etapa-1,feitas,href:i=>`?d=${dia}&etapa=${i+1}`,titulo:dia===hoje?"Hoje":fmt(dia),sub:`${R.slugs.length} lojas`,faltas,seguir:etapa<6?{id:"peSeguir"}:false});
    ROD=B.rodape;
    return `${B.topo}<div class="dias-r">${dias.map(([d,X])=>`<a href="?d=${d}" class="${d===dia?"on":""}">${d===hoje?"Hoje":fmt(d)}<small>${(X.slugs||[]).length} lojas${X.pronta?" · pronta ✓":""}</small></a>`).join("")}<label>+ Outro dia<small>escolher a data</small><input type="date" id="outroDia" min="${hoje}"></label></div>
    ${B.titulo}<p class="sub">${AJ[etapa-1]}</p>`;}
  const rodape=()=>ROD;
  function ligarCab(){const ps=$("#peSeguir");if(ps)ps.onclick=ev=>{ev.preventDefault();const alvo=$("#seguir")||$("#aceitar")||$("#seguir3")||$("#seguir5");if(alvo&&alvo.disabled){alert("Marque ao menos uma loja para seguir.");return;}if(alvo)alvo.click();else ir(etapa+1);};const od=$("#outroDia");if(od)od.onchange=()=>{if(od.value)location.href=`?d=${od.value}`;};}

  // =============== 1 · LOJAS ===============
  function etapa1(){const C=candidatas();const sel=new Set(R.slugs);const naLista=new Set(C.map(x=>x.l.slug));const fora=R.slugs.filter(s=>!naLista.has(s)).map(L$).filter(Boolean);
    const linha=(l,outra)=>{return `<label><input type="checkbox" data-s="${esc(l.slug)}" ${sel.has(l.slug)?"checked":""}><span class="mi" data-mi="${esc(l.slug)}"><i>…</i></span><span><b>${esc(nomeLoja(l.nome))}</b><small>${esc(setorNome(l.setor))} · ${esc((l.endereco||"").split(" · ")[0])}</small></span><span style="text-align:right">${estrelasHTML(l.estrelas||0)}${outra?`<br><span class="tag">na rota de ${esc(fmt(outra))}</span>`:""}</span></label>`;};
    $("#app").innerHTML=`${topo()}${cabecalho()}
    <section class="card"><h2>Tipo de rota</h2>
      <div class="op">${Object.entries(App.TIPOS_ROTA).map(([k,t])=>`<button type="button" data-tipo="${k}" class="${R.tipo===k?"on":""}">${t}</button>`).join("")}</div>
      ${R.tipo!=="retorno"?`<label class="muted" style="font-size:13px">Zona</label><select class="campo" id="zona">${zonas.map(z=>`<option value="${z}" ${z===R.zona?"selected":""}>${esc(D.zonas[z].nome)} · ${D.lojas.filter(l=>l.zona===z&&l.estrelas>=3).length} lojas 3–5★</option>`).join("")}</select>`:`<p class="muted" style="margin:0">Lojas que pediram para voltar e as que não estavam quando o vendedor passou.</p>`}
      ${R.tipo==="zona-familia"?`<label class="muted" style="font-size:13px">Família</label><div class="op">${Object.entries(App.FAMILIAS).map(([k,f])=>`<button type="button" data-fam="${k}" class="${R.familia===k?"on":""}">${f.nome}</button>`).join("")}</div>`:""}
    </section>
    ${(()=>{if(R.tipo==="retorno")return "";const rv=retornosVencendo(R.zona);const fora2=rv.filter(l=>!R.slugs.includes(l.slug));if(!rv.length)return "";const MOT=s=>((estado().voltas||{})[s]||{}).motivo||"retorno";
      return `<button type="button" class="ret-b" id="incRet" ${fora2.length?"":"disabled"}><b>${rv.length} retorno(s) vencem nesta zona até ${limVolta().slice(8,10)}/${limVolta().slice(5,7)}</b><small>${rv.slice(0,4).map(l=>`${esc(nomeLoja(l.nome))} (${esc(MOT(l.slug))})`).join(" · ")}${rv.length>4?" …":""}. ${fora2.length?"Toque para incluir na rota.":"Já estão na rota."}</small></button>`;})()}
    <section class="card"><h2>Lojas da rota <small class="muted" style="font-weight:400;font-size:14px">· <b id="nSel">${R.slugs.length}</b> marcadas de ${C.length}</small></h2>
      <div class="mapa-r" id="mapaR"></div><p class="mapa-leg" id="mapaLeg"></p>
      <div class="linha-b"><button type="button" class="btn sec" id="m35">Marcar as 35 primeiras</button><button type="button" class="btn sec" id="limpa">Limpar</button></div>
      ${fora.length?`<p class="muted" style="margin:0 0 6px;font-size:13px">Adicionadas por fora do filtro</p><div class="cand" style="margin-bottom:10px">${fora.map(l=>linha(l,null)).join("")}</div>`:""}
      ${C.length?`<div class="cand">${C.map(x=>linha(x.l,x.outra)).join("")}</div>`:`<p class="muted">Nenhuma loja com esse filtro${R.tipo==="retorno"?" (ainda não há retornos)":""}.</p>`}
    </section>
    <section class="card"><h2>Adicionar outras lojas</h2><input class="campo" id="busca" placeholder="Nome da loja (qualquer zona)" autocomplete="off"><div class="cand" id="buscaRes"></div></section>
    <div class="acoes"><div class="w"><button class="btn" type="button" id="seguir" ${R.slugs.length?"":"disabled"}>Seguir: logotipos →</button></div></div>${rodape()}${nav("rota")}`;
    document.body.classList.add("com-acoes");ligarCab();
    // miniaturas (fichas já estão em memória)
    $$("[data-mi]").forEach(async m=>{const c=await cliente({slug:m.dataset.mi});const s=logoDe(c);m.innerHTML=s?`<img src="${esc(s)}" alt="" loading="lazy">`:"<i>sem<br>logo</i>";});
    const conta=()=>{$("#nSel").textContent=R.slugs.length;$("#seguir").disabled=!R.slugs.length;};
    // mapa: as marcadas aparecem numeradas na ordem do caminho, ligadas a partir da base; as outras candidatas são pontos cinza (toque marca/desmarca)
    let mapa=null,camada=null;
    function desenhaMapa(){const box=$("#mapaR");if(!box||typeof L==="undefined"){if(box)box.remove();return;}
      if(!mapa){mapa=L.map(box,{zoomControl:true,attributionControl:true,scrollWheelZoom:false,dragging:false,touchZoom:false,doubleClickZoom:false,boxZoom:false,keyboard:false,tap:false});L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(mapa);camada=L.layerGroup().addTo(mapa);}
      camada.clearLayers();const sel=new Set(R.slugs);const pts=[];const b=baseZ();
      const todas=[...C.map(x=>x.l),...fora];

    const reduz=src=>new Promise(res=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.naturalWidth,im.naturalHeight));if(k>=1&&src.length<2.5e6)return res(src);const cv=document.createElement("canvas");cv.width=Math.round(im.naturalWidth*k);cv.height=Math.round(im.naturalHeight*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/png"));};im.onerror=()=>res(src);im.src=src;});

      row.addEventListener("pointermove",ev=>{if(!ativo)return;const ddx=ev.clientX-x0,ddy=ev.clientY-y0;
        if(!decidiu){if(Math.abs(ddy)>10&&Math.abs(ddy)>Math.abs(ddx)){ativo=false;return;}if(Math.abs(ddx)<12)return;decidiu=true;try{row.setPointerCapture(ev.pointerId);}catch(e){}row.classList.add("puxa");
          fundo=document.createElement("div");fundo.className="rc-fundo";fundo.style.top=row.offsetTop+"px";fundo.style.height=row.offsetHeight+"px";row.parentNode.insertBefore(fundo,row);}
        dx=Math.max(-160,Math.min(160,ddx));row.style.transform=`translateX(${dx}px)`;fundo.className="rc-fundo "+(dx<0?"esq":"dir");fundo.textContent=dx<0?"Tirar da rota ✕":"📍 Lojas perto";});
      const fim=async()=>{if(!ativo)return;ativo=false;if(!decidiu)return;row.classList.remove("puxa");row.classList.add("volta");row.style.transform="";setTimeout(()=>{row.classList.remove("volta");if(fundo)fundo.remove();fundo=null;},220);
        // um toque/segurar no logotipo não vira puxada
        if(dx<=-90)await tirar(s);else if(dx>=90)await perto(s);dx=0;};
      row.addEventListener("pointerup",fim);row.addEventListener("pointercancel",fim);}
    function ligarLinha(row){const s=row.dataset.s;ligarPuxar(row);
      row.querySelectorAll("[data-logo]").forEach(f=>{let t=null;f.addEventListener("pointerdown",ev=>{if(ev.button===2)return;t=setTimeout(()=>{t=null;if(row.classList.contains("puxa"))return;if(navigator.vibrate)navigator.vibrate(12);menu(s);},480);});f.addEventListener("pointermove",ev=>{if(row.classList.contains("puxa"))clearTimeout(t);});["pointerup","pointercancel","pointerleave"].forEach(k=>f.addEventListener(k,()=>clearTimeout(t)));f.addEventListener("contextmenu",ev=>{ev.preventDefault();clearTimeout(t);menu(s);});});
      // arrastar pelo ≡: a linha segue o dedo e troca de lugar com as vizinhas
      const al=row.querySelector(".alca");al.addEventListener("pointerdown",ev=>{ev.preventDefault();try{al.setPointerCapture(ev.pointerId);}catch(e){}const lista=$("#lista");row.classList.add("arrasta");let y0=ev.clientY;
        const mv=e=>{const dy=e.clientY-y0;row.style.transform=`translateY(${dy}px)`;const irmaos=[...lista.children].filter(x=>x!==row);const meio=row.getBoundingClientRect().top+row.offsetHeight/2;
          for(const x of irmaos){const r=x.getBoundingClientRect();if(meio<r.top+r.height/2&&x.compareDocumentPosition(row)&Node.DOCUMENT_POSITION_FOLLOWING){const antes=row.getBoundingClientRect().top;lista.insertBefore(row,x);y0+=row.getBoundingClientRect().top-antes;row.style.transform=`translateY(${e.clientY-y0}px)`;break;}
            if(meio>r.top+r.height/2&&x.compareDocumentPosition(row)&Node.DOCUMENT_POSITION_PRECEDING&&x===row.nextElementSibling){const antes=row.getBoundingClientRect().top;lista.insertBefore(row,x.nextSibling);y0+=row.getBoundingClientRect().top-antes;row.style.transform=`translateY(${e.clientY-y0}px)`;break;}}};
        const up=async()=>{al.removeEventListener("pointermove",mv);al.removeEventListener("pointerup",up);al.removeEventListener("pointercancel",up);row.classList.remove("arrasta");row.style.transform="";
          R.slugs=[...lista.children].map(x=>x.dataset.s);[...lista.children].forEach((x,i)=>x.querySelector(".pos").textContent=i+1);await salvaR();};
        al.addEventListener("pointermove",mv);al.addEventListener("pointerup",up);al.addEventListener("pointercancel",up);});}
    function ligar(){$$(".rc").forEach(ligarLinha);
      $("#seguir3").onclick=async()=>{if(FILA){R.filaOk=true;R.etapa=Math.max(R.etapa||1,5);}else{R.faltaRec=lojas().filter(l=>!(C[l.slug]&&C[l.slug].manual&&C[l.slug].manual.editado)).length;R.recOk=!R.faltaRec;R.etapa=Math.max(R.etapa||1,4);}await salvaR();ir(FILA?5:4);};
      const cm=$("#caminho");if(cm)cm.onclick=async()=>{const Z=D.zonas[R.zona]||D.zona;const dist=(a,b)=>Math.hypot((a.lat-b.lat)*111,(a.lng-b.lng)*111*Math.cos(a.lat*Math.PI/180));let cur=Z&&Z.base?{lat:Z.base[0],lng:Z.base[1]}:null;
        const resto=lojas().filter(l=>l.lat&&l.lng),sem=lojas().filter(l=>!(l.lat&&l.lng));const out=[];if(!cur&&resto.length)cur=resto[0];
        while(resto.length){let k=0;for(let i=1;i<resto.length;i++)if(dist(cur,resto[i])<dist(cur,resto[k]))k=i;cur=resto.splice(k,1)[0];out.push(cur);}R.slugs=out.concat(sem).map(l=>l.slug);await salvaR();desenha();};
}
    desenha();}

  // =============== 5 · AQUECIMENTO ===============
  async function etapa5(){const lojas=R.slugs.map(L$).filter(Boolean);R.aq=R.aq||{};
    const padrao=`Olá! Aqui é ${eu().nome} da GênIO. Vou passar aí na loja ${dia===hoje?"hoje":"no dia "+dia.slice(8,10)+"/"+dia.slice(5,7)} para mostrar como fica a marca de vocês em capacho, uniforme e outros produtos. Posso passar?`;
    const msg=()=>R.aqMsg||padrao;
    const tel=l=>String(l.tel||"").replace(/\D/g,"");
    function desenha(){const n=lojas.filter(l=>R.aq[l.slug]).length;
      $("#app").innerHTML=`${topo()}${cabecalho()}
      <section class="card"><h2>Mensagem <small class="muted" style="font-weight:400;font-size:14px">· ${n} de ${lojas.length} avisadas</small></h2>
        <textarea class="campo" id="aqMsg" rows="4" style="width:100%;box-sizing:border-box">${esc(msg())}</textarea>
        <p class="muted" style="margin:6px 0 0;font-size:13px">O nome da loja entra no começo de cada mensagem. Toque em WhatsApp em cada loja; depois de enviar, ela fica marcada.</p></section>
      <section class="card" style="padding:6px 14px">${lojas.map((l,i)=>`<div class="aq" data-s="${esc(l.slug)}"><span class="pos">${i+1}</span><span class="nm"><b>${esc(nomeLoja(l.nome))}</b><small>${tel(l)?App.telFmt(l.tel):"sem telefone"}${R.aq[l.slug]?" · ✓ avisada":""}</small></span>
        ${tel(l)?`<a class="btn ${R.aq[l.slug]?"sec":""}" target="_blank" rel="noopener" data-wa="${esc(l.slug)}" href="https://wa.me/55${tel(l).replace(/^55(?=\d{10,11}$)/,"")}?text=${encodeURIComponent(nomeLoja(l.nome)+", "+msg().replace(/^Olá!\s*/,"olá! "))}">${App.nb(`5.${i+1}`,"WhatsApp")}</a>`:`<button type="button" class="btn sec" data-pula="${esc(l.slug)}">${R.aq[l.slug]?"✓":"Pular"}</button>`}</div>`).join("")}</section>
      <div class="acoes"><div class="w"><button class="btn" type="button" id="seguir5">Seguir</button></div></div>${rodape()}${nav("rota")}`;
      ligarCab();
      const t=$("#aqMsg");t.onchange=()=>{R.aqMsg=t.value.trim()===padrao?"":t.value.trim();salvaR();desenha();};
      $$("[data-wa]").forEach(a=>a.addEventListener("click",()=>{R.aq[a.dataset.wa]=new Date().toISOString();salvaR();setTimeout(desenha,400);}));
      $$("[data-pula]").forEach(b=>b.onclick=()=>{const s2=b.dataset.pula;if(R.aq[s2])delete R.aq[s2];else R.aq[s2]="pulada";salvaR();desenha();});
      $("#seguir5").onclick=async()=>{R.aqOk=lojas.every(l=>R.aq[l.slug]);R.etapa=Math.max(R.etapa||1,6);await salvaR();ir(6);};}
    desenha();}
  // =============== 6 · PRONTA ===============
  async function etapa6(){const lojas=R.slugs.map(L$).filter(Boolean);const C={};for(const l of lojas)C[l.slug]=await cliente(l);
    const nLogo=lojas.filter(l=>logoDe(C[l.slug])).length,nRec=lojas.filter(l=>C[l.slug].manual&&C[l.slug].manual.editado).length,nAq=lojas.filter(l=>(R.aq||{})[l.slug]).length;
    const it=(ok,t,et)=>`<a class="chk ${ok?"ok":"falta"}" href="?d=${dia}&etapa=${et}"><span>${ok?"✓":"!"}</span>${t}</a>`;
    $("#app").innerHTML=`${topo()}${cabecalho()}
      ${R.pronta?`<div class="pronta">✓ Rota pronta · ${lojas.length} lojas.</div>`:""}
      <section class="card"><h2>Resumo</h2><div class="chks">
        ${it(lojas.length>0,`${lojas.length} loja(s) na rota`,1)}${it(nLogo===lojas.length,`${nLogo} de ${lojas.length} com logotipo`,2)}${it(nRec===lojas.length,`${nRec} de ${lojas.length} recortados`,3)}${it(!!R.filaOk,R.filaOk?"Fila conferida":"Fila não conferida",4)}${it(nAq===lojas.length,`${nAq} de ${lojas.length} avisadas`,5)}</div></section>
      <div class="linha-b" style="flex-direction:column;gap:8px">${R.pronta?`<a class="btn" href="play.html" style="min-height:56px;font-size:17px">${App.nb("6.1","▶ Começar a rota")}</a>`:`<button class="btn" type="button" id="pronta" style="min-height:56px;font-size:17px">${App.nb("6.1","✓ Marcar a rota como pronta")}</button>`}</div>
      ${rodape()}${nav("rota")}`;
    ligarCab();
    const b=$("#pronta");if(b)b.onclick=async()=>{const falta=lojas.length-nRec;if(falta&&!confirm(`${falta} loja(s) sem recorte. Marcar a rota como pronta mesmo assim?`))return;R.pronta=true;R.prontaEm=new Date().toISOString();R.res=R.res||{};R.etapa=6;await salvaR();etapa6();};}

  if(etapa>=2&&!R.slugs.length)etapa=1;
  if(etapa===2)await etapa2();else if(etapa===3)await etapa3("recorte");else if(etapa===4)await etapa3("fila");else if(etapa===5)await etapa5();else if(etapa===6)await etapa6();else etapa1();
})();
</script>
