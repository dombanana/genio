<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Edição do produto</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=2c011855f7">
<style>
body.com-acoes{padding-bottom:calc(250px + env(safe-area-inset-bottom,0))}
.prancheta{position:relative;background:repeating-conic-gradient(#e9e5f3 0 25%,#fff 0 50%) 0 0/18px 18px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;height:min(72vw,460px);margin:0 0 8px}
.prancheta canvas{position:absolute;left:0;top:0;transform-origin:0 0;box-shadow:0 2px 14px rgba(28,22,53,.18)}
.medida-ed{display:flex;justify-content:space-between;gap:8px;color:var(--texto2);font-size:13px;margin:0 0 10px;flex-wrap:wrap}
.ferr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 10px}
.ferr button{border:0;background:#fff;border-radius:12px;min-height:58px;font:inherit;font-size:12px;color:var(--texto);display:grid;place-items:center;gap:2px;padding:6px 2px}
.ferr button .ic{font-size:20px}.ferr button.on{background:var(--navy);color:#fff}
.painel{background:#fff;border-radius:16px;padding:12px 14px;margin:0 0 10px}
.painel h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linha label{font-size:13px;color:var(--texto2)}
.linha input[type=range]{flex:1;min-width:100px}
.linha select,.linha textarea{font:inherit;font-size:15px;border:1.5px solid var(--linha);border-radius:10px;padding:8px 10px;background:#fff;min-width:0}
.paleta{display:flex;gap:6px;flex-wrap:wrap}
.paleta button{width:34px;height:34px;border-radius:10px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12);padding:0}
.paleta button.on{outline:3px solid var(--marca)}
.paleta button.mais{background:#fff;font-size:16px;font-weight:700;color:var(--marca);border:1.5px dashed var(--marca)}
.lista{display:flex;flex-direction:column;gap:6px}
.lista .it{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:var(--lav);border-radius:10px;padding:6px 10px;font-size:14px}
.lista .it.on{outline:2px solid var(--marca)}.lista .it .ic{text-align:center}
.lista .it button{border:0;background:transparent;font-size:16px;color:var(--texto2);padding:4px 6px}
.btn.mini{min-height:36px;padding:0 12px;font-size:13px;width:auto;flex:0 0 auto}
.campos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.campos label{display:block;font-size:12px;color:var(--texto2)}
.campos input{width:100%;font:inherit;font-size:14px;border:1.5px solid var(--linha);border-radius:10px;padding:8px 10px;background:#fff;box-sizing:border-box}
.ia textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;border:1.5px solid var(--linha);border-radius:10px;padding:8px 10px;min-height:64px}
.acs{display:flex;gap:8px;flex-wrap:wrap}.acs button{border:0;background:var(--lav);color:var(--marca);border-radius:12px;min-height:42px;padding:0 12px;font:inherit;font-weight:700;font-size:14px}
</style>
<script>window.giroLivre=false;</script></head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=2c011855f7"></script>
<script src="qr.js?v=2c011855f7"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,ficha,nav,topo,voltar,nomeLoja,telFmt,cliente,gravarCliente,definirCliente,setorNome}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const pid=qs.get("p")||"capacho";const pb=App.baseId(pid);const FACE=qs.get("face")==="verso"?"verso":"frente";const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("rota")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);let c=await App.garantirCamadas(l);const man=c.manual||null;
  // gabarito da gráfica: área total = produto + sangria; a guia mostra corte (vermelho) e segurança (verde-água)
  const G=await (await fetch("gabaritos.json?v=2c011855f7")).json();const P={...(G.produtos[pb]||G.produtos.capacho),...(((c&&c.formatos)||{})[pid]||((c&&c.formatos)||{})[pb]||{})};
  const sang=P.sangria_mm!=null?P.sangria_mm:G.sangria_mm,seg=P.seguranca_mm!=null?P.seguranca_mm:G.seguranca_mm;
  const PX=Math.min(100,Math.floor(3000/Math.max(P.w_cm+sang/5,P.h_cm+sang/5)));  // px por cm (teto 3000 px)
  const W=Math.round((P.w_cm+2*sang/10)*PX),H=Math.round((P.h_cm+2*sang/10)*PX),B=Math.round(sang/10*PX),S=Math.round(seg/10*PX);
  const PALETAS={capacho:[["#2B2B2D","Preto"],["#9A9B9D","Cinza"],["#1F3A5F","Azul marinho"],["#7A1E1E","Vinho"],["#2E5E3A","Verde"],["#EE6A1D","Laranja"],["#C8A95B","Bege"],["#5B3A29","Marrom"]],
    rigido:[["#F4F1EA","Branco"],["#141C3A","Navy"],["#2B2B2D","Preto"],["#B8B8B8","Alumínio"],["#D4AF37","Dourado"]],
    vinil:[["#2B2B2D","Preto"],["#FFFFFF","Branco"],["#C62828","Vermelho"],["#1565C0","Azul"],["#2E7D32","Verde"],["#F9A825","Amarelo"],["#6A1B9A","Roxo"],["#FF6F00","Laranja"],["#B8B8B8","Prata"],["#D4AF37","Dourado"]],
    tecido:[["#F4F1EA","Branco"],["#2B2B2D","Preto"],["#1F3A5F","Marinho"],["#9A9B9D","Cinza"],["#C62828","Vermelho"],["#2E7D32","Verde"],["#14B8B0","Verde-água"],["#EDE6D6","Cru"]],
    papel:[["#FFFFFF","Branco"],["#EDE6D6","Kraft claro"],["#141C3A","Navy"],["#2B2B2D","Preto"]],
    lona:[["#FFFFFF","Branco"],["#141C3A","Navy"],["#2B2B2D","Preto"],["#F4F1EA","Creme"]],
    carimbo:[["#2B2B2D","Preto"],["#1565C0","Azul"],["#C62828","Vermelho"]]};
  const PAL=PALETAS[P.superficie]||PALETAS.vinil;const semFundo=!!P.sem_fundo||P.superficie==="carimbo";
  // onde a cor do produto incide de verdade (decisão do dono, 10/11): tinge a peça (máscara/material), imprime a folha inteira, ou não existe
  const COR_TINGE=new Set(["capacho","placas","windbanner","uniformes","camiseta","bone","avental"]);
  const COR_IMPRESSA=new Set(["impressos","panfleto","banners","faixa","folheto"]);
  const corProduto=COR_TINGE.has(pb)?"tinge":COR_IMPRESSA.has(pb)?"imprime":"nenhuma";
  const coresMarca=(man&&man.cores)||[];
  const cad=await ficha(slug);const L=(cad&&cad.lacunas)||{};
  const IMGS={};const img=src=>new Promise(res=>{if(IMGS[src])return res(IMGS[src]);const i=new Image();i.crossOrigin="anonymous";i.onload=()=>{IMGS[src]=i;res(i);};i.onerror=()=>res(null);i.src=src;});
  // ---- documento da arte
  function elementosMarca(){const el=[];if(!man)return el;const cams=(man.camadas||[]).filter(x=>x.png);const lw=man.largura||1,lh=man.altura||1;
    const aw=W-2*(B+S),ah=H-2*(B+S);const esc_=Math.min(aw*0.6/lw,ah*(P.ancora==="topo"?0.3:0.6)/lh);const gw=lw*esc_,gh=lh*esc_;const gx=(W-gw)/2,gy=P.ancora==="topo"?B+S+ah*0.06:(H-gh)/2;
    if(cams.length>1){cams.forEach((cm,i)=>el.push({tipo:"camada",id:"c"+i,nome:cm.nome||("Camada "+(i+1)),src:cm.png,cor:cm.cor||null,corOriginal:cm.cor||null,usarCor:false,x:gx,y:gy,w:gw,h:gh,borda:0,bordaCor:"#FFFFFF",grupo:"logo"}));}
    else{const src=(cams[0]&&cams[0].png)||man.tratado;if(src)el.push({tipo:"camada",id:"logo",nome:"Logotipo",src,cor:null,usarCor:false,x:gx,y:gy,w:gw,h:gh,borda:0,bordaCor:"#FFFFFF",grupo:"logo"});}
    return el;}
  function novoDoc(){const d={fundo:semFundo?null:PAL[0][0],fundoImg:null,el:elementosMarca(),campos:null};
    if(P.cartao){d.campos={nome,cargo:"",tel:l.tel?telFmt(l.tel):"",email:"",endereco:l.endereco||"",site:(L.site&&L.site.estado==="encontrado"?L.site.valor:"")||""};
      d.el.forEach(e=>{e.x=B+S+W*0.03;e.y=H*0.2;const r=e.w/e.h;e.h=H*0.6;e.w=e.h*r;if(e.w>W*0.36){e.w=W*0.36;e.h=e.w/r;}});
      d.el.push({tipo:"campos",id:"campos",nome:"Dados do cartão",x:W*0.46,y:H*0.16,w:W*0.46,h:H*0.6,cor:"#1C1635",tam:Math.round(H*0.075),fonte:"Rubik, system-ui, sans-serif"});
      d.el.push({tipo:"qr",id:"qr",nome:"QR Code (genérico)",x:W-B-S-H*0.3,y:H-B-S-H*0.3,w:H*0.3,h:H*0.3,cor:"#1C1635"});}
    return d;}
  const arteTopo=(c.artes||{})[pid]||null;const arteAnt=FACE==="verso"?(arteTopo&&arteTopo.verso)||null:arteTopo;
  const DUAS=!!P.faces&&P.faces>1;
  const CARIMBO=pb==="carimbo";
  let doc=(arteAnt&&arteAnt.doc&&!(CARIMBO&&!arteAnt.soTexto))?JSON.parse(JSON.stringify(arteAnt.doc)):(CARIMBO?(await App.artePadrao("carimbo",c,l)).doc:(DUAS&&man&&man.tratado?await (async()=>{const a=await App.artePadrao(pid,c,l);return a?(FACE==="verso"?a.verso.doc:a.doc):novoDoc();})():novoDoc()));await App.assarRecortes(doc);
  // cor da peça escolhida no cartão (uniformes) ou vinda da marca: o editor abre com ela
  if(arteAnt&&arteAnt.material&&!doc.fundo&&P.superficie==="tecido")doc.fundo=arteAnt.material;
  let sel=null,cv,cx,guia=true,z=1,px=0,py=0,borracha=false,pincel=0,desfazer=[],guiaCentro=null;
  const luz=h=>{if(!h)return 255;const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);return 0.299*r+0.587*g+0.114*b;};
  const corTexto=()=>luz(doc.fundo)<128?"#FFFFFF":"#1C1635";
  function render(){
    $("#app").innerHTML=`${topo()}${voltar(`produtos.html?l=${encodeURIComponent(slug)}`,"Produtos")}
    <h1 style="font-size:24px;margin-bottom:2px">${esc(P.nome)}${DUAS?` <span class="sub" style="font-weight:400">· ${FACE}</span>`:""}</h1><p class="sub">${esc(nome)}${CARIMBO?' · só texto, CNPJ em negrito':''}</p>
    ${DUAS?`<div class="faces" style="display:flex;gap:8px;margin:0 0 10px"><a class="btn sec sm ${FACE==="frente"?"on":""}" style="flex:1;min-height:38px;text-decoration:none" href="editor.html?l=${encodeURIComponent(slug)}&p=${pid}">Frente</a><a class="btn sec sm ${FACE==="verso"?"on":""}" style="flex:1;min-height:38px;text-decoration:none" href="editor.html?l=${encodeURIComponent(slug)}&p=${pid}&face=verso">Verso</a></div>`:""}
    <div class="prancheta" id="pr"><canvas id="cv"></canvas><button type="button" class="trava-giro ${giroLivre?"livre":""}" id="travaGiro">${giroLivre?"⟳ Giro livre":"🔒 Giro travado"}</button></div>
    <div class="medida-ed"><span>${P.w_cm} × ${P.h_cm} cm${sang?` · sangria ${sang} mm`:""} · segurança ${seg} mm${P.a_confirmar?" · <b style='color:#B7791F'>medida a confirmar</b>":""}</span><span id="selnome">${sel?esc(sel.nome||sel.tipo):"toque num elemento · pinça amplia"}</span></div>${P.fonte?`<details class="forn" style="margin:2px 0 8px;font-size:13px;color:var(--texto2)"><summary>${esc(P.fonte)}</summary>${Object.entries(P.opcoes||{}).map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(v)}</div>`).join("")}</details>`:""}
    <div class="ferr" style="grid-template-columns:repeat(8,1fr)">${[["ret","▭","Retângulo"],["qua","◻","Quadrado"],["tri","△","Triângulo"],["cir","○","Círculo"],["seta","➜","Seta"],["txt","T","Texto"]].concat(CARIMBO?[]:[["logo","✦","Marca"]]).map(([id,ic,n])=>`<button type="button" data-add="${id}"><span class="ic">${ic}</span>${n}</button>`).join("")}<button type="button" id="ferrBorracha" class="${borracha?"on":""}"><span class="ic">🧽</span>Borracha</button></div>
    ${borracha?`<div class="painel"><div class="linha"><label>Borracha${sel&&(sel.tipo==="camada"||sel.tipo==="imagem")?` em <b>${esc(sel.nome)}</b>`:" · toque numa camada do logotipo"}</label><input type="range" id="pincel" min="1" max="12" value="${pincel||4}"><button type="button" class="btn sec mini" id="desfazerB" ${desfazer.length?"":"disabled"}>↶ Desfazer</button></div><small class="muted">Arraste sobre a prancheta para apagar partes da camada selecionada.</small></div>`:""}
    <div class="painel"><h3>${corProduto==="tinge"?"Cor da peça":corProduto==="imprime"?"Cor do fundo impresso":"Material"} <small class="muted" style="font-weight:400">${corProduto==="tinge"?"· pinta só a peça na foto":corProduto==="imprime"?"· imprime a folha inteira":"· a cor é do próprio material; só a arte tem cor"}</small><button type="button" class="btn sec mini" id="guia">${guia?"Ocultar guia":"Mostrar guia"}</button></h3>
      <div class="paleta" id="palFundo" ${corProduto==="nenhuma"?'hidden':""}>${semFundo?'<button type="button" data-c="" class="'+(!doc.fundo?"on":"")+'" style="background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px" title="sem fundo"></button>':""}${PAL.map(([h,n])=>`<button type="button" data-c="${h}" class="${doc.fundo===h?"on":""}" style="background:${h}" title="${n}"></button>`).join("")}${coresMarca.map(x=>`<button type="button" data-c="${x.hex}" class="${doc.fundo===x.hex?"on":""}" style="background:${x.hex}" title="${esc(x.nome||"")} (marca)"></button>`).join("")}<button type="button" class="mais" id="fundoMais">+</button></div></div>
    ${P.ia?`<div class="painel ia"><h3>Fundo com IA <small class="muted" style="font-weight:400">· só a composição; marca e textos ficam por cima</small></h3><textarea id="prompt">${esc(doc.prompt||`Fundo para ${P.nome.toLowerCase()} de ${nome} (${setorNome(l.setor).toLowerCase()}), elegante, cores ${coresMarca.slice(0,3).map(x=>x.hex).join(", ")||"neutras"}, sem texto, sem logotipo, espaço limpo para a marca.`)}</textarea><div class="acs" style="margin-top:8px"><button type="button" id="gerar">✨ Gerar fundo</button>${doc.fundoImg?'<button type="button" id="tirarIA">Tirar fundo IA</button>':""}<span class="muted" id="iaSt" style="font-size:13px;align-self:center"></span></div></div>`:""}
    <div class="painel" id="props"></div>
    <div class="painel"><h3>Elementos <small class="muted" style="font-weight:400">· o último fica por cima</small></h3><div class="lista" id="lista"></div></div>
    <div class="acoes"><div class="w"><a class="btn sec" href="produtos.html?l=${encodeURIComponent(slug)}">← Produtos</a><button class="btn" id="salvar" type="button">Salvar arte →</button></div></div>
    ${nav("rota")}`;document.body.classList.add("com-acoes");
    cv=$("#cv");cx=cv.getContext("2d");cv.width=W;cv.height=H;encaixe();ligar();renderLista();renderProps();desenhar();
  }
  function encaixe(){const pr=$("#pr");const pw=pr.clientWidth,ph=pr.clientHeight;const s=Math.min((pw-16)/W,(ph-16)/H)*z;cv.style.width=W+"px";cv.style.height=H+"px";cv.style.transform=`translate(${px+(pw-W*s)/2}px,${py+(ph-H*s)/2}px) scale(${s})`;}
  function tintar(im,cor,w,h){const c2=document.createElement("canvas");c2.width=Math.max(1,Math.round(w));c2.height=Math.max(1,Math.round(h));const g=c2.getContext("2d");g.drawImage(im,0,0,c2.width,c2.height);g.globalCompositeOperation="source-in";g.fillStyle=cor;g.fillRect(0,0,c2.width,c2.height);return c2;}
  function qrGenerico(g,x,y,s,cor){const n=21,m=s/n;g.fillStyle=cor;let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280;};
    const finder=(fx,fy)=>{g.fillStyle=cor;g.fillRect(x+fx*m,y+fy*m,7*m,7*m);g.fillStyle="#fff";g.fillRect(x+(fx+1)*m,y+(fy+1)*m,5*m,5*m);g.fillStyle=cor;g.fillRect(x+(fx+2)*m,y+(fy+2)*m,3*m,3*m);};
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){const inF=(i<8&&j<8)||(i<8&&j>=n-8)||(i>=n-8&&j<8);if(!inF&&rnd()>0.55)g.fillRect(x+j*m,y+i*m,m,m);}
    finder(0,0);finder(n-7,0);finder(0,n-7);}
  function desenharGuia(g){if(B){g.fillStyle="rgba(220,40,40,.16)";g.fillRect(0,0,W,B);g.fillRect(0,H-B,W,B);g.fillRect(0,0,B,H);g.fillRect(W-B,0,B,H);g.strokeStyle="#DC2828";g.lineWidth=Math.max(2,W/600);g.strokeRect(B,B,W-2*B,H-2*B);}
    g.setLineDash([W/80,W/120]);g.strokeStyle="#14B8B0";g.lineWidth=Math.max(2,W/700);g.strokeRect(B+S,B+S,W-2*(B+S),H-2*(B+S));g.setLineDash([]);
    if(P.rodape_oculto_cm){g.fillStyle="rgba(20,28,58,.22)";g.fillRect(0,H-B-P.rodape_oculto_cm*PX,W,P.rodape_oculto_cm*PX);}
    g.font=`${Math.max(12,W/60)}px sans-serif`;if(B){g.fillStyle="#DC2828";g.fillText("corte",B+6,B+Math.max(12,W/60)+2);}g.fillStyle="#14B8B0";g.fillText("segurança",B+S+6,B+S+Math.max(12,W/60)*2+6);}
  async function desenhar(comGuia=guia,comFundo=true,comSel=true){
    cx.clearRect(0,0,W,H);if(comFundo&&doc.fundo){cx.fillStyle=doc.fundo;cx.fillRect(0,0,W,H);}
    if(comFundo&&doc.fundoImg){const im=await img(doc.fundoImg);if(im){const s=Math.max(W/im.naturalWidth,H/im.naturalHeight);cx.drawImage(im,(W-im.naturalWidth*s)/2,(H-im.naturalHeight*s)/2,im.naturalWidth*s,im.naturalHeight*s);}}
    for(const e of doc.el){if(!comFundo&&e.sem)continue;  // superfície neutra do kit (placa, faixa…) não vai para a arte aplicada na foto
      cx.save();if(e.rot){const cxm=e.x+e.w/2,cym=e.y+e.h/2;cx.translate(cxm,cym);cx.rotate(e.rot*Math.PI/180);cx.translate(-cxm,-cym);}
      if(e.tipo==="camada"||e.tipo==="imagem"){const im=e.oculta?null:await img(e.src);if(im){
          if(e.borda>0){const t=tintar(im,e.bordaCor||"#fff",e.w,e.h);const b=e.borda;for(let a=0;a<360;a+=30){cx.drawImage(t,e.x+Math.cos(a*Math.PI/180)*b,e.y+Math.sin(a*Math.PI/180)*b,e.w,e.h);}}
          if(e.usarCor&&e.cor)cx.drawImage(tintar(im,e.cor,e.w,e.h),e.x,e.y,e.w,e.h);else cx.drawImage(im,e.x,e.y,e.w,e.h);}}
      else if(e.tipo==="forma"){cx.fillStyle=e.cor;cx.strokeStyle=e.bordaCor||"#000";cx.lineWidth=e.borda||0;cx.beginPath();
        if(e.forma==="cir"){cx.ellipse(e.x+e.w/2,e.y+e.h/2,e.w/2,e.h/2,0,0,Math.PI*2);}else if(e.forma==="tri"){cx.moveTo(e.x+e.w/2,e.y);cx.lineTo(e.x+e.w,e.y+e.h);cx.lineTo(e.x,e.y+e.h);cx.closePath();}else if(e.raio>0&&cx.roundRect){cx.roundRect(e.x,e.y,e.w,e.h,e.raio);}else{cx.rect(e.x,e.y,e.w,e.h);}

      // tocar fora não desmarca na hora (o segundo dedo da pinça costuma cair fora do item); desmarca só se for um toque simples
      if(!hit&&sel){tocouVazio={x:ev.clientX,y:ev.clientY};pan={x:ev.clientX,y:ev.clientY,px,py};return;}
      if(hit!==sel){sel=hit||null;renderLista();renderProps();$("#selnome").textContent=sel?(sel.nome||sel.tipo):"toque num elemento · pinça amplia";}
      if(sel)drag={modo:"mov",p,x:sel.x,y:sel.y,grupo:sel.grupo==="logo"?doc.el.filter(e=>e.grupo==="logo").map(e=>({e,x:e.x,y:e.y})):null};else pan={x:ev.clientX,y:ev.clientY,px,py};desenhar();});
    pr.addEventListener("pointermove",ev=>{if(!ptrs.has(ev.pointerId))return;ptrs.set(ev.pointerId,ev);
      if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);const ang=Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX);
        if(pinch.el&&sel){const f=giroLivre?1:d/pinch.d;let dr=giroLivre?(ang-pinch.ang)*180/Math.PI:0;if(Math.abs(dr)<2)dr=0;const snap=r=>{const n=Math.round(r/90)*90;return Math.abs(r-n)<3?n:r;};const E=pinch.el;
          if(E.grupo){const x0=Math.min(...E.grupo.map(g=>g.x)),y0=Math.min(...E.grupo.map(g=>g.y)),x1=Math.max(...E.grupo.map(g=>g.x+g.w)),y1=Math.max(...E.grupo.map(g=>g.y+g.h));const cxm=(x0+x1)/2,cym=(y0+y1)/2;E.grupo.forEach(g=>{g.e.w=g.w*f;g.e.h=g.h*f;g.e.x=cxm+(g.x+g.w/2-cxm)*f-g.e.w/2;g.e.y=cym+(g.y+g.h/2-cym)*f-g.e.h/2;g.e.rot=dr?snap(g.rot+dr):g.rot;});}
          else{const cxm=E.x+E.w/2,cym=E.y+E.h/2;if(sel.tipo==="texto"||sel.tipo==="campos"||sel.tipo==="lista"||sel.tipo==="carimbo"){sel.tam=Math.max(6,Math.round(E.tam*f));sel.w=E.w*f;}else{sel.w=E.w*f;sel.h=E.h*f;}sel.x=cxm-sel.w/2;sel.y=cym-sel.h/2;sel.rot=dr?snap(E.rot+dr):E.rot;}
          $("#selnome").textContent=`${sel.nome||sel.tipo} · ${Math.round(sel.rot||0)}°`;desenhar();return;}
        z=Math.min(6,Math.max(1,pinch.z*d/pinch.d));const mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;px=pinch.px+(mx-pinch.cx);py=pinch.py+(my-pinch.cy);encaixe();return;}
      if(pan){px=pan.px+(ev.clientX-pan.x);py=pan.py+(ev.clientY-pan.y);encaixe();return;}
      if(!drag||!sel)return;const p=pos(ev);if(drag.modo==="apaga"){apagar(p);return;}const dx=p.x-drag.p.x,dy=p.y-drag.p.y;
      if(drag.modo==="mov"){if(drag.grupo){drag.grupo.forEach(g=>{g.e.x=g.x+dx;g.e.y=g.y+dy;});}else{sel.x=drag.x+dx;sel.y=drag.y+dy;}
        // encaixe no centro: perto do meio, cola e mostra as guias
        const lim=W/60;const G=drag.grupo?drag.grupo.map(g=>g.e):[sel];const x0=Math.min(...G.map(e=>e.x)),y0=Math.min(...G.map(e=>e.y)),x1=Math.max(...G.map(e=>e.x+e.w)),y1=Math.max(...G.map(e=>e.y+e.h));const cxm=(x0+x1)/2,cym=(y0+y1)/2;guiaCentro={v:false,h:false};
        if(Math.abs(cxm-W/2)<lim){G.forEach(e=>e.x+=W/2-cxm);guiaCentro.v=true;}if(Math.abs(cym-H/2)<lim){G.forEach(e=>e.y+=H/2-cym);guiaCentro.h=true;}if(!guiaCentro.v&&!guiaCentro.h)guiaCentro=null;else if((guiaCentro.v||guiaCentro.h)&&!drag.vibrou&&navigator.vibrate){navigator.vibrate(8);drag.vibrou=true;}}
      else{const r=drag.w/drag.h;let nw=Math.max(W*0.03,drag.w+dx);
        if(drag.grupo){const f=nw/drag.w;drag.grupo.forEach(g=>{g.e.w=g.w*f;g.e.h=g.h*f;g.e.x=drag.x0+(g.x-drag.x0)*f;g.e.y=drag.y0+(g.y-drag.y0)*f;});}
        else if(sel.tipo==="texto"){sel.tam=Math.max(8,Math.round(sel.tam*nw/sel.w));}else if(sel.tipo==="campos"||sel.tipo==="lista"){sel.w=nw;}else{sel.w=nw;sel.h=nw/r;}}
      desenhar();});
    function apagar(p){const r=Math.max(2,pincel)*W/100*0.5;const g=drag.og;g.save();g.globalCompositeOperation="destination-out";g.beginPath();g.arc((p.x-sel.x)*drag.k,(p.y-sel.y)*drag.k,r*drag.k,0,Math.PI*2);g.fill();g.restore();
      const tmp=drag.oc;cx.save();cx.clearRect(sel.x,sel.y,sel.w,sel.h);cx.restore();desenharApaga(tmp);}
    let tApaga=0;function desenharApaga(oc){const im=new Image();im.onload=()=>{IMGS[sel.src]=im;desenhar();};if(Date.now()-tApaga>80){tApaga=Date.now();im.src=oc.toDataURL("image/png");}}
    function local(e,p){if(!e.rot)return p;const cxm=e.x+e.w/2,cym=e.y+e.h/2,a=-e.rot*Math.PI/180;const dx=p.x-cxm,dy=p.y-cym;return {x:cxm+dx*Math.cos(a)-dy*Math.sin(a),y:cym+dx*Math.sin(a)+dy*Math.cos(a)};}
    const fim=ev=>{ptrs.delete(ev.pointerId);if(tocouVazio&&!pinch&&ptrs.size===0&&Math.hypot(ev.clientX-tocouVazio.x,ev.clientY-tocouVazio.y)<8){sel=null;renderLista();renderProps();$("#selnome").textContent="toque num elemento · pinça amplia";desenhar();}if(ptrs.size===0)tocouVazio=null;if(ptrs.size<2)pinch=null;if(guiaCentro){guiaCentro=null;desenhar();}if(drag&&drag.modo==="apaga"){const u=drag.oc.toDataURL("image/png");const im=new Image();im.onload=()=>{IMGS[u]=im;sel.src=u;const b=$("#desfazerB");if(b)b.disabled=false;desenhar();};im.src=u;}drag=null;pan=null;};pr.addEventListener("pointerup",fim);pr.addEventListener("pointercancel",fim);
    $("#salvar").onclick=async()=>{sel=null;delete doc.auto;$("#salvar").disabled=true;$("#salvar").textContent="Salvando…";
      await desenhar(false,true,false);const png=cv.toDataURL("image/png");
      await desenhar(false,corProduto==="imprime",false);const pngArte=cv.toDataURL("image/png");  // tinge: arte sem fundo (a peça recebe a cor); imprime: o fundo vai junto na arte
      c=await cliente(l);c.artes=c.artes||{};const ant=c.artes[pid]||{};
      if(FACE==="verso"){c.artes[pid]={...ant,verso:{doc,png,pngArte,material:doc.fundo,em:new Date().toISOString()}};}
      else{const novo={doc,png,pngArte,material:corProduto==="tinge"?doc.fundo:null,w_cm:P.w_cm,h_cm:P.h_cm,sangria_mm:sang,em:new Date().toISOString(),contexto:ant.png===png?ant.contexto:null,soTexto:CARIMBO};if(ant.verso)novo.verso=ant.verso;if(ant.paleta)novo.paleta=ant.paleta;c.artes[pid]=novo;}
      await gravarCliente(c);location.href=`produtos.html?l=${encodeURIComponent(slug)}`;};
  }
  window.__editor=()=>({doc,sel,W,H,B,S});
  render();
})();
