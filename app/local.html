<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Ver no local</title>
<meta name="theme-color" content="#000000">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=9c503e9a29">
<style>
html,body{height:100%;margin:0;background:#000;overflow:hidden;touch-action:none}
#palco{position:fixed;inset:0;overflow:hidden;touch-action:none}
#palco video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#arte{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;user-select:none;-webkit-user-select:none;max-width:none}
#arte.mescla{mix-blend-mode:multiply}
.topo-l{position:fixed;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:center;z-index:5;background:linear-gradient(#000a,#0000)}
.topo-l b{color:#fff;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px #000}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:#1C1635;font:600 14px Rubik,system-ui,sans-serif;cursor:pointer;text-decoration:none;display:inline-grid;place-items:center;white-space:nowrap}
.pill.on{background:#6933C5;color:#fff}
.base-l{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(12px + env(safe-area-inset-bottom));z-index:5;background:linear-gradient(#0000,#000b);display:grid;gap:10px}
.base-l .linha{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.base-l label{color:#fff;font:600 13px Rubik,system-ui,sans-serif;display:flex;align-items:center;gap:8px;flex:1;min-width:140px;text-shadow:0 1px 3px #000}
.base-l input[type=range]{flex:1;min-width:0;height:36px}
#foto{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:#6933C5;cursor:pointer;flex:none}
.msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:#fff;font:500 17px/1.4 Rubik,system-ui,sans-serif;z-index:3}
.msg .btn{margin-top:14px}
.aviso-l{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#fff;color:#1C1635;border-radius:14px;padding:12px 18px;font:600 15px Rubik,system-ui,sans-serif;z-index:9}
</style>
</head>
<body>
<div id="palco"><video id="v" playsinline muted autoplay></video><img id="arte" alt="" draggable="false"></div>
<div class="topo-l"><a class="pill" id="voltar" href="#">←</a><b id="tit"></b><button type="button" class="pill" id="giro">🔒 Giro travado</button></div>
<div class="base-l" id="base" hidden>
  <div class="linha"><label>Inclinar <input type="range" id="incX" min="-70" max="70" value="0"></label><label>De lado <input type="range" id="incY" min="-70" max="70" value="0"></label></div>
  <div class="linha"><button type="button" class="pill" id="mescla">Estampado</button><button type="button" id="foto" aria-label="Fotografar"></button><button type="button" class="pill" id="zerar">Recentrar</button></div>
</div>
<div class="msg" id="msg">Abrindo a câmera…</div>
<script src="app.js?v=9c503e9a29"></script>
<script>
(async()=>{
  const {$,esc,qs,sessao,dados,cliente,nomeLoja,classificar}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l"),pid=qs.get("p");const l=D.lojas.find(x=>x.slug===slug);
  const volta=`produtos.html?l=${encodeURIComponent(slug||"")}`;$("#voltar").href=volta;
  const erro=t=>{$("#msg").innerHTML=`<div>${t}<br><a class="btn" href="${volta}" style="text-decoration:none">Voltar</a></div>`;};
  if(!l)return erro("Loja não encontrada.");
  const c=await cliente(l);const A=(c.artes||{})[pid];if(!A)return erro("Este produto ainda não tem arte. Gere os produtos primeiro.");
  const G=await fetch("gabaritos.json?v=9c503e9a29").then(r=>r.json()).catch(()=>({produtos:{}}));const P=(G.produtos||{})[pid]||{};
  $("#tit").textContent=`${P.nome||pid} · ${nomeLoja(l.nome)}`;
  // peça com fundo (placa, banner, faixa, papel) entra inteira; recorte e estampa (vinil, tecido, carimbo) entram só com a arte
  const src=(P.sem_fundo||P.superficie==="carimbo")?(A.pngArte||A.png):(A.png||A.pngArte);
  const arte=$("#arte"),v=$("#v"),palco=$("#palco");
  await new Promise((ok,nao)=>{arte.onload=ok;arte.onerror=nao;arte.src=src;}).catch(()=>0);
  if(!arte.naturalWidth)return erro("Não consegui abrir a arte deste produto.");
  const W=arte.naturalWidth,H=arte.naturalHeight;arte.style.width=W+"px";arte.style.height=H+"px";
  // estado da peça na tela: centro, tamanho, giro e inclinação (perspectiva calculada aqui; a foto usa a mesma conta)
  const S={cx:innerWidth/2,cy:innerHeight/2,s:Math.min(innerWidth*.6/W,innerHeight*.4/H),rot:0,ix:0,iy:0};let giroLivre=false;
  function cantos(){const d=Math.max(W,H)*S.s*2.2;const ax=S.ix*Math.PI/180,ay=S.iy*Math.PI/180,az=S.rot*Math.PI/180;
    return [[-W/2,-H/2],[W/2,-H/2],[W/2,H/2],[-W/2,H/2]].map(([x,y])=>{x*=S.s;y*=S.s;let z=0;
      let y1=y*Math.cos(ax)-z*Math.sin(ax),z1=y*Math.sin(ax)+z*Math.cos(ax);y=y1;z=z1;
      let x1=x*Math.cos(ay)+z*Math.sin(ay);z1=-x*Math.sin(ay)+z*Math.cos(ay);x=x1;z=z1;
      const k=d/(d-z);x*=k;y*=k;return [S.cx+x*Math.cos(az)-y*Math.sin(az),S.cy+x*Math.sin(az)+y*Math.cos(az)];});}
  // homografia do retângulo W×H para os 4 cantos → matrix3d
  function homografia(q){const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q;const dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;const den=dx1*dy2-dx2*dy1;
    const g=(dx3*dy2-dx2*dy3)/den,h=(dx1*dy3-dx3*dy1)/den;const a=x1-x0+g*x1,b=x3-x0+h*x3,cc=x0,d=y1-y0+g*y1,e=y3-y0+h*y3,f=y0;
    return {a:a/W,b:b/H,c:cc,d:d/W,e:e/H,f,g:g/W,h:h/H};}
  function desenhar(){const m=homografia(cantos());arte.style.transform=`matrix3d(${m.a},${m.d},0,${m.g},${m.b},${m.e},0,${m.h},0,0,1,0,${m.c},${m.f},0,1)`;}
  // gestos: um dedo move; pinça amplia (giro travado) ou só gira (giro livre)
  const ptrs=new Map();let mov=null,pin=null;
  palco.addEventListener("pointerdown",ev=>{try{palco.setPointerCapture(ev.pointerId);}catch(e){}ptrs.set(ev.pointerId,ev);
    if(ptrs.size===1)mov={x:ev.clientX,y:ev.clientY,cx:S.cx,cy:S.cy};
    if(ptrs.size===2){mov=null;const [a,b]=[...ptrs.values()];pin={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),ang:Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX),s:S.s,rot:S.rot};}});
  palco.addEventListener("pointermove",ev=>{if(!ptrs.has(ev.pointerId))return;ptrs.set(ev.pointerId,ev);
    if(pin&&ptrs.size===2){const [a,b]=[...ptrs.values()];if(giroLivre)S.rot=pin.rot+(Math.atan2(b.clientY-a.clientY,b.clientX-a.clientX)-pin.ang)*180/Math.PI;else S.s=Math.max(.02,pin.s*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/pin.d);desenhar();}
    else if(mov&&ptrs.size===1){S.cx=mov.cx+(ev.clientX-mov.x);S.cy=mov.cy+(ev.clientY-mov.y);desenhar();}});
  const fim=ev=>{ptrs.delete(ev.pointerId);if(ptrs.size<2)pin=null;if(ptrs.size===1){const r=[...ptrs.values()][0];mov={x:r.clientX,y:r.clientY,cx:S.cx,cy:S.cy};}else mov=null;};
  palco.addEventListener("pointerup",fim);palco.addEventListener("pointercancel",fim);
  $("#incX").oninput=e=>{S.ix=+e.target.value;desenhar();};$("#incY").oninput=e=>{S.iy=+e.target.value;desenhar();};
  $("#giro").onclick=()=>{giroLivre=!giroLivre;$("#giro").classList.toggle("on",giroLivre);$("#giro").textContent=giroLivre?"⟳ Giro livre":"🔒 Giro travado";};
  const tecido=P.superficie==="tecido"||P.superficie==="carimbo";let mescla=tecido;const pinta=()=>{arte.classList.toggle("mescla",mescla);$("#mescla").classList.toggle("on",mescla);};$("#mescla").onclick=()=>{mescla=!mescla;pinta();};pinta();
  $("#zerar").onclick=()=>{Object.assign(S,{cx:innerWidth/2,cy:innerHeight/2,s:Math.min(innerWidth*.6/W,innerHeight*.4/H),rot:0,ix:0,iy:0});$("#incX").value=0;$("#incY").value=0;desenhar();};
  // câmera traseira
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false});v.srcObject=st;await v.play().catch(()=>{});$("#msg").remove();$("#base").hidden=false;desenhar();}
  catch(e){return erro("A câmera não abriu. Libere a câmera para o GênIO nas permissões do navegador e tente de novo.");}
  // foto: quadro da câmera + a peça com a mesma perspectiva (malha de triângulos); fica guardada na ficha, no servidor
  $("#foto").onclick=async()=>{const b=$("#foto");b.disabled=true;const vw=innerWidth,vh=innerHeight;const k=Math.min(2,1600/Math.max(vw,vh));const cv=document.createElement("canvas");cv.width=Math.round(vw*k);cv.height=Math.round(vh*k);const g=cv.getContext("2d");
    const sv=Math.max(cv.width/v.videoWidth,cv.height/v.videoHeight);g.drawImage(v,(cv.width-v.videoWidth*sv)/2,(cv.height-v.videoHeight*sv)/2,v.videoWidth*sv,v.videoHeight*sv);
    const m=homografia(cantos());const pt=(x,y)=>{const w=m.g*x+m.h*y+1;return [(m.a*x+m.b*y+m.c)/w*k,(m.d*x+m.e*y+m.f)/w*k];};
    if(mescla)g.globalCompositeOperation="multiply";const N=14;
    const tri=(s0,s1,s2,d0,d1,d2)=>{g.save();g.beginPath();const mx=(d0[0]+d1[0]+d2[0])/3,my=(d0[1]+d1[1]+d2[1])/3;const fora=p=>{const n=Math.hypot(p[0]-mx,p[1]-my)||1;return [p[0]+(p[0]-mx)/n*.9,p[1]+(p[1]-my)/n*.9];};g.moveTo(...fora(d0));g.lineTo(...fora(d1));g.lineTo(...fora(d2));g.closePath();g.clip();
      const den=(s0[0]*(s1[1]-s2[1])+s1[0]*(s2[1]-s0[1])+s2[0]*(s0[1]-s1[1]));const a=(d0[0]*(s1[1]-s2[1])+d1[0]*(s2[1]-s0[1])+d2[0]*(s0[1]-s1[1]))/den,bb=(d0[1]*(s1[1]-s2[1])+d1[1]*(s2[1]-s0[1])+d2[1]*(s0[1]-s1[1]))/den,
        cc=(d0[0]*(s2[0]-s1[0])+d1[0]*(s0[0]-s2[0])+d2[0]*(s1[0]-s0[0]))/den,dd=(d0[1]*(s2[0]-s1[0])+d1[1]*(s0[0]-s2[0])+d2[1]*(s1[0]-s0[0]))/den,
        ee=(d0[0]*(s1[0]*s2[1]-s2[0]*s1[1])+d1[0]*(s2[0]*s0[1]-s0[0]*s2[1])+d2[0]*(s0[0]*s1[1]-s1[0]*s0[1]))/den,ff=(d0[1]*(s1[0]*s2[1]-s2[0]*s1[1])+d1[1]*(s2[0]*s0[1]-s0[0]*s2[1])+d2[1]*(s0[0]*s1[1]-s1[0]*s0[1]))/den;
      g.setTransform(a,bb,cc,dd,ee,ff);g.drawImage(arte,0,0);g.restore();};
    for(let i=0;i<N;i++)for(let j=0;j<N;j++){const x0=W*i/N,x1=W*(i+1)/N+.6,y0=H*j/N,y1=H*(j+1)/N+.6;tri([x0,y0],[x1,y0],[x1,y1],pt(x0,y0),pt(x1,y0),pt(x1,y1));tri([x0,y0],[x1,y1],[x0,y1],pt(x0,y0),pt(x1,y1),pt(x0,y1));}
    g.globalCompositeOperation="source-over";
    const a=document.createElement("div");a.className="aviso-l";a.textContent="Guardando a foto…";document.body.appendChild(a);
    try{await classificar(l,cv.toDataURL("image/jpeg",.86),"arquivo",`no local · ${P.nome||pid}`);a.textContent="Foto guardada na ficha ✓";}catch(e){a.textContent="Não consegui guardar. Confira a internet.";}
    setTimeout(()=>{a.remove();b.disabled=false;},1400);};
  addEventListener("pagehide",()=>{try{v.srcObject.getTracks().forEach(t=>t.stop());}catch(e){}});
})();
</script>
</body>
</html>
