<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Orçamento</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=ff7090001c">
<style>
.orc{background:#fff;border-radius:18px;padding:6px 10px;margin:0 0 12px;box-shadow:0 1px 0 rgba(28,22,53,.06)}
.ln{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #F0EDF6}
.ln:last-child{border-bottom:0}
.ln .fig{position:relative;width:52px;height:52px;border-radius:10px;background:#F4F1FA;display:grid;place-items:center;font-size:19px;overflow:visible}
.ln .fig img{border-radius:10px}
.ln .fig img{width:100%;height:100%;object-fit:cover}
.ln .nm{min-width:0}
.ln .nm b{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .nm .sub2{display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0}
.ln .nm small{color:#7b7590;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ln .qt{display:inline-flex;align-items:center;gap:2px;flex:none}
.ln .qt button{width:24px;height:24px;border-radius:7px;border:1px solid #DDD6EC;background:#fff;font:600 14px/1 Rubik,system-ui,sans-serif;color:#5b3fc4;padding:0}
.ln .qt span{min-width:22px;text-align:center;font-weight:600;font-size:13px}
.pr{display:grid;justify-items:end;gap:1px}
.fo{display:inline-flex;align-items:center;gap:4px;margin-top:4px;border:0;background:#F1EDFA;color:#5b3fc4;border-radius:8px;padding:3px 8px;font:600 11.5px/1.2 Rubik,system-ui,sans-serif;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fo.proprio{background:#FFF1D6;color:#8A5A00}
.grd{grid-column:1/-1;display:grid;grid-template-columns:44px repeat(4,minmax(0,1fr));gap:4px 4px;align-items:center;background:#F7F5FB;border-radius:12px;padding:6px 6px 8px;margin-top:2px}
.grd .h{font-size:11px;font-weight:700;color:#7b7590;text-align:center}
.grd .sx{font-size:12px;font-weight:600;color:#5b5570}
.grd .c{display:flex;align-items:center;justify-content:center;gap:1px;background:#fff;border:1px solid #E6E0F1;border-radius:9px;height:30px}
.grd .c button{width:22px;height:28px;border:0;background:none;color:#5b3fc4;font:700 15px/1 Rubik,system-ui,sans-serif;padding:0}
.grd .c span{min-width:16px;text-align:center;font-weight:700;font-size:13px}.grd .c span.z{color:#b7b1c8;font-weight:500}
.grd .info{grid-column:1/-1;font-size:12px;color:#5b5570;padding:2px 2px 0}.grd .info.falta{color:#B4472E;font-weight:600}
.pr .aj{display:flex;align-items:center;gap:3px}
.pr .aj button{width:26px;height:28px;border-radius:8px;border:0;background:#EEE9F7;color:#5b3fc4;font-size:11px;padding:0}
.pr .aj .val{width:auto;min-width:78px;background:none;font-weight:700;font-size:14px;text-align:right;color:#141024;padding:0 2px}
.pr s{color:#a19bb5;font-size:11px}
.pr .desc{font-size:11px;color:#0E8A84;font-weight:600}
.pr .un{font-size:11px;color:#7b7590}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 4px;font-size:17px}
.tot b{font-size:22px}
.pag{display:grid;gap:8px;margin:0 0 12px}
.pag .op{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pag .op small{display:block;color:#7b7590;font-size:12.5px}
.pag .op b{font-size:17px;white-space:nowrap}
.pcli{border-radius:16px;padding:12px 14px;margin:0 0 12px;font-size:14px;line-height:1.45}.pcli.env{background:#FFF4DB;color:#5C4000}.pcli.ok{background:#E3F6F3;color:#0B5E5A}.pcli.mx{background:#EEE9F7;color:#3B2D73}
.pcli b{display:block;font-size:15.5px;margin-bottom:2px}.pcli .bt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pcli .bt .btn{min-height:42px;font-size:14px}
.mensal{font-size:13px;color:#5b5570;margin:-4px 4px 12px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=ff7090001c"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,nav,topo,voltar,nomeLoja,estado,salvar,cliente,definirCliente}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("pedidos")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);const c=await cliente(l);
  const R=v=>(Math.round(v*100)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const NOMES={capacho:"Capacho",placas:"Placa",adesivos:"Adesivo de vitrine",uniformes:"Camisa polo",impressos:"Cartão de visita",panfleto:"Flyer",banners:"Banner retrátil",parede:"Adesivo de parede",brindes:"Ecobag",carimbo:"Carimbo",windbanner:"Wind banner",faixa:"Faixa",folheto:"Folheto",camiseta:"Camiseta",bone:"Boné",avental:"Avental",mostraai:"Mostraí",falaai:"Fala Aí",inpi:"Registro de marca (INPI)"};
  const ICON={mostraai:"📺",falaai:"📞",inpi:"®"};
  // camiseta e camisa polo: grade masculino/feminino × P, M, G, GG; a soma da grade é a quantidade do item (respeitando o mínimo da gráfica)
  const GRADE=new Set(["camiseta","uniformes"]),TAM=["P","M","G","GG"],SEXO=[["M","Masc."],["F","Fem."]];
  const somaG=s=>{const g=s&&s.grade;if(!g)return 0;let t=0;for(const x of ["M","F"])for(const z of TAM)t+=+((g[x]||{})[z])||0;return t;};
  function grade(x,s){const g=(s&&s.grade)||{},soma=somaG(s),mn=App.qtdMin(x.k);
    return `<div class="grd"><span></span>${TAM.map(z=>`<span class="h">${z}</span>`).join("")}${SEXO.map(([sx,rot])=>`<span class="sx">${rot}</span>${TAM.map(z=>{const n=+((g[sx]||{})[z])||0;return `<span class="c"><button type="button" data-g="${sx}|${z}|-" aria-label="menos ${rot} ${z}">−</button><span class="${n?"":"z"}">${n}</span><button type="button" data-g="${sx}|${z}|+" aria-label="mais ${rot} ${z}">+</button></span>`;}).join("")}`).join("")}
      <span class="info ${soma&&soma<mn?"falta":""}">${!soma?`Distribua ${s.q.toLocaleString("pt-BR")} un. por modelo e tamanho`:soma<mn?`Grade: ${soma} un. · mínimo da gráfica ${mn} (faltam ${mn-soma}; o preço já conta ${mn})`:`Grade: ${soma} un.`}</span></div>`;}
  // o que o cliente fez no painel (escolhas e pedido) — fica num arquivo próprio da loja no servidor
  let PC={};const lerPC=async()=>{try{const r=await fetch(`/api/clientes/${encodeURIComponent(slug)}/painel`,{credentials:"same-origin",cache:"no-store"});PC=r.ok?await r.json():{};}catch(e){PC={};}};
  const Rq=v=>(Math.round(v*100)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  function pcHTML(O){const P=PC.pedido;
    if(P){const its=(P.linhas||[]).map(x=>`${esc(x.nome)}${x.servico?"":" · "+(+x.q).toLocaleString("pt-BR")+" un."}`).join(" · ");
      return P.confirmado?`<div class="pcli ok"><b>✓ Pedido do cliente confirmado</b>${its} · total ${Rq(P.total)} · ${esc(P.texto_pagamento||"")}</div>`
        :`<div class="pcli env"><b>Pedido fechado pelo cliente no painel</b>${esc(P.por||"")} em ${esc((P.em||"").slice(8,10)+"/"+(P.em||"").slice(5,7)+" "+(P.em||"").slice(11,16))}<br>${its} · total ${Rq(P.total)}<br>${esc(P.texto_pagamento||"")}
          <div class="bt"><a class="btn sec" href="visita.html?l=${encodeURIComponent(slug)}#mensagens" style="text-decoration:none;display:grid;place-items:center">Conversar</a><button type="button" class="btn" id="pcConf">Confirmar pedido</button></div></div>`;}
    const E=PC.escolhas||{};const dif=O.linhas.filter(x=>E[x.k]!=null&&E[x.k]!==x.q);
    return dif.length?`<div class="pcli mx"><b>O cliente mexeu nas quantidades no painel</b>${dif.map(x=>`${esc(x.nome)}: ${x.q.toLocaleString("pt-BR")} → ${E[x.k]?E[x.k].toLocaleString("pt-BR"):"não quer"}`).join(" · ")}<div class="bt" style="grid-template-columns:1fr"><button type="button" class="btn" id="pcAplicar">Aplicar no orçamento</button></div></div>`:"";}
  // aplicar: as quantidades do cliente entram no orçamento (o que ele tirou fica 0)
  function aplicarPC(){const e=estado();const S=(e.sel||{})[slug]||{};const P=PC.pedido;
    if(P){const ped={};(P.linhas||[]).forEach(x=>ped[x.k]=x.q);const O=App.orcamento(c,S,(e.pedidos||{})[slug]||{});O.linhas.forEach(x=>{if(!S[x.k]||x.servico||x.fixa)return;S[x.k].q=ped[x.k]!=null?ped[x.k]:0;});}
    else Object.entries(PC.escolhas||{}).forEach(([k,q])=>{if(S[k])S[k].q=q;});salvar(e);}
  let pubT=null;const publicar=()=>{clearTimeout(pubT);pubT=setTimeout(()=>App.publicarPainel(l),1500);};
  function render(){publicar();
    const e=estado();const S=(e.sel||{})[slug]||{};const P=((e.pedidos||{})[slug])||{};
    const O=App.orcamento(c,S,P);
    $("#app").innerHTML=`${topo()}${voltar(`produtos.html?l=${encodeURIComponent(slug)}`,"Produtos")}
    ${App.cabCliente(l,{titulo:"Orçamento",extra:O.linhas.length?`${O.linhas.length} item(ns) · total ${R(O.total)}${O.frete!=null?" com frete":" · frete a definir"}`:""})}
    ${pcHTML(O)}
    ${O.linhas.length?`<div class="orc">${O.linhas.map(x=>`<div class="ln" data-k="${x.k}">
        <div class="fig">${x.img?`<img src="${esc(x.img)}" alt="" loading="lazy">`:(ICON[x.base]||"▫")}</div>
        <div class="nm"><b>${esc(x.nome)}</b>${x.servico||x.base==="locacao"||x.base==="capacho"?"":`<button type="button" class="fo ${x.fornProprio?"proprio":""}" data-fo="1">🏭 ${esc(x.forn?x.forn.nome+(x.forn.prazo?` · ${x.forn.prazo} dias`:"")+(x.forn.preco?"":" · preço da tabela"):"Printi / GIV")}${x.fornProprio?" · só neste":""} ▾</button>`}<div class="sub2">${GRADE.has(x.base)&&somaG(S[x.k])?`<small>${x.q.toLocaleString("pt-BR")} un. pela grade</small>`:x.fixa?(x.k==="capacho"&&x.q>1?`<small>${x.q} un. · </small>`:""):`<span class="qt"><button type="button" data-q="-">−</button><span>${x.q.toLocaleString("pt-BR")}</span><button type="button" data-q="+">+</button></span>`}${GRADE.has(x.base)&&somaG(S[x.k])?"":`<small>${x.lote||!x.fixa?"un. · ":""}${esc(x.unid||"")}</small>`}</div></div>
        <div class="pr">${x.total==null?`<span class="un">preço a confirmar</span>`:`<div class="aj"><button type="button" data-p="-" aria-label="baixar o preço">▼</button><button type="button" class="val" data-ed="1">${R(x.total)}</button><button type="button" data-p="+" aria-label="subir o preço">▲</button></div>
          ${x.pct?`<span><s>${R(x.lista)}</s> <span class="desc">${x.pct<0?"−":"+"}${Math.abs(x.pct).toLocaleString("pt-BR")}%</span></span>`:""}
          ${x.q>1&&!x.fixa?`<span class="un">${R(x.total/x.q)} cada</span>`:""}${x.mensal?`<span class="un">+ ${R(x.mensal)}/mês</span>`:""}`}</div>${GRADE.has(x.base)?grade(x,S[x.k]):""}</div>`).join("")}
      <div class="ln" data-k="_frete"><div class="fig">🚚</div><div class="nm"><b>Frete</b><div class="sub2"><small>um valor para o pedido inteiro</small></div></div>
        <div class="pr"><div class="aj"><button type="button" data-p="-">▼</button><button type="button" class="val" data-ed="1">${O.frete!=null?R(O.frete):"definir"}</button><button type="button" data-p="+">▲</button></div></div></div>
      <div class="tot"><span>Total</span><b>${R(O.total)}</b></div></div>
      ${O.mensal?`<p class="mensal">Mais ${R(O.mensal)}/mês dos serviços.</p>`:""}
      <h2 style="margin:4px 0 8px">Formas de pagamento</h2>
      <div class="pag">${App.pagamentos(O.total).map(p=>`<div class="op"><div><b style="font-size:15px">${esc(p.t)}</b><small>${esc(p.d)}</small></div><b>${p.v}</b></div>`).join("")}</div>
      ${O.semPreco?`<p class="mensal">${O.semPreco} item(ns) sem preço ainda não entram no total.</p>`:""}`
    :`<section class="card"><p>Nada escolhido ainda.</p></section>`}
    <div class="acoes"><div class="w"><a class="btn sec" href="produtos.html?l=${encodeURIComponent(slug)}">← Produtos</a><a class="btn" href="pedidos.html">Pedidos →</a></div></div>
    ${nav("pedidos")}`;document.body.classList.add("com-acoes");
    $$("[data-g]").forEach(b=>b.onclick=()=>{const k=b.closest(".ln").dataset.k;const [sx,z,m]=b.dataset.g.split("|");const e=estado();const s=((e.sel||{})[slug]||{})[k];if(!s)return;
      s.grade=s.grade||{M:{},F:{}};s.grade[sx]=s.grade[sx]||{};const n=Math.max(0,(+s.grade[sx][z]||0)+(m==="+"?1:-1));if(n)s.grade[sx][z]=n;else delete s.grade[sx][z];
      const t=somaG(s);if(t)s.q=Math.max(App.qtdMin(k),t);else{s.q=Math.max(1,App.qtdMin(k));delete s.grade;}salvar(e);render();});
    const pa=$("#pcAplicar");if(pa)pa.onclick=()=>{aplicarPC();render();};
    const pk=$("#pcConf");if(pk)pk.onclick=async()=>{pk.disabled=true;pk.textContent="Confirmando…";try{aplicarPC();
        const r=await fetch(`/api/clientes/${encodeURIComponent(slug)}/painel/confirmar`,{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||r.status);PC=d;
        App.moverEtapa(slug,"arte",{valor:PC.pedido.valor,pagamento:PC.pedido.pagamento,origem:"painel"});render();}
      catch(e){pk.disabled=false;pk.textContent="Confirmar pedido";alert("Não confirmou: "+e.message);}};
    // quantidade: segue a tabela da gráfica (lote: só as quantidades da tabela; unidade: de 1 em 1 a partir do mínimo)
    $$("[data-q]").forEach(b=>b.onclick=()=>{const k=b.closest(".ln").dataset.k;const e=estado();const s=((e.sel||{})[slug]||{})[k];if(!s)return;
      const fid=(((e.pedidos||{})[slug]||{}).forn||{})[k]||null;s.q=App.passoQtd(k,App.qtdNormal(k,s.q,fid),b.dataset.q==="+"?1:-1,fid);salvar(e);render();});
    // fornecedor do item só para este cliente (o ativo de Config vale para os outros)
    $$("[data-fo]").forEach(b=>b.onclick=async()=>{const k=b.closest(".ln").dataset.k;const it=App.fornItem(k);const ativo=it.ativo||"tabela";
      const ops=[{k:"tabela",ic:ativo==="tabela"?"✓":"",t:"Printi / GIV · tabela"+(ativo==="tabela"?" (ativo)":"")},...(it.lista||[]).map(f=>({k:f.id,ic:ativo===f.id?"✓":"",t:`${f.nome}${f.prazo?` · ${f.prazo} dias`:""}${App.fornTab(f).length?"":" · sem preço"}${ativo===f.id?" (ativo)":""}`}))];
      if(ops.length<2){alert("Este item só tem a tabela Printi/GIV. Cadastre fornecedores em Config → Fornecedores por item.");return;}
      const id=await App.menuLongo("Fornecedor deste item para "+nome,ops);if(!id)return;
      const e=estado();e.pedidos=e.pedidos||{};const p=e.pedidos[slug]=e.pedidos[slug]||{etapa:"entrada",hist:[]};p.forn=p.forn||{};if(id===ativo)delete p.forn[k];else p.forn[k]=id;
      const s=((e.sel||{})[slug]||{})[k];if(s&&s.q>0&&!s.grade)s.q=App.qtdNormal(k,s.q,p.forn[k]||null);salvar(e);render();});
    // preço: desconto ou acréscimo em % sobre a tabela (as setas andam 1%); tocar no valor deixa digitar o preço da linha
    const gravar=(k,v)=>{const e=estado();e.pedidos=e.pedidos||{};const p=e.pedidos[slug]=e.pedidos[slug]||{etapa:"entrada",hist:[]};
      if(k==="_frete")p.frete=v;else{p.desc=p.desc||{};if(!v)delete p.desc[k];else p.desc[k]=v;}salvar(e);render();};
    $$("[data-p]").forEach(b=>b.onclick=()=>{const k=b.closest(".ln").dataset.k;const sinal=b.dataset.p==="+"?1:-1;
      if(k==="_frete"){gravar(k,Math.max(0,Math.round(((O.frete||0)+sinal*5)*100)/100));return;}
      const x=O.linhas.find(y=>y.k===k);gravar(k,Math.max(-100,Math.round((x.pct+sinal)*10)/10));});
    $$("[data-ed]").forEach(b=>b.onclick=()=>{const k=b.closest(".ln").dataset.k;const x=O.linhas.find(y=>y.k===k);
      const atual=k==="_frete"?(O.frete||0):x.total;const v=prompt(k==="_frete"?"Frete do pedido inteiro (R$)":`Preço de ${x.nome} (${x.q.toLocaleString("pt-BR")} un.) (R$)`,String(atual.toFixed(2)).replace(".",","));if(v===null)return;
      const n=parseFloat(v.replace(/\./g,"").replace(",","."));if(isNaN(n)||n<0)return;
      if(k==="_frete"){gravar(k,Math.round(n*100)/100);return;}gravar(k,Math.round((n/x.lista-1)*1000)/10);});
  }
  await lerPC();render();
})();
</script>
</body>
</html>
