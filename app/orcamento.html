<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Orçamento</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=47594caa60">
<style>
.orc{background:#fff;border-radius:18px;padding:6px 10px;margin:0 0 12px;box-shadow:0 1px 0 rgba(28,22,53,.06)}
.ln{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #F0EDF6}
.ln:last-child{border-bottom:0}
.ln .fig{position:relative;width:52px;height:52px;border-radius:10px;background:#F4F1FA;display:grid;place-items:center;font-size:19px;overflow:visible}
.ln .fig img{border-radius:10px}
.ln .dup{position:absolute;top:-6px;right:-8px;display:flex;gap:2px}
.ln .dup button{width:21px;height:21px;border-radius:50%;border:1.5px solid #fff;background:#5b3fc4;color:#fff;font:700 14px/1 Rubik,system-ui,sans-serif;padding:0;display:grid;place-items:center;box-shadow:0 1px 3px rgba(28,22,53,.3)}
.ln .dup button.menos{background:#8a84a0}
.ln .fig img{width:100%;height:100%;object-fit:cover}
.ln .nm{min-width:0}
.ln .nm b{display:block;font-size:14px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln .nm .sub2{display:flex;align-items:center;gap:6px;margin-top:3px;min-width:0}
.ln .nm small{color:#7b7590;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ln .qt{display:inline-flex;align-items:center;gap:2px;flex:none}
.ln .qt button{width:24px;height:24px;border-radius:7px;border:1px solid #DDD6EC;background:#fff;font:600 14px/1 Rubik,system-ui,sans-serif;color:#5b3fc4;padding:0}
.ln .qt span{min-width:22px;text-align:center;font-weight:600;font-size:13px}
.pr{display:grid;justify-items:end;gap:1px}
.pr .aj{display:flex;align-items:center;gap:3px}
.pr .aj button{width:26px;height:28px;border-radius:8px;border:0;background:#EEE9F7;color:#5b3fc4;font-size:11px;padding:0}
.pr .aj .val{width:auto;min-width:78px;background:none;font-weight:700;font-size:14px;text-align:right;color:#141024;padding:0 2px}
.pr s{color:#a19bb5;font-size:11px}
.pr .desc{font-size:11px;color:#0E8A84;font-weight:600}
.pr .un{font-size:11px;color:#7b7590}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 4px 4px;font-size:17px}
.tot b{font-size:22px}
.pag{display:grid;gap:8px;margin:0 0 12px}
.pag .op{background:#fff;border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.pag .op small{display:block;color:#7b7590;font-size:12.5px}
.pag .op b{font-size:17px;white-space:nowrap}
.mensal{font-size:13px;color:#5b5570;margin:-4px 4px 12px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=47594caa60"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,nav,topo,voltar,nomeLoja,estado,salvar,cliente,definirCliente}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("pedidos")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);let c=await cliente(l);
  const R=v=>(Math.round(v*100)/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const NOMES={capacho:"Capacho",placas:"Placa",adesivos:"Adesivo de vitrine",uniformes:"Camisa polo",impressos:"Cartão de visita",panfleto:"Flyer",banners:"Banner retrátil",parede:"Adesivo de parede",brindes:"Ecobag",carimbo:"Carimbo",windbanner:"Wind banner",faixa:"Faixa",folheto:"Folheto",camiseta:"Camiseta",bone:"Boné",avental:"Avental",mostraai:"Mostraí",falaai:"Fala Aí",inpi:"Registro de marca (INPI)"};
  const ICON={mostraai:"📺",falaai:"📞",inpi:"®"};
  function render(){
    const e=estado();const S=(e.sel||{})[slug]||{};const P=((e.pedidos||{})[slug])||{};
    const O=App.orcamento(c,S,P);
    $("#app").innerHTML=`${topo()}${voltar(`produtos.html?l=${encodeURIComponent(slug)}`,"Produtos")}
    <h1>Orçamento</h1><p class="sub">${esc(nome)}</p>
    ${O.linhas.length?`<div class="orc">${O.linhas.map(x=>`<div class="ln" data-k="${x.k}">
        <div class="fig">${x.img?`<img src="${esc(x.img)}" alt="" loading="lazy">`:(ICON[x.k]||"▫")}${x.servico?"":`<span class="dup"><button type="button" class="menos" data-tira="1" aria-label="tirar esta proposta">−</button><button type="button" data-dup="1" aria-label="duplicar esta proposta">+</button></span>`}</div>
        <div class="nm"><b>${esc(x.nome)}</b><div class="sub2">${x.fixa?(x.k==="capacho"&&x.q>1?`<small>${x.q} un. · </small>`:""):`<span class="qt"><button type="button" data-q="-">−</button><span>${x.q.toLocaleString("pt-BR")}</span><button type="button" data-q="+">+</button></span>`}<small>${x.lote||!x.fixa?"un. · ":""}${esc(x.unid||"")}</small></div></div>
        <div class="pr">${x.total==null?`<span class="un">preço a confirmar</span>`:`<div class="aj"><button type="button" data-p="-" aria-label="baixar o preço">▼</button><button type="button" class="val" data-ed="1">${R(x.total)}</button><button type="button" data-p="+" aria-label="subir o preço">▲</button></div>
          ${x.pct?`<span><s>${R(x.lista)}</s> <span class="desc">${x.pct<0?"−":"+"}${Math.abs(x.pct).toLocaleString("pt-BR")}%</span></span>`:""}
          ${x.q>1&&!x.fixa?`<span class="un">${R(x.total/x.q)} cada</span>`:""}${x.mensal?`<span class="un">+ ${R(x.mensal)}/mês</span>`:""}`}</div></div>`).join("")}
      <div class="ln" data-k="_frete"><div class="fig">🚚</div><div class="nm"><b>Frete</b><div class="sub2"><small>um valor para o pedido inteiro</small></div></div>
        <div class="pr"><div class="aj"><button type="button" data-p="-">▼</button><button type="button" class="val" data-ed="1">${O.frete!=null?R(O.frete):"definir"}</button><button type="button" data-p="+">▲</button></div></div></div>
      <div class="tot"><span>Total</span><b>${R(O.total)}</b></div></div>
      ${O.mensal?`<p class="mensal">Mais ${R(O.mensal)}/mês dos serviços.</p>`:""}
      <h2 style="margin:4px 0 8px">Formas de pagamento</h2>
      <div class="pag">${App.pagamentos(O.total).map(p=>`<div class="op"><div><b style="font-size:15px">${esc(p.t)}</b><small>${esc(p.d)}</small></div><b>${p.v}</b></div>`).join("")}</div>
      ${O.semPreco?`<p class="mensal">${O.semPreco} item(ns) sem preço ainda não entram no total.</p>`:""}`
    :`<section class="card"><p>Nada escolhido ainda.</p></section>`}
    <div class="acoes"><div class="w"><a class="btn sec" href="produtos.html?l=${encodeURIComponent(slug)}">← Produtos</a><a class="btn" href="pedidos.html">Pedidos →</a></div></div>
    ${nav("pedidos")}`;document.body.classList.add("com-acoes");
    // + na foto: duplica a proposta (outra cor, outra arte, outra quantidade); − na foto: tira a proposta do orçamento
    $$("[data-dup]").forEach(b=>b.onclick=async()=>{const k=b.closest(".ln").dataset.k;const kb=App.baseId(k);
      if(kb==="capacho"){location.href=`capacho.html?l=${encodeURIComponent(slug)}&n=${encodeURIComponent(nome)}`;return;}   // outro tapete: o motor do capacho monta vários no mesmo orçamento
      const e=estado();const S=e.sel[slug];let n=2;while(S[kb+"~"+n])n++;const nk=kb+"~"+n;S[nk]={...S[k],q:S[k].q};salvar(e);
      c=await App.cliente(l);c.artes=c.artes||{};if(c.artes[k])c.artes[nk]=JSON.parse(JSON.stringify(c.artes[k]));if(c.formatos&&c.formatos[k]){c.formatos[nk]={...c.formatos[k]};}await App.gravarCliente(c);render();});
    $$("[data-tira]").forEach(b=>b.onclick=async()=>{const k=b.closest(".ln").dataset.k;const e=estado();const S=e.sel[slug];const P=(e.pedidos||{})[slug];
      if(k.includes("~")){delete S[k];if(P&&P.desc)delete P.desc[k];salvar(e);c=await App.cliente(l);if(c.artes)delete c.artes[k];if(c.formatos)delete c.formatos[k];await App.gravarCliente(c);}
      else{S[k].q=0;salvar(e);}render();});
    // quantidade: segue a tabela da gráfica (lote: só as quantidades da tabela; unidade: de 1 em 1 a partir do mínimo)
    $$("[data-q]").forEach(b=>b.onclick=()=>{const k=b.closest(".ln").dataset.k;const e=estado();const s=((e.sel||{})[slug]||{})[k];if(!s)return;
      s.q=App.passoQtd(k,App.qtdNormal(k,s.q),b.dataset.q==="+"?1:-1);salvar(e);render();});
    // preço: desconto ou acréscimo em % sobre a tabela (as setas andam 1%); tocar no valor deixa digitar o preço da linha
    const gravar=(k,v)=>{const e=estado();e.pedidos=e.pedidos||{};const p=e.pedidos[slug]=e.pedidos[slug]||{etapa:"entrada",hist:[]};
      if(k==="_frete")p.frete=v;else{p.desc=p.desc||{};if(!v)delete p.desc[k];else p.desc[k]=v;}salvar(e);render();};
    $$("[data-p]").forEach(b=>b.onclick=()=>{const k=b.closest(".ln").dataset.k;const sinal=b.dataset.p==="+"?1:-1;
      if(k==="_frete"){gravar(k,Math.max(0,Math.round(((O.frete||0)+sinal*5)*100)/100));return;}
      const x=O.linhas.find(y=>y.k===k);gravar(k,Math.max(-100,Math.round((x.pct+sinal)*10)/10));});
    $$("[data-ed]").forEach(b=>b.onclick=()=>{const k=b.closest(".ln").dataset.k;const x=O.linhas.find(y=>y.k===k);
      const atual=k==="_frete"?(O.frete||0):x.total;const v=prompt(k==="_frete"?"Frete do pedido inteiro (R$)":`Preço de ${x.nome} (${x.q.toLocaleString("pt-BR")} un.) (R$)`,String(atual.toFixed(2)).replace(".",","));if(v===null)return;
      const n=parseFloat(v.replace(/\./g,"").replace(",","."));if(isNaN(n)||n<0)return;
      if(k==="_frete"){gravar(k,Math.round(n*100)/100);return;}gravar(k,Math.round((n/x.lista-1)*1000)/10);});
  }
  render();
})();
</script>
</body>
</html>
