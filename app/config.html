<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Configuração</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=fcfda3f6c3">
<style>
.forn{display:grid;grid-template-columns:1fr;gap:6px;margin:8px 0 0}
.forn .it{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:var(--lav);border-radius:12px;padding:10px 12px}
.forn .it small{display:block;color:var(--texto2);font-size:12px}
.forn .it button{border:0;background:#fff;border-radius:10px;min-height:36px;padding:0 12px;font:inherit;font-size:13px;color:var(--marca);font-weight:700}
.fo-lista{display:grid;gap:8px;margin:8px 0}
.fo-c{border:1.5px solid var(--linha);border-radius:14px;padding:10px 12px;background:#fff}
.fo-c.on{border-color:var(--marca);background:#F7F4FE}
.fo-c b{font-size:15px}.fo-c small{display:block;color:var(--texto2);font-size:12.5px;line-height:1.35;margin-top:2px}
.fo-c .bts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}.fo-c .bts button,.fo-c .bts a{border:0;background:var(--lav);border-radius:9px;min-height:34px;padding:0 12px;font:600 13px Rubik,system-ui,sans-serif;color:var(--marca);text-decoration:none;display:inline-grid;place-items:center}
.fo-c .bts .usar{background:var(--marca);color:#fff}
.fo-tab{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}.fo-tab input{min-width:0}
.fo-hist{font-size:12px;color:var(--texto2);margin:8px 0 0;line-height:1.5}
.ed-forn{max-height:84vh;overflow:auto}
.ed-forn select{width:100%;box-sizing:border-box;font:inherit;font-size:15px;border:1.5px solid var(--linha);border-radius:10px;padding:9px 10px;background:#fff}
.ed-forn{position:fixed;left:12px;right:12px;top:6vh;background:#fff;border-radius:18px;padding:14px;z-index:75;box-shadow:0 10px 40px rgba(28,22,53,.3)}
.ed-forn label{display:block;font-size:12px;color:var(--texto2);margin:8px 0 2px}
.ed-forn input,.ed-forn textarea{width:100%;box-sizing:border-box;font:inherit;font-size:15px;border:1.5px solid var(--linha);border-radius:10px;padding:9px 10px}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=fcfda3f6c3"></script>
<script>
(async()=>{
  const {$,$$,esc,sessao,nav,topo}=App;
  if(!await sessao())return;
  await App.dados().catch(()=>null);
  const API=(()=>{try{return window.top.REC_API||null;}catch(e){return null;}})();
  let tipoSel=localStorage.getItem("rec-tipo")||"audio",telaAcesa=localStorage.getItem("rec-tela")!=="0";
  const TIPOS=[["audio","","Áudio"],["transcrever","","Transcrever"],["video-tras","","Vídeo"],["foto","","Foto"]];if(!TIPOS.some(t=>t[0]===tipoSel)){tipoSel="audio";try{localStorage.setItem("rec-tipo","audio");}catch(e){}}
  // fornecedores por item (gravado no aparelho até existir conta no servidor)
  const PADRAO={capacho:{item:"Capacho",fornecedor:"Kapazi",obs:"23 cores de vinil · produção própria"},placas:{item:"Placas e sinalização",fornecedor:"Printi"},adesivos:{item:"Adesivos e vitrines",fornecedor:"Printi"},uniformes:{item:"Uniformes e camisetas",fornecedor:"Printi",obs:"polo bordada · camiseta clássica/premium"},impressos:{item:"Cartões de visita",fornecedor:"Printi"},panfleto:{item:"Flyers e panfletos",fornecedor:"Printi"},banners:{item:"Banners e faixas",fornecedor:"Printi"},parede:{item:"Adesivos de parede",fornecedor:"Printi"},brindes:{item:"Sacolas e brindes",fornecedor:"Printi"},carimbo:{item:"Carimbos",fornecedor:"produção própria"},mostraai:{item:"Mostra Aí · cardápio digital",fornecedor:"AI Negócios"},falaai:{item:"Fala Aí · atendente no telefone",fornecedor:"AI Negócios"},telefonia:{item:"Atendente virtual (telefone)",fornecedor:"a definir"},inpi:{item:"Registro de marca",fornecedor:"a definir"}};
  let FORN=(await App.lerChave("fornecedores"))||{};  // fornecedores por item: no servidor, iguais para todos
  const ler=()=>Object.assign({},PADRAO,FORN);
  const gravar=f=>{FORN=f;App.gravarChave("fornecedores",f);};
  function render(){const E=API?API.estado():{suporte:{}};const F=ler();
    $("#app").innerHTML=`${topo()}<h1>Configuração</h1>
    <section class="card"><h2>Modo do REC</h2><small class="muted" style="display:block;margin:0 0 8px">O botão REC da barra grava neste modo com um toque; outro toque para.</small>
      <div class="rec-tipos">${TIPOS.map(([k,ic,n])=>`<button type="button" data-t="${k}" class="${tipoSel===k?"on":""}" ${(k==="transcrever"&&!E.suporte.transcrever)?'disabled title="não disponível neste navegador"':""}><span class="ic-modo">${App.ICONES.recModo(k)}</span>${n}</button>`).join("")}</div>
      <div class="rec-opc"><label><input type="checkbox" id="rTela" ${telaAcesa?"checked":""} ${E.suporte.wake?"":"disabled"}> manter a tela acesa enquanto grava${E.suporte.wake?"":" (sem suporte)"}</label></div>
      ${tipoSel.startsWith("video")?'<small class="muted">O vídeo abre a câmera do próprio celular; ao terminar, ele volta e fica nas notas.</small>':tipoSel==="transcrever"?'<small class="muted">Transcrição pelo reconhecimento de voz do navegador (precisa de internet); salva só o texto.</small>':""}</section>
    <section class="card" id="metas"><h2>Metas de venda</h2><small class="muted" style="display:block;margin:0 0 8px">Venda = pedido confirmado (sai da Entrada). Aparecem ao lado do seu nome, no topo.</small>
      <div class="metas-f"><label>Meta do dia<input type="number" min="0" inputmode="numeric" id="mDia" value="${App.METAS.dia||""}" placeholder="vendas"></label><label>Meta do mês<input type="number" min="0" inputmode="numeric" id="mMes" value="${App.METAS.mes||""}" placeholder="vendas"></label><label>Jornada (horas)<input type="number" min="1" max="14" inputmode="numeric" id="mJor" value="${App.METAS.jornada||8}"></label><label>Comissão (%)<input type="number" min="0" max="100" step="0.5" inputmode="decimal" id="mCom" value="${App.METAS.comissao||""}" placeholder="%"></label></div></section>
    <section class="card" id="lucro"><h2>Preço e lucro</h2><small class="muted" style="display:block;margin:0 0 8px">Preço de venda = preço do fornecedor (na unidade e quantidade dele) + lucro sobre esse preço + arte + revisão. O frete não entra aqui: é um valor único no fechamento do pedido.</small>
      <div class="metas-f"><label>Lucro sobre a base (%)<input type="number" min="0" step="1" inputmode="decimal" id="mLucro" value="${App.lucroPct()}"></label><label>Arte, por produto (R$)<input type="number" min="0" step="0.01" inputmode="decimal" id="mArte" value="${App.METAS.arte||""}" placeholder="0"></label><label>Revisão, por produto (R$)<input type="number" min="0" step="0.01" inputmode="decimal" id="mRev" value="${App.METAS.revisao||""}" placeholder="0"></label></div>
      <h3 style="margin:14px 0 6px">Formas de pagamento no orçamento</h3>
      <div class="metas-f">${(()=>{const g=Object.assign({pix:5,cartao:8,parc:6,sinal:50},App.METAS.pag||{});return `<label>Desconto no Pix (%)<input type="number" min="0" max="50" step="0.5" inputmode="decimal" id="gPix" value="${g.pix}"></label><label>Acréscimo no cartão (%)<input type="number" min="0" max="50" step="0.5" inputmode="decimal" id="gCart" value="${g.cartao}"></label><label>Parcelas no cartão<input type="number" min="1" max="24" step="1" inputmode="numeric" id="gParc" value="${g.parc}"></label><label>Sinal (%)<input type="number" min="0" max="100" step="5" inputmode="decimal" id="gSinal" value="${g.sinal}"></label>`;})()}</div>
      <div id="tabLucro"></div></section>
    <section class="card" id="locacao"><h2>Locação · kit tapete + wind banner</h2><small class="muted" style="display:block;margin:0 0 8px">Sempre 15 dias. O preço sai da data de retirada: se ela cai num período da tabela, vale o valor do período; fora dos períodos, o valor padrão. Sem valor, o orçamento mostra "preço a confirmar". Kits por tema: quantos existem — o calendário risca os dias sem kit livre (vazio = sem limite).</small>
      <div class="metas-f">${App.LOC_TEMAS.map(t=>`<label>Kits ${esc(t.nome)}<input type="number" min="0" step="1" inputmode="numeric" data-lk="${t.id}" value="${(((App.METAS.locacao||{}).kits||{})[t.id])??""}" placeholder="sem limite"></label>`).join("")}<label>Valor padrão · 15 dias (R$)<input type="number" min="0" step="0.01" inputmode="decimal" id="lPad" value="${(App.METAS.locacao||{}).padrao??""}" placeholder="a confirmar"></label></div>
      <h3 style="margin:14px 0 6px">Períodos com preço próprio</h3><div id="lPer"></div><button type="button" class="btn sec sm" id="lAdd" style="margin-top:6px">+ período</button>
      <h3 style="margin:14px 0 6px">Reservas</h3><div id="lRes"><small class="muted">carregando…</small></div></section>
    <section class="card" id="fornec"><h2>Fornecedores por item</h2><small class="muted">Cada item com os seus fornecedores e o histórico. O ativo vale para os orçamentos; no orçamento dá para trocar o fornecedor de um item só para aquele cliente. Sem tabela de preço, o orçamento usa a tabela Printi/GIV.</small>
      <div class="forn">${ITENS.map(k=>{const it=App.fornItem(k),fa=App.fornDe(k),n=(it.lista||[]).length;return `<div class="it"><div><b>${esc(App.NOME_ORC[k]||k)}</b><small>${fa?`✓ ${esc(fa.nome)}${fa.prazo?` · ${fa.prazo} dias`:""}${App.fornTab(fa).length?"":" · sem preço"}`:esc(TAB_NOME[k]||"tabela Printi/GIV")}${n?` · ${n} fornecedor(es)`:""}</small></div><button type="button" data-fi="${k}">Abrir</button></div>`;}).join("")}</div></section>
    ${nav("config")}`;
    const NOMES={capacho:"Capacho",placas:"Placa",uniformes:"Polo",impressos:"Cartão de visita",panfleto:"Flyer",banners:"Banner retrátil",parede:"Adesivo de parede",brindes:"Ecobag",carimbo:"Carimbo",windbanner:"Wind banner",faixa:"Faixa",folheto:"Folheto",camiseta:"Camiseta",bone:"Boné",avental:"Avental"};
    const R=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
    const tab=()=>{const fr=0,L=App.lucroPct();$("#tabLucro").innerHTML=`<table class="tab-lucro"><tr><th>Produto</th><th>Fornecedor</th><th>Lucro</th><th>Venda</th></tr>${Object.entries(App.CUSTO).map(([k,c])=>{const b=c[0]+fr,v=App.venda(b);return `<tr><td>${esc(NOMES[k]||k)} <small>${esc(c[1])}</small></td><td>${R(b)}</td><td>${R(b*L/100)}</td><td><b>${R(v)}</b></td></tr>`;}).join("")}</table><small class="muted">Lucro de ${App.LUCRO_PADRAO}% = cobramos o mesmo valor do fornecedor em cima dele (preço = 2 × fornecedor).</small>`;};tab();
    ["mDia","mMes","mJor","mCom","mLucro","mArte","mRev","gPix","gCart","gParc","gSinal"].forEach(id=>{const i=$("#"+id);if(i)i.onchange=()=>{const m={...App.METAS,pag:{pix:+$("#gPix").value||0,cartao:+$("#gCart").value||0,parc:Math.max(1,+$("#gParc").value||1),sinal:+$("#gSinal").value||0},dia:+$("#mDia").value||0,mes:+$("#mMes").value||0,jornada:+$("#mJor").value||8,comissao:+$("#mCom").value||0,lucro:$("#mLucro").value===""?App.LUCRO_PADRAO:+$("#mLucro").value,arte:+$("#mArte").value||0,revisao:+$("#mRev").value||0};App.gravarChave("metas",m);Object.assign(App.METAS,m);tab();};});
    // locação: tabela de preço por período e estoque de kits (em metas, no servidor); reservas de todas as lojas (/api/estado/locacoes)
    const locL=()=>JSON.parse(JSON.stringify(App.METAS.locacao||{kits:{},padrao:"",periodos:[]}));
    const locGravar=L=>{const m={...App.METAS,locacao:L};App.gravarChave("metas",m);Object.assign(App.METAS,m);};
    const per=()=>{const L=locL();$("#lPer").innerHTML=(L.periodos||[]).length?`<table class="tab-lucro"><tr><th>De</th><th>Até</th><th>R$ · 15 dias</th><th></th></tr>${L.periodos.map((x,i)=>`<tr><td><input type="date" data-pi="${i}" data-pc="de" value="${x.de||""}"></td><td><input type="date" data-pi="${i}" data-pc="ate" value="${x.ate||""}"></td><td><input type="number" min="0" step="0.01" inputmode="decimal" data-pi="${i}" data-pc="valor" value="${x.valor??""}" style="width:90px"></td><td><button type="button" class="btn sec sm" data-px="${i}" aria-label="tirar período">×</button></td></tr>`).join("")}</table>`:`<small class="muted">Nenhum período: vale o valor padrão em qualquer data.</small>`;
      $$("[data-pi]").forEach(i=>i.onchange=()=>{const L=locL();const x=L.periodos[+i.dataset.pi];x[i.dataset.pc]=i.dataset.pc==="valor"?(i.value===""?"":+i.value):i.value;locGravar(L);});
      $$("[data-px]").forEach(b=>b.onclick=()=>{const L=locL();L.periodos.splice(+b.dataset.px,1);locGravar(L);per();});};
    per();
    $("#lAdd").onclick=()=>{const L=locL();L.periodos=L.periodos||[];L.periodos.push({de:"",ate:"",valor:""});locGravar(L);per();};
    $("#lPad").onchange=ev=>{const L=locL();L.padrao=ev.target.value===""?"":+ev.target.value;locGravar(L);};
    $$("[data-lk]").forEach(i=>i.onchange=()=>{const L=locL();L.kits=L.kits||{};if(i.value==="")delete L.kits[i.dataset.lk];else L.kits[i.dataset.lk]=+i.value;locGravar(L);});
    (async()=>{const Rv=(await App.reservasLoc()).sort((a,b)=>a.inicio<b.inicio?-1:1);const el=$("#lRes");if(!el)return;
      el.innerHTML=Rv.length?`<table class="tab-lucro"><tr><th>Loja</th><th>Tema</th><th>Período</th><th></th></tr>${Rv.map(r=>`<tr><td>${esc(r.loja||r.slug)}${r.por?`<br><small class="muted">${esc(r.por)}</small>`:""}</td><td>${esc((App.LOC_TEMAS.find(t=>t.id===r.tema)||{}).nome||r.tema)}</td><td>${App.diaBR(r.inicio)} a ${App.diaBR(r.fim)}</td><td><button type="button" class="btn sec sm" data-rx="${esc(r.id)}" aria-label="cancelar reserva">×</button></td></tr>`).join("")}</table>`:`<small class="muted">Nenhum kit reservado.</small>`;
      el.querySelectorAll("[data-rx]").forEach(b=>b.onclick=async()=>{const r=Rv.find(x=>x.id===b.dataset.rx);if(!confirm(`Cancelar a reserva de ${r.loja||r.slug} (${App.diaBR(r.inicio)} a ${App.diaBR(r.fim)})?`))return;await App.reservarLoc({id:r.id,inicio:null});render();});})();
    if(location.hash==="#metas"&&!render._r){render._r=1;setTimeout(()=>{const s=$("#metas");if(s)s.scrollIntoView({block:"start"});},50);}
    $$("#app [data-t]").forEach(b=>b.onclick=()=>{tipoSel=b.dataset.t;localStorage.setItem("rec-tipo",tipoSel);render();});
    $("#rTela").onchange=ev=>{telaAcesa=ev.target.checked;localStorage.setItem("rec-tela",telaAcesa?"1":"0");};
    $$("[data-fi]").forEach(b=>b.onclick=()=>abrirItem(b.dataset.fi));
    if(abrirDepois){const k=abrirDepois;abrirDepois=null;abrirItem(k);}}
  // ---- fornecedores por item: lista, histórico, ativo, edição
  let abrirDepois=null;
  const ITENS=App.ORDEM_ORC.filter(k=>k!=="locacao");
  const TAB_NOME={capacho:"Kapazi · motor do capacho",mostraai:"AI Negócios",falaai:"AI Negócios",inpi:"a definir",carimbo:"tabela GIV",placas:"tabela GIV",bone:"tabela GIV",faixa:"tabela GIV",parede:"tabela GIV"};
  const novoId=()=>"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  async function gravarFornec(F){App.FORNEC=F;await App.gravarChave("fornec",F);}
  const copia=()=>JSON.parse(JSON.stringify(App.FORNEC||{itens:{}}));
  const R$=v=>Number(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
  const resumo=f=>{const t=App.fornTab(f);return [f.whats?"WhatsApp "+f.whats:"",f.email||"",f.prazo?`prazo ${f.prazo} dias`:"",f.frete!==""&&f.frete!=null?`frete ${R$(f.frete)}`:"",
    t.length?(f.modo==="lote"?t.map(x=>`${x[0].toLocaleString("pt-BR")} un. ${R$(x[1])}`).join(" · "):t.map(x=>`${x[0]}+ un. ${R$(x[1])} cada`).join(" · ")):"sem preço",
    f.cores?"cores: "+f.cores:"",f.tecnica?"técnica: "+f.tecnica:"",f.vida?"vida útil: "+f.vida:"",f.obs||""].filter(Boolean).map(esc).join("<br>");};
  function abrirItem(k){const it=App.fornItem(k),nomeI=App.NOME_ORC[k]||k;const fa=it.ativo||"tabela";
    const f=document.createElement("div");f.className="rec-fundo";f.style.zIndex=70;const m=document.createElement("div");m.className="ed-forn";const fecha=()=>{f.remove();m.remove();};
    m.innerHTML=`<h3 style="margin:0 0 4px">${esc(nomeI)}</h3><small class="muted">Toque em "Usar este" para trocar o fornecedor ativo na hora.</small>
      <div class="fo-lista"><div class="fo-c ${fa==="tabela"?"on":""}"><b>${esc(TAB_NOME[k]||"Printi / GIV")}</b><small>tabela do sistema (consulta de 10–11/11)</small>${fa==="tabela"?`<small style="color:var(--marca);font-weight:700">✓ ativo</small>`:`<div class="bts"><button type="button" class="usar" data-usar="tabela">Usar este</button></div>`}</div>
      ${(it.lista||[]).map(x=>`<div class="fo-c ${fa===x.id?"on":""}"><b>${esc(x.nome)}</b><small>${resumo(x)}</small><div class="bts">${fa===x.id?`<span style="color:var(--marca);font-weight:700;font-size:13px;align-self:center">✓ ativo</span>`:`<button type="button" class="usar" data-usar="${x.id}">Usar este</button>`}<button type="button" data-ed="${x.id}">Editar</button>${x.whats?`<a href="https://wa.me/${esc(String(x.whats).replace(/\D/g,"").replace(/^(?!55)/,"55"))}" target="_blank" rel="noopener">WhatsApp</a>`:""}${x.email?`<a href="mailto:${esc(x.email)}">E-mail</a>`:""}</div></div>`).join("")}</div>
      <button type="button" class="btn" data-novo style="min-height:46px">+ Novo fornecedor</button>
      ${(it.hist||[]).length?`<div class="fo-hist"><b>Histórico</b><br>${it.hist.slice(-8).reverse().map(h=>`${esc(h.em.slice(8,10)+"/"+h.em.slice(5,7))} · ${esc(h.t)}`).join("<br>")}</div>`:""}
      <button type="button" class="btn sec" data-x style="min-height:44px;margin-top:10px">Fechar</button>`;
    document.body.append(f,m);f.onclick=fecha;m.querySelector("[data-x]").onclick=fecha;
    const nomeDe=id=>id==="tabela"?(TAB_NOME[k]||"Printi / GIV"):((it.lista||[]).find(x=>x.id===id)||{}).nome||id;
    m.querySelectorAll("[data-usar]").forEach(b=>b.onclick=async()=>{const F=copia();F.itens=F.itens||{};const I=F.itens[k]=F.itens[k]||{lista:[]};const de=I.ativo||"tabela";I.ativo=b.dataset.usar;
      I.hist=[...(I.hist||[]),{em:new Date().toISOString(),t:`ativo: ${nomeDe(de)} → ${nomeDe(b.dataset.usar)}`}];await gravarFornec(F);fecha();abrirDepois=k;render();});
    m.querySelector("[data-novo]").onclick=()=>{fecha();editarForn(k,null);};
    m.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{fecha();editarForn(k,b.dataset.ed);});}
  function editarForn(k,id){const it=App.fornItem(k);const x=id?JSON.parse(JSON.stringify((it.lista||[]).find(y=>y.id===id)||{})):{modo:"unidade",faixas:[[1,""]]};
    // contatos já cadastrados em outros itens (a mesma loja da galeria pode fazer vários itens)
    const todos={};Object.values((App.FORNEC||{}).itens||{}).forEach(I=>(I.lista||[]).forEach(y=>{if(y.nome)todos[y.nome.toLowerCase()]=y;}));
    const f=document.createElement("div");f.className="rec-fundo";f.style.zIndex=70;const m=document.createElement("div");m.className="ed-forn";const fecha=()=>{f.remove();m.remove();};
    const tab=()=>(x.faixas||[]).map((t,i)=>`<div class="fo-tab"><input type="number" min="1" step="1" inputmode="numeric" data-tq="${i}" value="${t[0]??""}" placeholder="a partir de (un.)"><input type="number" min="0" step="0.01" inputmode="decimal" data-tv="${i}" value="${t[1]??""}" placeholder="${x.modo==="lote"?"R$ do pacote":"R$ por unidade"}"><button type="button" class="btn sec sm" data-tx="${i}" style="width:auto;min-height:38px;padding:0 10px">×</button></div>`).join("");
    m.innerHTML=`<h3 style="margin:0">${esc(App.NOME_ORC[k]||k)} · ${id?"editar fornecedor":"novo fornecedor"}</h3>
      <label>Nome</label><input id="fNome" value="${esc(x.nome||"")}" list="fNomes" autocomplete="off"><datalist id="fNomes">${Object.values(todos).map(y=>`<option value="${esc(y.nome)}">`).join("")}</datalist>
      <label>WhatsApp</label><input id="fWhats" value="${esc(x.whats||"")}" inputmode="tel" placeholder="(11) 9…">
      <label>E-mail para pedido</label><input id="fEmail" value="${esc(x.email||"")}" inputmode="email">
      <label>Site / Instagram</label><input id="fSite" value="${esc(x.site||"")}" inputmode="url">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label>Prazo de entrega (dias)</label><input id="fPrazo" type="number" min="0" inputmode="numeric" value="${x.prazo??""}"></div><div><label>Frete (R$)</label><input id="fFrete" type="number" min="0" step="0.01" inputmode="decimal" value="${x.frete??""}"></div></div>
      <label>Como cobra</label><select id="fModo"><option value="unidade" ${x.modo!=="lote"?"selected":""}>Por unidade (preço cai com a quantidade)</option><option value="lote" ${x.modo==="lote"?"selected":""}>Pacote fechado (ex.: 500 cartões)</option></select>
      <label id="fTabRot">${x.modo==="lote"?"Pacotes: quantidade e preço do pacote":"Preço por unidade a partir de cada quantidade"}</label><div id="fTab" style="display:grid;gap:6px">${tab()}</div><button type="button" class="btn sec sm" id="fTabMais" style="margin-top:6px;min-height:38px">+ faixa de quantidade</button>
      <label>Cores que produz</label><input id="fCores" value="${esc(x.cores||"")}">
      <label>Técnica de produção</label><input id="fTec" value="${esc(x.tecnica||"")}" placeholder="ex.: silk, DTF, sublimação, bordado">
      <label>Vida útil do produto</label><input id="fVida" value="${esc(x.vida||"")}" placeholder="ex.: 2 anos ao sol">
      <label>Observações</label><textarea id="fObs" rows="3">${esc(x.obs||"")}</textarea>
      <div style="display:grid;grid-template-columns:${id?"1fr 1fr 1fr":"1fr 2fr"};gap:8px;margin-top:12px">${id?`<button type="button" class="btn sec" id="fDel" style="min-height:46px">Tirar</button>`:""}<button type="button" class="btn sec" id="fX" style="min-height:46px">Cancelar</button><button type="button" class="btn" id="fOk" style="min-height:46px">Salvar</button></div>`;
    document.body.append(f,m);f.onclick=fecha;
    const ler=()=>{x.faixas=[...m.querySelectorAll("[data-tq]")].map((q,i)=>[q.value===""?"":+q.value,m.querySelector(`[data-tv="${i}"]`).value===""?"":+m.querySelector(`[data-tv="${i}"]`).value]);};
    const ligarTab=()=>{m.querySelectorAll("[data-tx]").forEach(b=>b.onclick=()=>{ler();x.faixas.splice(+b.dataset.tx,1);m.querySelector("#fTab").innerHTML=tab();ligarTab();});};ligarTab();
    m.querySelector("#fTabMais").onclick=()=>{ler();x.faixas.push(["",""]);m.querySelector("#fTab").innerHTML=tab();ligarTab();};
    m.querySelector("#fModo").onchange=ev=>{ler();x.modo=ev.target.value;m.querySelector("#fTabRot").textContent=x.modo==="lote"?"Pacotes: quantidade e preço do pacote":"Preço por unidade a partir de cada quantidade";m.querySelector("#fTab").innerHTML=tab();ligarTab();};
    m.querySelector("#fNome").onchange=ev=>{const y=todos[ev.target.value.trim().toLowerCase()];if(!y)return;[["fWhats","whats"],["fEmail","email"],["fSite","site"]].forEach(([i,c])=>{const el=m.querySelector("#"+i);if(!el.value&&y[c])el.value=y[c];});};
    m.querySelector("#fX").onclick=()=>{fecha();abrirItem(k);};
    if(id)m.querySelector("#fDel").onclick=async()=>{if(!confirm(`Tirar ${x.nome} de ${App.NOME_ORC[k]||k}? Fica registrado no histórico.`))return;const F=copia();const I=F.itens[k];I.lista=I.lista.filter(y=>y.id!==id);if(I.ativo===id)I.ativo="tabela";I.hist=[...(I.hist||[]),{em:new Date().toISOString(),t:`tirou ${x.nome}`}];await gravarFornec(F);fecha();abrirDepois=k;render();};
    m.querySelector("#fOk").onclick=async()=>{ler();const nome=m.querySelector("#fNome").value.trim();if(!nome){alert("Falta o nome do fornecedor.");return;}
      const v=sel=>m.querySelector(sel).value.trim();const num=sel=>v(sel)===""?"":+v(sel);
      const novo={...x,id:id||novoId(),nome,whats:v("#fWhats"),email:v("#fEmail"),site:v("#fSite"),prazo:num("#fPrazo"),frete:num("#fFrete"),modo:v("#fModo"),faixas:x.faixas.filter(t=>t[0]!==""||t[1]!==""),cores:v("#fCores"),tecnica:v("#fTec"),vida:v("#fVida"),obs:v("#fObs"),criado:x.criado||new Date().toISOString(),atualizado:new Date().toISOString()};
      const F=copia();F.itens=F.itens||{};const I=F.itens[k]=F.itens[k]||{lista:[]};I.lista=I.lista||[];const i=I.lista.findIndex(y=>y.id===novo.id);
      if(i>=0){I.lista[i]=novo;I.hist=[...(I.hist||[]),{em:new Date().toISOString(),t:`atualizou ${nome}`}];}else{I.lista.push(novo);I.hist=[...(I.hist||[]),{em:new Date().toISOString(),t:`cadastrou ${nome}`}];}
      await gravarFornec(F);fecha();abrirDepois=k;render();};}
  render();
})();
</script>
</body>
</html>
