<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Visita</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=db7f6df133">
<style>
.cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fach{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--lav2);display:grid;place-items:center;position:relative}
.fach img{width:100%;height:100%;object-fit:cover;display:block}
.fach .sel{position:absolute;left:10px;bottom:10px;background:rgba(20,28,58,.75);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.fach .vazio{color:var(--texto2);text-align:center;font-size:15px}
.fontes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 12px}
.fontes .btn.sec{min-height:50px;font-size:16px;text-decoration:none}
.fato{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--linha);font-size:15px}
.prods-p{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.prods-p figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;border:2px solid var(--linha);position:relative;cursor:pointer}
.prods-p img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:#fff;pointer-events:none}
.prods-p figcaption{font-size:13px;font-weight:600;padding:6px 8px}
.prods-p .ck{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:rgba(20,16,36,.35);color:transparent;display:grid;place-items:center;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.prods-p .tst{position:absolute;left:8px;top:8px;background:rgba(20,16,36,.78);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:5px 10px;text-decoration:none;z-index:2}
.prods-p figure.on{border-color:var(--marca);box-shadow:0 0 0 3px rgba(105,51,197,.18)}.prods-p figure.on .ck{background:var(--marca);color:#fff}
.passos.fila-p{border:0;padding:10px 14px}.passos.fila-p ol{margin:0}.passos.fila-p li{min-width:0}
.fato:first-of-type{border-top:0}.fato span{color:var(--texto2)}.fato .lk{color:var(--marca);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
.ln-o{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--linha);font-size:15px}.ln-o:last-child{border-bottom:0}
.grade-nb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}.grade-nb .btn{min-height:56px;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.ops-s{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ops-s button{min-height:56px;border:1.5px solid var(--linha);background:#fff;border-radius:12px;font:inherit;font-size:14px;font-weight:600;color:var(--texto);padding:6px}.ops-s button.on{background:var(--marca);border-color:var(--marca);color:#fff}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=db7f6df133"></script>
<script src="qr.js?v=db7f6df133"></script>
<script src="../pdfmini.js?v=db7f6df133"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,ficha,estrelasHTML,estado,salvar,nav,topo,voltar,setorNome,nomeLoja,telFmt,cliente,gravarCliente,classificar,definirCliente,menuLongo,ligarLongo,ZONA,entradas,ligarEntradas,abrirLogotipo,logoPrincipal,removerLogo}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("rota")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);try{localStorage.setItem("app-ultima-loja",JSON.stringify({slug,nome}));}catch(e){}
  const cad=await ficha(slug);const L=(cad&&cad.lacunas)||{};const base=`/dados/captacao/${App.zonaDe(slug)}/`;
  let c=await cliente(l);
  const abs=s=>/^(data:|https?:)/.test(s)?s:(s.startsWith("/")?location.origin+s:location.origin+base+s);
  // candidatos: imagens que a varredura trouxe (logotipo sugerido, referências do local, fotos da web) + o que o representante já guardou
  function candidatos(){const vistos=new Set(),out=[];const add=(src,fonte,papel)=>{if(!src)return;const a=abs(src);if(vistos.has(a)||(c.descartadas||[]).includes(a))return;vistos.add(a);out.push({src:a,fonte,papel});};
    (c.logos||[]).forEach(x=>add(x.src,x.nome,"logotipo"));if(c.fachada)add(c.fachada.src,"fachada","fachada");(c.produtos||[]).forEach(x=>add(x.src,x.fonte,"produto"));(c.arquivo||[]).forEach(x=>add(x.src,x.fonte,"arquivo"));
    ((L.logoOriginal||{}).opcoes||[]).forEach(o=>add(o.img,o.legenda,null));((L.fachada||{}).referencias||[]).forEach(r=>add(r,"referência pública",null));
    return out;}
  const horarioHoje=h=>{if(!h)return null;const d=["dom","seg","ter","qua","qui","sex","sáb"][new Date().getDay()];const m=h.split(" · ").find(p=>p.startsWith(d));return m?m.replace(d,"").trim():null;};
  const cn=L.nome_curiosidade||{};const curios=[cn.valor,(L.sobre||{}).valor].filter(Boolean);
  const leitura=(L.leitura||{}).valor||"";const desde=(leitura.match(/desde (\d{4})/)||[])[1];const razao=(leitura.match(/Razão social: ([^·]+)/)||[])[1];
  const AV=L.avaliacoes||{};const GAT=(AV.gatilhos||[]);const ganchos=GAT.map(g=>g.tema);
  const PROD_NOME={capacho:"Capacho",placas:"Placa de preços",placa:"Placa",adesivos:"Adesivos",uniformes:"Uniformes",telefonia:"Atendente virtual (telefone/WhatsApp)",identidade:"Identidade visual completa",cardapio:"Cardápio"};
  const prodNomes=p=>String(p||"").split("+").map(x=>PROD_NOME[x]||x).join(" + ");
  // quebra-gelo: curiosidade + o que as avaliações sustentam; sem avaliação negativa, entra o padrão do setor
  const falaGelo=()=>[`${nome}.`,...curios,...GAT.map(g=>`Nas avaliações falam de ${g.tema}: "${(g.trecho||"").replace(/…/g,"")}". ${g.argumento}`)].join(" ");
  // ---- atendimento: início e fim marcados aqui; o tempo de cada loja alimenta média, ciclo e conversão (chip de metas)
  const fmtT=ms=>{const s=Math.max(0,Math.floor(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;};
  function atendHTML(){const A=(estado().atend||{})[slug]||{};
    if(modo==="play")return A.ini&&!A.fim?`<div class="atend rodando"><div class="t"><small>Em atendimento</small><b id="atT">${fmtT(Date.now()-new Date(A.ini))}</b></div></div>`:"";
    if(A.ini&&!A.fim)return `<div class="atend rodando"><div class="t"><small>Em atendimento</small><b id="atT">${fmtT(Date.now()-new Date(A.ini))}</b></div><button type="button" class="fim" id="atFim">Terminar atendimento</button></div>`;
    if(A.ini&&A.fim)return `<div class="atend"><div class="t"><small>Atendimento feito</small><b>${Math.max(1,Math.round((new Date(A.fim)-new Date(A.ini))/6e4))} min</b></div><button type="button" class="ini" id="atIni" style="background:var(--lav);color:var(--marca)">Recomeçar</button></div>`;
    return `<div class="atend"><div class="t"><small>Atendimento</small><b>Não iniciado</b></div><button type="button" class="ini" id="atIni">Iniciar atendimento</button></div>`;}
  setInterval(()=>{const t=document.getElementById("atT");const A=(estado().atend||{})[slug];if(t&&A&&A.ini&&!A.fim)t.textContent=fmtT(Date.now()-new Date(A.ini));},1000);
  document.addEventListener("click",ev=>{const ini=ev.target.closest&&ev.target.closest("#atIni"),fim=ev.target.closest&&ev.target.closest("#atFim");if(!ini&&!fim)return;const e=estado();e.atend=e.atend||{};const agora=new Date().toISOString();
    if(ini){// outra loja em andamento termina agora
      for(const [s,x] of Object.entries(e.atend))if(s!==slug&&x&&x.ini&&!x.fim)x.fim=agora;
      e.atend[slug]={ini:agora};}
    else{e.atend[slug]={...e.atend[slug],fim:agora};if(!(e.feitas||[]).includes(slug))e.feitas=[...(e.feitas||[]),slug];}
    salvar(e);const y=scrollY;render();scrollTo(0,y);});
  // ---- mensagens do cliente (painel dele / Mostraí): conversa no servidor; abrir a loja marca como lidas
  let MSGS=[];try{const r=await fetch(`/api/mensagens/${encodeURIComponent(slug)}`,{credentials:"same-origin",cache:"no-store"});if(r.ok)MSGS=(await r.json()).mensagens||[];}catch(err){}
  if(MSGS.some(m=>!m.lida)){fetch(`/api/mensagens/${encodeURIComponent(slug)}/lidas`,{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"}).then(()=>{try{window.top.postMessage({genio:"avisos"},location.origin);}catch(err){}}).catch(()=>{});}
  const hora=iso=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});};
  function mensagensHTML(){const novas=MSGS.filter(m=>!m.lida).length;
    return `<section class="card msgs" id="mensagens"><h2>Mensagens${novas?` <small style="color:#C62828;font-weight:700;font-size:14px">· ${novas} nova(s)</small>`:""}</h2>
      ${MSGS.length?`<div class="conv">${MSGS.slice(-30).map(m=>`<div class="m ${m.de}"><p>${esc(m.texto)}</p><small>${m.de==="cliente"?"Cliente":esc(m.por||"Você")}${m.canal?" · "+esc(m.canal):""} · ${hora(m.em)}</small></div>`).join("")}</div>`:`<p class="muted" style="margin:0 0 8px">Nenhuma mensagem. O cliente fala com você pelo painel dele (telefone + código, logo abaixo).</p>`}
      <div class="resp"><textarea id="respTxt" rows="2" placeholder="Responder ao cliente"></textarea><button type="button" class="btn sm" id="respEnviar" style="width:auto;padding:0 16px">Enviar</button></div></section>`;}
  document.addEventListener("click",async ev=>{if(!ev.target.closest||!ev.target.closest("#respEnviar"))return;const t=$("#respTxt");const v=t.value.trim();if(!v)return;const b=$("#respEnviar");b.disabled=true;
    try{const r=await fetch(`/api/mensagens/${encodeURIComponent(slug)}`,{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({texto:v})});if(!r.ok)throw 0;MSGS.push(await r.json());const y=scrollY;render();scrollTo(0,y);}catch(err){b.disabled=false;alert("Não foi: confira a internet.");}});
  // ---- pesquisa rápida da loja: um toque por resposta, grava no servidor na hora
  const SEGS=["cafeteria","restaurante","bar","padaria","mercado/hortifruti","cereais/empório","salão/barbearia","estética","clínica/consultório","farmácia","ótica","pet","loja de roupas/calçados","floricultura/presentes","academia/estúdio","autopeças/oficina","celular/assistência","escritório/imobiliária","escola/curso","embalagens/utilidades","comércio"];
  const PQ=[["degrau","Degrau na entrada",["Não","1 degrau","2 ou mais"]],["alaga","Alaga ou pega chuva na porta",["Não","Sim"]],["porta","Porta abre para",["Dentro","Fora","De correr","Sem porta"]],["vitrine","Vitrine de vidro",["Não","Sim"]],["mesas","Mesinhas na calçada",["Não","Sim"]],["movimento","Movimento agora",["Fraco","Médio","Forte"]],["dono","Quem decide está na loja",["Sim","Não","Volta depois"]]];
  const JA=["Capacho","Banner","Faixa","Placa","Adesivo na vitrine","Wind banner","Uniforme","TV ou cardápio na parede"];
  function pesquisaHTML(){const p=c.pesquisa||{};const ja=p.ja||[];const feitas=PQ.filter(([k])=>p[k]).length+(p.jaVisto?1:0);
    // formulário "como é a loja" retirado a pedido do dono (14/11); fica só o segmento
    return `<section class="card pesq" id="pesq"><h2>Segmento</h2>
      <label class="pq-l">Segmento${l.setorSugerido&&l.setorSugerido!==l.setor?` <small class="muted">· sugerido: ${esc(setorNome(l.setorSugerido))}</small>`:""}</label>
      <select id="pqSetor">${SEGS.concat(SEGS.includes(l.setor)?[]:[l.setor]).map(s=>`<option value="${esc(s)}" ${s===l.setor?"selected":""}>${esc(setorNome(s))}</option>`).join("")}</select>
</section>`;}
  async function gravarPesquisa(mud){c=await cliente(l);c.pesquisa={...(c.pesquisa||{}),...mud,em:new Date().toISOString()};await gravarCliente(c);const y=scrollY;render();scrollTo(0,y);}
  document.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest("#pesq button");if(!b)return;const p=c.pesquisa||{};
    if(b.dataset.pq)gravarPesquisa({[b.dataset.pq]:p[b.dataset.pq]===b.dataset.v?"":b.dataset.v});
    else if("ja" in b.dataset){const o=b.dataset.ja;let ja=(p.ja||[]).slice();if(!o)ja=[];else ja=ja.includes(o)?ja.filter(x=>x!==o):ja.concat(o);gravarPesquisa({ja,jaVisto:true});}});
  document.addEventListener("change",ev=>{if(ev.target.id!=="pqSetor")return;l.setorSugerido=l.setorSugerido||l.setor;l.setor=ev.target.value;gravarPesquisa({setor:l.setor,setorSugerido:l.setorSugerido});});
  // ---- percurso passo a passo: em rota (▶) é a visita; fora dela é o preparo da loja (decisão do dono, 10/11)
  const emRotaAgora=()=>Object.values(estado().jornadas||{}).some(j=>j&&j.status==="andando");
  // ▶ Play (14/11): esta mesma tela, aberta pelo Play na loja da vez; os produtos com o logotipo entram no lugar da imagem e são selecionados aqui
  const PLAY=qs.get("de")==="play";const RP=PLAY?App.rotaDoPlay():null;const diaP=RP&&RP[0];
  const modo=PLAY&&RP?"play":qs.get("modo")||(emRotaAgora()?"visita":"preparo");
  const Rp=()=>{const X=((estado().rotas||{})[diaP])||{slugs:[]};X.res=X.res||{};X.chegou=X.chegou||{};X.orc=X.orc||{};return X;};
  const filaP=()=>{const e=estado();const arq=new Set(e.arquivadas||[]);return (Rp().slugs||[]).filter(s=>D.lojas.some(x=>x.slug===s)&&!arq.has(s));};
  const PNOME={capacho:"Capacho",placas:"Placa",adesivos:"Adesivo de vitrine",uniformes:"Camisa polo",impressos:"Cartão de visita",panfleto:"Flyer",banners:"Banner retrátil",parede:"Adesivo de parede",brindes:"Ecobag",carimbo:"Carimbo",windbanner:"Wind banner",faixa:"Faixa",folheto:"Folheto",camiseta:"Camiseta",bone:"Boné",avental:"Avental"};
  const pnome=k=>(PNOME[App.baseId(k)]||k)+(String(k).includes("~")?" · "+String(k).split("~")[1]:"");
  const selP=()=>((estado().sel||{})[slug])||{};const nSelP=()=>Object.entries(selP()).filter(([k,v])=>v&&v.q>0&&((c.artes||{})[k]||App.ehServico(k))).length;
  function filaHTML(){const f=filaP();const X=Rp();const i=f.indexOf(slug);const x=App.dataCurta(diaP);
    return `<div class="passos fila-p"><div class="t"><span>${diaP===App.hojeISO()?"Rota de hoje":`Rota de ${x.sem} ${x.dia}/${x.mes}`} · loja ${i+1} de ${f.length}</span><b>${f.filter(s=>X.res[s]).length} feita(s)</b></div><ol>${f.map(s=>`<li class="${X.res[s]?"ok":s===slug?"agora":""}"></li>`).join("")}</ol></div>`;}
  let KIT14=null;App.carregarScript("kits14.js?v=db7f6df133").then(()=>{KIT14=window.Kits14;if(modo==="play"&&ETL===1){const y=scrollY;render();scrollTo(0,y);}}).catch(()=>{});
  const kGrupo="grupo-"+slug;let GRUPO_AB=(()=>{try{return sessionStorage.getItem(kGrupo)||"";}catch(e){return "";}})();  // começa com os 5 fechados: todos à vista, com o mesmo peso
  const qsL=`l=${encodeURIComponent(slug)}`;
  function conteudoGrupo(g){const S=selP();
    if(g==="personalizacao"){const A=Object.entries(c.artes||{}).filter(([k])=>App.grupoDe(k)==="personalizacao").map(([k,a])=>({k,src:a&&(a.contexto||a.png||a.pngArte)})).filter(x=>x.src);const pronto=!!(c.manual&&c.manual.editado);
      return A.length?`<p class="muted" style="margin:0 0 8px;font-size:13px">Toque para escolher · o selo do canto testa a peça.</p><div class="prods-p">${A.map(x=>`<figure data-pp="${esc(x.k)}" class="${S[x.k]&&S[x.k].q>0?"on":""}"><img src="${esc(x.src)}" alt="" loading="lazy"><span class="ck">✓</span>${testeP(x.k)}<figcaption>${esc(pnome(x.k))}</figcaption></figure>`).join("")}</div><a class="sv-lk" href="produtos.html?${qsL}&de=play&g=personalizacao">Cores, tamanhos e quantidades →</a>`
        :pronto?`<p class="muted" style="margin:0 0 10px">Os produtos ainda não foram gerados com este logotipo.</p><button class="btn sec" type="button" id="gerarP">✦ Gerar os produtos agora</button>`
        :`<p class="muted" style="margin:0">O logotipo ainda não foi recortado. A personalização abre depois do recorte (Rota, etapa 3, ou Logotipo, logo abaixo). Os serviços já podem ser oferecidos.</p>`;}
    if(g==="mostraai"){const v=S.mostraai,on=!!(v&&v.q>0);const img=KIT14?`/brand/mostrai/JPG/${KIT14.kitDe(l.setor)}_Mostrai.jpg`:"";
      return `${img?`<img class="sv-ref" src="${img}" alt="Mostraí numa loja do mesmo ramo" loading="lazy">`:""}<div class="sv-planos">${App.MOSTRAI_PLANOS.map(p=>`<button type="button" data-plano-m="${p.id}" class="${on&&(v.plano||"comodato")===p.id?"on":""}"><b>${p.rot}</b><small>${p.txt}</small></button>`).join("")}</div>
        <p class="sv-nota">${on?"✓ No orçamento. Toque no plano escolhido para tirar.":"Toque num plano para pôr no orçamento."} A TV é do lojista; a GênIO liga e configura o aparelho.</p>
        <a class="sv-lk" href="produtos.html?${qsL}&de=play&g=mostraai#acionar">📺 Ligar a TV de demonstração (link e QR)</a>
        <a class="sv-lk" href="produtos.html?${qsL}&de=play&g=mostraai#cardapio">📷 Fotografar o cardápio da loja</a>`;}
    if(g==="falaai"||g==="inpi"){const v=S[g],on=!!(v&&v.q>0);
      return `<p class="sv-nota" style="margin-top:0">${g==="falaai"?"O telefone da loja atendido com o nome dela, com frases gravadas no sistema. Preço e número de demonstração: a definir.":"Pedido de registro do nome e do logotipo no INPI. Preço: a confirmar."}</p><button type="button" class="sv-tog ${on?"on":""}" data-svtog="${g}">${on?"✓ No orçamento · tocar para tirar":"Pôr no orçamento"}</button>`;}
    if(g==="locacao"){const v=S.locacao||{},tema=v.tema||"liquidacao";
      return `<div class="prods-p" style="grid-template-columns:1fr 1fr">${App.LOC_IMG.map(u=>`<figure style="cursor:default"><img src="${u}" alt="" loading="lazy"></figure>`).join("")}</div>
        <div class="sv-temas">${App.LOC_TEMAS.map(t=>`<button type="button" data-loc-tema="${t.id}" class="${t.id===tema?"on":""}">${esc(t.nome)}</button>`).join("")}</div>
        <a class="sv-lk" href="produtos.html?${qsL}&de=play&g=locacao#p-locacao">📅 ${v.inicio?`Retira ${App.diaBR(v.inicio)} · devolve ${App.diaBR(App.locFim(v.inicio))} · mudar`:"Escolher o dia da retirada"}</a>`;}
    return "";}
  function prodsPlayHTML(){const S=selP();const artes=c.artes||{};const pri=Object.values(artes).map(a=>a&&(a.contexto||a.png)).find(Boolean)||(c.manual&&c.manual.tratado)||"";
    return `<section class="card" id="prodsP" style="padding:12px"><h2 style="margin:0 0 10px">O que oferecer nesta loja</h2>
      ${App.gruposHTML({S,artes,aberto:GRUPO_AB,img:{personalizacao:pri,mostraai:KIT14?`/brand/mostrai/JPG/${KIT14.kitDe(l.setor)}_Mostrai.jpg`:"",locacao:App.LOC_IMG[1]},conteudo:conteudoGrupo})}</section>`;}
  // teste de cada produto sem sair do fluxo do Play: capacho no chão (cartão Gênio), vestíveis no Provar, o resto no editor do produto
  function testeP(k){const b=App.baseId(k),q=`l=${encodeURIComponent(slug)}`;
    if(b==="capacho")return `<a class="tst" data-tst href="capacho.html?${q}&n=${encodeURIComponent(nome)}&ver=1&de=play">📷 Testar no chão</a>`;
    if(["uniformes","camiseta","bone","avental"].includes(b))return `<a class="tst" data-tst href="provar.html?${q}&p=${encodeURIComponent(k)}&de=play">👕 Provar</a>`;
    return `<a class="tst" data-tst href="produtos.html?${q}&de=play#p-${encodeURIComponent(k)}">✎ Editar</a>`;}

    $$("[data-passo]").forEach(b=>b.addEventListener("click",ev=>{const k=b.dataset.passo;
      if(k==="ini"){const a=document.getElementById("atIni");if(a)a.click();}
      else if(k==="verloja"){const el=document.getElementById("pesq");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}
      else if(k==="verlogo"){const el=document.getElementById("logoArea");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}
      else if(k==="lojaok")marca({lojaOk:true});
      else if(k==="apres"){ev.preventDefault();const e=estado();e.atend=e.atend||{};e.atend[slug]={...(e.atend[slug]||{}),apres:true};Promise.resolve(salvar(e)).finally(()=>{location.href=b.href;});}
      else if(k==="verres"){const el=document.getElementById("resultado");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});}
      else if(k==="fim"){const A=(estado().atend||{})[slug]||{};if(!A.res){alert("Antes de encerrar, registre o resultado da visita.");const el=document.getElementById("resultado");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});return;}const a=document.getElementById("atFim");if(a)a.click();}
      else if(k==="pronta"){const e=estado();e.preparadas={...(e.preparadas||{}),[slug]:hojeI()};salvar(e);const y=scrollY;render();scrollTo(0,y);}}));
    $$("[data-res]").forEach(b=>b.onclick=async()=>{const k=b.dataset.res;
      if(k==="voltar"){const am=(()=>{const d=new Date(hojeI()+"T12:00:00");do{d.setDate(d.getDate()+1);}while(d.getDay()===0||d.getDay()===6);return d.toISOString().slice(0,10);})();
        const iso=prompt("Voltar em que dia? (AAAA-MM-DD)",am);if(!iso||!/^\d{4}-\d{2}-\d{2}$/.test(iso))return;App.reagendarLoja(slug,iso);marca({res:"voltar",volta:iso});return;}
      marca({res:k,motivo:k==="sem"?((estado().atend||{})[slug]||{}).motivo||null:null});});
    $$("[data-mot]").forEach(b=>b.onclick=()=>marca({motivo:b.dataset.mot}));
    const ap=$("#aprovarLogo");if(ap)ap.onclick=async()=>{ap.disabled=true;ap.textContent="Aprovando…";const r=await App.aprovarLogo(l);if(r&&!r.ok&&!r.ja)alert("Aprovado. O recorte automático não saiu agora ("+r.motivo+"); use ✂ Editar ou tente de novo.");location.reload();};
    const ra=$("#recAuto");if(ra)ra.onclick=async()=>{ra.disabled=true;ra.textContent="Recortando…";const r=await App.recortarLogo(l);if(!r.ok){alert("Não consegui: "+r.motivo);ra.disabled=false;ra.textContent="✦ Recorte automático";return;}c=await cliente(l);render();};
    const nl=$("#nomeLogo");if(nl)nl.onclick=async()=>{const cv=document.createElement("canvas");const g=cv.getContext("2d");const linhas=nome.length>18?nome.split(/\s+(?=\S+$)|\s-\s| · /).filter(Boolean):[nome];const tam=120;g.font=`700 ${tam}px Rubik, system-ui, sans-serif`;const w=Math.ceil(Math.max(...linhas.map(t=>g.measureText(t).width))+tam*0.6);cv.width=w;cv.height=Math.ceil(linhas.length*tam*1.2+tam*0.5);const g2=cv.getContext("2d");g2.font=`700 ${tam}px Rubik, system-ui, sans-serif`;g2.fillStyle="#1C1635";g2.textAlign="center";g2.textBaseline="top";linhas.forEach((t,i)=>g2.fillText(t,w/2,tam*0.25+i*tam*1.2));
      const png=cv.toDataURL("image/png");c=await cliente(l);c.logos=[{id:"nome"+Date.now().toString(36),src:png,nome:"Logotipo · nome em texto",origem:"nome",largura:cv.width,altura:cv.height,tratado:true,em:new Date().toISOString()},...(c.logos||[])];c.manual={editado:true,tratado:png,largura:cv.width,altura:cv.height,cores:[],camadas:[{nome:"Nome",png}],em:new Date().toISOString()};await gravarCliente(c);render();};const eb=$("#editarLogo");if(eb)eb.onclick=editar;// seguir nunca volta para o editor: se ainda falta tirar o fundo, o recorte automático roda aqui e o vendedor vai para os produtos
    const sp=$("#seguirProd");if(sp)sp.onclick=async()=>{sp.disabled=true;sp.textContent="Tirando o fundo…";const r=await App.recortarLogo(l);
      if(r.ok){location.href=`produtos.html?l=${encodeURIComponent(slug)}`;return;}sp.disabled=false;sp.textContent="Produtos e serviços →";alert("Não consegui tirar o fundo sozinho ("+r.motivo+"). Use ✂ Editar e salve; depois é só seguir.");};
    ligarEntradas(document,l,null,async()=>{c=await cliente(l);render();});
    if(location.hash==="#mensagens"&&!render._rolou){render._rolou=true;setTimeout(()=>{const m=document.getElementById("mensagens");if(m)m.scrollIntoView({block:"start"});},60);}
    $$(".logos figure").forEach(fg=>{let longo=false;fg.addEventListener("pointerdown",()=>{longo=false;});fg.addEventListener("longo",()=>{longo=true;});fg.onclick=async()=>{if(longo)return;await logoPrincipal(l,fg.dataset.id);c=await cliente(l);render();};});
    ligarLongo(document,async el=>{
      if(el.dataset.id&&el.closest(".logos")){el.dispatchEvent(new Event("longo"));const k=await menuLongo("Este logotipo…",[{k:"usar",ic:"✦",t:"Usar como principal"},{k:"editar",ic:"✂",t:"Editar"},{k:"remover",ic:"🗑",t:"Remover"}]);if(!k)return;
        const x=(c.logos||[]).find(y=>y.id===el.dataset.id);if(k==="editar"&&x)return abrirLogotipo(slug,x.src,(x.nome||"").replace(/^Logotipo ?·? ?/,""),"visita");if(k==="usar")await logoPrincipal(l,el.dataset.id);if(k==="remover")await removerLogo(l,el.dataset.id);c=await cliente(l);render();return;}
      const src=el.dataset.src;if(!src)return;
      const k=await menuLongo("Esta imagem é…",[{k:"logotipo",ic:"✦",t:"Logotipo"},{k:"fachada",ic:"🏬",t:"Fachada"},{k:"arquivo",ic:"🗂",t:"Imagem de arquivo"},{k:"produto",ic:"🛍",t:"Foto de produto"},{k:"descartar",ic:"🗑",t:"Descartar"}]);
      if(!k)return;await classificar(l,src,k,el.dataset.fonte||"");c=await cliente(l);
      if(k==="logotipo"){abrirLogotipo(slug,src,el.dataset.fonte||"","visita");return;}
      render();});
  }
  render();
})();
</script>
