<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Visita</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=8ae06ec8aa">
<style>
.cab{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.fach{width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:var(--lav2);display:grid;place-items:center;position:relative}
.fach img{width:100%;height:100%;object-fit:cover;display:block}
.fach .sel{position:absolute;left:10px;bottom:10px;background:rgba(20,28,58,.75);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.fach .vazio{color:var(--texto2);text-align:center;font-size:15px}
.fontes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 12px}
.fontes .btn.sec{min-height:50px;font-size:16px;text-decoration:none}
.fato{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:6px 0;border-top:1px solid var(--linha);font-size:15px}
.fato:first-of-type{border-top:0}.fato span{color:var(--texto2)}.fato .lk{color:var(--marca);text-decoration:underline;text-underline-offset:3px;word-break:break-all}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="app.js?v=8ae06ec8aa"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,ficha,estrelasHTML,estado,salvar,nav,topo,voltar,setorNome,nomeLoja,telFmt,cliente,gravarCliente,classificar,definirCliente,menuLongo,ligarLongo,ZONA,entradas,ligarEntradas,abrirLogotipo,logoPrincipal,removerLogo}=App;
  if(!await sessao())return;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("rota")}`;return;}
  const nome=nomeLoja(l.nome);definirCliente(l);try{localStorage.setItem("app-ultima-loja",JSON.stringify({slug,nome}));}catch(e){}
  const cad=await ficha(slug);const L=(cad&&cad.lacunas)||{};const base=`/dados/captacao/${App.zonaDe(slug)}/`;
  let c=await cliente(l);
  const abs=s=>/^(data:|https?:)/.test(s)?s:(s.startsWith("/")?location.origin+s:location.origin+base+s);
  // candidatos: imagens que a varredura trouxe (logotipo sugerido, referências do local, fotos da web) + o que o representante já guardou
  function candidatos(){const vistos=new Set(),out=[];const add=(src,fonte,papel)=>{if(!src)return;const a=abs(src);if(vistos.has(a)||(c.descartadas||[]).includes(a))return;vistos.add(a);out.push({src:a,fonte,papel});};
    (c.logos||[]).forEach(x=>add(x.src,x.nome,"logotipo"));if(c.fachada)add(c.fachada.src,"fachada","fachada");(c.produtos||[]).forEach(x=>add(x.src,x.fonte,"produto"));(c.arquivo||[]).forEach(x=>add(x.src,x.fonte,"arquivo"));
    ((L.logoOriginal||{}).opcoes||[]).forEach(o=>add(o.img,o.legenda,null));((L.fachada||{}).referencias||[]).forEach(r=>add(r,"referência pública",null));
    return out;}
  const horarioHoje=h=>{if(!h)return null;const d=["dom","seg","ter","qua","qui","sex","sáb"][new Date().getDay()];const m=h.split(" · ").find(p=>p.startsWith(d));return m?m.replace(d,"").trim():null;};
  const cn=L.nome_curiosidade||{};const curios=[cn.valor,(L.sobre||{}).valor].filter(Boolean);
  const leitura=(L.leitura||{}).valor||"";const desde=(leitura.match(/desde (\d{4})/)||[])[1];const razao=(leitura.match(/Razão social: ([^·]+)/)||[])[1];
  const AV=L.avaliacoes||{};const GAT=(AV.gatilhos||[]);const ganchos=GAT.map(g=>g.tema);
  const PROD_NOME={capacho:"Capacho",placas:"Placa de preços",placa:"Placa",adesivos:"Adesivos",uniformes:"Uniformes",telefonia:"Atendente virtual (telefone/WhatsApp)",identidade:"Identidade visual completa",cardapio:"Cardápio"};
  const prodNomes=p=>String(p||"").split("+").map(x=>PROD_NOME[x]||x).join(" + ");
  // quebra-gelo: curiosidade + o que as avaliações sustentam; sem avaliação negativa, entra o padrão do setor
  const falaGelo=()=>[`${nome}.`,...curios,...GAT.map(g=>`Nas avaliações falam de ${g.tema}: "${(g.trecho||"").replace(/…/g,"")}". ${g.argumento}`)].join(" ");
  // ---- mensagens do cliente (painel dele / Mostraí): conversa no servidor; abrir a loja marca como lidas
  let MSGS=[];try{const r=await fetch(`/api/mensagens/${encodeURIComponent(slug)}`,{credentials:"same-origin",cache:"no-store"});if(r.ok)MSGS=(await r.json()).mensagens||[];}catch(err){}
  if(MSGS.some(m=>!m.lida)){fetch(`/api/mensagens/${encodeURIComponent(slug)}/lidas`,{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"}).then(()=>{try{window.top.postMessage({genio:"avisos"},location.origin);}catch(err){}}).catch(()=>{});}
  const hora=iso=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});};
  function mensagensHTML(){const novas=MSGS.filter(m=>!m.lida).length;
    return `<section class="card msgs" id="mensagens"><h2>Mensagens${novas?` <small style="color:#C62828;font-weight:700;font-size:14px">· ${novas} nova(s)</small>`:""}</h2>
      ${MSGS.length?`<div class="conv">${MSGS.slice(-30).map(m=>`<div class="m ${m.de}"><p>${esc(m.texto)}</p><small>${m.de==="cliente"?"Cliente":esc(m.por||"Você")}${m.canal?" · "+esc(m.canal):""} · ${hora(m.em)}</small></div>`).join("")}</div>`:`<p class="muted" style="margin:0 0 8px">Nenhuma mensagem. O cliente fala com você pelo painel dele (link do Mostraí).</p>`}
      <div class="resp"><textarea id="respTxt" rows="2" placeholder="Responder ao cliente"></textarea><button type="button" class="btn sm" id="respEnviar" style="width:auto;padding:0 16px">Enviar</button></div></section>`;}
  document.addEventListener("click",async ev=>{if(!ev.target.closest||!ev.target.closest("#respEnviar"))return;const t=$("#respTxt");const v=t.value.trim();if(!v)return;const b=$("#respEnviar");b.disabled=true;
    try{const r=await fetch(`/api/mensagens/${encodeURIComponent(slug)}`,{method:"PUT",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({texto:v})});if(!r.ok)throw 0;MSGS.push(await r.json());const y=scrollY;render();scrollTo(0,y);}catch(err){b.disabled=false;alert("Não foi: confira a internet.");}});
  // ---- pesquisa rápida da loja: um toque por resposta, grava no servidor na hora
  const SEGS=["cafeteria","restaurante","bar","padaria","mercado/hortifruti","cereais/empório","salão/barbearia","estética","clínica/consultório","farmácia","ótica","pet","loja de roupas/calçados","floricultura/presentes","academia/estúdio","autopeças/oficina","celular/assistência","escritório/imobiliária","escola/curso","embalagens/utilidades","comércio"];
  const PQ=[["degrau","Degrau na entrada",["Não","1 degrau","2 ou mais"]],["alaga","Alaga ou pega chuva na porta",["Não","Sim"]],["porta","Porta abre para",["Dentro","Fora","De correr","Sem porta"]],["vitrine","Vitrine de vidro",["Não","Sim"]],["mesas","Mesinhas na calçada",["Não","Sim"]],["movimento","Movimento agora",["Fraco","Médio","Forte"]],["dono","Quem decide está na loja",["Sim","Não","Volta depois"]]];
  const JA=["Capacho","Banner","Faixa","Placa","Adesivo na vitrine","Wind banner","Uniforme","TV ou cardápio na parede"];
  function pesquisaHTML(){const p=c.pesquisa||{};const ja=p.ja||[];const feitas=PQ.filter(([k])=>p[k]).length+(p.jaVisto?1:0);
    return `<section class="card pesq" id="pesq"><h2>Como é a loja <small class="muted" style="font-weight:400;font-size:14px">· ${feitas}/${PQ.length+1}</small></h2>
      <label class="pq-l">Segmento${l.setorSugerido&&l.setorSugerido!==l.setor?` <small class="muted">· sugerido: ${esc(setorNome(l.setorSugerido))}</small>`:""}</label>
      <select id="pqSetor">${SEGS.concat(SEGS.includes(l.setor)?[]:[l.setor]).map(s=>`<option value="${esc(s)}" ${s===l.setor?"selected":""}>${esc(setorNome(s))}</option>`).join("")}</select>
      ${PQ.map(([k,t,ops])=>`<label class="pq-l">${t}</label><div class="pq-o">${ops.map(o=>`<button type="button" data-pq="${k}" data-v="${esc(o)}" class="${p[k]===o?"on":""}">${o}</button>`).join("")}</div>`).join("")}
      <label class="pq-l">Já tem na loja <small class="muted">· toque em tudo que vir</small></label><div class="pq-o">${JA.map(o=>`<button type="button" data-ja="${esc(o)}" class="${ja.includes(o)?"on":""}">${o}</button>`).join("")}<button type="button" data-ja="" class="${p.jaVisto&&!ja.length?"on":""}">Nada disso</button></div></section>`;}
  async function gravarPesquisa(mud){c=await cliente(l);c.pesquisa={...(c.pesquisa||{}),...mud,em:new Date().toISOString()};await gravarCliente(c);const y=scrollY;render();scrollTo(0,y);}
  document.addEventListener("click",ev=>{const b=ev.target.closest&&ev.target.closest("#pesq button");if(!b)return;const p=c.pesquisa||{};
    if(b.dataset.pq)gravarPesquisa({[b.dataset.pq]:p[b.dataset.pq]===b.dataset.v?"":b.dataset.v});
    else if("ja" in b.dataset){const o=b.dataset.ja;let ja=(p.ja||[]).slice();if(!o)ja=[];else ja=ja.includes(o)?ja.filter(x=>x!==o):ja.concat(o);gravarPesquisa({ja,jaVisto:true});}});
  document.addEventListener("change",ev=>{if(ev.target.id!=="pqSetor")return;l.setorSugerido=l.setorSugerido||l.setor;l.setor=ev.target.value;gravarPesquisa({setor:l.setor,setorSugerido:l.setorSugerido});});
  function render(){
    const cands=candidatos();const logos=c.logos||[];const principal=logos[0]||null;const logo=(c.manual&&c.manual.tratado)||(principal&&principal.src)||null;const fach=(c.fachada&&c.fachada.src)||null;
    const pronto=!!(c.manual&&c.manual.editado);const e=estado();
    $("#app").innerHTML=`${topo()}${voltar("index.html","Rota")}
    <div class="cab"><div><h1 style="margin-bottom:2px">${esc(nome)}${l.avulso?` <button type="button" id="edAvulso" class="btn sec sm" style="width:auto;min-height:32px;padding:0 10px;font-size:13px;vertical-align:middle">✎</button>`:""}</h1><p class="sub">${esc(setorNome(l.setor))} · <a href="${l.maps||(l.place_id?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((l.endereco||l.nome)+", São Paulo")}&query_place_id=${encodeURIComponent(l.place_id)}`:(l.lat&&l.lng?`https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`:`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((l.endereco||l.nome)+", São Paulo")}`))}" target="_blank" rel="noopener" style="color:var(--marca);text-decoration:underline;text-underline-offset:3px">📍 ${esc(l.endereco||"ver no mapa")}</a></p></div><div style="padding-top:8px">${estrelasHTML(l.estrelas)}</div></div>
    ${(()=>{const prod=(c.produtos||[])[0];const capa=fach?[fach,"Fachada"]:prod?[abs(prod.src),"Produto · sem fachada"]:logo?[logo,"Logotipo · sem fachada"]:null;
      return `<div class="fach" data-longo data-src="${esc(capa?capa[0]:"")}">${capa?`<img src="${esc(capa[0])}" alt="" ${capa[1]!=="Fachada"?'style="object-fit:contain;background:#fff"':""}><span class="sel">${capa[1]}</span>`:`<div class="nome-logo"><b>${esc(nome)}</b><small>${esc(setorNome(l.setor))}</small></div><span class="sel">Nome · sem imagem</span>`}</div>`;})()}
    ${mensagensHTML()}
    ${entradas(slug,"entG")}${L.site&&L.site.estado==="encontrado"?`<a class="btn sec" style="margin:-4px 0 10px;min-height:44px" href="fontes.html?l=${encodeURIComponent(slug)}&tipo=site">🌐 Imagens do site</a>`:""}
    ${pesquisaHTML()}
    <section class="card"><h2>Imagens encontradas <small class="muted" style="font-weight:400;font-size:14px">· segure para classificar</small></h2>
      ${cands.length?`<div class="galeria">${cands.map((x,i)=>`<figure data-longo data-src="${esc(x.src)}" data-fonte="${esc(x.fonte||"")}">${x.papel?`<span class="pap ${x.papel==="logotipo"?"logo":x.papel==="fachada"?"fach":""}">${{logotipo:"Logotipo",fachada:"Fachada",produto:"Produto",arquivo:"Arquivo"}[x.papel]}</span>`:""}<img src="${esc(x.src)}" alt="" loading="lazy"></figure>`).join("")}</div>`:`<p class="muted">Nenhuma imagem ainda. Use o Site ou a Pesquisa de fotos.</p>`}</section>
    <section class="card"><h2>Logotipo${logos.length>1?` <small class="muted" style="font-weight:400;font-size:14px">· ${logos.length} salvos · toque para usar · segure para remover</small>`:""}</h2>
      <div class="logo-area" id="logoArea">${logo?`<img src="${esc(logo)}" alt="">`:`<div class="nome-logo"><b>${esc(nome)}</b><small>sem logotipo · pesquise, fotografe, envie ou use o nome</small></div>`}</div>
      ${logos.length>1?`<div class="logos">${logos.map((x,i)=>`<figure class="${i===0?"on":""}" data-id="${esc(x.id)}" data-longo><img src="${esc(x.src)}" alt=""><figcaption>${x.tratado?"✓":""}${esc((x.nome||"").replace(/^Logotipo ?·? ?/,"")||"logotipo")}</figcaption></figure>`).join("")}</div>`:""}
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center"><span class="chip ${pronto?"ok":c.aprovacao==="pendente"?"auto":logo?"dec":""}">${pronto?"✓ Logotipo tratado":c.aprovacao==="pendente"?"✦ Automático · aguarda aprovação":logo?"◷ Falta tirar o fundo":"Sem logotipo"}</span>${!pronto&&c.aprovacao==="pendente"?`<button type="button" class="btn sm" id="aprovarLogo" style="width:auto;min-height:36px;padding:0 14px;font-size:14px">✓ Aprovar</button>`:""}${logo?"":`<button type="button" class="btn sec sm" id="nomeLogo" style="width:auto;min-height:36px;padding:0 12px;font-size:14px">T Usar o nome como logotipo</button>`}${logo?`<button type="button" class="btn sec sm" id="editarLogo" style="width:auto;min-height:36px;padding:0 12px;font-size:14px">✂ Editar</button>${pronto?"":`<button type="button" class="btn sec sm" id="recAuto" style="width:auto;min-height:36px;padding:0 12px;font-size:14px">✦ Recorte automático</button>`}<a class="btn sec sm" href="manual.html?l=${encodeURIComponent(slug)}" style="width:auto;min-height:36px;padding:0 12px;font-size:14px;text-decoration:none">Editor avançado</a>`:""}</div>
      ${entradas(slug,"entL")}</section>
    ${curios.length?`<section class="card" style="border-left:5px solid var(--teal)"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Curiosidade</h2><button class="btn sec sm" id="ouvir" type="button" style="width:auto;min-height:40px;padding:0 14px;font-size:14px">▶ Ouvir</button></div>${curios.map(t=>`<p style="margin:8px 0 0">${esc(t)}</p>`).join("")}${cn.nota&&cn.valor?`<small class="muted">${esc(cn.nota)}</small>`:""}</section>`:""}
    ${GAT.length?`<section class="card" style="border-left:5px solid var(--marca)"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Quebra-gelo</h2><button class="btn sec sm" id="ouvirGelo" type="button" style="width:auto;min-height:40px;padding:0 14px;font-size:14px">▶ Ouvir</button></div>
      <small class="muted">O que as avaliações do Google sustentam — e qual inteligência resolve.</small>
      ${GAT.map(g=>`<div class="gelo"><div class="tema">${esc(g.tema)}${g.nota?` <span class="muted">· ${g.nota}★</span>`:""}</div><blockquote>“${esc((g.trecho||"").replace(/^…|…$/g,""))}”${g.autor?` <span class="muted">— ${esc(g.autor)}</span>`:""}</blockquote><div class="arg"><b>→ ${esc(prodNomes(g.produto))}</b><br>${esc(g.argumento)}</div></div>`).join("")}</section>`:""}
    <section class="card"><h2>Antes de entrar</h2>
      ${razao?`<div class="fato"><span>Razão social</span><b>${esc(razao.trim())}</b></div>`:""}${desde?`<div class="fato"><span>Desde</span><b>${esc(desde)}</b></div>`:""}
      ${l.tel?`<div class="fato"><span>Telefone</span><b><a href="tel:+55${esc(String(l.tel).replace(/\D/g,"").replace(/^55/,""))}" class="lk">📞 ${esc(telFmt(l.tel))}</a> · <a href="https://wa.me/55${esc(String(l.tel).replace(/\D/g,"").replace(/^55/,""))}" target="_blank" rel="noopener" class="lk">WhatsApp</a></b></div>`:""}
      ${(L.site&&L.site.estado==="encontrado"&&L.site.valor)||l.site?`<div class="fato"><span>Site</span><b><a href="${esc(((L.site&&L.site.valor)||l.site).match(/^https?:/)?((L.site&&L.site.valor)||l.site):"https://"+((L.site&&L.site.valor)||l.site))}" target="_blank" rel="noopener" class="lk">🌐 ${esc(((L.site&&L.site.valor)||l.site).replace(/^https?:\/\//,"").replace(/\/$/,""))}</a></b></div>`:""}
      ${(L.email&&L.email.valor)?`<div class="fato"><span>E-mail</span><b><a href="mailto:${esc(L.email.valor)}" class="lk">✉️ ${esc(L.email.valor)}</a></b></div>`:""}
      ${(L.redes&&L.redes.estado==="encontrado"&&/@/.test(L.redes.valor||""))?`<div class="fato"><span>Redes</span><b>${(L.redes.valor.match(/@[\w.]+/g)||[]).map(h=>`<a href="https://instagram.com/${esc(h.slice(1))}" target="_blank" rel="noopener" class="lk">${esc(h)}</a>`).join(" · ")}</b></div>`:""}${horarioHoje((L.horario||{}).valor)?`<div class="fato"><span>Hoje</span><b>${esc(horarioHoje(L.horario.valor))}</b></div>`:""}
      ${l.nota?`<div class="fato"><span>Google</span><b>${l.nota} · ${l.aval||0} avaliações${ganchos.length?` · reclamam de: ${esc(ganchos.join(", "))}`:""}</b></div>`:""}
    </section>
    <div class="acoes"><div class="w"><a class="btn sec" href="index.html">← Rota</a>${pronto?`<a class="btn" href="produtos.html?l=${encodeURIComponent(slug)}">Produtos e serviços →</a>`:logo?`<button class="btn" type="button" id="tratarLogo">Tratar o logotipo →</button>`:`<a class="btn" href="fontes.html?l=${encodeURIComponent(slug)}&tipo=busca">Escolher logotipo →</a>`}</div></div>
    ${nav("rota")}`;document.body.classList.add("com-acoes");
    if(!(e.feitas||[]).includes(slug)){e.feitas=[...(e.feitas||[]),slug];salvar(e);}
    const editar=()=>{if(!principal)return location.href=`fontes.html?l=${encodeURIComponent(slug)}&tipo=busca`;abrirLogotipo(slug,principal.src,(principal.nome||"").replace(/^Logotipo ?·? ?/,""),"visita");};
    const ea=$("#edAvulso");if(ea)ea.onclick=()=>{const n=prompt("Nome do cliente/empresa",l.nome);if(n===null)return;const t=prompt("Telefone",l.tel||"");App.atualizarAvulso(slug,{nome:n.trim()||l.nome,tel:(t||"").trim()});location.reload();};
    // ler em voz alta (como na versão anterior): voz do aparelho, pt-BR; toque de novo para parar
    const og=$("#ouvirGelo");if(og)og.onclick=()=>{if(!window.speechSynthesis){og.textContent="Sem voz";return;}if(speechSynthesis.speaking){speechSynthesis.cancel();og.textContent="▶ Ouvir";return;}const u=new SpeechSynthesisUtterance(falaGelo());u.lang="pt-BR";u.rate=1;u.onend=()=>{og.textContent="▶ Ouvir";};u.onerror=()=>{og.textContent="▶ Ouvir";};og.textContent="■ Parar";speechSynthesis.speak(u);};
    const ob=$("#ouvir");if(ob)ob.onclick=()=>{if(!window.speechSynthesis){ob.textContent="Sem voz";return;}if(speechSynthesis.speaking){speechSynthesis.cancel();ob.textContent="▶ Ouvir";return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(`${nome}. ${curios.join(" ")}`);u.lang="pt-BR";u.rate=1;u.onend=()=>{ob.textContent="▶ Ouvir";};u.onerror=()=>{ob.textContent="▶ Ouvir";};ob.textContent="■ Parar";speechSynthesis.speak(u);};
    $("#logoArea").onclick=editar;
    const ap=$("#aprovarLogo");if(ap)ap.onclick=async()=>{ap.disabled=true;ap.textContent="Aprovando…";const r=await App.aprovarLogo(l);if(r&&!r.ok&&!r.ja)alert("Aprovado. O recorte automático não saiu agora ("+r.motivo+"); use ✂ Editar ou tente de novo.");location.reload();};
    const ra=$("#recAuto");if(ra)ra.onclick=async()=>{ra.disabled=true;ra.textContent="Recortando…";const r=await App.recortarLogo(l);if(!r.ok){alert("Não consegui: "+r.motivo);ra.disabled=false;ra.textContent="✦ Recorte automático";return;}c=await cliente(l);render();};
    const nl=$("#nomeLogo");if(nl)nl.onclick=async()=>{const cv=document.createElement("canvas");const g=cv.getContext("2d");const linhas=nome.length>18?nome.split(/\s+(?=\S+$)|\s-\s| · /).filter(Boolean):[nome];const tam=120;g.font=`700 ${tam}px Rubik, system-ui, sans-serif`;const w=Math.ceil(Math.max(...linhas.map(t=>g.measureText(t).width))+tam*0.6);cv.width=w;cv.height=Math.ceil(linhas.length*tam*1.2+tam*0.5);const g2=cv.getContext("2d");g2.font=`700 ${tam}px Rubik, system-ui, sans-serif`;g2.fillStyle="#1C1635";g2.textAlign="center";g2.textBaseline="top";linhas.forEach((t,i)=>g2.fillText(t,w/2,tam*0.25+i*tam*1.2));
      const png=cv.toDataURL("image/png");c=await cliente(l);c.logos=[{id:"nome"+Date.now().toString(36),src:png,nome:"Logotipo · nome em texto",origem:"nome",largura:cv.width,altura:cv.height,tratado:true,em:new Date().toISOString()},...(c.logos||[])];c.manual={editado:true,tratado:png,largura:cv.width,altura:cv.height,cores:[],camadas:[{nome:"Nome",png}],em:new Date().toISOString()};await gravarCliente(c);render();};const eb=$("#editarLogo");if(eb)eb.onclick=editar;const tb=$("#tratarLogo");if(tb)tb.onclick=editar;
    ligarEntradas(document,l,null,async()=>{c=await cliente(l);render();});
    if(location.hash==="#mensagens"&&!render._rolou){render._rolou=true;setTimeout(()=>{const m=document.getElementById("mensagens");if(m)m.scrollIntoView({block:"start"});},60);}
    $$(".logos figure").forEach(fg=>{let longo=false;fg.addEventListener("pointerdown",()=>{longo=false;});fg.addEventListener("longo",()=>{longo=true;});fg.onclick=async()=>{if(longo)return;await logoPrincipal(l,fg.dataset.id);c=await cliente(l);render();};});
    ligarLongo(document,async el=>{
      if(el.dataset.id&&el.closest(".logos")){el.dispatchEvent(new Event("longo"));const k=await menuLongo("Este logotipo…",[{k:"usar",ic:"✦",t:"Usar como principal"},{k:"editar",ic:"✂",t:"Editar"},{k:"remover",ic:"🗑",t:"Remover"}]);if(!k)return;
        const x=(c.logos||[]).find(y=>y.id===el.dataset.id);if(k==="editar"&&x)return abrirLogotipo(slug,x.src,(x.nome||"").replace(/^Logotipo ?·? ?/,""),"visita");if(k==="usar")await logoPrincipal(l,el.dataset.id);if(k==="remover")await removerLogo(l,el.dataset.id);c=await cliente(l);render();return;}
      const src=el.dataset.src;if(!src)return;
      const k=await menuLongo("Esta imagem é…",[{k:"logotipo",ic:"✦",t:"Logotipo"},{k:"fachada",ic:"🏬",t:"Fachada"},{k:"arquivo",ic:"🗂",t:"Imagem de arquivo"},{k:"produto",ic:"🛍",t:"Foto de produto"},{k:"descartar",ic:"🗑",t:"Descartar"}]);
      if(!k)return;await classificar(l,src,k,el.dataset.fonte||"");c=await cliente(l);
      if(k==="logotipo"){abrirLogotipo(slug,src,el.dataset.fonte||"","visita");return;}
      render();});
  }
  render();
})();
</script>
