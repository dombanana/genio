<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Provar</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=98ae6a01e4">
<style>
.palco-p{position:relative;background:#111;border-radius:14px;overflow:hidden;touch-action:none;margin:0 0 8px;user-select:none;-webkit-user-select:none}
.palco-p .vista{transform-origin:0 0;will-change:transform}
.palco-p canvas{display:block;width:100%;height:auto}
.palco-p .carga{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:600;background:rgba(0,0,0,.45);text-align:center;padding:20px;z-index:3}
.palco-p .zoom{position:absolute;right:8px;top:8px;z-index:2;background:rgba(20,16,36,.7);color:#fff;border:0;border-radius:999px;font:600 12px Rubik,system-ui,sans-serif;padding:5px 10px}
.escolher{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.escolher label{display:grid;place-items:center;gap:6px;min-height:120px;border-radius:16px;background:#fff;border:2px dashed var(--linha);font-weight:700;color:var(--marca);cursor:pointer;text-align:center;padding:10px}
.escolher label span{font-size:34px}
.ferr{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 8px}
.ferr button{min-height:52px;border-radius:12px;border:1.5px solid var(--linha);background:#fff;font:600 11.5px/1.15 Rubik,system-ui,sans-serif;color:var(--texto);display:grid;place-items:center;gap:1px;padding:4px 2px}
.ferr button i{font-style:normal;font-size:19px;line-height:1}
.ferr button.on{border-color:var(--marca);background:var(--lav);color:var(--marca)}
.ajuste{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--texto2);margin:0 0 6px}
.ajuste span{flex:0 0 92px}.ajuste input{flex:1}.ajuste b{flex:0 0 36px;text-align:right;color:var(--texto);font-size:13px}
.cores-p{display:flex;flex-wrap:wrap;gap:9px;margin:4px 0 10px}
.cores-p button{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--linha);cursor:pointer;padding:0}
.cores-p button.on{box-shadow:0 0 0 3px var(--marca)}
.cores-p button.orig{width:auto;border-radius:999px;padding:0 12px;background:#fff;font:600 13px Rubik,system-ui,sans-serif;color:var(--texto2)}
.acoes-p{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.dica-p{font-size:13px;color:var(--texto2);margin:0 0 8px;min-height:18px}
.feito-p{background:#E7F6F3;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.feito-p b{color:#0E8A84}
 .fotos-p{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 12px}
.fotos-p figure{margin:0;position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--linha);cursor:pointer}
.fotos-p figure.on{box-shadow:0 0 0 3px var(--marca)}
.fotos-p img{width:100%;height:100%;object-fit:cover;display:block}
.fotos-p .tg{position:absolute;left:5px;bottom:5px;right:5px;background:rgba(20,16,36,.72);color:#fff;font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fotos-p .x{position:absolute;top:5px;right:5px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;background:#B4472E;color:#fff;font:700 15px/1 Rubik,system-ui,sans-serif;padding:0;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.base-p{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 0}
.linha-b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:0 0 8px}
.linha-b button{min-height:40px;border-radius:10px;border:0;background:var(--lav);color:var(--marca);font:600 13px Rubik,system-ui,sans-serif}
</style>
</head>
<body>
<div class="w" id="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<script src="app.js?v=98ae6a01e4"></script>
<script src="kits14.js?v=98ae6a01e4"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,cliente,gravarCliente,gravarNota,nomeLoja,topo,voltar,nav}=App;
  if(!await sessao())return;
  const slug=qs.get("l"),pid=qs.get("p")||"camiseta",pb=App.baseId(pid);const D=await dados();const l=D.lojas.find(x=>x.slug===slug);if(!l){$("#app").textContent="Loja não encontrada.";return;}
  let c=await cliente(l);const NOME={camiseta:"Camiseta",uniformes:"Camisa polo",bone:"Boné",avental:"Avental"}[pb]||pb;
  const volta=`produtos.html?l=${encodeURIComponent(slug)}#p-${pid}`,orc=`orcamento.html?l=${encodeURIComponent(slug)}`;
  const NV=pid.includes("~")?" · "+pid.split("~")[1]:"";
  const BASE_ARQ={uniformes:"04_uniforme_polo.jpg",camiseta:"14_camiseta.jpg",bone:"15_bone.jpg",avental:"16_avental.jpg"}[pb];
  const TECIDO=[["#F4F1EA","Branco"],["#2B2B2D","Preto"],["#1F3A5F","Marinho"],["#9A9B9D","Cinza"],["#C62828","Vermelho"],["#2E7D32","Verde"],["#14B8B0","Verde-água"],["#EDE6D6","Cru"]];
  const fm=c.manual&&c.manual.fundoMarca;const marca=((c.manual&&c.manual.cores)||[]).map(x=>x.hex).filter(Boolean);
  let CORES=(()=>{const v=new Set();return [...(fm?[[fm,"Fundo da marca"]]:[]),...marca.slice(0,3).map(h=>[h,"Cor da marca"]),...TECIDO].filter(([h])=>{const k=h.toLowerCase();if(v.has(k))return false;v.add(k);return true;});})();
  const A=(c.artes||{})[pid];let cor=(A&&A.material)||null;
  const estampaSrc=(A&&(A.pngArte||A.png))||(c.manual&&c.manual.tratado)||null;
  const carregar=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
  const tela=(w,h)=>{const k=document.createElement("canvas");k.width=w;k.height=h;return k;};
  // estampa recortada no que tem tinta (sem margem transparente)
  let logo=null;if(estampaSrc)try{logo=await carregar(estampaSrc);}catch(e){}
  if(logo){const cv=tela(logo.naturalWidth,logo.naturalHeight);const g=cv.getContext("2d");g.drawImage(logo,0,0);const d=g.getImageData(0,0,cv.width,cv.height).data;let x0=cv.width,y0=cv.height,x1=0,y1=0;
    for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2){if(d[(y*cv.width+x)*4+3]>30){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
    if(x1>x0&&y1>y0){const o=tela(x1-x0+1,y1-y0+1);o.getContext("2d").drawImage(cv,-x0,-y0);logo=o;}}

  // ---- camadas: foto (pode espelhar) · cor (máscara editável + tom aplicado aqui) · estampa (4 cantos: mover, girar, perspectiva)
  let P=null,W=0,H=0,FOTO=null,MASC=null,TINTA=null,Q=null,auto=null,espelho=false,salvo=null,logoOn=true,atual=null;
  let ferr="logo",pincel=6,tol=50,vista={s:1,x:0,y:0};const PILHA=[];
  const dica={logo:"Arraste a estampa para mover. Puxe os cantos para a perspectiva; a bolinha de cima gira.",pincel:"Pinte a parte da peça que ficou sem cor (borda esfumaçada).",borracha:"Apague a cor que passou da peça. A foto não é apagada.",varinha:"Toque na peça: pega a área da mesma cor, conforme a tolerância.",gotas:"Toque num ponto da foto: aquela cor vira a cor da peça."};
  const nomeCor=h=>{if(!h)return "cor original da foto";const x=CORES.find(([k])=>k.toLowerCase()===h.toLowerCase());return (x?x[1]+" ":"")+h.toUpperCase();};
  function cab(){const S=((App.estado().sel||{})[slug]||{})[pid]||{};const q=S.q>0?App.qtdNormal(pid,S.q):0;const fo=App.fornDe(pid,((((App.estado().pedidos||{})[slug])||{}).forn||{})[pid]);
    const g=S.grade?["M","F"].map(sx=>{const t=["P","M","G","GG"].filter(z=>(S.grade[sx]||{})[z]).map(z=>`${z} ${S.grade[sx][z]}`).join(", ");return t?(sx==="M"?"Masc. ":"Fem. ")+t:"";}).filter(Boolean).join(" · "):"";
    const pv=((((c.artes||{})[pid])||{}).provas||[]).length;
    return App.cabCliente(l,{titulo:`Provar · ${NOME}${NV}`,extra:[`Cor da peça: ${esc(nomeCor(cor))}`,q?`${q.toLocaleString("pt-BR")} un. no orçamento${g?" ("+esc(g)+")":""}`:"fora do orçamento",fo?`fornecedor ${esc(fo.nome)}`:"",`${pv} prova(s) guardada(s)`,atual!=null?`editando a prova ${atual+1}`:""].filter(Boolean).join(" · ")});}
  function fotosHTML(){const Ap=(c.artes||{})[pid]||{};const pv=Ap.provas||[];
    const it=[...(Ap.contexto?[{src:Ap.contexto,tag:"No ambiente",ctx:1}]:[]),...pv.map((x,i)=>({src:x.src,tag:`Prova ${i+1}${x.cor?" · "+nomeCor(x.cor).split(" ")[0]:""}`,i}))];
    return `<h2 style="font-size:16px;margin:16px 0 4px">Fotos desta peça</h2><p class="dica-p" style="margin:0">Toque numa foto para editar. × apaga a prova.</p>
      ${it.length?`<div class="fotos-p">${it.map(x=>`<figure data-fp="${x.ctx?"ctx":x.i}" class="${!x.ctx&&atual===x.i?"on":""}"><img src="${esc(x.src)}" alt="" loading="lazy"><span class="tg">${esc(x.tag)}</span>${x.ctx?"":`<button type="button" class="x" data-fx="${x.i}" aria-label="apagar prova">×</button>`}</figure>`).join("")}</div>`:`<p class="dica-p">Nenhuma prova guardada ainda.</p>`}`;}
  function render(){$("#app").innerHTML=`${topo()}${voltar(volta,NOME+NV)}${cab()}
    ${P?`<div class="palco-p" id="palco"><div class="vista" id="vista"><canvas id="cv"></canvas></div><button type="button" class="zoom" id="zoom" ${vista.s>1?"":"hidden"}>1:1</button><div class="carga" id="carga" hidden></div></div>
      <div class="ferr">${[["logo","✋","Estampa"],["pincel","🖌","Pincel"],["borracha","🧽","Borracha"],["varinha","🪄","Seleção"],["gotas","💧","Conta-gotas"],["espelho","↔","Espelhar"],["auto","✦","Recorte auto"],["desfazer","↶","Desfazer"]].map(([k,i,t])=>`<button type="button" data-f="${k}" class="${ferr===k?"on":""}"><i>${i}</i>${t}</button>`).join("")}</div>
      <p class="dica-p" id="dica">${dica[ferr]||""} Dois dedos ampliam a foto.</p>
      <div class="ajuste" ${["pincel","borracha"].includes(ferr)?"":"hidden"}><span>Pincel</span><input type="range" id="tamP" min="1" max="20" value="${pincel}"><b>${pincel}</b></div>
      <div class="ajuste"><span>Tolerância de cor</span><input type="range" id="tol" min="5" max="100" value="${tol}"><b id="tolV">${tol}</b></div>
      <div class="ajuste" ${ferr==="logo"&&logoOn?"":"hidden"}><span>Tamanho</span><input type="range" id="tam" min="30" max="200" value="100"><b></b></div>
      ${ferr==="logo"?`<div class="linha-b">${logoOn?`<button type="button" id="reto">Tirar perspectiva</button><button type="button" id="autoL">Posição automática</button>`:""}<button type="button" id="logoOn" style="${logoOn?"":"grid-column:1/-1"}">${logoOn?"Tirar estampa":"Pôr estampa"}</button></div>`:""}
      <h2 style="font-size:16px;margin:10px 0 6px">Cor da peça</h2><div class="cores-p">${`<button type="button" class="orig ${cor?"":"on"}" data-cor="">Original</button>`+CORES.map(([h,n])=>`<button type="button" data-cor="${h}" title="${esc(n)}" class="${cor&&cor.toLowerCase()===h.toLowerCase()?"on":""}" style="background:${h}"></button>`).join("")}</div>
      ${salvo?`<div class="feito-p"><b>✓ Guardada</b> nas fotos desta peça e nos arquivos de ${esc(nomeLoja(l.nome))}.</div>`:""}
      <div class="acoes-p"><button type="button" class="btn sec" id="outra">Outra foto</button><button type="button" class="btn" id="salvar">${atual!=null?"Guardar esta prova":"Guardar"}</button></div>`
    :`<div class="palco-p" style="min-height:240px"><div class="carga" id="carga">Abrindo…</div></div>`}
    <div class="escolher" ${P?"hidden":""} id="escolher"><label for="cam"><span>📷</span>Tirar foto</label><label for="gal"><span>🖼</span>Da galeria</label></div>
    ${fotosHTML()}
    <div class="base-p"><a class="btn sec" href="${volta}" style="display:grid;text-decoration:none">← Produtos</a><a class="btn" href="${orc}" style="display:grid;text-decoration:none">Orçamento →</a></div>${nav("atendimento")}`;
    ligarFotos();
    if(P){ligar();desenhar();aplicarVista();}}
  const carga=t=>{const e=$("#carga");if(e){e.hidden=!t;e.textContent=t||"";}};

  // ---- cor: tom novo com a luz da foto (L da foto em volta do L da cor nova; a e b da cor nova) — o mesmo cálculo do servidor, feito aqui
  const lin=v=>{v/=255;return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4);},gam=v=>{v=v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055;return Math.max(0,Math.min(255,Math.round(v*255)));};
  const fL=t=>t>.008856?Math.cbrt(t):7.787*t+16/116,fLi=t=>{const t3=t*t*t;return t3>.008856?t3:(t-16/116)/7.787;};
  function lab(r,g,b){const R=lin(r),G=lin(g),B=lin(b);const x=fL((R*.4124+G*.3576+B*.1805)/.95047),y=fL(R*.2126+G*.7152+B*.0722),z=fL((R*.0193+G*.1192+B*.9505)/1.08883);return [116*y-16,500*(x-y),200*(y-z)];}
  function rgb(L,a,b){const y=(L+16)/116,x=a/500+y,z=y-b/200;const X=fLi(x)*.95047,Y=fLi(y),Z=fLi(z)*1.08883;return [gam(X*3.2406-Y*1.5372-Z*.4986),gam(-X*.9689+Y*1.8758+Z*.0415),gam(X*.0557-Y*.204+Z*1.057)];}
  const hexRGB=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
  function tingir(){if(!cor||!FOTO){TINTA=null;return;}
    const fd=FOTO.getContext("2d").getImageData(0,0,W,H).data,md=MASC.getContext("2d").getImageData(0,0,W,H).data;
    // L mediano da peça (pela máscara), em amostra
    const hist=new Uint32Array(101);let n=0;for(let i=0;i<fd.length;i+=16){if(md[i+3]>128){const L=Math.round(lab(fd[i],fd[i+1],fd[i+2])[0]);hist[Math.max(0,Math.min(100,L))]++;n++;}}
    let mu=50;if(n){let s=0;for(let k=0;k<=100;k++){s+=hist[k];if(s>=n/2){mu=k;break;}}}
    const [aL,aa,ab]=lab(...hexRGB(cor));const kL=aL>60*100/255?.85:.6;
    const T=tela(W,H),tg=T.getContext("2d"),out=tg.createImageData(W,H),od=out.data;const cache=new Map();
    for(let i=0;i<fd.length;i+=4){const key=(fd[i]>>2)<<12|(fd[i+1]>>2)<<6|(fd[i+2]>>2);let v=cache.get(key);
      if(!v){const L=lab(fd[i],fd[i+1],fd[i+2])[0];v=rgb(Math.max(0,Math.min(100,aL+(L-mu)*kL)),aa,ab);cache.set(key,v);}od[i]=v[0];od[i+1]=v[1];od[i+2]=v[2];od[i+3]=255;}
    tg.putImageData(out,0,0);TINTA=T;}

  // ---- estampa em perspectiva: homografia do retângulo da estampa para os 4 cantos, desenhada em malha de triângulos
  function homog(q){const [x0,y0]=q[0],[x1,y1]=q[1],[x2,y2]=q[2],[x3,y3]=q[3];const dx1=x1-x2,dx2=x3-x2,dy1=y1-y2,dy2=y3-y2,sx=x0-x1+x2-x3,sy=y0-y1+y2-y3;
    let g=0,h=0;if(Math.abs(sx)>1e-9||Math.abs(sy)>1e-9){const den=dx1*dy2-dx2*dy1;g=(sx*dy2-dx2*sy)/den;h=(dx1*sy-sx*dy1)/den;}
    const a=x1-x0+g*x1,b=x3-x0+h*x3,cc=x0,d=y1-y0+g*y1,e=y3-y0+h*y3,f=y0;return (u,v)=>{const w=g*u+h*v+1;return [(a*u+b*v+cc)/w,(d*u+e*v+f)/w];};}
  function triangulo(g,img,s0,s1,s2,d0,d1,d2){g.save();g.beginPath();const cx=(d0[0]+d1[0]+d2[0])/3,cy=(d0[1]+d1[1]+d2[1])/3;const ex=p=>[p[0]+(p[0]-cx)*.02,p[1]+(p[1]-cy)*.02];const e0=ex(d0),e1=ex(d1),e2=ex(d2);
    g.moveTo(e0[0],e0[1]);g.lineTo(e1[0],e1[1]);g.lineTo(e2[0],e2[1]);g.closePath();g.clip();
    const den=(s1[0]-s0[0])*(s2[1]-s0[1])-(s2[0]-s0[0])*(s1[1]-s0[1]);if(!den){g.restore();return;}
    const a=((d1[0]-d0[0])*(s2[1]-s0[1])-(d2[0]-d0[0])*(s1[1]-s0[1]))/den,b=((d1[1]-d0[1])*(s2[1]-s0[1])-(d2[1]-d0[1])*(s1[1]-s0[1]))/den,
      cc=((d2[0]-d0[0])*(s1[0]-s0[0])-(d1[0]-d0[0])*(s2[0]-s0[0]))/den,d=((d2[1]-d0[1])*(s1[0]-s0[0])-(d1[1]-d0[1])*(s2[0]-s0[0]))/den;
    g.transform(a,b,cc,d,d0[0]-a*s0[0]-cc*s0[1],d0[1]-b*s0[0]-d*s0[1]);g.drawImage(img,0,0);g.restore();}
  function desenharLogo(g){if(!logo||!Q||!logoOn)return;const M=homog(Q),N=8,lw=logo.width,lh=logo.height;g.globalAlpha=.97;
    for(let j=0;j<N;j++)for(let i=0;i<N;i++){const u0=i/N,u1=(i+1)/N,v0=j/N,v1=(j+1)/N;const p00=M(u0,v0),p10=M(u1,v0),p11=M(u1,v1),p01=M(u0,v1);
      const s00=[u0*lw,v0*lh],s10=[u1*lw,v0*lh],s11=[u1*lw,v1*lh],s01=[u0*lw,v1*lh];triangulo(g,logo,s00,s10,s11,p00,p10,p11);triangulo(g,logo,s00,s11,s01,p00,p11,p01);}g.globalAlpha=1;}
  const centro=()=>[(Q[0][0]+Q[1][0]+Q[2][0]+Q[3][0])/4,(Q[0][1]+Q[1][1]+Q[2][1]+Q[3][1])/4];
  function quadDe(L){const h=L.w*(logo?logo.height/logo.width:1),a=(L.ang||0)*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);return [[-L.w/2,-h/2],[L.w/2,-h/2],[L.w/2,h/2],[-L.w/2,h/2]].map(([x,y])=>[L.cx+x*ca-y*sa,L.cy+x*sa+y*ca]);}
  function composto(final){const cv=tela(W,H),g=cv.getContext("2d");g.drawImage(FOTO,0,0);
    if(TINTA){const t=tela(W,H),tg=t.getContext("2d");tg.drawImage(TINTA,0,0);tg.globalCompositeOperation="destination-in";tg.drawImage(MASC,0,0);g.drawImage(t,0,0);}
    else if(!final&&["pincel","borracha","varinha"].includes(ferr)){const t=tela(W,H),tg=t.getContext("2d");tg.fillStyle="rgba(150,60,255,.45)";tg.fillRect(0,0,W,H);tg.globalCompositeOperation="destination-in";tg.drawImage(MASC,0,0);g.drawImage(t,0,0);}
    desenharLogo(g);return cv;}
  function desenhar(){const cv=$("#cv");if(!cv||!FOTO)return;if(cv.width!==W){cv.width=W;cv.height=H;}const g=cv.getContext("2d");g.drawImage(composto(false),0,0);
    if(ferr==="logo"&&Q&&logo&&logoOn){const r=W/90/vista.s;g.lineWidth=Math.max(1.5,W/500/vista.s);g.strokeStyle="rgba(255,255,255,.9)";g.setLineDash([r,r]);g.beginPath();Q.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.stroke();g.setLineDash([]);
      Q.forEach(p=>{g.beginPath();g.arc(p[0],p[1],r*1.3,0,7);g.fillStyle="#fff";g.fill();g.strokeStyle="#5b3fc4";g.stroke();});
      const gp=giroPonto();g.beginPath();g.moveTo((Q[0][0]+Q[1][0])/2,(Q[0][1]+Q[1][1])/2);g.lineTo(gp[0],gp[1]);g.strokeStyle="rgba(255,255,255,.9)";g.stroke();g.beginPath();g.arc(gp[0],gp[1],r*1.3,0,7);g.fillStyle="#5b3fc4";g.fill();g.strokeStyle="#fff";g.stroke();}}
  function giroPonto(){const mx=(Q[0][0]+Q[1][0])/2,my=(Q[0][1]+Q[1][1])/2,[cx,cy]=centro();const dx=mx-cx,dy=my-cy,d=Math.hypot(dx,dy)||1,ext=W/14/vista.s;return [mx+dx/d*ext,my+dy/d*ext];}

  // ---- desfazer: máscara, estampa e espelho
  function guardarPasso(){const m=tela(W,H);m.getContext("2d").drawImage(MASC,0,0);PILHA.push({m,Q:Q?Q.map(p=>[...p]):null,espelho,cor,logoOn});if(PILHA.length>12)PILHA.shift();}
  function virar(k){const t=tela(W,H),tg=t.getContext("2d");tg.translate(W,0);tg.scale(-1,1);tg.drawImage(k,0,0);const g=k.getContext("2d");g.clearRect(0,0,W,H);g.drawImage(t,0,0);}
  function desfazer(){const s=PILHA.pop();if(!s)return;const virou=s.espelho!==espelho;if(virou){virar(FOTO);espelho=s.espelho;}const mg=MASC.getContext("2d");mg.clearRect(0,0,W,H);mg.drawImage(s.m,0,0);Q=s.Q;logoOn=s.logoOn!==false;
    const mudouCor=s.cor!==cor;cor=s.cor;if(mudouCor||virou)tingir();if(mudouCor)render();else desenhar();}
  // espelhar: a foto e a camada de cor viram; a estampa fica como está (não espelha)
  function espelhar(passo=true){if(passo)guardarPasso();virar(FOTO);virar(MASC);if(TINTA)virar(TINTA);espelho=!espelho;desenhar();}

  // ---- seleção pela cor (varinha): a partir do toque, a área contígua de cor parecida (tolerância) entra na máscara
  function varinha(x,y){guardarPasso();const k=Math.min(1,700/Math.max(W,H)),w=Math.max(1,Math.round(W*k)),h=Math.max(1,Math.round(H*k));const sm=tela(w,h),sg=sm.getContext("2d");sg.drawImage(FOTO,0,0,w,h);const d=sg.getImageData(0,0,w,h).data;
    const px=Math.min(w-1,Math.max(0,Math.round(x*k))),py=Math.min(h-1,Math.max(0,Math.round(y*k)));const L=new Float32Array(w*h*3);for(let i=0,j=0;i<d.length;i+=4,j+=3){const v=lab(d[i],d[i+1],d[i+2]);L[j]=v[0];L[j+1]=v[1];L[j+2]=v[2];}
    let r0=0,a0=0,b0=0,nn=0;for(let yy=Math.max(0,py-2);yy<=Math.min(h-1,py+2);yy++)for(let xx=Math.max(0,px-2);xx<=Math.min(w-1,px+2);xx++){const j=(yy*w+xx)*3;r0+=L[j];a0+=L[j+1];b0+=L[j+2];nn++;}r0/=nn;a0/=nn;b0/=nn;
    const lim=4+tol*.42,limL=10+tol*.9;const sel=new Uint8Array(w*h),fila=new Int32Array(w*h);let ini=0,fim=0;sel[py*w+px]=1;fila[fim++]=py*w+px;
    while(ini<fim){const p=fila[ini++],xx=p%w,yy=(p/w)|0;for(const q of [xx>0?p-1:-1,xx<w-1?p+1:-1,yy>0?p-w:-1,yy<h-1?p+w:-1]){if(q<0||sel[q])continue;const j=q*3;if(Math.hypot(L[j+1]-a0,L[j+2]-b0)<lim&&Math.abs(L[j]-r0)<limL){sel[q]=1;fila[fim++]=q;}}}
    const m=sg.createImageData(w,h);for(let i=0;i<sel.length;i++)if(sel[i]){m.data[i*4]=m.data[i*4+1]=m.data[i*4+2]=255;m.data[i*4+3]=255;}sg.putImageData(m,0,0);
    const mg=MASC.getContext("2d");mg.save();mg.filter=`blur(${Math.max(1,1/k)}px)`;mg.imageSmoothingEnabled=true;mg.drawImage(sm,0,0,W,H);mg.restore();desenhar();}
  // pincel e borracha de borda esfumaçada na camada de cor
  function pinta(x,y,apaga){const r=W*pincel/200,g=MASC.getContext("2d");const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,"rgba(255,255,255,1)");gr.addColorStop(.45,"rgba(255,255,255,.85)");gr.addColorStop(1,"rgba(255,255,255,0)");
    g.save();g.globalCompositeOperation=apaga?"destination-out":"source-over";g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.restore();}
  function traco(a,b,apaga){const dd=Math.hypot(b[0]-a[0],b[1]-a[1]),passo=Math.max(1,W*pincel/200*.3);for(let t=0;t<=dd;t+=passo)pinta(a[0]+(b[0]-a[0])*t/dd,a[1]+(b[1]-a[1])*t/dd,apaga);if(!dd)pinta(b[0],b[1],apaga);}

  // ---- vista: dois dedos ampliam e arrastam a foto (para pintar com precisão)
  function aplicarVista(){const v=$("#vista");if(v)v.style.transform=`translate(${vista.x}px,${vista.y}px) scale(${vista.s})`;const z=$("#zoom");if(z)z.hidden=vista.s<=1.01;}
  function limitarVista(){const pal=$("#palco");if(!pal)return;const w=pal.clientWidth,h=pal.clientHeight;vista.s=Math.max(1,Math.min(6,vista.s));vista.x=Math.min(0,Math.max(w-w*vista.s,vista.x));vista.y=Math.min(0,Math.max(h-h*vista.s,vista.y));}

  async function chamar(corpo){const r=await fetch("/api/provar",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({peca:pb,camada:1,...corpo})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||r.status);return d;}
  async function receber(d,manterLogo){const [im,mk]=await Promise.all([carregar(d.jpg),carregar(d.mascara)]);P=d;W=d.w;H=d.h;
    FOTO=tela(W,H);FOTO.getContext("2d").drawImage(im,0,0);MASC=tela(W,H);const mg=MASC.getContext("2d");mg.drawImage(mk,0,0,W,H);
    // a máscara cinza vira alfa (branco opaco onde é peça)
    const id=mg.getImageData(0,0,W,H),dd=id.data;for(let i=0;i<dd.length;i+=4){const a=dd[i];dd[i]=dd[i+1]=dd[i+2]=255;dd[i+3]=a;}mg.putImageData(id,0,0);
    if(espelho){espelho=false;espelhar(false);}
    auto=d.medidas&&d.medidas.logo?{...d.medidas.logo}:{cx:W/2,cy:H*.38,w:W*.22,ang:0};if(espelho&&auto)auto.cx=W-auto.cx;if(!manterLogo||!Q)Q=quadDe(auto);tingir();}
  async function novaFoto(f,o={}){if(!f)return;salvo=null;espelho=false;PILHA.length=0;vista={s:1,x:0,y:0};P=null;FOTO=null;atual=o.atual??null;logoOn=o.logo!==false;render();carga("Recortando a peça…");
    try{const im=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(im.width,im.height));const cv=tela(Math.round(im.width*k),Math.round(im.height*k));cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      const d=await chamar({foto:cv.toDataURL("image/jpeg",.9),tol:tol/50});await receber(d,false);if(o.cor!==undefined){cor=o.cor;tingir();}render();}
    catch(e){carga("Não consegui: "+e.message);}}
  const blobDe=async src=>{const r=await fetch(src,{credentials:"same-origin"});if(!r.ok)throw new Error(r.status);return r.blob();};
  // prova guardada com camadas: volta exatamente como estava (foto, cor corrigida, estampa, espelho); prova antiga ou foto no ambiente: entra como foto nova, sem estampa por cima
  async function abrirProva(i){const pr=((((c.artes||{})[pid])||{}).provas||[])[i];if(!pr)return;const K=pr.camadas;
    if(!K||!K.foto||!K.mascara){return novaFoto(await blobDe(pr.src),{atual:i,logo:false,cor:null});}
    salvo=null;PILHA.length=0;vista={s:1,x:0,y:0};P=null;FOTO=null;render();carga("Abrindo a prova…");
    try{const [im,mk]=await Promise.all([carregar(K.foto),carregar(K.mascara)]);W=im.naturalWidth;H=im.naturalHeight;FOTO=tela(W,H);FOTO.getContext("2d").drawImage(im,0,0);MASC=tela(W,H);MASC.getContext("2d").drawImage(mk,0,0,W,H);
      P={id:null,w:W,h:H};Q=K.Q||null;espelho=!!K.espelho;logoOn=K.logo!==false&&!!Q;cor=K.cor||null;auto=K.auto||{cx:W/2,cy:H*.38,w:W*.22,ang:0};atual=i;tingir();render();}
    catch(e){carga("Não consegui abrir: "+e.message);}}
  async function abrirBase(){if(!BASE_ARQ||!window.Kits14)return false;try{const b=await blobDe(`/brand/kits14/${Kits14.kitDe(l.setor)}/SEM_ARTE/${BASE_ARQ}`);await novaFoto(b,{logo:true});return true;}catch(e){return false;}}
  function ligarFotos(){$$(".fotos-p [data-fx]").forEach(b=>b.onclick=async ev=>{ev.stopPropagation();const i=+b.dataset.fx;if(!confirm(`Apagar a prova ${i+1}?`))return;
      c=await cliente(l);const Ap=c.artes[pid];Ap.provas.splice(i,1);await gravarCliente(c);if(atual===i)atual=null;else if(atual!=null&&atual>i)atual--;render();});
    $$(".fotos-p [data-fp]").forEach(f=>f.onclick=async()=>{const k=f.dataset.fp;if(k==="ctx"){const Ap=(c.artes||{})[pid]||{};try{await novaFoto(await blobDe(Ap.contexto),{logo:false});}catch(e){alert("Não abriu: "+e.message);}}else abrirProva(+k);});}
  $("#cam").onchange=e=>{novaFoto(e.target.files[0]);e.target.value="";};$("#gal").onchange=e=>{novaFoto(e.target.files[0]);e.target.value="";};

  function ligar(){const cv=$("#cv"),pal=$("#palco");
    $("#outra").onclick=()=>{P=null;FOTO=null;salvo=null;atual=null;render();carga("");const e=$("#carga");if(e)e.textContent="Tire uma foto ou escolha da galeria.",e.hidden=false;};$("#salvar").onclick=salvar;
    const lo=$("#logoOn");if(lo)lo.onclick=()=>{guardarPasso();logoOn=!logoOn;if(logoOn&&!Q)Q=quadDe(auto||{cx:W/2,cy:H*.38,w:W*.22,ang:0});render();};
    $("#zoom").onpointerdown=e=>e.stopPropagation();$("#zoom").onclick=()=>{vista={s:1,x:0,y:0};aplicarVista();desenhar();};
    $$(".ferr [data-f]").forEach(b=>b.onclick=async()=>{const f=b.dataset.f;
      if(f==="espelho"){espelhar();return;}if(f==="desfazer"){desfazer();return;}
      if(f==="auto"){guardarPasso();carga("Recortando com a tolerância escolhida…");try{const porId=!!P.id;const d=await chamar(porId?{id:P.id,tol:tol/50}:{foto:FOTO.toDataURL("image/jpeg",.9),tol:tol/50});if(!porId)P.id=null;const mk=await carregar(d.mascara);const mg=MASC.getContext("2d");mg.clearRect(0,0,W,H);
          const t=tela(W,H),tg=t.getContext("2d");if(espelho&&porId){tg.translate(W,0);tg.scale(-1,1);}tg.drawImage(mk,0,0,W,H);const id=tg.getImageData(0,0,W,H),dd=id.data;for(let i=0;i<dd.length;i+=4){const a=dd[i];dd[i]=dd[i+1]=dd[i+2]=255;dd[i+3]=a;}mg.putImageData(id,0,0);tingir();carga("");desenhar();}
        catch(e){carga("Não consegui: "+e.message);}return;}
      ferr=f;render();});
    const tp=$("#tamP");if(tp)tp.oninput=()=>{pincel=+tp.value;tp.nextElementSibling.textContent=pincel;};
    $("#tol").oninput=()=>{tol=+$("#tol").value;$("#tolV").textContent=tol;};
    const tm=$("#tam");if(tm){let base=null;tm.onpointerdown=()=>{guardarPasso();base=Q.map(p=>[...p]);};tm.oninput=()=>{if(!base)base=Q.map(p=>[...p]);const [cx,cy]=[(base[0][0]+base[2][0])/2,(base[0][1]+base[2][1])/2];const k=+tm.value/100;Q=base.map(([x,y])=>[cx+(x-cx)*k,cy+(y-cy)*k]);desenhar();};tm.onchange=()=>{base=null;tm.value=100;};}
    const rt=$("#reto");if(rt)rt.onclick=()=>{guardarPasso();const [cx,cy]=centro();const w=(Math.hypot(Q[1][0]-Q[0][0],Q[1][1]-Q[0][1])+Math.hypot(Q[2][0]-Q[3][0],Q[2][1]-Q[3][1]))/2;const ang=Math.atan2(Q[1][1]-Q[0][1],Q[1][0]-Q[0][0])*180/Math.PI;Q=quadDe({cx,cy,w,ang});desenhar();};
    const al=$("#autoL");if(al)al.onclick=()=>{guardarPasso();Q=quadDe(auto);desenhar();};
    const g0=$("#girar0");if(g0)g0.onclick=()=>{guardarPasso();const [cx,cy]=centro();const w=Math.hypot(Q[1][0]-Q[0][0],Q[1][1]-Q[0][1]);Q=quadDe({cx,cy,w,ang:0});desenhar();};
    $$(".cores-p [data-cor]").forEach(b=>b.onclick=()=>{guardarPasso();cor=b.dataset.cor||null;$$(".cores-p button").forEach(x=>x.classList.toggle("on",x===b));carga("Aplicando a cor…");setTimeout(()=>{tingir();carga("");desenhar();},30);});
    // gestos: um dedo usa a ferramenta; dois dedos ampliam/arrastam a vista
    const pos=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)*W/r.width,(ev.clientY-r.top)*H/r.height];};
    const dedos=new Map();let g2=null,op=null;
    pal.onpointerdown=ev=>{pal.setPointerCapture(ev.pointerId);dedos.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
      if(dedos.size===2){op=null;const [a,b]=[...dedos.values()];g2={d:Math.hypot(a.x-b.x,a.y-b.y),mx:(a.x+b.x)/2,my:(a.y+b.y)/2,v:{...vista}};return;}
      if(dedos.size>2)return;const p=pos(ev);const raio=W/22/vista.s;
      if(ferr==="logo"&&Q&&logoOn){const gp=giroPonto();if(Math.hypot(p[0]-gp[0],p[1]-gp[1])<raio){guardarPasso();const [cx,cy]=centro();op={t:"giro",cx,cy,a0:Math.atan2(p[1]-cy,p[0]-cx),Q0:Q.map(q=>[...q])};return;}
        const i=Q.findIndex(q=>Math.hypot(p[0]-q[0],p[1]-q[1])<raio);if(i>=0){guardarPasso();op={t:"canto",i};return;}
        guardarPasso();op={t:"mover",p0:p,Q0:Q.map(q=>[...q])};return;}
      if(ferr==="pincel"||ferr==="borracha"){guardarPasso();op={t:"pinta",ult:p};pinta(p[0],p[1],ferr==="borracha");desenhar();return;}
      if(ferr==="varinha"){op={t:"toque"};varinha(p[0],p[1]);return;}
      if(ferr==="gotas"){op={t:"toque"};const d=FOTO.getContext("2d").getImageData(Math.max(0,Math.round(p[0])-2),Math.max(0,Math.round(p[1])-2),5,5).data;let r=0,g=0,b=0;for(let i=0;i<d.length;i+=4){r+=d[i];g+=d[i+1];b+=d[i+2];}const n=d.length/4;
        const hx="#"+[r,g,b].map(v=>Math.round(v/n).toString(16).padStart(2,"0")).join("");guardarPasso();cor=hx;CORES=[[hx,"Do conta-gotas"],...CORES.filter(x=>x[1]!=="Do conta-gotas")];render();carga("Aplicando a cor…");setTimeout(()=>{tingir();carga("");desenhar();},30);}};
    pal.onpointermove=ev=>{if(!dedos.has(ev.pointerId))return;dedos.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
      if(g2&&dedos.size===2){const [a,b]=[...dedos.values()];const r=pal.getBoundingClientRect();const d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;const s=Math.max(1,Math.min(6,g2.v.s*d/g2.d));
        const ox=g2.mx-r.left,oy=g2.my-r.top;vista.s=s;vista.x=mx-r.left-(ox-g2.v.x)*s/g2.v.s;vista.y=my-r.top-(oy-g2.v.y)*s/g2.v.s;limitarVista();aplicarVista();return;}
      if(!op)return;const p=pos(ev);
      if(op.t==="mover"){const dx=p[0]-op.p0[0],dy=p[1]-op.p0[1];Q=op.Q0.map(([x,y])=>[x+dx,y+dy]);desenhar();}
      else if(op.t==="canto"){Q[op.i]=p;desenhar();}
      else if(op.t==="giro"){const a=Math.atan2(p[1]-op.cy,p[0]-op.cx)-op.a0,ca=Math.cos(a),sa=Math.sin(a);Q=op.Q0.map(([x,y])=>[op.cx+(x-op.cx)*ca-(y-op.cy)*sa,op.cy+(x-op.cx)*sa+(y-op.cy)*ca]);desenhar();}
      else if(op.t==="pinta"){traco(op.ult,p,ferr==="borracha");op.ult=p;desenhar();}};
    const solta=ev=>{dedos.delete(ev.pointerId);if(dedos.size<2)g2=null;if(!dedos.size)op=null;};
    pal.onpointerup=pal.onpointercancel=solta;}
  // guardar: a foto composta (sem as alças) fica no card do produto (ficha, no servidor) e vira nota ligada à loja e ao produto
  async function salvar(){const b=$("#salvar");b.disabled=true;b.textContent="Guardando…";
    try{const src=composto(true).toDataURL("image/jpeg",.86);c=await cliente(l);c.artes=c.artes||{};const Ap=c.artes[pid]||{};Ap.provas=Ap.provas||[];
      const camadas={foto:FOTO.toDataURL("image/jpeg",.88),mascara:MASC.toDataURL("image/png"),Q:Q?Q.map(p=>p.map(v=>Math.round(v*10)/10)):null,cor:cor||null,espelho,logo:logoOn,auto};
      const pr={id:(atual!=null&&Ap.provas[atual]&&Ap.provas[atual].id)||"pv"+Date.now().toString(36),src,cor:cor||null,em:new Date().toISOString(),camadas};
      const nova=!(atual!=null&&Ap.provas[atual]);if(nova){Ap.provas.unshift(pr);atual=0;}else Ap.provas[atual]=pr;Ap.provas=Ap.provas.slice(0,30);c.artes[pid]=Ap;await gravarCliente(c);
      if(nova)await gravarNota({id:"n"+Date.now().toString(36),em:new Date().toISOString(),texto:`Prova · ${NOME}${cor?" · cor "+cor:""}`,foto:src,loja:{slug:l.slug,nome:nomeLoja(l.nome)},produto:pid});
      try{if(window.top!==window)window.top.postMessage({genio:"nota"},location.origin);}catch(e){}
      salvo=src;render();}
    catch(e){b.disabled=false;b.textContent="Não guardou: tente de novo";}}
  render();
  {const pv=((((c.artes||{})[pid])||{}).provas||[]);if(pv.length)await abrirProva(0);else if(!await abrirBase()){render();const e=$("#carga");if(e)e.textContent="Tire uma foto ou escolha da galeria.";}}
})();
</script>
