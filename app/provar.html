<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Provar na foto</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="app.css?v=002f8a8963">
<style>
.palco-p{position:relative;background:#111;border-radius:14px;overflow:hidden;touch-action:none;margin:0 0 10px}
.palco-p canvas{display:block;width:100%;height:auto}
.palco-p .carga{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:600;background:rgba(0,0,0,.45);text-align:center;padding:20px}
.escolher{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.escolher label{display:grid;place-items:center;gap:6px;min-height:120px;border-radius:16px;background:#fff;border:2px dashed var(--linha);font-weight:700;color:var(--marca);cursor:pointer;text-align:center;padding:10px}
.escolher label span{font-size:34px}
.cores-p{display:flex;flex-wrap:wrap;gap:10px;margin:4px 0 10px}
.cores-p button{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--linha);cursor:pointer;padding:0}
.cores-p button.on{box-shadow:0 0 0 3px var(--marca)}
.cores-p button.orig{width:auto;border-radius:999px;padding:0 12px;background:#fff;font:600 13px Rubik,system-ui,sans-serif;color:var(--texto2)}
.acoes-p{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tam-p{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--texto2);margin:0 0 6px}
.tam-p input{flex:1}
.dica-p{font-size:13px;color:var(--texto2);margin:0 0 8px}
.feito-p{background:#E7F6F3;border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14px}
.feito-p b{color:#0E8A84}
</style>
</head>
<body>
<div class="w" id="app"></div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="gal" accept="image/*" hidden>
<script src="app.js?v=002f8a8963"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,sessao,dados,cliente,gravarCliente,gravarNota,nomeLoja,topo,voltar,nav}=App;
  if(!await sessao())return;
  const slug=qs.get("l"),pid=qs.get("p")||"camiseta",pb=App.baseId(pid);const D=await dados();const l=D.lojas.find(x=>x.slug===slug);if(!l){$("#app").textContent="Loja não encontrada.";return;}
  let c=await cliente(l);const NOME={camiseta:"Camiseta",uniformes:"Camisa polo",bone:"Boné",avental:"Avental"}[pb]||pb;
  const volta=`produtos.html?l=${encodeURIComponent(slug)}#p-${pid}`;
  const TECIDO=[["#F4F1EA","Branco"],["#2B2B2D","Preto"],["#1F3A5F","Marinho"],["#9A9B9D","Cinza"],["#C62828","Vermelho"],["#2E7D32","Verde"],["#14B8B0","Verde-água"],["#EDE6D6","Cru"]];
  const fm=c.manual&&c.manual.fundoMarca;const marca=((c.manual&&c.manual.cores)||[]).map(x=>x.hex).filter(Boolean);
  const CORES=(()=>{const v=new Set();return [...(fm?[[fm,"Fundo da marca"]]:[]),...marca.slice(0,3).map(h=>[h,"Cor da marca"]),...TECIDO].filter(([h])=>{const k=h.toLowerCase();if(v.has(k))return false;v.add(k);return true;});})();
  const A=(c.artes||{})[pid];let cor=(A&&A.material)||null;
  // estampa: a arte da peça feita no editor (frente, sem fundo); sem arte, o logotipo tratado
  const estampaSrc=(A&&(A.pngArte||A.png))||(c.manual&&c.manual.tratado)||null;
  let P=null,base=null,logo=null,L=null,auto=null,salvo=null;
  const carregar=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});
  if(estampaSrc)try{logo=await carregar(estampaSrc);}catch(e){}
  // estampa recortada no que tem tinta (sem margem transparente) para o tamanho ficar fiel
  if(logo){const cv=document.createElement("canvas");cv.width=logo.naturalWidth;cv.height=logo.naturalHeight;const g=cv.getContext("2d");g.drawImage(logo,0,0);const d=g.getImageData(0,0,cv.width,cv.height).data;let x0=cv.width,y0=cv.height,x1=0,y1=0;
    for(let y=0;y<cv.height;y+=2)for(let x=0;x<cv.width;x+=2){if(d[(y*cv.width+x)*4+3]>30){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}}
    if(x1>x0&&y1>y0){const o=document.createElement("canvas");o.width=x1-x0+1;o.height=y1-y0+1;o.getContext("2d").drawImage(cv,-x0,-y0);logo=o;}}
  function render(){$("#app").innerHTML=`${topo()}${voltar(volta,NOME)}<h1>Provar na foto</h1><p class="sub">${esc(nomeLoja(l.nome))} · ${esc(NOME)}</p>
    ${P?`<div class="palco-p" id="palco"><canvas id="cv"></canvas><div class="carga" id="carga" hidden></div></div>
      <p class="dica-p">A estampa entra sozinha pelas medidas da peça. Arraste para ajustar. Se o recorte pegou errado, toque e segure em cima da peça.</p>
      <div class="tam-p">Tamanho <input type="range" id="tam" min="40" max="180" value="100"><button type="button" class="btn sec mini" id="auto" style="width:auto">Automático</button></div>
      <h2 style="font-size:16px;margin:10px 0 6px">Cor da peça</h2><div class="cores-p">${`<button type="button" class="orig ${cor?"":"on"}" data-cor="">Original</button>`+CORES.map(([h,n])=>`<button type="button" data-cor="${h}" title="${esc(n)}" class="${cor&&cor.toLowerCase()===h.toLowerCase()?"on":""}" style="background:${h}"></button>`).join("")}</div>
      ${salvo?`<div class="feito-p"><b>✓ Guardada</b> no card do produto e em Notas, ligada a ${esc(nomeLoja(l.nome))}.</div>`:""}
      <div class="acoes-p"><button type="button" class="btn sec" id="outra">Outra foto</button><button type="button" class="btn" id="salvar">${salvo?"Guardar de novo":"Guardar"}</button></div>
      <a class="btn sec" href="${volta}" style="display:grid;text-decoration:none">← Voltar ao produto</a>`
    :`<p class="dica-p">Foto de frente de quem vai vestir (ou da peça pendurada). O sistema recorta a peça, troca a cor e põe a estampa no lugar.</p>
      <div class="escolher"><label for="cam"><span>📷</span>Tirar foto</label><label for="gal"><span>🖼</span>Da galeria</label></div>
      <a class="btn sec" href="${volta}" style="display:grid;text-decoration:none">← Voltar ao produto</a>`}${nav("atendimento")}`;
    if(P)ligar();}
  function desenhar(){const cv=$("#cv");if(!cv||!base)return;cv.width=base.naturalWidth;cv.height=base.naturalHeight;const g=cv.getContext("2d");g.drawImage(base,0,0);
    if(logo&&L){const h=L.w*logo.height/logo.width;g.save();g.translate(L.cx,L.cy);g.rotate(L.ang*Math.PI/180);g.globalAlpha=.97;g.drawImage(logo,-L.w/2,-h/2,L.w,h);g.restore();}}
  const carga=t=>{const e=$("#carga");if(e){e.hidden=!t;e.textContent=t||"";}};
  async function chamar(corpo){const r=await fetch("/api/provar",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({peca:pb,...corpo})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.erro||r.status);return d;}
  async function aplicar(d,manterLogo){P=d;base=await carregar(d.jpg);auto=d.medidas&&d.medidas.logo?{...d.medidas.logo}:{cx:d.w/2,cy:d.h*.38,w:d.w*.22,ang:0};if(!manterLogo||!L)L={...auto};
    if(!$("#cv"))render();desenhar();}
  async function novaFoto(f){if(!f)return;salvo=null;P={};render();carga("Recortando a peça…");
    try{const im=await createImageBitmap(f);const k=Math.min(1,1600/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      const d=await chamar({foto:cv.toDataURL("image/jpeg",.9),cor});await aplicar(d,false);carga("");}
    catch(e){carga("Não consegui: "+e.message);}}
  $("#cam").onchange=e=>{novaFoto(e.target.files[0]);e.target.value="";};$("#gal").onchange=e=>{novaFoto(e.target.files[0]);e.target.value="";};
  function ligar(){const cv=$("#cv"),pal=$("#palco");
    $("#outra").onclick=()=>{P=null;base=null;salvo=null;render();};
    $("#auto").onclick=()=>{if(auto){L={...auto};$("#tam").value=100;desenhar();}};
    $("#tam").oninput=()=>{if(auto&&L){L.w=auto.w*$("#tam").value/100;desenhar();}};
    $$(".cores-p [data-cor]").forEach(b=>b.onclick=async()=>{cor=b.dataset.cor||null;$$(".cores-p button").forEach(x=>x.classList.toggle("on",x===b));carga("Trocando a cor…");try{await aplicar(await chamar({id:P.id,cor}),true);carga("");}catch(e){carga("Não consegui: "+e.message);}});
    $("#salvar").onclick=salvar;
    // arrastar move a estampa; toque longo parado refaz o recorte a partir daquele ponto
    const pos=ev=>{const r=cv.getBoundingClientRect();return [(ev.clientX-r.left)*cv.width/r.width,(ev.clientY-r.top)*cv.height/r.height,(ev.clientX-r.left)/r.width,(ev.clientY-r.top)/r.height];};
    let arr=null,longo=null;
    pal.onpointerdown=ev=>{if(!L)return;const [x,y,u,v]=pos(ev);arr={x,y,cx:L.cx,cy:L.cy,mov:false};pal.setPointerCapture(ev.pointerId);
      longo=setTimeout(async()=>{if(arr&&!arr.mov){arr=null;carga("Recortando de novo a partir do toque…");try{await aplicar(await chamar({id:P.id,cor,ponto:[u,v]}),false);carga("");}catch(e){carga("Não consegui: "+e.message);}}},650);};
    pal.onpointermove=ev=>{if(!arr)return;const [x,y]=pos(ev);if(Math.hypot(x-arr.x,y-arr.y)>cv.width*.01){arr.mov=true;clearTimeout(longo);}if(arr.mov){L.cx=arr.cx+(x-arr.x);L.cy=arr.cy+(y-arr.y);desenhar();}};
    pal.onpointerup=pal.onpointercancel=()=>{arr=null;clearTimeout(longo);};}
  // guardar: a foto fica no card do produto (ficha, no servidor) e vira nota ligada à loja e ao produto
  async function salvar(){const b=$("#salvar");b.disabled=true;b.textContent="Guardando…";
    try{desenhar();const src=$("#cv").toDataURL("image/jpeg",.86);c=await cliente(l);c.artes=c.artes||{};const Ap=c.artes[pid]||{};
      Ap.provas=[{src,cor:cor||null,em:new Date().toISOString()},...(Ap.provas||[])].slice(0,4);c.artes[pid]=Ap;await gravarCliente(c);
      await gravarNota({id:"n"+Date.now().toString(36),em:new Date().toISOString(),texto:`Prova na foto · ${NOME}${cor?" · cor "+cor:""}`,foto:src,loja:{slug:l.slug,nome:nomeLoja(l.nome)},produto:pid});
      try{if(window.top!==window)window.top.postMessage({genio:"nota"},location.origin);}catch(e){}
      salvo=src;render();desenhar();}
    catch(e){b.disabled=false;b.textContent="Não guardou: tente de novo";}}
  render();
})();
</script>
</body>
</html>
