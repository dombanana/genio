<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mostraí · Programação</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
:root{--roxo:#6933C5;--esc:#1C1635;--lav:#EFEAFB;--texto2:#5B5675;--ok:#0E8A84}
*{box-sizing:border-box}
body{margin:0 auto;max-width:640px;background:#F6F3FC;color:var(--esc);font-family:Rubik,"Segoe UI",system-ui,sans-serif;padding:16px 16px 120px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--texto2);margin:0 0 14px;font-size:14px}
h2{font-size:15px;margin:0 0 10px}
.card{background:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(28,22,53,.06)}
label{display:block;font-size:13px;color:var(--texto2);margin:10px 0 4px}label:first-of-type{margin-top:0}
input[type=text],input[type=date],select{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #D9D2F0;border-radius:10px;background:#fff;color:inherit}
.dois{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.previa{margin:12px auto 0;width:52%;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#000;box-shadow:0 0 0 6px #1C1635}.previa.pais{width:100%;aspect-ratio:16/9}.previa iframe{width:100%;height:100%;border:0;display:block;pointer-events:none}
.it{display:grid;grid-template-columns:1fr 104px;gap:8px;align-items:start;padding:12px 0;border-top:1px solid #EEE9F8}
.it:first-child{border-top:0}
.it .linha2{grid-column:1/-1;display:flex;gap:8px;align-items:center}
.it .linha2 input{flex:1;min-width:0;font-size:14px;padding:8px 10px}
.tog{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;padding:8px 10px;border-radius:999px;border:1px solid #D9D2F0;background:#fff;color:var(--texto2);cursor:pointer;white-space:nowrap}
.tog.on{background:var(--lav);color:var(--roxo);border-color:#C9B8F2;font-weight:700}
.mini{font:inherit;font-size:13px;min-width:36px;padding:8px 9px;border-radius:8px;border:1px solid #D9D2F0;background:#fff;cursor:pointer}
.mini.rm{color:#B42318}
.it.off input{opacity:.55}
.add{width:100%;min-height:46px;border-radius:12px;border:2px dashed #C9B8F2;background:transparent;color:var(--roxo);font:700 15px Rubik,system-ui;cursor:pointer;margin-bottom:12px}
.foto{display:block;width:100%;aspect-ratio:2/1;border-radius:12px;border:2px dashed #C9B8F2;background:#FAF8FE center/cover no-repeat;color:var(--roxo);font:700 15px Rubik,system-ui;cursor:pointer}
.foto.tem{border-style:solid;color:transparent}
.tirar{margin-top:8px;border:0;background:none;color:#B42318;font:inherit;font-size:13px;cursor:pointer;padding:6px 0}
.estado{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid #E6E0F5;padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px;font-size:14px}
.estado .pt{width:10px;height:10px;border-radius:50%;background:#ccc}.estado .pt.ok{background:var(--ok)}.estado .pt.env{background:#E6A700}.estado .pt.erro{background:#B42318}
.estado a{margin-left:auto;color:var(--roxo);font-weight:700;text-decoration:none}
.erro{padding:40px 20px;text-align:center}
.conv{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto;margin:0 0 10px}
.m{max-width:84%;border-radius:14px;padding:8px 12px;font-size:15px}.m.cliente{align-self:flex-end;background:var(--roxo);color:#fff}.m.genio{align-self:flex-start;background:var(--lav)}
.m small{display:block;font-size:11px;opacity:.75;margin-top:3px}
textarea{width:100%;box-sizing:border-box;font:inherit;font-size:16px;padding:10px 12px;border:1px solid #D9D2F0;border-radius:10px;resize:vertical}
.enviar{margin-top:8px;width:100%;min-height:46px;border:0;border-radius:12px;background:var(--roxo);color:#fff;font:700 15px Rubik,system-ui;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="arq" accept="image/*" hidden>
<div class="estado" id="estado"><span class="pt" id="pt"></span><span id="txt">Carregando…</span><a id="verTela" href="#" target="_blank" rel="noopener">Ver a tela ↗</a></div>
<script>
(()=>{
  const c=new URLSearchParams(location.search).get("c")||"";const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
  if(!c){$("#app").innerHTML='<div class="erro">Falta o código no endereço.</div>';return;}
  const URL_API=`/api/mostra/${encodeURIComponent(c)}`;$("#verTela").href=`/mostra.html?c=${encodeURIComponent(c)}`;
  let E=null,timer=null,enviando=false,pendente=false;
  const estado=(k,t)=>{$("#pt").className="pt "+k;$("#txt").textContent=t;};
  const agora=()=>{const h=new Date();return String(h.getHours()).padStart(2,"0")+":"+String(h.getMinutes()).padStart(2,"0");};
  function render(){const it=E.itens||[];const D=E.destaque=E.destaque||{rotulo:"",texto:"",valor:"",ate:""};
    $("#app").innerHTML=`<h1>${esc(E.nome)}</h1><p class="sub">O que você muda aqui aparece na TV em poucos segundos.</p>
    <div class="card"><label>Título da tela</label><input type="text" id="titulo" value="${esc(E.titulo||"")}" maxlength="40">
      <label>Foto principal</label><button type="button" class="foto ${E.foto?"tem":""}" id="foto" ${E.foto?`style="background-image:url('${esc(E.foto)}')"`:""}>${E.foto?"trocar":"+ Escolher foto"}</button>${E.foto?`<button type="button" class="tirar" id="semFoto">Tirar a foto</button>`:""}</div>
    <div class="card" id="lista"><h2>Itens · ${porTxt()}, a tela troca sozinha</h2>${it.map((x,i)=>`<div class="it ${x.ativo===false?"off":""}" data-i="${i}"><input type="text" data-k="nome" value="${esc(x.nome)}" placeholder="Nome do item" maxlength="60"><input type="text" data-k="preco" value="${esc(x.preco)}" placeholder="R$" inputmode="decimal" maxlength="20">
      <div class="linha2"><input type="text" data-k="desc" value="${esc(x.desc||"")}" placeholder="kg, 350 ml…" maxlength="40"><button type="button" class="tog ${x.ativo!==false?"on":""}" data-a="ativo">${x.ativo!==false?"● Na tela":"○ Fora"}</button><button type="button" class="mini" data-a="sobe" aria-label="subir">↑</button><button type="button" class="mini" data-a="desce" aria-label="descer">↓</button><button type="button" class="mini rm" data-a="rm" aria-label="remover">✕</button></div></div>`).join("")}</div>
    <button type="button" class="add" id="add">+ Adicionar item</button>
    <div class="card"><h2>Destaque · a oferta em letras grandes</h2><div class="dois"><div><label>Chamada</label><input type="text" id="dRot" value="${esc(D.rotulo)}" maxlength="28" placeholder="OFERTA DA SEMANA"></div><div><label>Valor</label><input type="text" id="dVal" value="${esc(D.valor)}" maxlength="22" placeholder="R$"></div></div>
      <label>O que é</label><input type="text" id="dTxt" value="${esc(D.texto)}" maxlength="60" placeholder="Ex.: café + pão na chapa">
      <label>Válido até (some sozinho depois)</label><input type="date" id="dAte" value="${esc(D.ate)}"></div>
    <div class="card"><label>Aviso no rodapé (opcional)</label><input type="text" id="aviso" value="${esc(E.aviso||"")}" maxlength="140" placeholder="Ex.: hoje até as 20h · aceitamos Pix">
</div>
    <div class="card"><h2>Tela da TV · a diagramação se ajusta</h2>
      <div class="dois"><div><label>Posição da TV</label><select id="formato"><option value="auto">Automático</option><option value="retrato">Em pé</option><option value="paisagem">Deitada</option></select></div>
      <div><label>Tamanho da TV</label><select id="polegadas"><option value="0">Não sei</option><option value="32">Até 32"</option><option value="43">40 a 43"</option><option value="50">50"</option><option value="55">55 a 58"</option><option value="65">60 a 65"</option><option value="75">70 a 75"</option><option value="85">80" ou mais</option></select></div></div>
      <label>Itens por tela</label><select id="linhas"><option value="0">Automático (pelo tamanho)</option><option value="4">Até 4 itens</option><option value="5">Até 5 itens</option><option value="6">Até 6 itens</option><option value="8">Até 8 itens</option><option value="10">Até 10 itens</option></select>
      <div id="giroBox" ${E.formato==="paisagem"?'hidden':''}><label>TV em pé: a imagem está de lado?</label><select id="giro"><option value="0">Não, está certa</option><option value="90">Girar para a direita</option><option value="270">Girar para a esquerda</option></select></div>
      <div class="previa ${E.formato==="paisagem"?"pais":""}"><iframe src="mostra.html?c=${encodeURIComponent(c)}&previa=1" title="Prévia da TV" loading="lazy" tabindex="-1"></iframe></div>
      <p class="sub" style="margin:6px 0 0">Prévia ${E.formato==="paisagem"?"deitada":"em pé"} · atualiza em poucos segundos depois de cada mudança.</p></div>
    <div class="card"><h2 style="font-size:16px;margin:0 0 8px">Fale com o seu atendente</h2><div class="conv" id="conv"></div><textarea id="msgTxt" rows="2" placeholder="Escreva sua mensagem"></textarea><button type="button" class="enviar" id="msgEnviar">Enviar</button></div>`;
    $("#msgEnviar").onclick=enviarMsg;desenharConv();
    $("#giro").value=String(E.giro||0);$("#formato").value=E.formato||"auto";$("#polegadas").value=String(E.polegadas||0);$("#linhas").value=String(E.linhas||0);
    const liga=(id,f)=>{$(id).oninput=()=>{f($(id).value);agendar();};};
    liga("#titulo",v=>E.titulo=v);liga("#aviso",v=>E.aviso=v);liga("#dRot",v=>D.rotulo=v);liga("#dVal",v=>D.valor=v);liga("#dTxt",v=>D.texto=v);liga("#dAte",v=>D.ate=v);
    $("#giro").onchange=()=>{E.giro=+$("#giro").value;agendar();};
    $("#formato").onchange=()=>{E.formato=$("#formato").value;agendar();render();};
    $("#polegadas").onchange=()=>{E.polegadas=+$("#polegadas").value;agendar();render();};
    $("#linhas").onchange=()=>{E.linhas=+$("#linhas").value;agendar();render();};
    $("#foto").onclick=()=>$("#arq").click();const sf=$("#semFoto");if(sf)sf.onclick=()=>{E.foto=null;semFoto=true;render();agendar();};
    $$("#lista input").forEach(inp=>inp.oninput=()=>{const i=+inp.closest(".it").dataset.i;E.itens[i][inp.dataset.k]=inp.value;agendar();});
    $$("#lista [data-a]").forEach(b=>b.onclick=()=>{const i=+b.closest(".it").dataset.i;const a=b.dataset.a;const L=E.itens;
      if(a==="ativo")L[i].ativo=L[i].ativo===false;else if(a==="rm")L.splice(i,1);else if(a==="sobe"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];else if(a==="desce"&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
      render();agendar();});
    $("#add").onclick=()=>{E.itens.push({id:"i"+Date.now().toString(36),nome:"",preco:"",desc:"",ativo:true});render();agendar();setTimeout(()=>{const ins=$$("#lista .it input[data-k=nome]");ins[ins.length-1]&&ins[ins.length-1].focus();},50);};}
  let semFoto=false;
  // mesma conta da tela da TV (mostra.html): automático pelo tamanho e pela posição
  function porTxt(){if(E.linhas)return "até "+E.linhas+" por tela, páginas equilibradas";const cap={retrato:{0:4,32:4,43:4,50:5,55:5,65:6,75:8,85:8},paisagem:{0:5,32:5,43:5,50:6,55:6,65:8,75:8,85:10}}[E.formato==="paisagem"?"paisagem":"retrato"][E.polegadas||0]||4;return "até "+cap+" por tela";}
  let CONV=[];const hm=iso=>{const d=new Date(iso);return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"})+" "+d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});};
  function desenharConv(){const el=$("#conv");if(!el)return;el.innerHTML=CONV.length?CONV.map(m=>`<div class="m ${m.de}">${esc(m.texto)}<small>${m.de==="cliente"?"Você":"Atendimento"} · ${hm(m.em)}</small></div>`).join(""):'<p class="sub" style="margin:0">Dúvidas, ajustes ou pedidos: escreva aqui que o seu atendente responde.</p>';el.scrollTop=el.scrollHeight;}
  async function puxarConv(){try{const r=await fetch(`/api/mostra/${encodeURIComponent(c)}/mensagens`,{cache:"no-store"});if(!r.ok)return;const d=await r.json();if(JSON.stringify(d.mensagens)!==JSON.stringify(CONV)){CONV=d.mensagens||[];desenharConv();}}catch(e){}}
  async function enviarMsg(){const t=$("#msgTxt");const v=t.value.trim();if(!v)return;const b=$("#msgEnviar");b.disabled=true;b.textContent="Enviando…";
    try{const r=await fetch(`/api/mostra/${encodeURIComponent(c)}/mensagem`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({texto:v})});if(!r.ok)throw 0;t.value="";await puxarConv();b.textContent="Enviado ✓";setTimeout(()=>{b.textContent="Enviar";b.disabled=false;},1500);}
    catch(e){b.textContent="Não foi: tente de novo";b.disabled=false;}}
  setInterval(puxarConv,20000);
  function agendar(){pendente=true;estado("env","Enviando…");clearTimeout(timer);timer=setTimeout(enviar,600);}
  async function enviar(){if(enviando){pendente=true;return;}enviando=true;pendente=false;
    try{const corpo={itens:E.itens,titulo:E.titulo,aviso:E.aviso,destaque:E.destaque,giro:E.giro||0,formato:E.formato||"auto",polegadas:E.polegadas||0,linhas:E.linhas||0};if(semFoto){corpo.foto=null;semFoto=false;}
      const r=await fetch(URL_API,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(corpo)});if(!r.ok)throw new Error(r.status);const d=await r.json();E.v=d.v;estado("ok","Na tela · "+agora());}
    catch(e){estado("erro","Não foi: confira a internet e mexa de novo.");}
    enviando=false;if(pendente)enviar();}
  // foto: reduzida aqui (1080 px de largura) e guardada no servidor
  $("#arq").onchange=async ev=>{const f=ev.target.files[0];ev.target.value="";if(!f)return;estado("env","Enviando a foto…");
    try{const im=await createImageBitmap(f);const k=Math.min(1,1080/im.width);const cv=document.createElement("canvas");cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      const r=await fetch(URL_API+"/foto",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({foto:cv.toDataURL("image/jpeg",.84)})});if(!r.ok)throw new Error(r.status);const d=await r.json();E.foto=d.foto;E.v=d.v;render();estado("ok","Na tela · "+agora());}
    catch(e){estado("erro","A foto não subiu: tente de novo.");}};
  (async()=>{try{const r=await fetch(URL_API,{cache:"no-store"});if(!r.ok)throw 0;E=await r.json();(E.itens||[]).forEach(i=>delete i.destaque);render();puxarConv();estado("ok","Na tela");}catch(e){$("#app").innerHTML='<div class="erro">Este Mostraí não existe ou foi desligado.</div>';estado("erro","Sem programação");}})();
})();
</script>
</body>
</html>
