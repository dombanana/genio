<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mostra Aí</title>
<meta name="robots" content="noindex">
<style>
:root{--esc:#1C1635;--vivo:#6933C5;--vivo2:#B9A6F0;--fundo:#1C1635;--texto:#fff;--texto2:rgba(255,255,255,.72)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--fundo);color:var(--texto);font-family:Rubik,"Segoe UI",system-ui,sans-serif;overflow:hidden}
.tela{height:100%;display:grid;grid-template-rows:auto 1fr auto;padding:3vh 4vw;gap:2vh}
header{display:flex;align-items:center;gap:2.5vw}
header .logo{height:11vh;max-width:28vw;object-fit:contain;background:#fff;border-radius:1.4vh;padding:1vh 1.4vw}
header .logo.esc{background:transparent;padding:0}
header h1{font-size:5.2vh;font-weight:800;line-height:1.05}
header small{display:block;font-size:2.4vh;color:var(--texto2);font-weight:500;margin-top:.6vh;letter-spacing:.08em;text-transform:uppercase}
header .hora{margin-left:auto;font-size:4vh;font-weight:700;color:var(--texto2);font-variant-numeric:tabular-nums}
main{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.6vh 2vw;align-content:stretch;min-height:0}
.it{display:flex;align-items:center;justify-content:space-between;gap:2vw;padding:1.8vh 2.2vw;border-radius:1.8vh;background:rgba(255,255,255,.08);border:.3vh solid rgba(255,255,255,.08);min-height:0;overflow:hidden}
.it b{font-size:3.6vh;font-weight:700;line-height:1.1}
.it small{display:block;font-size:2.2vh;color:var(--texto2);margin-top:.5vh;font-weight:400}
.it .p{font-size:4vh;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.it.dest{grid-column:1/-1;background:var(--vivo);border-color:var(--vivo);color:var(--txtVivo,#fff)}
.it.dest b{font-size:5vh}.it.dest .p{font-size:6vh}.it.dest small{color:inherit;opacity:.85}
.it.dest .tag{font-size:2vh;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9;display:block;margin-bottom:.6vh}
footer{display:flex;align-items:center;gap:2vw;font-size:2.6vh;color:var(--texto2);min-height:4.5vh}
footer .aviso{flex:1;white-space:nowrap;overflow:hidden}
footer .aviso span{display:inline-block;padding-left:100%;animation:rola 22s linear infinite}
@keyframes rola{to{transform:translateX(-100%)}}
footer .pag{display:flex;gap:.8vh}footer .pag i{width:1.4vh;height:1.4vh;border-radius:50%;background:rgba(255,255,255,.25)}footer .pag i.on{background:var(--vivo2)}
.vazio{grid-column:1/-1;display:grid;place-items:center;text-align:center;color:var(--texto2);font-size:3.4vh;line-height:1.4}
.erro{height:100%;display:grid;place-items:center;text-align:center;padding:6vw;font-size:3.5vh}
.troca{animation:entra .5s ease}
@keyframes entra{from{opacity:0;transform:translateY(1.5vh)}to{opacity:1;transform:none}}
@media (orientation:portrait){main{grid-template-columns:1fr}.it b{font-size:2.8vh}.it .p{font-size:3vh}.it.dest b{font-size:3.6vh}.it.dest .p{font-size:4.2vh}header h1{font-size:3.6vh}}
</style>
</head>
<body>
<div class="tela" id="tela"></div>
<script>
(()=>{
  const c=new URLSearchParams(location.search).get("c")||"";const $=s=>document.querySelector(s);
  if(!c){document.body.innerHTML='<div class="erro">Falta o código do Mostra Aí no endereço.</div>';return;}
  const hex2=h=>{h=(h||"#000").replace("#","");if(h.length===3)h=h.split("").map(x=>x+x).join("");const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];};
  const lum=h=>{const [r,g,b]=hex2(h);return .2126*r+.7152*g+.0722*b;};const sat=h=>{const [r,g,b]=hex2(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx?(mx-mn)/mx:0;};
  const mix=(a,b,t)=>{const A=hex2(a),B=hex2(b);return "#"+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,"0")).join("");};
  function tema(cores){cores=(cores||[]).filter(Boolean);const esc=cores.find(h=>lum(h)<70)||mix(cores[0]||"#1C1635","#0B1020",.7);let vivo=cores.find(h=>sat(h)>.3&&lum(h)>45&&lum(h)<215&&h!==esc)||cores.find(h=>h!==esc)||"#6933C5";if(lum(vivo)<40)vivo=mix(vivo,"#fff",.35);
    const r=document.documentElement.style;r.setProperty("--esc",esc);r.setProperty("--fundo",esc);r.setProperty("--vivo",vivo);r.setProperty("--vivo2",mix(vivo,"#fff",.45));r.setProperty("--txtVivo",lum(vivo)<140?"#fff":esc);}
  const hora=()=>{const d=new Date();return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");};
  let E=null,pag=0,POR=7;
  function desenhar(){if(!E)return;const ativos=(E.itens||[]).filter(i=>i.ativo!==false&&i.nome);const dest=ativos.filter(i=>i.destaque),com=ativos.filter(i=>!i.destaque);
    const porPag=Math.max(1,POR-(dest.length?2:0));const pags=Math.max(1,Math.ceil(com.length/porPag));pag=pag%pags;const vis=com.slice(pag*porPag,pag*porPag+porPag);const d1=dest[pag%Math.max(1,dest.length)];
    const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));const preco=p=>p?(/^\s*R\$/.test(p)?p:"R$ "+p):"";
    $("#tela").innerHTML=`<header>${E.logo?`<img class="logo ${lum(getComputedStyle(document.documentElement).getPropertyValue("--esc").trim()||"#000")>150?"esc":""}" src="${esc(E.logo)}" alt="">`:""}<div><h1>${esc(E.nome)}</h1><small>${esc(E.titulo||"")}</small></div><div class="hora">${hora()}</div></header>
      <main class="troca">${ativos.length?`${d1?`<div class="it dest"><div><span class="tag">Destaque</span><b>${esc(d1.nome)}</b>${d1.desc?`<small>${esc(d1.desc)}</small>`:""}</div><span class="p">${esc(preco(d1.preco))}</span></div>`:""}${vis.map(i=>`<div class="it"><div><b>${esc(i.nome)}</b>${i.desc?`<small>${esc(i.desc)}</small>`:""}</div><span class="p">${esc(preco(i.preco))}</span></div>`).join("")}`:`<div class="vazio">Programação em preparo.<br>Os itens aparecem aqui assim que forem lançados.</div>`}</main>
      <footer>${E.aviso?`<div class="aviso"><span>${esc(E.aviso)}</span></div>`:`<div class="aviso"></div>`}${pags>1?`<div class="pag">${Array.from({length:pags},(_,i)=>`<i class="${i===pag?"on":""}"></i>`).join("")}</div>`:""}</footer>`;}
  async function puxar(){try{const r=await fetch(`/api/mostra/${encodeURIComponent(c)}${E?"?v="+E.v:""}`,{cache:"no-store"});if(r.status===404){document.body.innerHTML='<div class="erro">Este Mostra Aí não existe ou foi desligado.</div>';return;}const d=await r.json();if(d.igual)return;E=d;tema(E.cores);pag=0;desenhar();}catch(e){}}
  puxar();setInterval(puxar,3000);setInterval(()=>{pag++;desenhar();},9000);setInterval(()=>{const h=$(".hora");if(h)h.textContent=hora();},15000);
  document.addEventListener("click",()=>{if(document.fullscreenEnabled&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});});
})();
</script>
</body>
</html>
