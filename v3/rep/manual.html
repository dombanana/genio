<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>GênIO · Manual de identidade</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="rep.css?v=6ad7d435ff">
<style>
body.com-acoes{padding-bottom:calc(250px + env(safe-area-inset-bottom,0))}
.palco{position:relative;background:repeating-conic-gradient(#e9e5f3 0 25%,#fff 0 50%) 0 0/18px 18px;border-radius:16px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;height:min(62vw,420px);margin:0 0 10px}
.palco canvas{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:auto}
.palco #sel{pointer-events:none;mix-blend-mode:normal}
.ferr{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:0 0 10px}
.ferr button{border:0;background:#fff;border-radius:12px;min-height:58px;font:inherit;font-size:12px;color:var(--texto);display:grid;place-items:center;gap:2px;padding:6px 2px}
.ferr button .ic{font-size:20px}
.ferr button.on{background:var(--navy);color:#fff}
.painel{background:#fff;border-radius:16px;padding:12px 14px;margin:0 0 10px}
.painel h3{margin:0 0 8px;font-size:15px}
.linha{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.linha input[type=range]{flex:1;min-width:120px}
.cores{display:flex;flex-direction:column;gap:6px}
.cores .c{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;background:var(--lav);border-radius:10px;padding:6px 8px}
.cores .sw{width:34px;height:34px;border-radius:8px;border:1px solid rgba(0,0,0,.1)}
.cores input{border:0;background:transparent;font:inherit;font-size:15px;font-weight:600;min-width:0}
.cores button{border:0;background:transparent;color:var(--texto2);font-size:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--linha);background:#fff;border-radius:999px;padding:6px 12px;font:inherit;font-size:14px}
.chips button.on{background:var(--marca);color:#fff;border-color:var(--marca)}
.camadas{display:flex;flex-direction:column;gap:6px}
.camadas .k{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--lav);border-radius:10px;padding:8px 10px}
.camadas .k.on{outline:2px solid var(--marca)}
.camadas .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--navy)}
.camadas select{font:inherit;font-size:14px;border:1px solid var(--linha);border-radius:8px;padding:4px 6px;background:#fff;max-width:150px}
.mini{display:flex;gap:6px;overflow-x:auto}
.mini canvas{width:72px;height:72px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 0 0/12px 12px;border-radius:8px;flex:0 0 auto}
.topo-ed{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px}
.topo-ed .sm{min-height:40px;padding:0 12px;font-size:14px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-radius:22px 22px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0));box-shadow:0 -8px 30px rgba(28,22,53,.18)}
.sheet .sw{width:56px;height:56px;border-radius:12px;border:1px solid rgba(0,0,0,.1)}
.fundo{position:fixed;inset:0;background:rgba(28,22,53,.35);z-index:59}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script src="rep.js?v=6ad7d435ff"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,nomeLoja,dados,nav,topo}=Rep;
  const D=await dados();const slug=qs.get("l")||(JSON.parse(localStorage.getItem("genio-cliente-dados")||"{}").slug);const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<p>Loja não encontrada.</p>${nav("rota")}`;return;}
  const nome=nomeLoja(l.nome),k=nome.toLowerCase();
  // ---- ficha do cliente (fonte única)
  const db=await Rep.abrirVendas();
  const getC=()=>new Promise(res=>{if(!db)return res(null);const t=db.transaction("clientes").objectStore("clientes").get(k);t.onsuccess=()=>res(t.result||null);t.onerror=()=>res(null);});
  const putC=o=>new Promise(res=>{if(!db)return res(false);const t=db.transaction("clientes","readwrite");t.objectStore("clientes").put(o);t.oncomplete=()=>res(true);t.onerror=()=>res(false);});
  let fic=await getC();
  const M0=(()=>{try{return JSON.parse(localStorage.getItem("genio-imagens")||"{}")}catch(e){return {}}})();
  const origem=(fic&&fic.logos&&fic.logos[0]&&fic.logos[0].src)||(M0[slug+"/logo"]&&M0[slug+"/logo"].dados)||null;
  const man=(fic&&fic.manual&&fic.manual.editado)?fic.manual:null;
  if(!origem&&!man){$("#app").innerHTML=`${topo()}<div class="faixa"><a href="visita.html?l=${encodeURIComponent(slug)}">Visita</a></div><h1>Manual de identidade</h1><p class="sub">${esc(nome)}</p><section class="card"><p>Ainda não há logotipo marcado para esta loja.</p><a class="btn" href="fontes.html?l=${encodeURIComponent(slug)}&tipo=busca">Marcar o logotipo →</a></section>${nav("rota")}`;return;}
  // ---- estado do editor
  const W0=1200;let cv,cx,sel,sx,img,W,H;let base=null;  // base: ImageData atual (com transparências)
  let hist=[];let cores=man?JSON.parse(JSON.stringify(man.cores||[])):[];  // {hex,nome}
  let camadas=man?JSON.parse(JSON.stringify((man.camadas||[]).map(c=>({nome:c.nome,cor:c.cor})))):[];let rot=null;  // rot: Uint8Array por pixel, 0 = sem camada
  let ferr="gotas",tol=28,pincel=18,zoom=1,pan={x:0,y:0},camAtiva=0,contiguo=true;
  const NOMES=["Fundo","Letras","Ícone","Detalhe","Contorno"];
  function render(){
    $("#app").innerHTML=`${topo()}
    <div class="faixa"><a href="visita.html?l=${encodeURIComponent(slug)}">Visita</a></div>
    <div class="topo-ed"><div><h1 style="margin:0;font-size:24px">Manual de identidade</h1><p class="sub" style="margin:2px 0 0">${esc(nome)}</p></div><button class="btn sec sm" id="desfazer" type="button">↶ Desfazer</button></div>
    <div class="palco" id="palco"><canvas id="cv"></canvas><canvas id="sel"></canvas></div>
    <div class="linha" style="margin:0 0 10px"><small class="muted">Zoom</small><input type="range" id="zoom" min="1" max="5" step="0.1" value="${zoom}"><button class="btn sec sm" id="mover" type="button" style="min-height:36px;padding:0 10px;font-size:13px">✋ Mover</button></div>
    <div class="ferr">
      ${[["gotas","💧","Conta-gotas"],["varinha","✨","Apagar por cor"],["borracha","🧽","Borracha"],["camada","🗂","Para camada"],["recuperar","↩","Recuperar"],["cortar","✂","Enquadrar"]].map(([id,ic,n])=>`<button type="button" data-f="${id}" class="${ferr===id?"on":""}"><span class="ic">${ic}</span>${n}</button>`).join("")}
    </div>
    <div class="painel" id="opc"></div>
    <div class="painel"><h3>Cores da marca <small class="muted" style="font-weight:400">· conta-gotas na imagem, depois dê o nome</small></h3><div class="cores" id="cores">${cores.length?"":'<small class="muted">nenhuma cor nomeada ainda</small>'}</div></div>
    <div class="painel"><h3>Camadas <small class="muted" style="font-weight:400">· quantas camadas tem esta marca?</small></h3>
      <div class="chips" id="ncam">${[1,2,3,4].map(n=>`<button type="button" data-n="${n}" class="${camadas.length===n?"on":""}">${n}</button>`).join("")}</div>
      <div class="camadas" id="camadas" style="margin-top:10px"></div>
      <div class="mini" id="mini" style="margin-top:10px"></div></div>
    <div class="acoes"><div class="w"><a class="btn sec" href="visita.html?l=${encodeURIComponent(slug)}">← Visita</a><button class="btn" id="salvar" type="button">Salvar e escolher produtos →</button></div></div>
    ${nav("rota")}`;document.body.classList.add("com-acoes");
    cv=$("#cv");cx=cv.getContext("2d",{willReadFrequently:true});sel=$("#sel");sx=sel.getContext("2d");
    ligar();renderCores();renderCamadas();renderOpc();
  }
  function encaixe(){const p=$("#palco");const pw=p.clientWidth,ph=p.clientHeight;const s=Math.min(pw/W,ph/H);const dz=s*zoom;
    [cv,sel].forEach(c=>{c.style.width=W+"px";c.style.height=H+"px";c.style.transform=`translate(${pan.x+(pw-W*dz)/2}px,${pan.y+(ph-H*dz)/2}px) scale(${dz})`;});return dz;}
  function carregar(){return new Promise(res=>{const im=new Image();im.crossOrigin="anonymous";im.onload=()=>{const s=Math.min(1,W0/Math.max(im.width,im.height));W=Math.round(im.width*s);H=Math.round(im.height*s);cv.width=sel.width=W;cv.height=sel.height=H;cx.drawImage(im,0,0,W,H);base=cx.getImageData(0,0,W,H);rot=new Uint8Array(W*H);encaixe();res();};im.onerror=()=>res();im.src=man&&man.tratado?man.tratado:origem;});}
  const pos=ev=>{const b=cv.getBoundingClientRect();return {x:Math.floor((ev.clientX-b.left)/b.width*W),y:Math.floor((ev.clientY-b.top)/b.height*H)};};
  const guardar=()=>{hist.push({d:new ImageData(new Uint8ClampedArray(base.data),W,H),r:new Uint8Array(rot)});if(hist.length>12)hist.shift();};
  const aplicar=()=>{cx.putImageData(base,0,0);};
  const hex=(r,g,b)=>"#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
  function similares(x0,y0,contig){const d=base.data;const i0=(y0*W+x0)*4;const R=d[i0],G=d[i0+1],B=d[i0+2];const out=new Uint8Array(W*H);const t2=tol*tol*3;
    const perto=i=>{const dr=d[i*4]-R,dg=d[i*4+1]-G,db=d[i*4+2]-B;return d[i*4+3]>0&&dr*dr+dg*dg+db*db<=t2;};
    if(!contig){for(let i=0;i<W*H;i++)if(perto(i))out[i]=1;return out;}
    const fila=[y0*W+x0];out[fila[0]]=1;
    while(fila.length){const i=fila.pop();const x=i%W,y=(i-x)/W;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const j=ny*W+nx;if(!out[j]&&perto(j)){out[j]=1;fila.push(j);}}}
    return out;}
  function mostrarSel(m,cor){sx.clearRect(0,0,W,H);if(!m)return;const id=sx.createImageData(W,H);const [r,g,b]=cor||[20,184,176];for(let i=0;i<W*H;i++)if(m[i]){id.data[i*4]=r;id.data[i*4+1]=g;id.data[i*4+2]=b;id.data[i*4+3]=150;}sx.putImageData(id,0,0);}
  let selMask=null;
  function renderOpc(){const o=$("#opc");
    if(ferr==="gotas")o.innerHTML=`<h3>Conta-gotas</h3><small class="muted">Toque na imagem para pegar uma cor e dar nome a ela.</small>`;
    if(ferr==="varinha")o.innerHTML=`<h3>Apagar por cor</h3><div class="linha"><small class="muted">Tolerância</small><input type="range" id="tol" min="4" max="90" value="${tol}"><button type="button" class="btn sec sm" id="contig" style="min-height:36px;padding:0 10px;font-size:13px">${contiguo?"Só a área tocada":"Na imagem toda"}</button></div><div class="linha" style="margin-top:8px"><button type="button" class="btn sm" id="apagarSel" ${selMask?"":"disabled"} style="min-height:40px">Apagar seleção</button><button type="button" class="btn sec sm" id="limparSel" style="min-height:40px">Limpar</button></div>`;
    if(ferr==="borracha"||ferr==="recuperar")o.innerHTML=`<h3>${ferr==="borracha"?"Borracha":"Recuperar (desfaz a borracha onde passar)"}</h3><div class="linha"><small class="muted">Tamanho</small><input type="range" id="pincel" min="4" max="80" value="${pincel}"></div>`;
    if(ferr==="camada")o.innerHTML=`<h3>Mandar para a camada ${camadas.length?camAtiva+1:"—"}</h3><small class="muted">${camadas.length?"Toque numa cor da imagem: tudo o que for parecido vai para a camada ativa (ajuste a tolerância).":"Defina primeiro quantas camadas tem a marca."}</small><div class="linha" style="margin-top:8px"><small class="muted">Tolerância</small><input type="range" id="tol" min="4" max="90" value="${tol}"><button type="button" class="btn sec sm" id="contig" style="min-height:36px;padding:0 10px;font-size:13px">${contiguo?"Só a área tocada":"Na imagem toda"}</button></div>`;
    if(ferr==="cortar")o.innerHTML=`<h3>Enquadrar</h3><small class="muted">Corta as margens transparentes sobrando.</small><div class="linha" style="margin-top:8px"><button type="button" class="btn sm" id="autoCorte" style="min-height:40px">Cortar margens</button></div>`;
    const t=$("#tol");if(t)t.oninput=()=>{tol=+t.value;};const pz=$("#pincel");if(pz)pz.oninput=()=>{pincel=+pz.value;};
    const cg=$("#contig");if(cg)cg.onclick=()=>{contiguo=!contiguo;renderOpc();};
    const ap=$("#apagarSel");if(ap)ap.onclick=()=>{if(!selMask)return;guardar();for(let i=0;i<W*H;i++)if(selMask[i])base.data[i*4+3]=0;aplicar();selMask=null;mostrarSel(null);renderOpc();renderMini();};
    const ls=$("#limparSel");if(ls)ls.onclick=()=>{selMask=null;mostrarSel(null);renderOpc();};
    const ac=$("#autoCorte");if(ac)ac.onclick=()=>{guardar();let x0=W,y0=H,x1=0,y1=0;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(base.data[(y*W+x)*4+3]>8){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}if(x1<=x0)return;const m=Math.round(Math.max(W,H)*0.03);x0=Math.max(0,x0-m);y0=Math.max(0,y0-m);x1=Math.min(W-1,x1+m);y1=Math.min(H-1,y1+m);
      const nw=x1-x0+1,nh=y1-y0+1;const nd=new ImageData(nw,nh);const nr=new Uint8Array(nw*nh);for(let y=0;y<nh;y++)for(let x=0;x<nw;x++){const si=((y+y0)*W+(x+x0)),di=y*nw+x;nd.data.set(base.data.subarray(si*4,si*4+4),di*4);nr[di]=rot[si];}
      W=nw;H=nh;cv.width=sel.width=W;cv.height=sel.height=H;base=nd;rot=nr;aplicar();encaixe();renderMini();};
  }
  function renderCores(){const c=$("#cores");c.innerHTML=cores.length?cores.map((x,i)=>`<div class="c"><span class="sw" style="background:${x.hex}"></span><input value="${esc(x.nome)}" data-i="${i}" placeholder="nome da cor (ex.: fundo)"><button type="button" data-x="${i}" aria-label="remover">✕</button></div>`).join(""):'<small class="muted">nenhuma cor nomeada ainda</small>';
    $$("#cores input").forEach(i=>i.onchange=()=>{cores[+i.dataset.i].nome=i.value;renderCamadas();});$$("#cores button").forEach(b=>b.onclick=()=>{cores.splice(+b.dataset.x,1);renderCores();renderCamadas();});}
  function renderCamadas(){const el=$("#camadas");$$("#ncam button").forEach(b=>b.classList.toggle("on",+b.dataset.n===camadas.length));
    el.innerHTML=camadas.map((c,i)=>`<div class="k ${i===camAtiva?"on":""}" data-i="${i}"><span class="n">${i+1}</span><div><input value="${esc(c.nome||("Camada "+(i+1)))}" data-i="${i}" style="border:0;background:transparent;font:inherit;font-weight:600;width:100%"><small class="muted">${rot?Math.round(rot.reduce((a,v)=>a+(v===i+1?1:0),0)/Math.max(1,rot.reduce((a,v)=>a+(v?1:0),0))*100)||0:0}% dos pixels marcados</small></div><select data-i="${i}"><option value="">cor…</option>${cores.map(x=>`<option value="${x.hex}" ${c.cor===x.hex?"selected":""}>${esc(x.nome||x.hex)}</option>`).join("")}</select></div>`).join("");
    $$("#camadas .k").forEach(d=>d.onclick=ev=>{if(ev.target.tagName==="SELECT"||ev.target.tagName==="INPUT")return;camAtiva=+d.dataset.i;renderCamadas();renderOpc();});
    $$("#camadas input").forEach(i=>i.onchange=()=>{camadas[+i.dataset.i].nome=i.value;});$$("#camadas select").forEach(s=>s.onchange=()=>{camadas[+s.dataset.i].cor=s.value;renderMini();});
    renderMini();}
  function renderMini(){const m=$("#mini");if(!m||!base)return;m.innerHTML="";camadas.forEach((c,i)=>{const cc=document.createElement("canvas");cc.width=W;cc.height=H;const g=cc.getContext("2d");const id=g.createImageData(W,H);let n=0;for(let p=0;p<W*H;p++)if(rot[p]===i+1){id.data.set(base.data.subarray(p*4,p*4+4),p*4);n++;}g.putImageData(id,0,0);cc.title=c.nome;m.appendChild(cc);});}
  function ligar(){
    $$(".ferr button").forEach(b=>b.onclick=()=>{ferr=b.dataset.f;$$(".ferr button").forEach(x=>x.classList.toggle("on",x===b));selMask=null;mostrarSel(null);renderOpc();});
    $("#zoom").oninput=ev=>{zoom=+ev.target.value;encaixe();};
    let mover=false;$("#mover").onclick=()=>{mover=!mover;$("#mover").classList.toggle("on",mover);$("#mover").style.background=mover?"var(--navy)":"";$("#mover").style.color=mover?"#fff":"";};
    $("#desfazer").onclick=()=>{const h=hist.pop();if(!h)return;base=h.d;rot=h.r;if(base.width!==W){W=base.width;H=base.height;cv.width=sel.width=W;cv.height=sel.height=H;encaixe();}aplicar();renderMini();renderCamadas();};
    $$("#ncam button").forEach(b=>b.onclick=()=>{const n=+b.dataset.n;while(camadas.length<n)camadas.push({nome:NOMES[camadas.length+1]||("Camada "+(camadas.length+1)),cor:""});camadas.length=n;rot=rot.map(v=>v>n?0:v);camAtiva=Math.min(camAtiva,n-1);renderCamadas();renderOpc();});
    const palco=$("#palco");let down=false,last=null,pint=false;
    palco.addEventListener("pointerdown",ev=>{palco.setPointerCapture(ev.pointerId);down=true;last={x:ev.clientX,y:ev.clientY};if(mover)return;const p=pos(ev);if(p.x<0||p.y<0||p.x>=W||p.y>=H)return;
      if(ferr==="gotas"){const i=(p.y*W+p.x)*4;if(base.data[i+3]===0)return;nomearCor(hex(base.data[i],base.data[i+1],base.data[i+2]));}
      if(ferr==="varinha"){selMask=similares(p.x,p.y,contiguo);mostrarSel(selMask);renderOpc();}
      if(ferr==="camada"&&camadas.length){guardar();const m=similares(p.x,p.y,contiguo);for(let i=0;i<W*H;i++)if(m[i])rot[i]=camAtiva+1;mostrarSel(m,[105,51,197]);setTimeout(()=>mostrarSel(null),600);renderCamadas();}
      if(ferr==="borracha"||ferr==="recuperar"){guardar();pint=true;pincelar(p);}
    });
    palco.addEventListener("pointermove",ev=>{if(!down)return;if(mover){pan.x+=ev.clientX-last.x;pan.y+=ev.clientY-last.y;last={x:ev.clientX,y:ev.clientY};encaixe();return;}if(pint)pincelar(pos(ev));});
    const up=()=>{down=false;pint=false;};palco.addEventListener("pointerup",up);palco.addEventListener("pointercancel",up);
    function pincelar(p){const r=pincel,orig=hist[hist.length-1]&&hist[0]?hist[0].d:null;for(let y=Math.max(0,p.y-r);y<=Math.min(H-1,p.y+r);y++)for(let x=Math.max(0,p.x-r);x<=Math.min(W-1,p.x+r);x++){if((x-p.x)**2+(y-p.y)**2>r*r)continue;const i=(y*W+x)*4;if(ferr==="borracha")base.data[i+3]=0;else if(orig&&orig.width===W)base.data[i+3]=orig.data[i+3];}aplicar();}
  }
  function nomearCor(h){const f=document.createElement("div");f.className="fundo";const s=document.createElement("div");s.className="sheet";
    s.innerHTML=`<div class="linha" style="margin-bottom:12px"><span class="sw" style="background:${h}"></span><div><b style="font-size:17px">${h.toUpperCase()}</b><br><small class="muted">O que é esta cor na marca?</small></div></div><div class="chips" id="nchips">${NOMES.map(n=>`<button type="button">${n}</button>`).join("")}</div><input id="noutro" placeholder="ou escreva (ex.: cor do símbolo)" style="width:100%;margin-top:10px;min-height:46px;border:1.5px solid var(--linha);border-radius:12px;padding:0 12px;font:inherit;font-size:16px"><div class="linha" style="margin-top:12px"><button type="button" class="btn" id="nok" style="flex:1">Guardar cor</button><button type="button" class="btn sec" id="ncancel" style="flex:0 0 auto;width:auto;padding:0 16px">Cancelar</button></div>`;
    document.body.append(f,s);let nomeSel="";$$("#nchips button",s).forEach(b=>b.onclick=()=>{nomeSel=b.textContent;$$("#nchips button",s).forEach(x=>x.classList.toggle("on",x===b));$("#noutro",s).value="";});
    const fechar=()=>{f.remove();s.remove();};f.onclick=fechar;$("#ncancel",s).onclick=fechar;
    $("#nok",s).onclick=()=>{const n=$("#noutro",s).value.trim()||nomeSel||("Cor "+(cores.length+1));const ex=cores.find(c=>c.hex===h);if(ex)ex.nome=n;else cores.push({hex:h,nome:n});fechar();renderCores();renderCamadas();};}
  async function salvar(){
    // resultado: composto tratado (PNG transparente) + uma PNG por camada (pixels originais) + versão chapada por camada na cor atrelada
    const tratado=cv.toDataURL("image/png");const cams=camadas.map((c,i)=>{const cc=document.createElement("canvas");cc.width=W;cc.height=H;const g=cc.getContext("2d");const id=g.createImageData(W,H);let n=0;
      for(let p=0;p<W*H;p++)if(rot[p]===i+1){id.data.set(base.data.subarray(p*4,p*4+4),p*4);n++;}g.putImageData(id,0,0);
      const chap=document.createElement("canvas");chap.width=W;chap.height=H;const gc=chap.getContext("2d");const idc=gc.createImageData(W,H);const col=c.cor?[parseInt(c.cor.slice(1,3),16),parseInt(c.cor.slice(3,5),16),parseInt(c.cor.slice(5,7),16)]:null;
      for(let p=0;p<W*H;p++)if(rot[p]===i+1){const a=base.data[p*4+3];if(col){idc.data[p*4]=col[0];idc.data[p*4+1]=col[1];idc.data[p*4+2]=col[2];}else idc.data.set(base.data.subarray(p*4,p*4+3),p*4);idc.data[p*4+3]=a;}gc.putImageData(idc,0,0);
      return {nome:c.nome,cor:c.cor,pixels:n,png:cc.toDataURL("image/png"),chapada:chap.toDataURL("image/png")};});
    const semCamada=rot.reduce((a,v)=>a+(v===0&&base.data[a*0]!==undefined?0:0),0);
    fic=fic||{k,nome,logos:origem?[{id:"captura",src:origem,nome:"Logotipo marcado",origem:"captura"}]:[],criado:new Date().toISOString()};
    fic.manual={editado:true,tratado,largura:W,altura:H,cores,camadas:cams,em:new Date().toISOString()};fic.atualizado=new Date().toISOString();
    const ok=await putC(fic);try{const M=JSON.parse(localStorage.getItem("genio-imagens")||"{}");M[slug+"/logo"]={dados:tratado,acao:"manual",em:new Date().toISOString()};localStorage.setItem("genio-imagens",JSON.stringify(M));localStorage.setItem("genio-cliente",nome);}catch(e){}
    return ok;}
  window.__manual=()=>({rot,camadas,cores,W,H,ferr});  // inspeção em testes
  render();await carregar();
  if(!base){$("#opc").innerHTML="<b>Não consegui abrir a imagem do logotipo.</b> Marque de novo pela pesquisa de imagem.";return;}
  renderMini();
  $("#salvar").onclick=async()=>{if(!camadas.length){if(!confirm("Nenhuma camada definida. Salvar só o tratamento (sem camadas)?"))return;}$("#salvar").disabled=true;$("#salvar").textContent="Salvando…";await salvar();location.href=`produtos.html?l=${encodeURIComponent(slug)}`;};
})();
</script>
