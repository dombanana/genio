<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GênIO · Onde vender agora</title>
<link rel="icon" href="../../genio-favicon.png">
<link rel="stylesheet" href="admin.css?v=bbfd9db4f5">
</head>
<body>
<div id="side"></div>
<main id="main"></main>
<script src="_menu.js?v=bbfd9db4f5"></script>
<script>
(async()=>{
  const esc=Adm.esc;document.getElementById("side").outerHTML=Adm.menu("zonas");
  const R=await fetch("../dados/ranking.json").then(r=>r.json());const Z=R.zonas;const mes=new Date().getMonth()+1;
  let cap=null;try{const r=await fetch("/dados/captacao/zona-cerealista/status.json");if(r.ok)cap=await r.json();}catch(e){}
  let idx=null;try{const r=await fetch("/dados/captacao/zona-cerealista/clientes/index.json");if(r.ok)idx=await r.json();}catch(e){}
  const momento=z=>{const m=z.momentos.find(m=>m.meses.includes(mes));if(m)return {t:/chuva/i.test(m.motivo)?"Chuva em alta":"Momento certo",c:"ok",ic:/chuva/i.test(m.motivo)?"🌧":"✓",motivo:m.motivo};const prox=z.momentos.map(m=>({m,d:Math.min(...m.meses.map(x=>(x-mes+12)%12||12))})).sort((a,b)=>a.d-b.d)[0];return {t:prox?`Em ${prox.d} ${prox.d===1?"mês":"meses"}`:"Avaliar visita",c:"dec",ic:"?",motivo:prox?prox.m.motivo:""};};
  const FX={B:"Baixa",M:"Média",A:"Alta",P:"Premium"};
  const CR={nf:"Lojas independentes",amb:"Ambição da loja",chuva:"Exposição à chuva",dono:"Dono presente",porta:"Porta na calçada",fluxo:"Fluxo de pedestres",alag:"Alagamentos",trad:"Tradição (CNPJ)",tiq:"Tíquete do setor",recompra:"Recompra",grafica:"Concorrência de gráficas"};
  const esc_=localStorage.getItem("adm-zona-escolhida");
  let sel=+(new URLSearchParams(location.search).get("z")||0);
  const n=(k,v)=>idx?idx.filter(x=>x.logo===v).length:null;
  const kp=[["🏪","Lojas pesquisadas",idx?idx.length:(cap&&cap.lojas)||"—",""],["✓","Marcas prontas",idx?n("logo","encontrado"):"—","ok"],["?","Para decidir",idx?idx.filter(x=>x.logo==="pendente").length:"—","dec"],["📷","Resolver na visita",idx?idx.filter(x=>!x.logo||x.logo==="nao").length:"—",""]];
  function render(){const z=Z[sel];const mo=momento(z);
    document.getElementById("main").innerHTML=`<p class="mig">Operação / <b>Zonas</b></p><h1>Onde vender agora</h1><p class="sub">Compare as zonas e escolha a próxima rota</p>
    <div class="kpis">${kp.map(([i,t,v,c])=>`<div class="kpi"><span class="ic ${c}">${i}</span><div><small>${t}</small><b>${v}</b></div></div>`).join("")}</div>
    <div class="grid"><section class="card"><h2>Ranking de zonas</h2><table><tr><th>Zona</th><th>Nota</th><th>Momento</th><th>Faixa</th></tr>
      ${Z.map((x,i)=>{const m=momento(x);return `<tr class="z ${i===sel?"sel":""}" data-i="${i}"><td><b>${esc(x.nome.split(" (")[0])}</b>${esc_===x.nome?' <span class="chip ok" style="font-size:12px;padding:3px 8px">escolhida</span>':""}</td><td><b>${String(x.nota).replace(".",",")}</b></td><td><span class="chip ${m.c}" style="background:transparent;padding:0;font-weight:500"><span style="font-size:18px">${m.ic}</span> ${m.t}</span></td><td><span class="chip">${FX[x.faixa]}</span></td></tr>`;}).join("")}</table></section>
    <aside class="card"><h2 style="margin-bottom:2px">${esc(z.nome.split(" (")[0])}</h2><p class="sub" style="font-size:16px;margin:0 0 10px">${esc(z.perfil)}</p>
      <div class="nota">${String(z.nota).replace(".",",")} <small>/ 10</small></div>
      ${Object.entries(z.crit).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([k,v])=>`<div class="barra"><span>${CR[k]||k}</span><i><b style="width:${v*10}%"></b></i><b>${String(v).replace(".",",")}</b></div>`).join("")}
      <div class="mom"><span style="font-size:26px">${mo.ic}</span><div><b>${mo.c==="ok"?"Momento favorável":"Fora do momento"}</b>${esc(mo.motivo)}</div></div>
      <div style="color:var(--texto2);font-size:14px;margin:0 0 12px">Faixa de investimento ${FX[z.faixa]} · ${esc(z.faixa_txt)}</div>
      <button class="btn" id="escolher">${esc_===z.nome?"Zona escolhida ✓":"Escolher zona"}</button>
      <p style="color:var(--texto2);font-size:13px;margin:10px 0 0">Escolher marca a zona da vez: a captação da madrugada passa a rodar nela e a rota dos representantes aponta para lá.</p></aside></div>
    <div class="rod"><b style="font-size:18px">◈ Última captação</b><span class="sep"></span><span>${cap?`${cap.processadas||0} lojas processadas · cota ${Math.max(0,50-(cap.processadas||0))} de reserva · ${esc(cap.fase)}`:"ainda não rodou (chaves pendentes no servidor)"}</span><span class="sep"></span><span><b>Custo:</b> ${cap&&cap.custo_reais!=null?"R$ "+cap.custo_reais.toFixed(2).replace(".",","):"—"}</span><span style="flex:1"></span><a href="/dados/captacao/zona-cerealista/index.html"><b>Ver resultados →</b></a></div>`;
    document.querySelectorAll("tr.z").forEach(tr=>tr.onclick=()=>{sel=+tr.dataset.i;render();});
    document.getElementById("escolher").onclick=()=>{localStorage.setItem("adm-zona-escolhida",z.nome);render();};}
  render();
})();
</script>
</body>
</html>
