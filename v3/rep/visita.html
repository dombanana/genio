<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GênIO · Visita</title>
<meta name="theme-color" content="#F1EEF8">
<link rel="icon" href="../genio-favicon.png">
<link rel="stylesheet" href="rep.css?v=83fedd26ab">
</head>
<body>
<div class="w" id="app"></div>
<input type="file" accept="image/*" capture="environment" id="cam" hidden>
<script src="../fotocrop.js?v=83fedd26ab"></script>
<script src="imagem.js?v=83fedd26ab"></script>
<script src="rep.js?v=83fedd26ab"></script>
<script>
(async()=>{
  const {$,$$,esc,qs,nomeLoja,dados,estado,salvar,stLogo,nav,topo,voz,ligarVoz,ouvir,roteiro,CHECK,PROD,setorNome,telFmt,abertaAgora,ZONA}=Rep;
  const D=await dados();const slug=qs.get("l");const l=D.lojas.find(x=>x.slug===slug);
  if(!l){$("#app").innerHTML=`${topo()}<div class="faixa"><a href="index.html">Rota</a></div><p>Loja não encontrada.</p>${nav("rota")}`;return;}
  // cadastro da captação (fotos, logo, cores) quando existir
  let cad=null;try{const r=await fetch(`/dados/captacao/${ZONA}/clientes/${slug}.json`,{cache:"no-store"});if(r.ok)cad=await r.json();}catch(e){}
  const L=cad?cad.lacunas:{};const logo=L.logoOriginal||{};const AV=L.avaliacoes||{};const base=`/dados/captacao/${ZONA}/`;
  const e=estado();const fotos=(e.fotos||{})[slug]||{};const ck=(e.check||{})[slug]||{};
  const st=stLogo({logo:logo.estado==="encontrado"?"encontrado":(logo.opcoes&&logo.opcoes.length?"pendente":null)});
  const aberta=abertaAgora(l.horario);
  const refs=(L.fachada&&L.fachada.referencias)||[];
  const arteVinc=await Rep.arteDoCliente(nomeLoja(l.nome));const M0=Imagem.ler();
  const logoSrc=arteVinc||(M0[slug+"/logo"]&&M0[slug+"/logo"].dados)||(logo.estado==="encontrado"?base+logo.valor:null);
  const fotoLocal=fotos.entrada||(refs[0]?base+refs[0]:null);
  const cores=(L.cores&&L.cores.valor)?L.cores.valor.split(" ").slice(0,3):[];
  // "Antes de entrar" = o que a pesquisa pública achou sobre este comércio (sem frase de venda; o produto entra só no fim)
  function briefing(){const P=[];const val=k=>(L[k]&&L[k].estado==="encontrado"&&L[k].valor)||"";
    const nome=nomeLoja(l.nome);const set=setorNome(l.setor).toLowerCase();
    let abre=`${nome} é ${set.startsWith("padaria")||set.startsWith("loja")||set.startsWith("distribuidora")?"uma":"um"} ${set} na ${l.endereco}`;
    const lei=val("leitura");const m=lei.match(/Razão social: ([^·]+)·\s*CNPJ\s*([\d./-]+)(?:\s*·\s*desde\s*(\d{4}))?/);
    if(m){abre+=` — razão social ${m[1].trim()}${m[3]?`, aberta em ${m[3]}`:""}`;}
    P.push(abre+".");
    const cn=L.nome_curiosidade;if(cn&&cn.valor)P.push(`Sobre o nome: ${cn.valor}${/[.!?]$/.test(cn.valor)?"":"."}${cn.origem==="derivado"?" (confirmar com o dono)":""}`);else if(cn&&cn.palavra&&!/^(melhor|galeria|barraca|central|mercado|natural|casa|ponto|grande|fama)$/.test(cn.palavra))P.push(`Pergunta que abre conversa: “${cn.palavra[0].toUpperCase()+cn.palavra.slice(1)}” é de família ou de lugar?`);
    if(val("sobre"))P.push(val("sobre"));
    const sl=L.slogan;const frase=(sl&&sl.estado==="encontrado"&&sl.valor)||(sl&&sl.opcoes&&sl.opcoes[0]&&sl.opcoes[0].valor)||"";
    const redes=val("redes");if(redes||frase)P.push(`${redes?"Presença: "+redes+". ":""}${frase?`A casa se apresenta como “${frase}”.`:""}`.trim());
    if(val("site"))P.push(`Site: ${val("site").replace(/^https?:\/\//,"")}.`);
    if(l.nota){const lista=AV.lista||[];const boas=lista.filter(a=>(a.nota||0)>=4&&(a.texto||"").length>30).sort((a,b)=>(b.nota||0)-(a.nota||0));const ruins=lista.filter(a=>(a.nota||5)<=3);
      let av=`No Google tem nota ${String(l.nota).replace(".",",")} em ${l.aval||0} avaliações`;
      if(boas[0])av+=`; elogiam, por exemplo: “${boas[0].texto.slice(0,110).trim()}${boas[0].texto.length>110?"…":""}”`;
      if(ruins.length)av+=`. Li as ${lista.length} avaliações mais baixas${ruins.length<lista.length?` (${ruins.length} negativas)`:""}`;
      if(AV.gatilhos&&AV.gatilhos.length)av+=`${ruins.length?"":"."} ${ruins.length?"— e":"E"} reclamam de coisas que o nosso serviço resolve: ${AV.gatilhos.map(g=>g.tema).join(", ")}`;
      P.push(av+".");}
    if(val("horario")){const h=val("horario").split(" · ");const hoje=["dom","seg","ter","qua","qui","sex","sáb"][new Date().getDay()];const hh=h.find(x=>x.startsWith(hoje));if(hh)P.push(`Hoje: ${hh.replace(/^\S+\s*/,"")}.`);}
    const prods=(PROD[l.setor]||PROD["comércio"]);P.push(`${logo.estado==="encontrado"?"A marca já está pronta no sistema — mostre o "+prods[0].toLowerCase()+" com ela na entrada.":"Sem marca pública confiável: fotografe a placa na porta antes de mostrar o "+prods[0].toLowerCase()+"."}`);
    return P.filter(Boolean).join(" ");}
  let txtRoteiro=briefing();
  $("#app").innerHTML=`${topo()}
  <div class="faixa"><a href="index.html">Rota</a></div>
  <h1>${esc(nomeLoja(l.nome))}</h1>
  <p class="sub">Parada ${l.ordem} · ${esc(l.endereco)}${l.tel?` · ${esc(telFmt(l.tel))}`:""}</p>
  <div class="foto" id="foto" data-img="local" data-loja="${esc(slug)}" data-nome="Foto do local" ${fotos.entrada?"":refs[0]?`data-fonte="referência pública"`:""}>${fotoLocal?`<img src="${esc(fotoLocal)}" alt="">${fotos.entrada?"":'<span class="sel">Referência pública</span>'}`:`<div style="text-align:center"><div style="font-size:40px">📷</div>Sem foto do local ainda<br><small>toque em “Fotografar entrada”</small></div>`}</div>
  <div class="chips"><span class="chip">🏪 ${esc(setorNome(l.setor))}</span>${aberta===true?'<span class="chip ok">✓ Aberto agora</span>':aberta===false?'<span class="chip">Fechado agora</span>':""}${l.nota?`<button type="button" class="chip" id="avals" style="cursor:pointer">★ ${String(l.nota).replace(".",",")} · ${l.aval||0} avaliações${AV.gatilhos&&AV.gatilhos.length?` · <b style="color:#C8552B">${AV.gatilhos.length} gancho${AV.gatilhos.length>1?"s":""}</b>`:""}</button>`:""}</div>
  ${AV.gatilhos&&AV.gatilhos.length?`<section class="card" style="border-left:5px solid #C8552B"><h2>O que os clientes reclamam</h2>${AV.gatilhos.map(g=>`<div style="margin:0 0 10px"><b>${esc(g.tema)}</b> <span class="chip dec" style="padding:3px 10px;font-size:13px">★ ${g.nota||"?"}</span><br><i class="muted">“${esc(g.trecho)}”</i><br>→ ${esc(g.argumento)}</div>`).join("")}</section>`:""}
  <section class="card"><h2>Identidade da loja</h2>
    <div class="ident"><div class="logo-box" id="logoBox" data-img="logo" data-loja="${esc(slug)}" data-nome="Logo" ${logo.nome?`data-fonte="${esc(logo.nome)}"`:""} title="Toque para arrumar a arte">${logoSrc?`<img src="${esc(logoSrc)}" alt="">`:`<span style="font-size:30px">◌</span>`}</div>
      <div><span class="chip ${arteVinc?"ok":st.c}">${arteVinc?"✓ Arte tratada":(st.c==="ok"?"✓ ":"")+(arteVinc?"":st.t)}</span>${cores.length?`<div class="cores">Cores da loja ${cores.map(c=>`<span class="cor" style="background:${esc(c)}"></span>`).join("")}</div>`:""}</div>
      <a class="acao-link" style="margin:0" id="verIdent" href="${L.manual&&L.manual.valor?esc(base+L.manual.valor):`identidade.html`}">${L.manual&&L.manual.valor?"Ver manual de identidade →":"Arrumar a arte →"}</a></div>
    ${L.manual&&L.manual.nota&&!/pipeline falhou/.test(L.manual.nota)?`<p class="ilus" style="margin-top:8px">Manual: ${esc(L.manual.nota.replace(/menor largura no capacho (\d+) cm/,"traço fino: no capacho a arte precisaria ter $1 cm de largura"))}</p>`:L.manual&&L.manual.nota?`<p class="ilus" style="margin-top:8px">Manual automático ainda não gerado — entra na próxima rodada.</p>`:""}
    ${logo.estado!=="encontrado"&&logo.opcoes&&logo.opcoes.length?`<p class="ilus" style="margin-top:10px">${logo.opcoes.length} opções encontradas na rede — decidir com o cliente na tela de identidade.</p>`:""}</section>
  <section class="card"><h2>Antes de entrar <small class="muted" style="font-weight:400;font-size:14px">· o que a pesquisa achou</small></h2>
    <div class="roteiro"><span class="ic">🔎</span><p>${esc(txtRoteiro)}</p><button class="btn sec sm" id="ouvir" type="button">▶ Ouvir</button></div></section>
  <section class="card"><h2>Condições da entrada</h2>
    <div class="check">${CHECK.map(([k,n])=>`<label><input type="checkbox" data-k="${k}" ${ck[k]?"checked":""}>${n}</label>`).join("")}</div>
    <button class="acao-link" id="fotografar" type="button" style="background:none;border:0;cursor:pointer;padding:0">📷 Fotografar entrada</button></section>
  <p class="ilus">${cad?`Dados públicos coletados em ${esc(cad.coletadoEm)}`:"Dados do Google Places; identidade entra na próxima captação"}</p>
  <div class="acoes"><div class="w"><button class="btn" id="produtos" type="button">Produtos e serviços →</button></div></div>
  ${voz()}${nav("rota")}`;document.body.classList.add("com-acoes");
  ligarVoz(slug);
  Imagem.ligar(document);
  // "Mostrar produtos" abre o módulo de capacho da versão em produção (foto do local, arte, encaixe, medidas e orçamento como já funcionam),
  // já com o cliente desta visita e o logo encontrado na captação
  async function definirCliente(){const nome=nomeLoja(l.nome);try{localStorage.setItem("genio-cliente",nome);localStorage.setItem("genio-cliente-dados",JSON.stringify({tel:telFmt(l.tel),endereco:l.endereco,slug,setor:l.setor}));}catch(e){}
    const M=Imagem.ler();const src=(M[slug+"/logo"]&&M[slug+"/logo"].dados)||(logo.estado==="encontrado"?location.origin+base+logo.valor:null);
    if(src){try{await new Promise(res=>{const rq=indexedDB.open("genio-vendas");rq.onsuccess=()=>{const db=rq.result;if(!db.objectStoreNames.contains("clientes")){db.close();return res();}const t=db.transaction("clientes","readwrite"),st=t.objectStore("clientes"),g=st.get(nome.toLowerCase());g.onsuccess=()=>{const r=g.result||{k:nome.toLowerCase(),nome,logos:[],criado:new Date().toISOString()};if(!(r.logos&&r.logos.length))r.logos=[{id:"cap"+Date.now().toString(36),src,nome:"logo-captacao.jpg",origem:"captacao"}];r.lacunas=r.lacunas||L;r.atualizado=new Date().toISOString();st.put(r);t.oncomplete=()=>{db.close();res();};t.onerror=()=>res();};g.onerror=()=>res();};rq.onerror=()=>res();});}catch(e){}}
  }
  $("#produtos").onclick=async()=>{await definirCliente();location.href=`produtos.html?l=${encodeURIComponent(slug)}`;};
  (()=>{const lb=$("#logoBox");let t0=0,mv=false;lb.addEventListener("pointerdown",()=>{t0=Date.now();mv=false;});lb.addEventListener("pointermove",()=>{mv=true;});lb.addEventListener("pointerup",async()=>{if(!mv&&Date.now()-t0<450){await definirCliente();location.href="identidade.html";}});})();
  $("#verIdent").onclick=async ev=>{if(L.manual&&L.manual.valor)return;ev.preventDefault();await definirCliente();location.href="identidade.html";};
  const bA=$("#avals");if(bA)bA.onclick=()=>{const lista=(AV.lista||[]).slice().sort((a,b)=>(a.nota||5)-(b.nota||5));const f=document.createElement("div");f.className="im-fundo";const sh=document.createElement("div");sh.className="im-sheet on";sh.style.maxHeight="80vh";sh.style.overflow="auto";
    sh.innerHTML=`<h3>Avaliações · ★ ${String(l.nota).replace(".",",")} · ${l.aval||0} no Google</h3>${lista.length?lista.map(a=>{const g=(AV.gatilhos||[]).find(x=>x.autor===a.autor&&x.nota===a.nota);return `<div style="padding:10px 0;border-bottom:1px solid #E0DAEE"><b style="color:${(a.nota||5)<=3?"#C8552B":"#1C1635"}">★ ${a.nota||"?"}</b> <small class="muted">${esc(a.autor||"")} · ${esc(a.quando||"")}</small><div>${esc(a.texto||"")}</div>${g?`<div style="margin-top:6px;color:#6933C5;font-weight:600">→ ${esc(g.argumento)}</div>`:""}</div>`;}).join(""):`<p class="muted">As avaliações entram na próxima captação desta loja${AV.nota?` (${esc(AV.nota)})`:""}.</p>`}<p class="muted" style="font-size:13px">Negativas primeiro. Só as que tocam no nosso serviço viram argumento.</p><button data-a="x" class="fechar" style="display:block;width:100%;border:0;background:none;color:#6B6578;font:600 16px Rubik,sans-serif;padding:12px;cursor:pointer">Fechar</button>`;
    document.body.append(f,sh);const fechar=()=>{sh.remove();f.remove();};f.onclick=fechar;sh.querySelector("[data-a=x]").onclick=fechar;};
  $("#ouvir").onclick=()=>ouvir(txtRoteiro,$("#ouvir"));
  $$("[data-k]").forEach(i=>i.onchange=()=>{const ee=estado();ee.check=ee.check||{};ee.check[slug]=ee.check[slug]||{};ee.check[slug][i.dataset.k]=i.checked;salvar(ee);});
  $("#fotografar").onclick=()=>{if(window.FotoCrop){FotoCrop.abrir({titulo:"Foto da entrada",varias:false,onFim:fs=>{if(fs&&fs[0]){const r=new FileReader();r.onload=()=>{const M=Imagem.ler();M[slug+"/local"]={dados:r.result,acao:"trocada",em:new Date().toISOString()};localStorage.setItem("genio-imagens",JSON.stringify(M));Imagem.aplicar(document);};r.readAsDataURL(fs[0]);}}});}else $("#cam").click();};
  $("#cam").onchange=()=>{const f=$("#cam").files[0];if(!f)return;const img=new Image();const u=URL.createObjectURL(f);img.onload=()=>{const c=document.createElement("canvas");const k=Math.min(1,1400/img.width);c.width=img.width*k;c.height=img.height*k;c.getContext("2d").drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",.82);const ee=estado();ee.fotos=ee.fotos||{};ee.fotos[slug]={...(ee.fotos[slug]||{}),entrada:d,em:new Date().toISOString()};salvar(ee);$("#foto").innerHTML=`<img src="${d}" alt="">`;URL.revokeObjectURL(u);};img.src=u;};
})();
</script>
</body>
</html>
