# genio.dombanana.tech: o sistema (arquivos do repositório) + a API em /api + a página do cliente em /t/<código>
server {
    listen 80;
    listen [::]:80;
    server_name genio.dombanana.tech;
    root /opt/genio;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/html text/css application/javascript application/json application/manifest+json image/svg+xml;

    # nada de arquivos internos do repositório
    location ~ /\.(?!well-known) { deny all; }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
        proxy_read_timeout 30s;
    }
    # página que o cliente abre pelo QR do cartão
    location ^~ /t/ { try_files /t.html =404; add_header Cache-Control "no-cache"; }
    # a página e o service worker sempre conferem se há versão nova
    location = / { try_files /index.html =404; add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri =404; }
}
